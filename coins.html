<!DOCTYPE html>  
<html lang="ne">  
<head>  
  <meta charset="UTF-8">  
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">  
  <title>LoksewaQuest - Coin History & Wallet</title>  
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">  
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">  
  <style>  
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }  
    body { background-color: #f8fafc; color: #0f172a; margin: 0; padding-bottom: 40px; overflow-x: hidden; }  
    
    .app-header { background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%); color: #ffffff; padding: 18px 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.15); }  
    .app-header h1 { font-size: 18px; font-weight: 800; letter-spacing: 0.5px; }  
    .back-btn { background: rgba(255, 255, 255, 0.15); color: #ffffff; border: none; width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; text-decoration: none; font-size: 14px; transition: background 0.2s; }  
    .back-btn:hover { background: rgba(255, 255, 255, 0.25); }  

    .main-wrapper { max-width: 500px; margin: 0 auto; padding: 20px 16px; width: 100%; }  

    /* Wallet Balance Card */
    .wallet-card { background: linear-gradient(135deg, #f59e0b 0%, #d97706 100%); color: #ffffff; border-radius: 24px; padding: 24px; text-align: center; margin-bottom: 20px; box-shadow: 0 10px 25px rgba(245, 158, 11, 0.3); position: relative; overflow: hidden; }
    .wallet-card::before { content: ''; position: absolute; top: -50px; right: -50px; width: 150px; height: 150px; background: rgba(255, 255, 255, 0.1); border-radius: 50%; }
    .wallet-title { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; opacity: 0.9; margin-bottom: 6px; }
    .wallet-balance { font-size: 38px; font-weight: 800; display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 15px; }
    .wallet-balance i { color: #fef08a; font-size: 32px; }
    .wallet-subtext { font-size: 11px; background: rgba(0, 0, 0, 0.15); padding: 6px 12px; border-radius: 20px; display: inline-block; font-weight: 600; }

    /* Section Header */
    .section-title { font-size: 15px; font-weight: 800; color: #1e293b; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    .section-title span { font-size: 11px; color: #64748b; font-weight: 600; }

    /* History List */
    .history-container { display: flex; flex-direction: column; gap: 10px; }
    .history-item { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 16px; padding: 14px 16px; display: flex; align-items: center; justify-content: space-between; box-shadow: 0 2px 8px rgba(0,0,0,0.02); transition: transform 0.2s; }
    .history-item:hover { transform: translateY(-1px); }
    
    .history-left { display: flex; align-items: center; gap: 12px; }
    .history-icon { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
    .history-icon.earn { background: #dcfce7; color: #16a34a; }
    .history-icon.spend { background: #fee2e2; color: #dc2626; }

    .history-info .title { font-size: 13px; font-weight: 700; color: #1e293b; margin-bottom: 2px; }
    .history-info .date { font-size: 10px; font-weight: 600; color: #64748b; }

    .history-amount { font-size: 14px; font-weight: 800; }
    .history-amount.earn { color: #16a34a; }
    .history-amount.spend { color: #dc2626; }

    .empty-state { text-align: center; padding: 40px 20px; background: #ffffff; border: 1px dashed #cbd5e1; border-radius: 20px; }
    .empty-state i { font-size: 36px; color: #94a3b8; margin-bottom: 10px; }
    .empty-state p { font-size: 13px; color: #64748b; font-weight: 600; }

    .loading-box { text-align: center; padding: 30px; font-size: 12px; color: #64748b; font-weight: 600; }
  </style>  
</head>  
<body>  

  <header class="app-header">  
    <a href="dashboard.html" class="back-btn" title="पछाडि जानुहोस्"><i class="fa-solid fa-arrow-left"></i></a>  
    <h1>कोइन वालेट तथा इतिहास</h1>  
    <div style="width: 38px;"></div>  
  </header>  

  <main class="main-wrapper">  

    <!-- Total Balance Card -->
    <div class="wallet-card">
      <div class="wallet-title">तपाईंको कुल कोइन ब्यालेन्स</div>
      <div class="wallet-balance">
        <i class="fa-solid fa-coins"></i> <span id="totalCoinsVal">0</span>
      </div>
      <div class="wallet-subtext">💡 दैनिक लिडरबोर्ड जितेर अझै कोइन कमाउनुहोस्!</div>
    </div>

    <!-- History Section -->
    <div class="section-title">
      <span> ट्रान्जेक्सन इतिहास (Transaction History)</span>
      <span id="totalTxCount">0 ट्रान्जेक्सन</span>
    </div>

    <div id="historyContainer" class="history-container">
      <div class="loading-box"><i class="fa-solid fa-spinner fa-spin"></i> इतिहास लोड हुँदैछ...</div>
    </div>

  </main>  

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <script type="module">  
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";  
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";  
    import { getFirestore, doc as fsDoc, getDoc as fsGetDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";  
    
    const firebaseConfig = {  
      apiKey: "AIzaSyCkKCU1re5b9MtdsAF1F4xI6rGxmxhGZak",  
      authDomain: "loksewaquest-227b6.firebaseapp.com",  
      projectId: "loksewaquest-227b6",  
      storageBucket: "loksewaquest-227b6.firebasestorage.app",  
      messagingSenderId: "779234903809",  
      appId: "1:779234903809:web:dd0dd0ffb742e1c218bd00"  
    };  

    const app = initializeApp(firebaseConfig);  
    const auth = getAuth(app);  
    const db = getFirestore(app);  

    const SUPABASE_URL = 'https://edyirdedkiarguvurpxq.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVkeWlyZGVka2lhcmd1dnVycHhxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwMTg2NjIsImV4cCI6MjEwNDU5NDY2Mn0.yhNn3YKmFSkxRdefk2F22qxTFhuKS90NH5fa3zzKSaY';
    
    let supabaseClient = null;
    try {
      if (typeof supabase !== 'undefined') {
        supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
      }
    } catch (e) { console.log("Supabase Init Error:", e); }

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        // १. युजरको कुल कोइन Firebase बाट ल्याउने
        try {
          const userSnap = await fsGetDoc(fsDoc(db, "users", user.uid));
          if (userSnap.exists()) {
            const userData = userSnap.data();
            const totalCoins = userData.coins || 0;
            document.getElementById('totalCoinsVal').innerText = totalCoins;
          }
        } catch (e) {
          console.error("Error fetching user coins:", e);
        }

        // २. कोइन इतिहास (Coin History) Supabase वा Firestore बाट लोड गर्ने
        loadCoinHistory(user.displayName || user.email);
      } else {
        window.location.href = "login.html";
      }
    });

    async function loadCoinHistory(username) {
      const container = document.getElementById('historyContainer');
      
      if (!supabaseClient) {
        container.innerHTML = `<div class="empty-state"><i class="fa-solid fa-triangle-exclamation"></i><p>डाटाबेस जडान असफल भयो।</p></div>`;
        return;
      }

      try {
        // यहाँ 'coin_history' नामको टेबलबाट युजरको ट्रान्जेक्सन फेच गरिन्छ
        // (यदि तपाईंले Supabase मा coin_history टेबल बनाउनुभएको छ भने त्यसले काम गर्छ)
        const { data, error } = await supabaseClient
          .from('coin_history')
          .select('*')
          .eq('username', username)
          .order('created_at', { ascending: false });

        if (error) throw error;

        if (!data || data.length === 0) {
          // यदि छुट्टै इतिहास छैन भने, ड्यासबोर्ड वा लिडरबोर्डको आधारमा एउटा जेनेरिक वा डेमो ट्रान्जेक्सन देखाउन सकिन्छ
          // वा खाली स्टेट देखाइन्छ:
          container.innerHTML = `
            <div class="empty-state">
              <i class="fa-solid fa-receipt"></i>
              <p>तपाईंको हालसम्म कुनै कोइन ट्रान्जेक्सन छैन।</p>
            </div>
          `;
          document.getElementById('totalTxCount').innerText = `० ट्रान्जेक्सन`;
          return;
        }

        document.getElementById('totalTxCount').innerText = `${data.length} ट्रान्जेक्सन`;
        let html = '';

        data.forEach(item => {
          const isEarn = item.type === 'earn' || item.amount > 0;
          const sign = isEarn ? '+' : '';
          const iconClass = isEarn ? 'earn' : 'spend';
          const iconSymbol = isEarn ? 'fa-arrow-down' : 'fa-arrow-up';
          const amountClass = isEarn ? 'earn' : 'spend';

          // मिति ढाँचा मिलाउने
          const dateObj = new Date(item.created_at);
          const dateStr = !isNaN(dateObj) ? dateObj.toLocaleDateString('ne-NP') + ' ' + dateObj.toLocaleTimeString('ne-NP', {hour: '2-digit', minute:'2-digit'}) : 'भर्खरै';

          html += `
            <div class="history-item">
              <div class="history-left">
                <div class="history-icon ${iconClass}">
                  <i class="fa-solid ${iconSymbol}"></i>
                </div>
                <div class="history-info">
                  <div class="title">${item.description || (isEarn ? 'कोइन प्राप्त भयो' : 'कोइन खर्च भयो')}</div>
                  <div class="date">${dateStr}</div>
                </div>
              </div>
              <div class="history-amount ${amountClass}">${sign}${item.amount} कोइन</div>
            </div>
          `;
        });

        container.innerHTML = html;

      } catch (err) {
        console.error("Error fetching coin history:", err);
        // यदि Supabase मा टेबल नभए test को लागि डेमो देखाउने वा एरर मेसेज दिने
        container.innerHTML = `
          <div class="empty-state">
            <i class="fa-solid fa-coins"></i>
            <p>इतिहास फेला परेन। (तपाईंले Supabase मा 'coin_history' टेबल बनाउनुपर्ने हुन सक्छ)</p>
          </div>
        `;
      }
    }
  </script>  

</body>  
</html>
