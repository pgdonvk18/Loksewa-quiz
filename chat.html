<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#3413aa">
<title>LoksewaQuest - Discussion Community</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: 'Plus Jakarta Sans', sans-serif;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  width: 100%;
  height: 100%;
  min-height: 100%;
  overflow: hidden;
  background: #f5f7fb;
}

body {
  color: #172033;
  position: fixed;
  inset: 0;
}

:root {
  --primary: #3413aa;
  --primary2: #5b35d5;
  --text: #172033;
  --muted: #64748b;
  --border: #e2e8f0;
  --bg: #f5f7fb;
  --green: #22c55e;
  --input-height: 76px;
  --keyboard-offset: 0px;
}

.top-header {
  height: 68px;
  min-height: 68px;
  width: 100%;
  background: linear-gradient(135deg, #241078, #3413aa 60%, #5b35d5);
  color: white;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 14px;
  position: relative;
  z-index: 1000;
  box-shadow: 0 3px 15px rgba(0,0,0,.15);
  flex-shrink: 0;
}

.header-left {
  display: flex;
  align-items: center;
  gap: 9px;
  min-width: 0;
  flex: 1;
}

.back-btn, .menu-btn {
  width: 38px;
  height: 38px;
  min-width: 38px;
  border-radius: 11px;
  border: 1px solid rgba(255,255,255,.15);
  background: rgba(255,255,255,.13);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  text-decoration: none;
  cursor: pointer;
  flex-shrink: 0;
}

.menu-btn {
  border: none;
  font-size: 16px;
}

.group-avatar {
  width: 40px;
  height: 40px;
  min-width: 40px;
  border-radius: 12px;
  background: rgba(255,255,255,.17);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 17px;
  flex-shrink: 0;
}

.group-title {
  min-width: 0;
  overflow: hidden;
}

.group-title h1 {
  font-size: 15px;
  font-weight: 800;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.group-title p {
  font-size: 9px;
  opacity: .78;
  margin-top: 2px;
  white-space: nowrap;
}

.header-right {
  display: flex;
  align-items: center;
  gap: 7px;
  flex-shrink: 0;
}

.coin-pill {
  display: flex;
  align-items: center;
  gap: 5px;
  background: rgba(255,255,255,.13);
  border: 1px solid rgba(255,255,255,.13);
  padding: 7px 9px;
  border-radius: 20px;
  font-size: 10px;
  font-weight: 800;
}

.coin-pill i {
  color: #fbbf24;
}

.chat-page {
  position: relative;
  width: 100%;
  height: calc(100vh - 68px);
  height: calc(100dvh - 68px);
  min-height: 0;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: #f5f7fb;
}

.chat-status {
  height: 43px;
  min-height: 43px;
  width: 100%;
  background: white;
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 14px;
  flex-shrink: 0;
  position: relative;
  z-index: 20;
}

.live-status {
  display: flex;
  align-items: center;
  gap: 7px;
  font-size: 9px;
  font-weight: 700;
  color: #16a34a;
}

.live-dot {
  width: 7px;
  height: 7px;
  border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 0 3px #dcfce7;
  flex-shrink: 0;
}

.users-discussion {
  display: flex;
  align-items: center;
  gap: 5px;
  color: var(--muted);
  font-size: 9px;
  font-weight: 600;
}

.users-discussion i {
  color: var(--primary);
  font-size: 10px;
}

.users-discussion strong {
  color: var(--primary);
  font-size: 10px;
  font-weight: 800;
}

.chat-container {
  position: relative;
  width: 100%;
  flex: 1;
  min-height: 0;
  overflow-x: hidden;
  overflow-y: auto;
  padding: 15px 13px calc(var(--input-height) + 25px);
  background: radial-gradient(circle at 20% 10%, rgba(52,19,170,.035), transparent 25%), #f5f7fb;
  display: flex;
  flex-direction: column;
  gap: 10px;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior: contain;
  scroll-behavior: smooth;
}

.date-separator {
  align-self: center;
  margin: 8px 0 5px;
  padding: 6px 13px;
  min-width: 60px;
  text-align: center;
  border-radius: 20px;
  background: #e9e7f8;
  color: #5b35d5;
  font-size: 9px;
  font-weight: 800;
  letter-spacing: .1px;
  box-shadow: 0 2px 6px rgba(15,23,42,.04);
}

.message-row {
  display: flex;
  flex-direction: column;
  max-width: 82%;
  animation: messageIn .18s ease;
}

@keyframes messageIn {
  from { opacity: 0; transform: translateY(4px); }
  to { opacity: 1; transform: translateY(0); }
}

.message-row.sent {
  align-self: flex-end;
  align-items: flex-end;
}

.message-row.received {
  align-self: flex-start;
  align-items: flex-start;
}

.sender-name-container {
  display: flex;
  align-items: center;
  gap: 5px;
  margin: 0 5px 3px;
}

.sender-name {
  font-size: 9px;
  font-weight: 800;
  color: #64748b;
}

/* User Badge Styles */
.user-badge {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 8px;
  padding: 1px 5px;
  border-radius: 4px;
  font-weight: 700;
  gap: 3px;
}

.user-badge.admin {
  background: #fee2e2;
  color: #dc2626;
  border: 1px solid #fecaca;
}

.user-badge.moderator {
  background: #e0f2fe;
  color: #0284c7;
  border: 1px solid #bae6fd;
}

.user-badge.vip {
  background: #fef3c7;
  color: #d97706;
  border: 1px solid #fde68a;
}

.message-bubble {
  padding: 10px 13px;
  border-radius: 16px;
  font-size: 13px;
  line-height: 1.48;
  word-break: break-word;
  white-space: pre-wrap;
  box-shadow: 0 2px 7px rgba(15,23,42,.045);
}

.message-row.sent .message-bubble {
  background: linear-gradient(135deg, #3413aa, #542bc7);
  color: white;
  border-bottom-right-radius: 4px;
}

.message-row.received .message-bubble {
  background: white;
  color: #172033;
  border: 1px solid #e2e8f0;
  border-bottom-left-radius: 4px;
}

.empty-chat {
  margin: auto;
  text-align: center;
  color: #94a3b8;
  font-size: 11px;
  line-height: 1.6;
  padding: 30px 20px;
}

.empty-chat i {
  font-size: 30px;
  margin-bottom: 9px;
  opacity: .6;
}

.chat-input-area {
  position: absolute;
  left: 0;
  right: 0;
  bottom: var(--keyboard-offset);
  width: 100%;
  height: var(--input-height);
  min-height: var(--input-height);
  background: rgba(255,255,255,.98);
  border-top: 1px solid var(--border);
  padding: 10px 11px calc(10px + env(safe-area-inset-bottom, 0px));
  display: flex;
  align-items: center;
  gap: 8px;
  z-index: 900;
  box-shadow: 0 -4px 16px rgba(15,23,42,.08);
}

.chat-input {
  flex: 1 1 auto;
  min-width: 0;
  width: 100%;
  height: 46px;
  min-height: 46px;
  border-radius: 24px;
  border: 1px solid #dbe2ea;
  background: #f8fafc;
  outline: none;
  padding: 0 15px;
  font-size: 13px;
  color: var(--text);
}

.chat-input:focus {
  border-color: var(--primary);
  background: white;
  box-shadow: 0 0 0 3px rgba(52,19,170,.07);
}

.send-btn {
  width: 46px;
  height: 46px;
  min-width: 46px;
  min-height: 46px;
  flex: 0 0 46px;
  border: none;
  border-radius: 50%;
  background: linear-gradient(135deg, #3413aa, #5b35d5);
  color: white;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 15px;
  box-shadow: 0 5px 14px rgba(52,19,170,.25);
}

.send-btn:active {
  transform: scale(.94);
}

.drawer-overlay {
  position: fixed;
  inset: 0;
  background: rgba(15,23,42,.48);
  z-index: 3000;
  opacity: 0;
  visibility: hidden;
  transition: .25s ease;
  backdrop-filter: blur(2px);
}

.drawer-overlay.show {
  opacity: 1;
  visibility: visible;
}

.side-drawer {
  position: absolute;
  top: 0;
  right: 0;
  width: min(88%, 370px);
  height: 100%;
  background: #f8fafc;
  transform: translateX(100%);
  transition: transform .28s cubic-bezier(.4,0,.2,1);
  box-shadow: -8px 0 30px rgba(15,23,42,.16);
  display: flex;
  flex-direction: column;
}

.drawer-overlay.show .side-drawer {
  transform: translateX(0);
}

.drawer-header {
  min-height: 70px;
  background: linear-gradient(135deg, #241078, #3413aa, #5b35d5);
  color: white;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 16px;
  flex-shrink: 0;
}

.drawer-header-left {
  display: flex;
  align-items: center;
  gap: 10px;
}

.drawer-header-icon {
  width: 37px;
  height: 37px;
  border-radius: 11px;
  background: rgba(255,255,255,.15);
  display: flex;
  align-items: center;
  justify-content: center;
}

.drawer-header h2 { font-size: 14px; font-weight: 800; }
.drawer-header p { font-size: 9px; opacity: .75; margin-top: 2px; }

.close-drawer {
  width: 34px;
  height: 34px;
  border-radius: 10px;
  border: 1px solid rgba(255,255,255,.14);
  background: rgba(255,255,255,.1);
  color: white;
  cursor: pointer;
}

.drawer-content {
  flex: 1;
  overflow-y: auto;
  padding: 13px;
}

.drawer-section {
  background: white;
  border: 1px solid var(--border);
  border-radius: 17px;
  padding: 14px;
  margin-bottom: 11px;
  box-shadow: 0 3px 12px rgba(15,23,42,.035);
}

.section-title {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 11px;
}

.section-icon {
  width: 30px;
  height: 30px;
  border-radius: 9px;
  background: #eef2ff;
  color: var(--primary);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 11px;
}

.section-title h3 { font-size: 12px; font-weight: 800; }
.section-title p { font-size: 9px; color: var(--muted); margin-top: 2px; }

.community-description {
  color: #475569;
  font-size: 11px;
  line-height: 1.6;
  background: #f8fafc;
  padding: 10px;
  border-radius: 11px;
}

.toast {
  position: fixed;
  left: 50%;
  bottom: calc(90px + env(safe-area-inset-bottom,0px));
  transform: translate(-50%,20px);
  background: #172033;
  color: white;
  padding: 10px 15px;
  border-radius: 12px;
  font-size: 10px;
  opacity: 0;
  visibility: hidden;
  transition: .25s;
  z-index: 5000;
  max-width: 88%;
  text-align: center;
}

.toast.show {
  opacity: 1;
  visibility: visible;
  transform: translate(-50%,0);
}
</style>
</head>

<body>

<header class="top-header">
  <div class="header-left">
    <a href="dashboard.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
    <div class="group-avatar"><i class="fa-solid fa-users"></i></div>
    <div class="group-title">
      <h1>Loksewa Discussion</h1>
      <p>Learn • Discuss • Grow Together</p>
    </div>
  </div>
  <div class="header-right">
    <div class="coin-pill">
      <i class="fa-solid fa-coins"></i>
      <span id="headerCoins">0</span>
    </div>
    <button class="menu-btn" id="menuBtn" type="button"><i class="fa-solid fa-bars"></i></button>
  </div>
</header>

<main class="chat-page">
  <div class="chat-status">
    <div class="live-status"><span class="live-dot"></span> Community Live</div>
    <div class="users-discussion"><i class="fa-solid fa-user-group"></i> Active: <strong id="activeUsersCount">0</strong></div>
  </div>

  <div class="chat-container" id="chatContainer">
    <div class="empty-chat"><i class="fa-regular fa-comments"></i><br>मसेजहरू लोड हुँदैछन्...</div>
  </div>

  <form class="chat-input-area" id="chatForm">
    <input type="text" id="messageInput" class="chat-input" maxlength="500" placeholder="आफ्नो प्रश्न वा विचार लेख्नुहोस्..." required>
    <button type="submit" class="send-btn" id="sendBtn"><i class="fa-solid fa-paper-plane"></i></button>
  </form>
</main>

<div class="drawer-overlay" id="drawerOverlay">
  <aside class="side-drawer">
    <div class="drawer-header">
      <div class="drawer-header-left">
        <div class="drawer-header-icon"><i class="fa-solid fa-layer-group"></i></div>
        <div>
          <h2>Community Menu</h2>
          <p>Everything about this group</p>
        </div>
      </div>
      <button class="close-drawer" id="closeDrawer" type="button"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="drawer-content">
      <section class="drawer-section">
        <div class="section-title">
          <div class="section-icon"><i class="fa-solid fa-circle-info"></i></div>
          <div><h3>About Community</h3><p>LoksewaQuest Discussion</p></div>
        </div>
        <div class="community-description">लोकसेवा तयारीसँग सम्बन्धित प्रश्न, ज्ञान, अनुभव साझा गर्ने friendly community।</div>
      </section>
    </div>
  </aside>
</div>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import { getFirestore, collection, addDoc, onSnapshot, serverTimestamp, doc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCkKCU1re5b9MtdsAF1F4xI6rGxmxhGZak",
  authDomain: "loksewaquest-227b6.firebaseapp.com",
  projectId: "loksewaquest-227b6",
  storageBucket: "loksewaquest-227b6.firebasestorage.app",
  messagingSenderId: "779234903809",
  appId: "1:779234903809:web:dd0dd0ffb742e1c218bd00"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

let currentUser = null;
let currentUserName = "Aspirant";
let currentUserBadge = ""; // प्रयोगकर्ताको purchased badge यहाँ स्टोर हुन्छ
let messagesLoaded = false;

const menuBtn = document.getElementById("menuBtn");
const drawerOverlay = document.getElementById("drawerOverlay");
const closeDrawer = document.getElementById("closeDrawer");
const chatContainer = document.getElementById("chatContainer");
const chatForm = document.getElementById("chatForm");
const messageInput = document.getElementById("messageInput");
const sendBtn = document.getElementById("sendBtn");

menuBtn.addEventListener("click", () => drawerOverlay.classList.add("show"));
closeDrawer.addEventListener("click", () => drawerOverlay.classList.remove("show"));
drawerOverlay.addEventListener("click", (e) => { if (e.target === drawerOverlay) drawerOverlay.classList.remove("show"); });

onAuthStateChanged(auth, async (user) => {
  if (!user) {
    window.location.replace("login.html?redirect=chat.html");
    return;
  }

  currentUser = user;
  currentUserName = user.displayName || (user.email ? user.email.split("@")[0] : "Aspirant");

  try {
    const userRef = doc(db, "users", user.uid);
    const userSnap = await getDoc(userRef);
    if (userSnap.exists()) {
      const data = userSnap.data();
      if (data.name) currentUserName = data.name;
      
      // Firestore को 'PurchasedBadges' (string वा array भए पनि handle गर्ने)
      if (data.PurchasedBadges) {
        if (Array.isArray(data.PurchasedBadges)) {
          currentUserBadge = data.PurchasedBadges.length > 0 ? data.PurchasedBadges[0] : "";
        } else {
          currentUserBadge = data.PurchasedBadges;
        }
      }
    }
  } catch(e) { console.log(e); }

  loadRealtimeMessages();
  loadUserCoins();
});

function loadRealtimeMessages() {
  if (messagesLoaded) return;
  messagesLoaded = true;

  onSnapshot(collection(db, "global_chat"), (snapshot) => {
    chatContainer.innerHTML = "";

    if (snapshot.empty) {
      chatContainer.innerHTML = `<div class="empty-chat"><i class="fa-regular fa-comments"></i><br>कुनै मसेज छैन।</div>`;
      return;
    }

    let messages = [];
    snapshot.forEach((docSnap) => messages.push({ id: docSnap.id, ...docSnap.data() }));

    messages.sort((a,b) => {
      const timeA = a.createdAt?.toMillis ? a.createdAt.toMillis() : 0;
      const timeB = b.createdAt?.toMillis ? b.createdAt.toMillis() : 0;
      return timeA - timeB;
    });

    messages.forEach((data) => {
      const isMe = currentUser && data.uid === currentUser.uid;
      const row = document.createElement("div");
      row.className = "message-row " + (isMe ? "sent" : "received");

      // Sender Name & Badge Container
      const senderContainer = document.createElement("div");
      senderContainer.className = "sender-name-container";

      const sender = document.createElement("span");
      sender.className = "sender-name";
      sender.textContent = data.senderName || "Aspirant";
      senderContainer.appendChild(sender);

      // Render Badge if present (either saved in message or current user's purchased badge)
      const badgeType = data.badge || (isMe ? currentUserBadge : "");
      if (badgeType) {
        const badgeEl = document.createElement("span");
        badgeEl.className = "user-badge " + badgeType.toLowerCase();
        
        let badgeText = badgeType;
        let badgeIcon = '<i class="fa-solid fa-award"></i>';

        if (badgeType.toLowerCase() === 'admin') {
          badgeIcon = '<i class="fa-solid fa-shield-halved"></i>';
          badgeText = 'Admin';
        } else if (badgeType.toLowerCase() === 'moderator' || badgeType.toLowerCase() === 'mod') {
          badgeIcon = '<i class="fa-solid fa-star"></i>';
          badgeText = 'Mod';
        } else if (badgeType.toLowerCase() === 'vip') {
          badgeIcon = '<i class="fa-solid fa-crown"></i>';
          badgeText = 'VIP';
        }

        badgeEl.innerHTML = `${badgeIcon} ${badgeText}`;
        senderContainer.appendChild(badgeEl);
      }

      row.appendChild(senderContainer);

      const bubble = document.createElement("div");
      bubble.className = "message-bubble";
      bubble.textContent = data.text || "";
      row.appendChild(bubble);

      chatContainer.appendChild(row);
    });

    chatContainer.scrollTop = chatContainer.scrollHeight;
  });
}

chatForm.addEventListener("submit", async (e) => {
  e.preventDefault();
  const text = messageInput.value.trim();
  if (!text || !currentUser) return;

  try {
    await addDoc(collection(db, "global_chat"), {
      text: text,
      uid: currentUser.uid,
      senderName: currentUserName,
      badge: currentUserBadge, // मसेज पठाउँदा purchased badge साथै सेभ हुने
      createdAt: serverTimestamp()
    });
    messageInput.value = "";
  } catch(err) {
    showToast("मसेज पठाउन सकिएन।");
  }
});

async function loadUserCoins() {
  if (!currentUser) return;
  try {
    const snap = await getDoc(doc(db, "users", currentUser.uid));
    if (snap.exists()) {
      document.getElementById("headerCoins").textContent = snap.data().coins || 0;
    }
  } catch(e) {}
}

function showToast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2500);
}
</script>
</body>
</html>
