<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LoksewaQuest - Welcome</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }
    body {
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
      color: #ffffff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 40px 20px;
      text-align: center;
      overflow: hidden;
    }
    .content-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 40px;
    }
    .logo-icon {
      width: 80px;
      height: 80px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 32px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 10px;
    }
    h1 span {
      color: #facc15; /* पहेँलो रङ (Quest को लागि) */
    }
    p {
      font-size: 14px;
      color: #cbd5e1;
      max-width: 280px;
      line-height: 1.5;
    }
    .footer-section {
      width: 100%;
      max-width: 400px;
      display: flex;
      flex-direction: column;
      gap: 15px;
    }
    .btn-get-started {
      background-color: #facc15;
      color: #1e293b;
      font-size: 16px;
      font-weight: 600;
      padding: 16px;
      border-radius: 30px;
      border: none;
      width: 100%;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(250, 204, 21, 0.4);
      text-decoration: none;
      display: block;
    }
    .login-text {
      font-size: 14px;
      color: #94a3b8;
    }
    .login-text a {
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="content-container">
    <!-- यहाँ तपाईं आफ्नो एपको लोगो वा झण्डा राख्न सक्नुहुन्छ -->
    <div style="font-size: 50px; margin-bottom: 10px;">🇳🇵</div>
    <h1>Loksewa<span>Quest</span></h1>
    <p>Your Journey to Government Service Starts Here</p>
  </div>

  <div class="footer-section">
    <div style="font-size: 12px; color: #94a3b8; margin-bottom: -5px;">Study  •  Practice  •  Succeed</div>
    
    <!-- गेट स्टार्टेड बटन (क्लिक गर्दा ड्यासबोर्ड वा मुख्य पेजमा जान्छ) -->
    <a href="dashboard.html" class="btn-get-started">Get Started →</a>
    
    <div class="login-text">
      Already have an account? <a href="login.html">Login</a>
    </div>
  </div>

-</body>
</html>
