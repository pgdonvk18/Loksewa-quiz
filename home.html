<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LoksewaQuest - Welcome</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }
    body {
      /* स्क्रिनसटको जस्तै गहिरो नीलो Gradient र Background Image को संयोजन */
      background: linear-gradient(180deg, rgba(15, 32, 39, 0.85) 0%, rgba(32, 58, 67, 0.9) 50%, rgba(44, 83, 100, 0.95) 100%), 
                  url('https://images.unsplash.com/photo-1544735716-392fe2489ffa?q=80&w=1000&auto=format&fit=crop') no-repeat center center/cover;
      color: #ffffff;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 50px 20px;
      text-align: center;
      overflow: hidden;
    }
    .content-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 30px;
    }
    .flag-icon {
      font-size: 60px;
      margin-bottom: 15px;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
    }
    h1 {
      font-size: 34px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }
    h1 span {
      color: #fbbf24; /* आकर्षक पहेँलो रङ */
    }
    p {
      font-size: 14px;
      color: #e2e8f0;
      max-width: 280px;
      line-height: 1.5;
      font-weight: 300;
    }
    .footer-section {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 20px;
    }
    .features-text {
      font-size: 11px;
      letter-spacing: 1.5px;
      color: #cbd5e1;
      text-transform: uppercase;
      margin-bottom: -5px;
    }
    .btn-get-started {
      background-color: #fbbf24;
      color: #0f172a;
      font-size: 16px;
      font-weight: 600;
      padding: 16px;
      border-radius: 30px;
      border: none;
      width: 100%;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(251, 191, 36, 0.4);
      text-decoration: none;
      display: block;
      transition: transform 0.2s;
    }
    .btn-get-started:active {
      transform: scale(0.98);
    }
    .login-text {
      font-size: 14px;
      color: #cbd5e1;
    }
    .login-text a {
      color: #fbbf24;
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>

  <div class="content-container">
    <!-- नेपालको झण्डा इमोजी वा लोगो -->
    <div class="flag-icon">🇳🇵</div>
    <h1>Loksewa<span>Quest</span></h1>
    <p>Your Journey to Government Service Starts Here</p>
  </div>

  <div class="footer-section">
    <div class="features-text">Study  •  Practice  •  Succeed</div>
    
    <!-- Get Started बटन (यसले ड्यासबोर्ड वा मुख्य एप पेजमा लैजान्छ) -->
    <a href="register.html" class="btn-get-started">Get Started →</a>
    
    <div class="login-text">
      Already have an account? <a href="login.html">Login</a>
    </div>
  </div>

</body>
</html>
