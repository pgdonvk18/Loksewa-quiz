<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Exam Sets Hub - LoksewaQuest</title>
  <!-- प्रिमियम आधुनिक फन्ट (Plus Jakarta Sans) -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- व्यावसायिक आइकनहरूको लागि FontAwesome CDN -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    body {
      background-color: #0f2a4a;
      color: #1e293b;
      margin: 0;
      padding-bottom: 75px;
      overflow-x: hidden;
    }

    /* टप हेडर सेक्सन */
    .app-header {
      background: linear-gradient(135deg, #0f2a4a 0%, #1e40af 100%);
      color: white;
      padding: 22px 20px 32px 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .app-header h1 {
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }
    .app-header h1 span {
      color: #fbbf24;
    }
    .icon-btn {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: white;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s;
    }

    /* मुख्य सेतो कन्टेनर */
    .main-container {
      background-color: #f8fafc;
      border-top-left-radius: 32px;
      border-top-right-radius: 32px;
      padding: 24px 16px;
      min-height: calc(100vh - 80px);
      box-shadow: 0 -6px 25px rgba(0,0,0,0.08);
    }

    /* स्वागत ब्यानर */
    .welcome-banner {
      background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 50%, #1d4ed8 100%);
      border-radius: 20px;
      padding: 20px;
      color: white;
      box-shadow: 0 8px 20px rgba(37, 99, 235, 0.25);
      margin-bottom: 24px;
      border: 1.5px solid rgba(255, 255, 255, 0.15);
      position: relative;
      overflow: hidden;
    }
    .badge-tag {
      display: inline-block;
      background: rgba(255, 255, 255, 0.2);
      color: #ffffff;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
    }
    .welcome-banner h2 {
      font-size: 18px;
      font-weight: 800;
      margin-bottom: 6px;
    }
    .welcome-banner p {
      font-size: 12px;
      color: #bfdbfe;
      line-height: 1.5;
    }

    /* खण्ड हेडर */
    .section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
    }
    .section-header h3 {
      font-size: 15px;
      font-weight: 800;
      color: #0f172a;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .section-header span.counter {
      font-size: 12px;
      color: #64748b;
      font-weight: 600;
    }

    /* सेट कार्डहरू */
    .sets-grid {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 24px;
    }

    .set-card {
      background: #ffffff;
      border-radius: 18px;
      padding: 18px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 4px 15px rgba(0,0,0,0.03);
      border: 1px solid #f1f5f9;
      text-decoration: none;
      transition: all 0.2s ease;
    }
    .set-card.active-set {
      border: 1.5px solid #3b82f6;
      box-shadow: 0 6px 20px rgba(59, 130, 246, 0.1);
    }
    .set-card.active-set:active {
      transform: scale(0.98);
    }
    .set-card.disabled-set {
      background: #f1f5f9;
      opacity: 0.75;
      cursor: not-allowed;
      pointer-events: none;
    }

    .set-card-top {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      margin-bottom: 12px;
    }
    .set-number-box {
      width: 44px;
      height: 44px;
      border-radius: 12px;
      background: #eff6ff;
      color: #2563eb;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
      font-size: 16px;
    }
    .disabled-set .set-number-box {
      background: #e2e8f0;
      color: #94a3b8;
    }

    .status-badge {
      font-size: 11px;
      font-weight: 700;
      padding: 4px 10px;
      border-radius: 20px;
      display: flex;
      align-items: center;
      gap: 5px;
    }
    .badge-active { background: #dcfce7; color: #15803d; }
    .badge-inactive { background: #e2e8f0; color: #64748b; }

    .set-info h4 {
      font-size: 15px;
      font-weight: 700;
      color: #1e293b;
      margin-bottom: 4px;
    }
    .active-set h4:hover { color: #2563eb; }
    .disabled-set .set-info h4 { color: #64748b; }
    .set-info p {
      font-size: 12px;
      color: #64748b;
      line-height: 1.4;
      margin-bottom: 14px;
    }

    .set-card-footer {
      border-top: 1px solid #f1f5f9;
      padding-top: 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 12px;
      color: #64748b;
      font-weight: 600;
    }
    .set-meta { display: flex; gap: 12px; }
    .action-text { color: #2563eb; font-weight: 700; }
    .disabled-set .action-text { color: #94a3b8; }
  </style>
</head>
<body>

  <!-- टप हेडर -->
  <div class="app-header">
    <a href="dashboard.html" class="icon-btn"><i class="fa-solid fa-arrow-left"></i></a>
    <h1>Loksewa<span>Quest</span></h1>
    <a href="dashboard.html" class="icon-btn"><i class="fa-solid fa-house"></i></a>
  </div>

  <!-- मुख्य सेतो इन्टरफेस -->
  <div class="main-container">
    <div class="welcome-banner">
      <span class="badge-tag">⚡ उच्च प्राविधिक अभ्यास केन्द्र</span>
      <h2>Pre Qualifying Exam Sets</h2>
      <p>लोकसेवा तथा खरिदार/नासु प्रथम पत्रको पूर्वयोग्यता परीक्षाको नयाँ ढाँचामा आधारित मोडल सेटहरू अभ्यास गर्नुहोस्।</p>
    </div>

    <div class="section-header">
      <h3><i class="fa-solid fa-layer-group text-blue-600"></i> उपलब्ध सेट सूची (Available Sets)</h3>
      <span class="counter" id="setCounter">सेटहरू चेक गर्दैछ...</span>
    </div>

    <div class="sets-grid" id="setsContainer">
      <!-- Supabase बाट चेक भएर यहाँ कार्डहरू देखिनेछन् -->
    </div>
  </div>

  <script>
    // तपाईंले दिनुभएको Supabase विवरणहरू
    const SUPABASE_URL = 'https://edyirdedkiarguvurpxq.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVkeWlyZGVka2lhcmd1dnVycHhxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwMTg2NjIsImV4cCI6MjEwNDU5NDY2Mn0.yhNn3YKmFSkxRdefk2F22qxTFhuKS90NH5fa3zzKSaY';
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    // कुल सेटहरूको लिस्ट (तपाईंको आवश्यकता अनुसार थप्न वा घटाउन सक्नुहुन्छ)
    const baseSets = [
      { id: 'set_1', number: '01', title: 'Pre Qualifying Exam Set 1', desc: 'सामान्य ज्ञान र आधारभूत बौद्धिक परीक्षण (IQ) समेटिएको पहिलो मोडल सेट।' },
      { id: 'set_2', number: '02', title: 'Pre Qualifying Exam Set 2', desc: 'समसामयिक घटना, भूगोल तथा खरिदार प्रथम पत्रको नयाँ पाठ्यक्रममा आधारित सेट।' },
      { id: 'set_3', number: '03', title: 'Pre Qualifying Exam Set 3', desc: 'इतिहास, संस्कृति, संविधान र व्यवस्थापनसम्बन्धी महत्वपूर्ण प्रश्नहरूको संगालो।' },
      { id: 'set_4', number: '04', title: 'Pre Qualifying Exam Set 4', desc: 'विज्ञान, प्रविधि, अर्थशास्त्र तथा तर्कशास्त्रमा आधारित अभ्यास सेट।' },
      { id: 'set_5', number: '05', title: 'Pre Qualifying Exam Set 5', desc: 'पूर्ण मोडल टेस्ट – लोकसेवा आयोगको परीक्षा ढाँचा अनुसार अभ्यास सेट।' },
      { id: 'set_6', number: '06', title: 'Pre Qualifying Exam Set 6', desc: 'नयाँ पाठ्यक्रममा आधारित एड्भान्सड मोडल टेस्ट तथा विशेष प्रश्नहरू।' },
      { id: 'set_7', number: '07', title: 'Pre Qualifying Exam Set 7', desc: 'नवीनतम मोडल प्रश्नहरूमा आधारित अभ्यास सेट ७।' },
      { id: 'set_8', number: '08', title: 'Pre Qualifying Exam Set 8', desc: 'आगामी मोडल परीक्षा सेट ८।' }
    ];

    async function loadSetsFromSupabase() {
      const container = document.getElementById('setsContainer');
      const counter = document.getElementById('setCounter');
      container.innerHTML = '';

      let activeCount = 0;

      for (const set of baseSets) {
        // 'quizzes' टेबलमा set_id (वा set) को आधारमा चेक गर्छ 
        // (यदि तपाईंको टेबलमा स्तम्भको नाम अर्कै छ भने तलको 'set_id' लाई मिलाउन सक्नुहुन्छ)
        const { data, error } = await supabaseClient
          .from('quizzes')
          .select('id')
          .eq('set_id', set.id)
          .limit(1);

        // यदि डेटाबेसमा प्रश्न भेटियो भने सक्रिय, नत्र छिट्टै आउँदैछ
        const isActive = (data && data.length > 0);
        
        if (isActive) activeCount++;

        const card = document.createElement(isActive ? 'a' : 'div');
        if (isActive) {
          card.href = `exam.html?set=${set.id}`;
          card.className = 'set-card active-set';
        } else {
          card.className = 'set-card disabled-set';
        }

        card.innerHTML = `
          <div>
            <div class="set-card-top">
              <div class="set-number-box">${set.number}</div>
              <span class="status-badge ${isActive ? 'badge-active' : 'badge-inactive'}">
                ${isActive ? '<i class="fa-solid fa-circle text-[8px]"></i> सक्रिय (Active)' : 'छिट्टै आउँदैछ'}
              </span>
            </div>
            <div class="set-info">
              <h4>${set.title}</h4>
              <p>${set.desc}</p>
            </div>
          </div>
          <div class="set-card-footer">
            <div class="set-meta">
              <span><i class="fa-regular fa-clock"></i> ४५ मिनेट</span>
              <span><i class="fa-solid fa-file-lines"></i> ५० प्रश्न</span>
            </div>
            <span class="action-text">
              ${isActive ? 'परीक्षा दिनुहोस् <i class="fa-solid fa-arrow-right text-[10px]"></i>' : 'छिट्टै खुलेको'}
            </span>
          </div>
        `;
        container.appendChild(card);
      }

      counter.innerText = `कुल ${baseSets.length} सेटहरू`;
    }

    loadSetsFromSupabase();
  </script>

</body>
</html>
