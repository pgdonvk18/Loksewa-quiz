<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LoksewaQuest - Quiz Lobby</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: #f8fafc; color: #1e293b; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
    
    .container { width: 100%; max-width: 480px; margin-top: 10px; }
    
    .header { text-align: center; margin-bottom: 20px; }
    .header h2 { font-size: 22px; font-weight: 800; color: #0f2a4a; }
    .header p { font-size: 13px; color: #64748b; margin-top: 4px; }

    .card { background: white; padding: 18px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.04); margin-bottom: 14px; border: 1px solid #e2e8f0; }
    .card h3 { font-size: 14px; font-weight: 700; margin-bottom: 12px; color: #1e40af; display: flex; align-items: center; gap: 8px; }

    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 12px; font-weight: 600; color: #475569; margin-bottom: 4px; }
    .form-control { width: 100%; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 14px; outline: none; transition: border 0.2s; }
    .form-control:focus { border-color: #2563eb; }

    .btn-success { background: #16a34a; color: white; margin-top: 4px; width: 100%; padding: 12px; border: none; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: background 0.2s; }
    .btn-success:hover { background: #15803d; }
    
    .divider { text-align: center; margin: 14px 0; font-size: 12px; color: #94a3b8; font-weight: 600; text-transform: uppercase; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h2><i class="fa-solid fa-gamepad" style="color: #2563eb;"></i> Loksewa 1v1 Battle</h2>
      <p>आफ्नो साथीहरूसँग रियल-टाइम क्विज प्रतिस्पर्धा गर्नुहोस्</p>
    </div>

    <!-- 1. यहाँ components.js बाट अटोमेटिक रुम क्रिएट कार्ड लोड हुन्छ -->
    <div id="createRoomContainer"></div>

    <div class="divider">अथवा</div>

    <!-- Join Room Card -->
    <div class="card">
      <h3><i class="fa-solid fa-right-to-bracket"></i> रुममा जोइन हुनुहोस् (Join Room)</h3>
      <div class="form-group">
        <label>रुम कोड (Room Code):</label>
        <input type="text" id="roomCodeInput" class="form-control" placeholder="जस्तै: ABCD12" autocomplete="off">
      </div>
      <button class="btn-success" id="joinRoomBtn"><i class="fa-solid fa-arrow-right-to-bracket"></i> रुममा छिर्नुहोस्</button>
    </div>
  </div>

  <!-- Components Script पहिले लोड गर्नुपर्छ -->
  <script src="components.js"></script>

  <!-- Firebase & Main Logic Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, doc, setDoc, getDoc, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCkKCU1re5b9MtdsAF1F4xI6rGxmxhGZak",
      authDomain: "loksewaquest-227b6.firebaseapp.com",
      projectId: "loksewaquest-227b6",
      storageBucket: "loksewaquest-227b6.firebasestorage.app",
      messagingSenderId: "779234903809",
      appId: "1:779234903809:web:dd0dd0ffb742e1c218bd00"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;
    let currentUserName = "Aspirant";

    // पेज लोड हुँदा कम्पोनेन्ट कल गर्ने
    document.addEventListener("DOMContentLoaded", () => {
      if (typeof loadCreateRoomCard === 'function') {
        loadCreateRoomCard('createRoomContainer');
      }
    });

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        currentUserName = user.displayName || user.email.split('@')[0];
        try {
          const userSnap = await getDoc(doc(db, "users", user.uid));
          if (userSnap.exists() && userSnap.data().name) {
            currentUserName = userSnap.data().name;
          }
        } catch (e) { console.log(e); }
      } else {
        window.location.href = "login.html";
      }
    });

    function generateRoomCode() {
      return Math.random().toString(36).substring(2, 8).toUpperCase();
    }

    // Create Room Logic (Event Delegation प्रयोग गरिएको छ किनकी बटन dynamically load हुन्छ)
    document.addEventListener('click', async (e) => {
      if (e.target && e.target.id === 'createRoomBtn') {
        if (!currentUser) return;
        const roomId = generateRoomCode();

        const roomData = {
          roomId: roomId,
          hostId: currentUser.uid,
          status: "waiting",
          settings: { 
            maxPlayers: window.selectedMaxPlayers || 4, 
            totalRounds: window.selectedTotalRounds || 3 
          },
          players: [
            { uid: currentUser.uid, name: currentUserName, score: 0 }
          ],
          currentRound: 1,
          currentTurnIndex: 0,
          createdAt: new Date()
        };

        try {
          await setDoc(doc(db, "quiz_rooms", roomId), roomData);
          window.location.href = `quizgame.html?room=${roomId}`;
        } catch (err) {
          if (typeof showSuccessPopup === 'function') {
            showSuccessPopup("रुम बनाउन सकिएन: " + err.message, null, 'error', 'त्रुटि! ❌');
          } else {
            alert("रुम बनाउन सकिएन: " + err.message);
          }
        }
      }
    });

    // Join Room Logic
    document.getElementById('joinRoomBtn').addEventListener('click', async () => {
      if (!currentUser) return;
      const roomCode = document.getElementById('roomCodeInput').value.trim().toUpperCase();
      
      if (!roomCode) {
        if (typeof showSuccessPopup === 'function') {
          showSuccessPopup("कृपया रुम कोड राख्नुहोस्!", null, 'warning', 'ध्यान दिनुहोस् ⚠️');
        } else {
          alert("कृपया रुम कोड राख्नुहोस्!");
        }
        return;
      }

      const roomRef = doc(db, "quiz_rooms", roomCode);
      const roomSnap = await getDoc(roomRef);

      if (!roomSnap.exists()) {
        if (typeof showSuccessPopup === 'function') {
          showSuccessPopup("यो कोड भएको रुम फेला परेन!", null, 'error', 'फेला परेन ❌');
        } else {
          alert("यो कोड भएको रुम फेला परेन!");
        }
        return;
      }

      const roomData = roomSnap.data();
      if (roomData.status !== "waiting") {
        if (typeof showSuccessPopup === 'function') {
          showSuccessPopup("यो गेम अलरेडी सुरु भइसकेको छ!", null, 'warning', 'सूचना ⚠️');
        } else {
          alert("यो गेम अलरेडी सुरु भइसकेको छ!");
        }
        return;
      }

      if (roomData.players.length >= roomData.settings.maxPlayers) {
        if (typeof showSuccessPopup === 'function') {
          showSuccessPopup("यो रुम भरिइसकेको छ (Full)!", null, 'warning', 'रुम भरियो ⚠️');
        } else {
          alert("यो रुम भरिइसकेको छ (Full)!");
        }
        return;
      }

      const alreadyJoined = roomData.players.some(p => p.uid === currentUser.uid);
      if (!alreadyJoined) {
        await updateDoc(roomRef, {
          players: arrayUnion({ uid: currentUser.uid, name: currentUserName, score: 0 })
        });
      }

      window.location.href = `quizgame.html?room=${roomCode}`;
    });
  </script>

</body>
</html>
