<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LoksewaQuest - Quiz Lobby</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: #f8fafc; color: #1e293b; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 20px; }
    
    .container { width: 100%; max-width: 480px; margin-top: 20px; }
    
    .header { text-align: center; margin-bottom: 24px; }
    .header h2 { font-size: 24px; font-weight: 800; color: #0f2a4a; }
    .header p { font-size: 13px; color: #64748b; margin-top: 4px; }

    .card { background: white; padding: 20px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 16px; border: 1px solid #e2e8f0; }
    .card h3 { font-size: 15px; font-weight: 700; margin-bottom: 12px; color: #1e40af; display: flex; align-items: center; gap: 8px; }

    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 12px; font-weight: 600; color: #475569; margin-bottom: 4px; }
    .form-control { width: 100%; padding: 10px 14px; border: 1px solid #cbd5e1; border-radius: 10px; font-size: 14px; outline: none; transition: border 0.2s; }
    .form-control:focus { border-color: #2563eb; }

    .btn { width: 100%; padding: 12px; border: none; border-radius: 10px; font-size: 14px; font-weight: 700; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; transition: background 0.2s; }
    .btn-primary { background: #2563eb; color: white; }
    .btn-primary:hover { background: #1d4ed8; }
    .btn-success { background: #16a34a; color: white; margin-top: 8px; }
    .btn-success:hover { background: #15803d; }
    
    .divider { text-align: center; margin: 16px 0; font-size: 12px; color: #94a3b8; font-weight: 600; text-transform: uppercase; }
  </style>
</head>
<body>

  <div class="container">
    <div class="header">
      <h2><i class="fa-solid fa-gamepad" style="color: #2563eb;"></i> Loksewa 1v1 Battle</h2>
      <p>आफ्नो साथीहरूसँग रियल-टाइम क्विज प्रतिस्पर्धा गर्नुहोस्</p>
    </div>

    <!-- Create Room Card -->
    <div class="card">
      <h3><i class="fa-solid fa-circle-plus"></i> नयाँ रुम बनाउनुहोस् (Create Room)</h3>
      <div class="form-group">
        <label>खेलाडी संख्या (Players Limit):</label>
        <select id="maxPlayers" class="form-control">
          <option value="2">1 vs 1 (2 Players)</option>
          <option value="3">1 vs 1 vs 1 (3 Players)</option>
          <option value="4" selected>1 vs 1 vs 1 vs 1 (4 Players)</option>
        </select>
      </div>
      <div class="form-group">
        <label>कुल राउन्डहरू (Total Rounds):</label>
        <select id="totalRounds" class="form-control">
          <option value="1">1 राउन्ड</option>
          <option value="2">2 राउन्डहरू</option>
          <option value="3" selected>3 राउन्डहरू</option>
        </select>
      </div>
      <button class="btn btn-primary" id="createRoomBtn">रुम सुरु गर्नुहोस्</button>
    </div>

    <div class="divider">अथवा</div>

    <!-- Join Room Card -->
    <div class="card">
      <h3><i class="fa-solid fa-right-to-bracket"></i> रुममा जोइन हुनुहोस् (Join Room)</h3>
      <div class="form-group">
        <label>रुम कोड (Room Code):</label>
        <input type="text" id="roomCodeInput" class="form-control" placeholder="जस्तै: ABCD12" autocomplete="off">
      </div>
      <button class="btn btn-success" id="joinRoomBtn">रुममा छिर्नुहोस्</button>
    </div>
  </div>

  <!-- Firebase Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, collection, doc, setDoc, getDoc, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCkKCU1re5b9MtdsAF1F4xI6rGxmxhGZak",
      authDomain: "loksewaquest-227b6.firebaseapp.com",
      projectId: "loksewaquest-227b6",
      storageBucket: "loksewaquest-227b6.firebasestorage.app",
      messagingSenderId: "779234903809",
      appId: "1:779234903809:web:dd0dd0ffb742e1c218bd00"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUser = null;
    let currentUserName = "Aspirant";

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        currentUserName = user.displayName || user.email.split('@')[0];
        try {
          const userSnap = await getDoc(doc(db, "users", user.uid));
          if (userSnap.exists() && userSnap.data().name) {
            currentUserName = userSnap.data().name;
          }
        } catch (e) { console.log(e); }
      } else {
        window.location.href = "login.html";
      }
    });

    // Random Room Code Generator
    function generateRoomCode() {
      return Math.random().toString(36).substring(2, 8).toUpperCase();
    }

    // Create Room Logic
    document.getElementById('createRoomBtn').addEventListener('click', async () => {
      if (!currentUser) return;
      const maxPlayers = parseInt(document.getElementById('maxPlayers').value);
      const totalRounds = parseInt(document.getElementById('totalRounds').value);
      const roomId = generateRoomCode();

      const roomData = {
        roomId: roomId,
        hostId: currentUser.uid,
        status: "waiting", // waiting, playing, finished
        settings: { maxPlayers, totalRounds },
        players: [
          { uid: currentUser.uid, name: currentUserName, score: 0 }
        ],
        currentRound: 1,
        currentTurnIndex: 0,
        createdAt: new Date()
      };

      try {
        await setDoc(doc(db, "quiz_rooms", roomId), roomData);
        // अब यो quizgame.html मा जान्छ
        window.location.href = `quizgame.html?room=${roomId}`;
      } catch (err) {
        alert("रुम बनाउन सकिएन: " + err.message);
      }
    });

    // Join Room Logic
    document.getElementById('joinRoomBtn').appendListener ? document.getElementById('joinRoomBtn').addEventListener('click', async () => {
      // handled below properly
    }) : document.getElementById('joinRoomBtn').addEventListener('click', async () => {
      if (!currentUser) return;
      const roomCode = document.getElementById('roomCodeInput').value.trim().toUpperCase();
      if (!roomCode) {
        alert("कृपया रुम कोड राख्नुहोस्!");
        return;
      }

      const roomRef = doc(db, "quiz_rooms", roomCode);
      const roomSnap = await getDoc(roomRef);

      if (!roomSnap.exists()) {
        alert("यो कोड भएको रुम फेला परेन!");
        return;
      }

      const roomData = roomSnap.data();
      if (roomData.status !== "waiting") {
        alert("यो गेम अलरेडी सुरु भइसकेको छ!");
        return;
      }

      if (roomData.players.length >= roomData.settings.maxPlayers) {
        alert("यो रुम भरिइसकेको छ (Full)!");
        return;
      }

      const alreadyJoined = roomData.players.some(p => p.uid === currentUser.uid);
      if (!alreadyJoined) {
        await updateDoc(roomRef, {
          players: arrayUnion({ uid: currentUser.uid, name: currentUserName, score: 0 })
        });
      }

      // अब यो quizgame.html मा जान्छ
      window.location.href = `quizgame.html?room=${roomCode}`;
    });
  </script><script src="components.js"></script>

</body>
</html>
