<!DOCTYPE html>
<html lang="ne">
<head>
  <script src="components.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LoksewaQuest - Admin Panel</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    body {
      background-color: #f8fafc;
      color: #1e293b;
      padding-bottom: 50px;
    }
    #loadingScreen {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: #0f172a;
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      font-size: 16px;
      gap: 15px;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 4px solid rgba(255,255,255,0.3);
      border-top: 4px solid #3b82f6;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }

    .admin-header {
      background: linear-gradient(135deg, #0f2a4a 0%, #1e40af 100%);
      color: white;
      padding: 24px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-radius: 0 0 25px 25px;
      margin-bottom: 20px;
    }
    .admin-header h1 {
      font-size: 18px;
      font-weight: 700;
    }
    .back-btn {
      background: rgba(255,255,255,0.15);
      border: none;
      color: white;
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-decoration: none;
    }

    .container {
      max-width: 650px;
      margin: 0 auto;
      padding: 0 20px;
    }

    .form-card {
      background: #ffffff;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.04);
      border: 1px solid #f1f5f9;
      margin-bottom: 20px;
    }
    .form-card h3 {
      font-size: 15px;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .form-group {
      margin-bottom: 14px;
    }
    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: #475569;
      margin-bottom: 6px;
    }
    .form-control {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      font-size: 13px;
      outline: none;
      background: #f8fafc;
      transition: border 0.2s;
    }
    .form-control:focus {
      border-color: #2563eb;
      background: #fff;
    }
    textarea.form-control {
      resize: vertical;
      min-height: 250px;
      font-family: monospace;
      font-size: 12px;
    }

    .submit-btn {
      background: #2563eb;
      color: white;
      border: none;
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .submit-btn:active {
      background: #1d4ed8;
    }

    .help-text {
      font-size: 11px;
      color: #64748b;
      margin-top: 6px;
      line-height: 1.4;
    }

    #alertBox {
      padding: 12px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 15px;
      display: none;
    }
    .alert-success { background: #d1fae5; color: #065f46; }
    .alert-error { background: #fee2e2; color: #991b1b; }
  </style>
</head>
<body style="display: none;" id="adminBody">

  <div id="loadingScreen">
    <div class="spinner"></div>
    <span>एड्मिन अधिकार प्रमाणीकरण हुँदैछ...</span>
  </div>

  <div class="admin-header">
    <!-- यहाँ href लाई dashboard.html बनाइएको छ -->
    <a href="dashboard.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
    <h1><i class="fa-solid fa-shield-halved" style="color: #fbbf24;"></i> SQL Insert Admin Panel</h1>
    <div style="width: 38px;"></div>
  </div>

  <div class="container">
    <div id="alertBox"></div>

    <div class="form-card">
      <h3><i class="fa-solid fa-code" style="color: #2563eb;"></i> SQL Query मार्फत प्रश्नहरू हाल्नुहोस्</h3>
      <form id="sqlForm">
        <div class="form-group">
          <label>तपाईंको INSERT INTO SQL Query यहाँ राख्नुहोस्:</label>
          <textarea id="sqlInput" class="form-control" placeholder="INSERT INTO public.quizzes (topic, question, options, answer) 
VALUES 
(
  'World_geography', 
  'नेपाल राष्ट्र बैंकको स्थापना कहिले भएको हो?', 
  '[\"वि.सं. २०१३ वैशाख १४\", \"वि.सं. २०१२ बैशाख २६\", \"वि.सं. २०२० साल\", \"वि.सं. २००७ साल\"]', 
  'वि.सं. २०१३ वैशाख १४'
);" required></textarea>
          <div class="help-text">
            💡 <b>निर्देशन:</b> `INSERT INTO public.quizzes (...) VALUES (...)` फॉर्मेटमा राख्नुहोला। बहुसंख्यक रेकर्डहरू हुँदा कोमा (,) ले छुट्याउनुहोला।
          </div>
        </div>

        <button type="submit" class="submit-btn" id="sqlSaveBtn" style="background: #2563eb;">SQL डाटा सेभ गर्नुहोस्</button>
      </form>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCkKCU1re5b9MtdsAF1F4xI6rGxmxhGZak",
      authDomain: "loksewaquest-227b6.firebaseapp.com",
      projectId: "loksewaquest-227b6",
      storageBucket: "loksewaquest-227b6.firebasestorage.app",
      messagingSenderId: "779234903809",
      appId: "1:779234903809:web:dd0dd0ffb742e1c218bd00"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const SUPABASE_URL = "https://edyirdedkiarguvurpxq.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVkeWlyZGVka2lhcmd1dnVycHhxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwMTg2NjIsImV4cCI6MjEwNDU5NDY2Mn0.yhNn3YKmFSkxRdefk2F22qxTFhuKS90NH5fa3zzKSaY";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const adminEmails = ["pgprajwal11@gmail.com"];

    onAuthStateChanged(auth, async (user) => {
      if (!user || !user.email || !adminEmails.includes(user.email.toLowerCase())) {
        alert("तपाईंलाई यो प्यानल पहुँच गर्ने अनुमति छैन!");
        window.location.href = "dashboard.html"; // अनाधिकृत युजरलाई पनि ड्यासबोर्ड वा होमपेजमा फर्काउने
        return;
      }

      document.getElementById('loadingScreen').style.display = 'none';
      document.getElementById('adminBody').style.display = 'block';
    });

    const sqlForm = document.getElementById('sqlForm');
    const alertBox = document.getElementById('alertBox');

    sqlForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      const sqlSaveBtn = document.getElementById('sqlSaveBtn');
      sqlSaveBtn.disabled = true;
      sqlSaveBtn.textContent = "प्रशोधन र सेभ हुँदैछ...";

      const sqlText = document.getElementById('sqlInput').value;

      try {
        const valuesMatch = sqlText.match(/VALUES\s*([\s\S]*)/i);
        if (!valuesMatch) {
          throw new Error("SQL मा 'VALUES' फेला परेन। कृपया सही फॉर्मेट प्रयोग गर्नुहोस्।");
        }

        let valuesString = valuesMatch[1].trim();
        if (valuesString.endsWith(';')) {
          valuesString = valuesString.slice(0, -1);
        }

        const rows = [];
        let bracketDepth = 0;
        let currentRow = "";
        let inString = false;
        let escapeNext = false;

        for (let i = 0; i < valuesString.length; i++) {
          let char = valuesString[i];
          if (escapeNext) {
            currentRow += char;
            escapeNext = false;
            continue;
          }
          if (char === '\\') {
            escapeNext = true;
            currentRow += char;
            continue;
          }
          if (char === "'" && valuesString[i-1] !== '\\') {
            inString = !inString;
          }
          if (!inString) {
            if (char === '(') {
              if (bracketDepth === 0) {
                currentRow = "";
                bracketDepth++;
                continue;
              }
              bracketDepth++;
            } else if (char === ')') {
              bracketDepth--;
              if (bracketDepth === 0) {
                rows.push(currentRow);
                continue;
              }
            }
          }
          if (bracketDepth > 0) {
            currentRow += char;
          }
        }

        const parsedRecords = rows.map(rowStr => {
          const fields = [];
          let currentField = "";
          let inStr = false;
          let esc = false;

          for (let j = 0; j < rowStr.length; j++) {
            let c = rowStr[j];
            if (esc) {
              currentField += c;
              esc = false;
              continue;
            }
            if (c === '\\') {
              esc = true;
              currentField += c;
              continue;
            }
            if (c === "'") {
              inStr = !inStr;
              continue;
            }
            if (c === ',' && !inStr) {
              fields.push(currentField.trim());
              currentField = "";
            } else {
              currentField += c;
            }
          }
          fields.push(currentField.trim());

          let topic = fields[0] || '';
          let question = fields[1] || '';
          let optionsStr = fields[2] || '[]';
          let answer = fields[3] || '';

          let optionsParsed;
          try {
            optionsParsed = JSON.parse(optionsStr);
          } catch(e) {
            optionsParsed = optionsStr; 
          }

          return {
            topic: topic,
            question: question,
            options: optionsParsed,
            answer: answer
          };
        });

        if (parsedRecords.length === 0) {
          throw new Error("कुनै पनि वैध डेटा फेला परेन।");
        }

        const { error } = await supabase.from('quizzes').insert(parsedRecords);
        if (error) throw error;

        showAlert(`सफलतापूर्वक ${parsedRecords.length} वटा प्रश्नहरू quizzes टेबलमा सेभ भए!`, "success");
        sqlForm.reset();
      } catch (err) {
        showAlert("त्रुटि: " + err.message, "error");
      } finally {
        sqlSaveBtn.disabled = false;
        sqlSaveBtn.textContent = "SQL डाटा सेभ गर्नुहोस्";
      }
    });

    function showAlert(message, type) {
      alertBox.textContent = message;
      alertBox.className = type === 'success' ? 'alert-success' : 'alert-error';
      alertBox.style.display = 'block';
      setTimeout(() => {
        alertBox.style.display = 'none';
      }, 5000);
    }
  </script>
</body>
</html>
