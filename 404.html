<!DOCTYPE html>
<html lang="ne">
<head><script src="components.js"></script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LoksewaQuest - Coming Soon</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    
    body {
      background: linear-gradient(135deg, #1e3a8a 0%, #1d4ed8 50%, #3b82f6 100%);
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .error-card {
      background: #ffffff;
      width: 100%;
      max-width: 420px;
      padding: 40px 30px;
      border-radius: 28px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
      border: 1px solid #e2e8f0;
      text-align: center;
    }

    .icon-box {
      width: 80px;
      height: 80px;
      background: #eff6ff;
      color: #2563eb;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 34px;
      margin: 0 auto 20px auto;
      box-shadow: 0 10px 20px rgba(37, 99, 235, 0.15);
    }

    .error-card h1 {
      font-size: 26px;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 8px;
    }

    .error-card h2 {
      font-size: 16px;
      font-weight: 700;
      color: #2563eb;
      margin-bottom: 12px;
    }

    .error-card p {
      font-size: 13px;
      color: #64748b;
      line-height: 1.5;
      margin-bottom: 24px;
    }

    .home-btn {
      display: inline-block;
      width: 100%;
      background: #2563eb;
      color: white;
      border: none;
      padding: 15px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      text-decoration: none;
      transition: background 0.2s;
      box-shadow: 0 10px 20px rgba(37, 99, 235, 0.2);
    }

    .home-btn:hover {
      background: #1d4ed8;
    }
  </style>
</head>
<body>

  <div class="error-card">
    <div class="icon-box">
      <i class="fa-solid fa-person-digging"></i>
    </div>
    <h1>Coming Soon!</h1>
    <h2>पेज छिट्टै उपलब्ध हुनेछ</h2>
    <p>तपाईंले खोज्नु भएको वा जान खोज्नु भएको पेज अहिले निर्माणको क्रममा छ। कृपया केही समय पछि प्रयास गर्नुहोला।</p>
    
    <a href="dashboard.html" class="home-btn">
      <i class="fa-solid fa-house" style="margin-right: 8px;"></i> ड्यासबोर्डमा फर्कनुहोस्
    </a>
  </div>

</body>
</html>
