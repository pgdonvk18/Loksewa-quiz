<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>LoksewaQuest - User Profile</title>

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background: #f8fafc;
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding-bottom: 80px;
    }

    /* =========================
       PROFILE HEADER
    ========================= */

    .profile-header {
      background: linear-gradient(135deg, #0f2a4a 0%, #1e40af 100%);
      padding: 24px 20px 40px 20px;
      border-radius: 0 0 30px 30px;
      color: white;
      position: relative;
    }

    .nav-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 25px;
    }

    .back-btn {
      background: rgba(255, 255, 255, 0.15);
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 12px;
      color: white;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-decoration: none;
      backdrop-filter: blur(5px);
    }

    .nav-bar h2 {
      font-size: 18px;
      font-weight: 700;
    }

    .user-profile-card {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .avatar-wrapper {
      position: relative;
      flex-shrink: 0;
    }

    .avatar-container {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: #ffffff;
      padding: 3px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    }

    .avatar-container img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }

    .avatar-edit-btn {
      position: absolute;
      bottom: 0;
      right: 0;
      background: #2563eb;
      color: #ffffff;
      border: 2px solid #ffffff;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      cursor: pointer;
    }

    .user-meta {
      flex: 1;
      min-width: 0;
    }

    .user-meta p {
      font-size: 13px;
      color: #cbd5e1;
      font-weight: 500;
      margin-bottom: 6px;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .user-meta .address-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(255, 255, 255, 0.15);
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      margin-top: 6px;
      color: #fbbf24;
    }

    .name-edit-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }

    .name-input-box {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 10px;
      padding: 6px 12px;
      color: #ffffff;
      font-size: 17px;
      font-weight: 800;
      width: 100%;
      outline: none;
    }

    .name-input-box:disabled {
      background: transparent;
      border-color: transparent;
      padding: 0;
    }

    .name-input-box:focus:not(:disabled) {
      background: rgba(255, 255, 255, 0.25);
      border-color: #ffffff;
    }

    .edit-name-btn,
    .save-name-btn {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      width: 34px;
      height: 34px;
      border-radius: 8px;
      color: #ffffff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      flex-shrink: 0;
    }

    .save-name-btn {
      background: #16a34a;
      display: none;
    }

    /* =========================
       MAIN CONTAINER
    ========================= */

    .container {
      padding: 0 20px;
      margin-top: -20px;
      flex: 1;
    }

    /* =========================
       COIN CARD
    ========================= */

    .coin-display-card {
      background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%);
      border-radius: 20px;
      padding: 16px 20px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.05);
      border: 1px solid #fde68a;
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .coin-left {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .coin-icon {
      font-size: 32px;
      background: #fff;
      width: 50px;
      height: 50px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 10px rgba(245, 158, 11, 0.2);
    }

    .coin-info h4 {
      font-size: 12px;
      font-weight: 700;
      color: #92400e;
      text-transform: uppercase;
      margin-bottom: 2px;
    }

    .coin-info span {
      font-size: 22px;
      font-weight: 800;
      color: #78350f;
    }

    .redeem-btn {
      background: #d97706;
      color: white;
      border: none;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
    }

    /* =========================
       STATS
    ========================= */

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      margin-bottom: 24px;
    }

    .stat-card {
      background: #ffffff;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.05);
      border: 1px solid #f1f5f9;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .stat-icon {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }

    .stat-icon.solved {
      background: #eff6ff;
      color: #2563eb;
    }

    .stat-icon.time {
      background: #fff7ed;
      color: #ea580c;
    }

    .stat-icon.accuracy {
      background: #f0fdf4;
      color: #16a34a;
    }

    .stat-icon.rank {
      background: #fdf4ff;
      color: #c084fc;
    }

    .stat-info h4 {
      font-size: 12px;
      font-weight: 700;
      color: #64748b;
      text-transform: uppercase;
      margin-bottom: 4px;
      letter-spacing: 0.5px;
    }

    .stat-info span {
      font-size: 20px;
      font-weight: 800;
      color: #0f172a;
    }

    /* =====================================================
       🏅 BADGE SECTION
    ===================================================== */

    .badges-section {
      margin-bottom: 24px;
    }

    .badge-section-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 13px;
    }

    .badge-heading-left {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .badge-heading-icon {
      width: 38px;
      height: 38px;
      border-radius: 12px;
      background: linear-gradient(135deg, #fff7ed, #fef3c7);
      color: #d97706;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 17px;
    }

    .badge-heading-text h3 {
      font-size: 17px;
      font-weight: 800;
      color: #0f172a;
    }

    .badge-heading-text p {
      font-size: 10px;
      color: #64748b;
      margin-top: 2px;
    }

    .badge-counter {
      background: #eff6ff;
      color: #2563eb;
      padding: 6px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 800;
    }

    .badges-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    /* Individual Badge */

    .badge-card {
      position: relative;
      background: #ffffff;
      border: 1px solid #f1f5f9;
      border-radius: 19px;
      padding: 17px 12px 14px;
      text-align: center;
      box-shadow: 0 5px 18px rgba(0,0,0,0.045);
      overflow: hidden;
      transition: transform 0.2s ease;
    }

    .badge-card:active {
      transform: scale(0.97);
    }

    /* top shine */

    .badge-card.earned::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, #f59e0b, #fbbf24, #f59e0b);
    }

    .badge-icon-wrapper {
      width: 64px;
      height: 64px;
      margin: 0 auto 10px;
      border-radius: 19px;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .badge-icon-wrapper i {
      font-size: 27px;
    }

    /* Different badge styles */

    .badge-gold {
      background: linear-gradient(135deg, #fff7ed, #fef3c7);
      color: #d97706;
      box-shadow: inset 0 0 0 1px #fde68a;
    }

    .badge-blue {
      background: linear-gradient(135deg, #eff6ff, #dbeafe);
      color: #2563eb;
      box-shadow: inset 0 0 0 1px #bfdbfe;
    }

    .badge-green {
      background: linear-gradient(135deg, #f0fdf4, #dcfce7);
      color: #16a34a;
      box-shadow: inset 0 0 0 1px #bbf7d0;
    }

    .badge-purple {
      background: linear-gradient(135deg, #faf5ff, #f3e8ff);
      color: #9333ea;
      box-shadow: inset 0 0 0 1px #e9d5ff;
    }

    .badge-red {
      background: linear-gradient(135deg, #fff1f2, #ffe4e6);
      color: #e11d48;
      box-shadow: inset 0 0 0 1px #fecdd3;
    }

    .badge-cyan {
      background: linear-gradient(135deg, #ecfeff, #cffafe);
      color: #0891b2;
      box-shadow: inset 0 0 0 1px #a5f3fc;
    }

    .badge-card h4 {
      font-size: 12px;
      font-weight: 800;
      color: #1e293b;
      margin-bottom: 4px;
    }

    .badge-card p {
      font-size: 9.5px;
      line-height: 1.45;
      color: #64748b;
      min-height: 28px;
    }

    .badge-status {
      margin-top: 8px;
      font-size: 9px;
      font-weight: 800;
    }

    .badge-status.earned-status {
      color: #16a34a;
    }

    .badge-status.locked-status {
      color: #94a3b8;
    }

    .badge-status i {
      margin-right: 3px;
    }

    /* Locked badge */

    .badge-card.locked {
      opacity: 0.58;
    }

    .badge-card.locked .badge-icon-wrapper {
      filter: grayscale(0.7);
    }

    /* Progress */

    .badge-progress {
      margin-top: 9px;
      width: 100%;
      height: 5px;
      background: #f1f5f9;
      border-radius: 10px;
      overflow: hidden;
    }

    .badge-progress-fill {
      height: 100%;
      width: 0%;
      border-radius: 10px;
      background: linear-gradient(90deg, #2563eb, #60a5fa);
      transition: width 0.5s ease;
    }

    .badge-progress-text {
      font-size: 8px;
      color: #64748b;
      margin-top: 4px;
      display: block;
    }

    /* =========================
       MENU
    ========================= */

    .menu-card {
      background: #ffffff;
      border-radius: 20px;
      padding: 8px 16px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.05);
      border: 1px solid #f1f5f9;
      margin-bottom: 20px;
    }

    .menu-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 4px;
      text-decoration: none;
      border-bottom: 1px solid #f8fafc;
      color: #334155;
      font-size: 14px;
      font-weight: 600;
    }

    .menu-item:last-child {
      border-bottom: none;
    }

    .menu-item-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .menu-item-left i {
      font-size: 16px;
      color: #64748b;
      width: 24px;
      text-align: center;
    }

    .menu-item.logout {
      color: #dc2626;
    }

    .menu-item.logout i {
      color: #dc2626;
    }

    /* =========================
       TOAST
    ========================= */

    #toastMessage {
      position: fixed;
      bottom: 90px;
      left: 50%;
      transform: translateX(-50%);
      background: #0f172a;
      color: #ffffff;
      padding: 10px 20px;
      border-radius: 30px;
      font-size: 13px;
      font-weight: 600;
      box-shadow: 0 4px 15px rgba(0,0,0,0.2);
      z-index: 9999;
      display: none;
      text-align: center;
      white-space: nowrap;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 360px) {

      .container {
        padding-left: 15px;
        padding-right: 15px;
      }

      .profile-header {
        padding-left: 15px;
        padding-right: 15px;
      }

      .badges-grid {
        gap: 9px;
      }

      .badge-card {
        padding-left: 8px;
        padding-right: 8px;
      }

      .badge-icon-wrapper {
        width: 58px;
        height: 58px;
      }

    }

  </style>
</head>

        </div>

        <i

      <a href="#" class="menu-item">

        <div class="menu-item-left">

          <i class="fa-solid fa-shield-halved"></i>

          <span>Change Password</span>

        </div>

        <i
          class="fa-solid fa-chevron-right"
          style="font-size:12px;color:#cbd5e1;"

      </a>

        <div class="menu-item-left">

          <i class="fa-solid fa-right-from-bracket"></i>

    </div>

    /* =====================================================
       TOAST
    ===================================================== */

    function showToast(message) {

      const toast =
        document.getElementById("toastMessage");

      toast.textContent = message;

      toast.style.display = "block";

      setTimeout(() => {

        toast.style.display = "none";

      }, 2500);

    }

    window.showToast = showToast;


    /* =====================================================
       🏅 RENDER BADGES
    ===================================================== */

    function renderBadges(earnedBadges = []) {

      const grid =
        document.getElementById("badgesGrid");

      grid.innerHTML = "";

      let earnedCount = 0;


      BADGES.forEach((badge) => {

        const isEarned =
          earnedBadges.includes(badge.id);


        if (isEarned) {
          earnedCount++;
        }


        const card =
          document.createElement("div");

        card.className =
          `badge-card ${isEarned ? "earned" : "locked"}`;


        card.innerHTML = `

          <div class="badge-icon-wrapper ${badge.style}">

            <i class="fa-solid ${badge.icon}"></i>

          </div>

          <h4>${badge.name}</h4>

          <p>${badge.description}</p>

          ${
            isEarned

            ? `
              <div class="badge-status earned-status">
                <i class="fa-solid fa-circle-check"></i>
                Earned
              </div>
            `

            : `
              <div class="badge-status locked-status">
                <i class="fa-solid fa-lock"></i>
                ${badge.requirement}
              </div>
            `
          }

        `;


        grid.appendChild(card);

      });


      document.getElementById("badgeCount").textContent =
        `${earnedCount} / ${BADGES.length}`;

    }


    /* =====================================================
       AUTH
    ===================================================== */

    onAuthStateChanged(auth, async (user) => {

      if (!user) {

        window.location.href = "login.html";

        return;

      }


      currentUserId = user.uid;

      const userEmail =
        user.email || "No Email";

      document.getElementById("userEmail")
        .textContent = userEmail;


      let displayName =
        user.displayName ||
        userEmail.split("@")[0];


      /* =========================
         FIRESTORE USER
      ========================= */

      try {

        const userDocRef =
          doc(db, "users", user.uid);


        const userDocSnap =
          await getDoc(userDocRef);


        if (userDocSnap.exists()) {

          const userData =
            userDocSnap.data();


          /* COINS */

          const userCoins =
            userData.coins !== undefined
              ? userData.coins
              : 0;


          document.getElementById(
            "userCoinsDisplay"
          ).textContent = userCoins;


          /* NAME */

          if (userData.name) {

            displayName =
              userData.name;

            document.getElementById(
              "userNameInput"
            ).value = userData.name;

          } else {

            document.getElementById(
              "userNameInput"
            ).value = displayName;

          }


          /* PHOTO */

          if (userData.photoURL) {

            document.getElementById(
              "userAvatar"
            ).src = userData.photoURL;

          } else if (user.photoURL) {

            document.getElementById(
              "userAvatar"
            ).src = user.photoURL;

          }


          /* =================================================
             🏅 LOAD BADGES
          ================================================= */

          const earnedBadges =
            Array.isArray(userData.badges)
              ? userData.badges
              : [];


          renderBadges(earnedBadges);


        } else {

          document.getElementById(
            "userNameInput"
          ).value = displayName;


          document.getElementById(
            "userCoinsDisplay"
          ).textContent = "0";


          /* New user */

          await setDoc(
            userDocRef,
            {
              name: displayName,
              email: userEmail,
              coins: 0,
              badges: []
            },
            {
              merge: true
            }
          );


          renderBadges([]);

        }

      } catch (err) {

        console.error(
          "Firestore error:",
          err
        );

        document.getElementById(
          "userNameInput"
        ).value = displayName;


        renderBadges([]);

      }


      /* =========================
         SUPABASE STATS
      ========================= */

      try {

        let totalSolvedCount = 0;

        let totalTimeMinutes = 0;


        /* USER STATS */

        const {
          data: userStatData
        } = await supabase

          .from("user_stats")

          .select("*")

          .eq("id", user.uid)

          .maybeSingle();


        if (userStatData) {

          totalSolvedCount +=
            userStatData.total_solved || 0;

          totalTimeMinutes +=
            userStatData.time_spent_minutes || 0;

        }


        /* EXAM LEADERBOARD */

        const {
          data: examLbData
        } = await supabase

          .from("exam_leaderboard")

          .select(
            "total_questions, id, username"
          );


        if (
          examLbData &&
          examLbData.length > 0
        ) {

          examLbData.forEach(row => {

            if (
              row.id === user.uid ||
              row.username === displayName
            ) {

              totalSolvedCount +=
                row.total_questions || 0;

            }

          });

        }


        document.getElementById(
          "totalSolved"
        ).textContent =
          totalSolvedCount;


        const hours =
          (totalTimeMinutes / 60)
            .toFixed(1);


        document.getElementById(
          "spentTime"
        ).textContent =
          hours + " hrs";


        if (totalSolvedCount > 0) {

          document.getElementById(
            "accuracyRate"
          ).textContent = "85%";

        } else {

          document.getElementById(
            "accuracyRate"
          ).textContent = "0%";

        }

      } catch (dbError) {

        console.log(
          "Supabase error:",
          dbError.message
        );

      }

    });

    ===================================================== */

    window.enableNameEdit = function() {

        document.getElementById(

      nameInput.disabled = false;

      nameInput.focus();


      document.getElementById(

      document.getElementById(

    /* =====================================================
       SAVE NAME
    ===================================================== */

    window.saveNameUpdate = async function() {

      const newName =
        document.getElementById(
          "userNameInput"
        ).value.trim();


      if (!newName) {

        showToast(
          "नाम खाली राख्न पाइँदैन।"
        );

        return;

      }


      if (!currentUserId) return;


      try {

        if (auth.currentUser) {

          await updateProfile(
            auth.currentUser,
            {
              displayName: newName
            }
          );

        }


        const userDocRef =
          doc(
            db,
            "users",
            currentUserId
          );


        await updateDoc(
          userDocRef,
          {
            name: newName
          }
        );


        const nameInput =
          document.getElementById(
            "userNameInput"
          );


        nameInput.disabled = true;


        document.getElementById(
          "saveNameBtn"
        ).style.display = "none";


        document.getElementById(
          "editNameBtn"
        ).style.display = "flex";


        showToast(
          "Edited successfully"
        );


      } catch (error) {

        console.error(
          "नाम अपडेट गर्दा त्रुटि:",
          error
        );


        showToast(
          "नाम अपडेट गर्न सकिएन।"
        );

      }

    };


    /* =====================================================
       PHOTO UPLOAD
    ===================================================== */

    window.triggerPhotoUpload = function() {

      document.getElementById(
        "avatarFileInput"
      ).click();

    };


    window.handlePhotoChange =
      async function(event) {

        const file =
          event.target.files[0];


        if (!file) return;


        const reader =
          new FileReader();


        reader.onload =
          function(e) {

            const img =
              new Image();


            img.src =
              e.target.result;


            img.onload =
              async function() {

                const canvas =
                  document.createElement(
                    "canvas"
                  );


                let width =
                  img.width;

                let height =
                  img.height;


                if (width > height) {

                  if (width > 200) {

                    height *=
                      200 / width;

                    width = 200;

                  }

                } else {

                  if (height > 200) {

                    width *=
                      200 / height;

                    height = 200;

                  }

                }


                canvas.width =
                  width;

                canvas.height =
                  height;


                const ctx =
                  canvas.getContext(
                    "2d"
                  );


                ctx.drawImage(
                  img,
                  0,
                  0,
                  width,
                  height
                );


                const compressedBase64 =
                  canvas.toDataURL(
                    "image/jpeg",
                    0.6
                  );


                document.getElementById(
                  "userAvatar"
                ).src =
                  compressedBase64;


                if (currentUserId) {

                  try {

                    const userDocRef =
                      doc(
                        db,
                        "users",
                        currentUserId
                      );


                    await updateDoc(
                      userDocRef,
                      {
                        photoURL:
                          compressedBase64
                      }
                    );


                    showToast(
                      "Edited successfully"
                    );


                  } catch (err) {

                    console.error(
                      "फोटो सेभ गर्दा त्रुटि:",
                      err
                    );


                    showToast(
                      "तस्वीर सेभ गर्न सकिएन।"
                    );

                  }

                }

              };

          };


        reader.readAsDataURL(file);

      };


    /* =====================================================
       LOGOUT
    ===================================================== */

    document
      .getElementById("logoutBtn")
      .addEventListener(
        "click",
        (e) => {

          e.preventDefault();


          signOut(auth)
            .then(() => {

              window.location.href =
                "login.html";

            });

        }
      );

  </script>
