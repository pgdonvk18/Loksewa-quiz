<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f2a4a">
<title>LoksewaQuest - User Profile</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
/* ===== Tokens ===== */
:root{--navy:#0f2a4a;--blue:#2563eb;--blue-d:#1d4ed8;--blue-l:#e8effd;--gold:#f5b301;--gold-d:#92620a;--gold-l:#fff6d6;--ok:#15803d;--ok-l:#dcfce7;--bad:#dc2626;--bg:#f4f6fa;--card:#fff;--text:#0f2a4a;--mute:#64748b;--line:#e2e8f0;--r:14px;--font:'Plus Jakarta Sans','Noto Sans Devanagari',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;font-family:var(--font)}
body{background:var(--bg);color:var(--text);min-height:100vh;min-height:100dvh;line-height:1.5;padding-bottom:calc(96px + env(safe-area-inset-bottom));overflow-x:hidden}
button{cursor:pointer;border:0;background:none;color:inherit;font-weight:600}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
/* ===== Header ===== */
.hero{background:var(--navy);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 64px;position:relative}
.hero::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:28px 28px;-webkit-mask-image:linear-gradient(#000,transparent);mask-image:linear-gradient(#000,transparent)}
.nav{position:relative;max-width:720px;margin:0 auto;display:flex;align-items:center;justify-content:space-between}
.nav h1{font-size:16px;font-weight:600}
.back{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.12)}.back:hover{background:rgba(255,255,255,.2)}
.who{position:relative;max-width:720px;margin:10px auto 0;display:flex;align-items:center;gap:16px}
.av{position:relative;flex-shrink:0}
.av img{width:84px;height:84px;border-radius:50%;object-fit:cover;background:#fff;border:3px solid rgba(255,255,255,.9);display:block}
.av button{position:absolute;right:-2px;bottom:-2px;width:34px;height:34px;border-radius:50%;background:var(--blue);color:#fff;border:2px solid var(--navy);font-size:12px;display:grid;place-items:center}
.av button:hover{background:var(--blue-d)}
.meta{min-width:0;flex:1}
.nm{display:flex;align-items:center;gap:8px}
.sbadge{display:none;align-items:center;justify-content:center;width:26px;height:26px;border-radius:50%;background:var(--gold);color:var(--navy);font-size:12px;flex-shrink:0}
.nm input{min-width:0;flex:1;font-size:20px;font-weight:700;color:#fff;background:transparent;border:0;border-bottom:2px solid transparent;padding:2px 0;outline:none;text-overflow:ellipsis}
.nm input:not(:disabled){border-bottom-color:var(--gold);background:rgba(255,255,255,.08);padding:2px 6px;border-radius:6px 6px 0 0}
.ib{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;flex-shrink:0;color:#cbd5e1}.ib:hover{background:rgba(255,255,255,.12);color:#fff}
.ib.save{display:none;background:var(--ok);color:#fff}.ib.save:hover{background:#166534}
.meta .em{font-size:13px;color:#b8c5e3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chips{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:99px;background:rgba(255,255,255,.12)}
/* ===== Body ===== */
.wrap{position:relative;max-width:720px;margin:-40px auto 0;padding:0 14px;display:flex;flex-direction:column;gap:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;animation:in .3s ease-out both}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.coin{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--gold-l);border-color:#f3d36b}
.coin .l{display:flex;align-items:center;gap:12px;min-width:0}
.coin .ic{width:46px;height:46px;border-radius:12px;background:var(--gold);color:var(--navy);display:grid;place-items:center;font-size:20px;flex-shrink:0}
.coin small{display:block;font-size:12px;color:var(--gold-d);font-weight:600}
.coin b{font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.coin .rd{min-height:44px;padding:0 18px;border-radius:10px;background:var(--navy);color:#fff;font-size:13px}.coin .rd:hover{background:#173a63}
.sec{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.sec h2{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}.sec h2 i{color:var(--gold-d)}
.sec .cnt{font-size:12px;font-weight:700;background:var(--gold-l);color:var(--gold-d);padding:2px 10px;border-radius:99px}
.sec p{font-size:12px;color:var(--mute);font-weight:400}
.scroller{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 8px;scroll-snap-type:x proximity;scrollbar-width:thin}
.bc{flex:0 0 112px;scroll-snap-align:start;text-align:center;border:1px solid var(--line);border-radius:12px;padding:12px 8px;background:#fff;transition:transform .15s,border-color .15s}
.bc:hover{transform:translateY(-2px);border-color:#94a3b8}
.bc .w{position:relative;width:48px;height:48px;margin:0 auto 8px;border-radius:50%;display:grid;place-items:center;font-size:20px;background:#eef2f7;color:#94a3b8}
.bc.on .w{background:var(--gold);color:var(--navy)}.bc.on{border-color:#f3d36b;background:var(--gold-l)}
.bc .w s{position:absolute;right:-4px;bottom:-4px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:9px;text-decoration:none;background:#fff;border:1px solid var(--line);color:var(--mute)}
.bc.on .w s{background:var(--ok);color:#fff;border-color:var(--ok)}
.bc .n{font-size:12px;font-weight:600;line-height:1.3;min-height:32px}
.bc .s{font-size:11px;color:var(--mute);margin-top:2px}.bc.on .s{color:var(--ok);font-weight:600}
.mp{height:4px;border-radius:9px;background:var(--line);margin-top:8px;overflow:hidden}.mp i{display:block;height:100%;background:var(--blue)}.bc.on .mp i{background:var(--gold)}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.st{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;min-width:0}
.st .i{width:40px;height:40px;border-radius:10px;display:grid;place-items:center;flex-shrink:0;font-size:16px;background:var(--blue-l);color:var(--blue)}
.st .i.g{background:var(--ok-l);color:var(--ok)}.st .i.y{background:var(--gold-l);color:var(--gold-d)}.st .i.n{background:#e6ebf3;color:var(--navy)}
.st h3{font-size:11px;font-weight:600;color:var(--mute)}
.st b{display:block;font-size:18px;line-height:1.25;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}
.st small{display:block;font-size:11px;color:var(--mute)}
.loading b{color:transparent;width:56px;border-radius:6px;background:linear-gradient(90deg,#eef2f7,#e2e8f0,#eef2f7);background-size:200% 100%;animation:sh 1.2s linear infinite}
@keyframes sh{to{background-position:-200% 0}}
.note{display:none;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px;padding:8px 12px;border-radius:10px;font-size:12px;background:#fef3c7;color:#92400e}
.note button{min-height:36px;padding:0 12px;border-radius:8px;background:#fff;font-size:12px}
.menu{padding:4px 16px}
.mi{display:flex;align-items:center;justify-content:space-between;width:100%;min-height:54px;font-size:14px;font-weight:600;text-align:left;border-bottom:1px solid var(--line)}
.mi:last-child{border-bottom:0}.mi .a{display:flex;align-items:center;gap:12px}.mi .a i{width:20px;text-align:center;color:var(--mute)}
.mi>i{font-size:12px;color:#cbd5e1}.mi.out,.mi.out .a i{color:var(--bad)}.mi:hover{color:var(--blue)}.mi.out:hover{color:#b91c1c}
/* ===== Toast & modal ===== */
#toastMessage{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top));transform:translateX(-50%);z-index:300;max-width:calc(100% - 24px);padding:10px 16px;border-radius:10px;background:var(--navy);color:#fff;font-size:13px;font-weight:500;box-shadow:0 6px 18px rgba(15,42,74,.3);display:none;animation:in .2s ease-out}
.ov{position:fixed;inset:0;z-index:250;background:rgba(15,42,74,.55);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .2s}
.ov.show{opacity:1;pointer-events:auto}
.sheet{position:relative;width:100%;max-width:420px;background:#fff;border-radius:20px 20px 0 0;padding:26px 20px calc(24px + env(safe-area-inset-bottom));text-align:center;transform:translateY(24px);transition:transform .25s ease}
.ov.show .sheet{transform:none}
.sheet .x{position:absolute;top:8px;right:8px;width:44px;height:44px;border-radius:10px;color:var(--mute)}.sheet .x:hover{background:var(--bg)}
.mb{width:64px;height:64px;border-radius:50%;margin:0 auto 12px;display:grid;place-items:center;font-size:26px;background:var(--gold);color:var(--navy)}
.mb.lk{background:#eef2f7;color:#94a3b8}
.sheet h2{font-size:17px}.sheet p{font-size:13px;color:var(--mute);margin:6px 0 12px}
.stt{display:inline-block;font-size:12px;font-weight:700;padding:3px 12px;border-radius:99px;margin-bottom:12px}
.stt.unlocked{background:var(--ok-l);color:var(--ok)}.stt.locked{background:#eef2f7;color:var(--mute)}
.pb{height:8px;background:var(--line);border-radius:9px;overflow:hidden}.pb i{display:block;height:100%;width:0;background:var(--blue);border-radius:9px;transition:width .4s}
.pt{font-size:12px;color:var(--mute);margin-top:6px}
@media(min-width:640px){.ov{align-items:center}.sheet{border-radius:20px}.stats{grid-template-columns:repeat(4,1fr)}.st{flex-direction:column;align-items:flex-start;text-align:left}}
@media(max-width:360px){.av img{width:68px;height:68px}.nm input{font-size:17px}.coin b{font-size:22px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<div id="toastMessage" role="status" aria-live="polite">Edited successfully</div>

<header class="hero">
  <div class="nav">
    <a href="dashboard.html" class="back" aria-label="पछाडि जानुहोस्"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i></a>

    <div style="width:44px" aria-hidden="true"></div>
  </div>
  <div class="who">

        <button type="button" class="ib save" id="saveNameBtn" onclick="saveNameUpdate()" aria-label="नाम सेभ गर्नुहोस्"><i class="fa-solid fa-check" aria-hidden="true"></i></button>
      </div>
      <p class="em" id="userEmail">fetching...</p>
      <div class="chips"><span class="chip"><i class="fa-solid fa-location-dot" aria-hidden="true"></i>नेपाल</span><span class="chip"><i class="fa-solid fa-award" aria-hidden="true"></i><span id="levelChip">Aspirant</span></span></div>
    </div>

</header>

<main class="wrap">
  <section class="card coin" aria-label="कोइन">
    <div class="l"><div class="ic" aria-hidden="true"><i class="fa-solid fa-coins"></i></div><div><small>मेरो कोइन (Coins)</small><b id="userCoinsDisplay">0</b></div></div>
    <button class="rd" onclick="showToast('रिडिम फिचर छिट्टै आउँदैछ!')">रिडिम</button>
  </section>

  <section class="card" aria-labelledby="statsH">

    <div class="note" id="statsNote"><span>तथ्यांक लोड गर्न सकिएन।</span><button type="button" id="retryStats">फेरि प्रयास</button></div>
    <div class="stats" id="statsGrid">
      <div class="st loading"><div class="i" aria-hidden="true"><i class="fa-solid fa-circle-check"></i></div><div><h3>Solved Questions</h3><b id="totalSolved">0</b></div></div>
      <div class="st loading"><div class="i n" aria-hidden="true"><i class="fa-solid fa-clock-rotate-left"></i></div><div><h3>Spent Time</h3><b id="spentTime">0 hrs</b></div></div>
      <div class="st loading"><div class="i g" aria-hidden="true"><i class="fa-solid fa-bullseye"></i></div><div><h3>Accuracy</h3><b id="accuracyRate">0%</b></div></div>
      <div class="st loading"><div class="i y" aria-hidden="true"><i class="fa-solid fa-award"></i></div><div><h3>Quiz Level</h3><b id="userRank">Aspirant</b><small id="levelNext"></small></div></div>
    </div>

  <section class="card" aria-labelledby="achH">
    <div class="sec"><div><h2 id="achH"><i class="fa-solid fa-trophy" aria-hidden="true"></i>Achievements</h2><p>तपाईंका उपलब्धिहरू</p></div><span class="cnt" id="badgeCount">0/7</span></div>

  <section class="card menu" aria-label="खाता">

</main>

<div class="ov" id="badgeModal" onclick="closeBadgeDetails(event)">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="modalBadgeName" onclick="event.stopPropagation()">
    <button class="x" id="modalClose" onclick="closeBadgeDetails()" aria-label="बन्द गर्नुहोस्"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button>
    <div class="mb" id="modalBadgeIcon"><i class="fa-solid fa-trophy"></i></div>

    <p id="modalBadgeDesc">Badge description</p>
    <div class="stt locked" id="modalBadgeStatus">Locked</div>
    <div class="pb"><i id="modalProgressFill"></i></div>
    <div class="pt" id="modalProgressText">0 / 100</div>
  </div>
</div>

<!-- SCRIPTS -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getAuth, onAuthStateChanged, signOut, updateProfile, sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import { getFirestore, doc, getDoc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCkKCU1re5b9MtdsAF1F4xI6rGxmxhGZak",
  authDomain: "loksewaquest-227b6.firebaseapp.com",
  projectId: "loksewaquest-227b6",
  storageBucket: "loksewaquest-227b6.firebasestorage.app",
  messagingSenderId: "779234903809",
  appId: "1:779234903809:web:dd0dd0ffb742e1c218bd00"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const SUPABASE_URL = "https://edyirdedkiarguvurpxq.supabase.co";
// FIX: the previous key in this file was corrupted, so user_stats could never be read.
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVkeWlyZGVka2lhcmd1dnVycHhxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwMTg2NjIsImV4cCI6MjEwNDU5NDY2Mn0.yhNn3YKmFSkxRdefk2F22qxTFhuKS90NH5fa3zzKSaY";
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = id => document.getElementById(id);
let currentUserId = null, currentBadgeState = {}, currentBadgeMetrics = {}, toastTimer = null;

function showToast(message) {
  const t = $("toastMessage");
  t.textContent = message; t.style.display = "block";
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { t.style.display = "none"; }, 2500);
}
window.showToast = showToast;

/* ---------- Badges (definitions unchanged) ---------- */
const BADGES = [
  { id: "first_step", name: "First Step", nepali: "पहिलो कदम", icon: "fa-flag-checkered", metric: "solved", target: 1, description: "पहिलो प्रश्न solve गरेर LoksewaQuest यात्राको सुरुवात गर्नुहोस्।" },
  { id: "practice_starter", name: "Practice Starter", nepali: "अभ्यास सुरु", icon: "fa-book-open", metric: "solved", target: 50, description: "50 वटा प्रश्न solve गरेपछि यो badge unlock हुन्छ।" },
  { id: "question_hunter", name: "Question Hunter", nepali: "प्रश्न शिकारी", icon: "fa-crosshairs", metric: "solved", target: 100, description: "100 वटा प्रश्न solve गरेर Question Hunter बन्नुहोस्।" },
  { id: "knowledge_seeker", name: "Knowledge Seeker", nepali: "ज्ञान खोजी", icon: "fa-book", metric: "solved", target: 500, description: "500 वटा प्रश्न solve गरेपछि Knowledge Seeker badge unlock हुन्छ।" },
  { id: "question_master", name: "Question Master", nepali: "प्रश्न मास्टर", icon: "fa-crown", metric: "solved", target: 1000, description: "1,000 वटा प्रश्न solve गरेर Question Master बन्नुहोस्।" },
  { id: "coin_collector", name: "Coin Collector", nepali: "Coin Collector", icon: "fa-coins", metric: "coins", target: 100, description: "100 coins जम्मा गरेपछि Coin Collector badge unlock हुन्छ।" },
  { id: "exam_warrior", name: "Exam Warrior", nepali: "परीक्षा योद्धा", icon: "fa-shield-halved", metric: "exams", target: 5, description: "5 वटा Set Exam complete गरेपछि Exam Warrior badge unlock हुन्छ।" },
  { id: "consistency", name: "Consistency Pro", nepali: "निरन्तर साधक", icon: "fa-fire", metric: "streak", target: 7, description: "7 दिनको learning streak पूरा गरेपछि यो badge unlock हुन्छ।" }
];
const getMetricLabel = m => ({ solved: "questions", coins: "coins", exams: "exams", streak: "days" }[m] || "");

/* Quiz Level is derived from solved questions, using the same thresholds as the solved-badges. */
const LEVELS = [[0, "Aspirant"], [50, "Practice Starter"], [100, "Question Hunter"], [500, "Knowledge Seeker"], [1000, "Question Master"]];
function levelFor(solved) {
  let i = 0; LEVELS.forEach((l, idx) => { if (solved >= l[0]) i = idx; });
  return { name: LEVELS[i][1], next: LEVELS[i + 1] || null };
}

async function processBadges(userDocRef, userData, metrics) {
  const existing = userData.badges || {}, updated = { ...existing }, firestoreUpdates = {};
  BADGES.forEach(badge => {
    const currentValue = Number(metrics[badge.metric] || 0);
    const existingBadge = existing[badge.id] || {};
    const alreadyUnlocked = existingBadge === true || existingBadge.unlocked === true;
    const reached = currentValue >= badge.target;
    if (reached || alreadyUnlocked) {
      const d = { unlocked: true, progress: Math.min(currentValue, badge.target), target: badge.target, unlockedAt: existingBadge.unlockedAt || new Date().toISOString() };
      updated[badge.id] = d;
      if (existingBadge.unlocked !== true || Number(existingBadge.progress || 0) !== d.progress) firestoreUpdates[`badges.${badge.id}`] = d;
    } else {
      const d = { unlocked: false, progress: Math.min(currentValue, badge.target), target: badge.target };
      updated[badge.id] = d;
      if (existingBadge.unlocked !== false || Number(existingBadge.progress || 0) !== d.progress) firestoreUpdates[`badges.${badge.id}`] = d;
    }
  });
  if (Object.keys(firestoreUpdates).length > 0) {
    try { await updateDoc(userDocRef, firestoreUpdates); } catch (e) { console.error("Badge save error:", e); }
  }
  return updated;
}

function renderBadges(badgeState, metrics) {
  const box = $("badgeScroller"); box.innerHTML = "";
  let unlockedCount = 0;
  BADGES.forEach(badge => {
    const saved = badgeState[badge.id] || {};
    const value = Number(metrics[badge.metric] || 0);
    const unlocked = saved.unlocked === true || value >= badge.target;
    if (unlocked) unlockedCount++;
    const shown = Math.min(value, badge.target), pct = Math.min(100, Math.round(shown / badge.target * 100));
    const card = document.createElement("button");
    card.type = "button"; card.setAttribute("role", "listitem");
    card.className = `bc ${unlocked ? "on" : "off"}`;
    card.setAttribute("aria-label", `${badge.nepali}: ${unlocked ? "प्राप्त" : "लक गरिएको"} ${shown}/${badge.target}`);
    card.onclick = () => openBadgeDetails(badge.id);
    card.innerHTML = `<div class="w"><i class="fa-solid ${badge.icon}"></i><s><i class="fa-solid ${unlocked ? "fa-check" : "fa-lock"}"></i></s></div>
      <div class="n">${badge.nepali}</div><div class="s">${unlocked ? "✓ Earned" : `${shown}/${badge.target}`}</div><div class="mp"><i style="width:${pct}%"></i></div>`;
    box.appendChild(card);
  });
  $("badgeCount").textContent = `${unlockedCount}/${BADGES.length}`;
  currentBadgeState = badgeState; currentBadgeMetrics = metrics;
}

function renderPurchasedBadgeOnProfile(userData) {
  const el = $("profilePurchasedBadge");
  const purchased = userData.purchasedBadges || userData.inventory || [];
  const equipped = userData.equippedBadge;
  const key = equipped || (Array.isArray(purchased) && purchased.length > 0 ? purchased[purchased.length - 1] : null);
  if (!key) { el.style.display = "none"; return; }
  let icon = "fa-crown", text = "";
  if (key.includes("aspirant") || key === "badge_aspirant") { icon = ""; text = "A"; }
  else if (key.includes("pro") || key === "badge_pro") { icon = ""; text = "P"; }
  else if (key.includes("master") || key === "badge_master") { icon = ""; text = "M"; }
  el.style.display = "flex";
  el.innerHTML = icon ? `<i class="fa-solid ${icon}"></i>` : `<span style="font-weight:800;font-size:13px">${text}</span>`;
}

let lastFocus = null;
window.openBadgeDetails = function (id) {
  const badge = BADGES.find(b => b.id === id); if (!badge) return;
  const saved = currentBadgeState[id] || {}, value = Number(currentBadgeMetrics[badge.metric] || 0);
  const unlocked = saved.unlocked === true || value >= badge.target;
  const shown = Math.min(value, badge.target), pct = Math.min(100, Math.round(shown / badge.target * 100));
  $("modalBadgeIcon").innerHTML = `<i class="fa-solid ${badge.icon}"></i>`;
  $("modalBadgeIcon").className = "mb" + (unlocked ? "" : " lk");
  $("modalBadgeName").textContent = `${badge.nepali} · ${badge.name}`;
  $("modalBadgeDesc").textContent = badge.description;
  const st = $("modalBadgeStatus");
  st.textContent = unlocked ? "✓ BADGE UNLOCKED" : "🔒 LOCKED";
  st.className = "stt " + (unlocked ? "unlocked" : "locked");
  $("modalProgressFill").style.width = `${pct}%`;
  $("modalProgressText").textContent = `${shown} / ${badge.target} ${getMetricLabel(badge.metric)}`;
  lastFocus = document.activeElement;
  $("badgeModal").classList.add("show"); $("modalClose").focus();
};
window.closeBadgeDetails = function (event) {
  if (event && event.target !== $("badgeModal")) return;
  $("badgeModal").classList.remove("show");
  if (lastFocus && lastFocus.focus) lastFocus.focus();
};
addEventListener("keydown", e => { if (e.key === "Escape" && $("badgeModal").classList.contains("show")) closeBadgeDetails(); });

/* ---------- Stats (FIXED) ---------- */
function setLoadingStats(on) { document.querySelectorAll(".st").forEach(s => s.classList.toggle("loading", on)); }

async function loadStats(user, userData, userDocRef) {
  setLoadingStats(true); $("statsNote").style.display = "none";
  let sbSolved = 0, minutes = 0, accuracy = null, ok = true;
  try {
    const { data, error } = await supabase.from("user_stats").select("*").eq("id", user.uid).maybeSingle();
    if (error) throw error;
    if (data) {
      sbSolved = Number(data.total_solved || 0);
      minutes = Number(data.time_spent_minutes || 0);
      const correct = Number(data.correct_answers || 0);
      if (sbSolved > 0) accuracy = data.correct_answers != null ? Math.round(correct / sbSolved * 100) : (data.accuracy != null ? Math.round(Number(data.accuracy)) : null);
    } else {
      // Older accounts may have no stats row yet: create it, same shape as registration.
      try { await supabase.from("user_stats").upsert([{ id: user.uid, total_solved: 0, time_spent_minutes: 0, accuracy: 0 }]); } catch (e) { console.error(e); }
    }
  } catch (err) {
    ok = false; console.error("Supabase stats error:", err);
  }

  // Same total the badges use: Firestore practice answers + Supabase quiz answers.
  const solved = Number(userData.practiceSolved || 0) + sbSolved;
  const lvl = levelFor(solved);
  const metrics = {
    solved, coins: Number(userData.coins || 0),
    exams: Number(userData.completedExams || userData.examsCompleted || 0),
    streak: Number(userData.streakDays ?? userData.currentStreak ?? userData.streak ?? 0)
  };

  $("totalSolved").textContent = solved.toLocaleString();
  $("spentTime").textContent = minutes >= 60 ? `${(minutes / 60).toFixed(1)} hrs` : `${Math.round(minutes)} min`;
  $("accuracyRate").textContent = accuracy === null ? "—" : `${accuracy}%`;
  $("userRank").textContent = lvl.name; $("levelChip").textContent = lvl.name;
  $("levelNext").textContent = lvl.next ? `अर्को: ${solved}/${lvl.next[0]}` : "उच्चतम लेभल 🎉";
  setLoadingStats(false);
  if (!ok) $("statsNote").style.display = "flex";

  // Badges render from Firestore data even if Supabase failed.
  try { renderBadges(await processBadges(userDocRef, userData, metrics), metrics); }
  catch (e) { console.error("Badge error:", e); renderBadges(userData.badges || {}, metrics); }
}

/* ---------- Auth & profile ---------- */
onAuthStateChanged(auth, async (user) => {
  if (!user) { window.location.href = "login.html"; return; }
  currentUserId = user.uid;
  const userEmail = user.email || "No Email";
  $("userEmail").textContent = userEmail;
  let displayName = user.displayName || userEmail.split("@")[0];
  let userData = {};
  const userDocRef = doc(db, "users", user.uid);
  try {
    const snap = await getDoc(userDocRef);
    if (snap.exists()) {
      userData = snap.data();
      $("userCoinsDisplay").textContent = userData.coins !== undefined ? Number(userData.coins).toLocaleString() : 0;
      if (userData.name) displayName = userData.name;
      $("userNameInput").value = displayName;
      if (userData.photoURL) $("userAvatar").src = userData.photoURL;
      else if (user.photoURL) $("userAvatar").src = user.photoURL;
      renderPurchasedBadgeOnProfile(userData);
    } else {
      $("userNameInput").value = displayName;
      $("userCoinsDisplay").textContent = "0";
      userData = { name: displayName, email: userEmail, coins: 0, practiceSolved: 0, badges: {}, purchasedBadges: [] };
      await setDoc(userDocRef, userData, { merge: true });
    }
  } catch (err) {
    console.error("Firestore error:", err);
    $("userNameInput").value = displayName;
    showToast("प्रोफाइल लोड गर्न सकिएन।");
  }
  $("retryStats").onclick = () => loadStats(user, userData, userDocRef);
  loadStats(user, userData, userDocRef);
});

/* ---------- Edit name / photo / password / logout ---------- */
window.enableNameEdit = function () {
  const input = $("userNameInput");
  input.disabled = false; input.focus(); input.select();
  $("editNameBtn").style.display = "none"; $("saveNameBtn").style.display = "grid";
};
window.saveNameUpdate = async function () {
  const newName = $("userNameInput").value.trim();
  if (!newName) { showToast("नाम खाली राख्न पाइँदैन।"); return; }
  if (!currentUserId) return;
  try {
    if (auth.currentUser) await updateProfile(auth.currentUser, { displayName: newName });

    // Firebase UID is the permanent identity. The display name is only a label.
    // Keep the same user linked in Supabase even when the name changes.
    await updateDoc(doc(db, "users", currentUserId), { name: newName });

    // Update this user's existing leaderboard rows by UID, never by username.
    // This prevents changing the name from creating a second leaderboard identity.
    const { error: leaderboardNameError } = await supabase
      .from("exam_leaderboard")
      .update({ username: newName })
      .eq("user_uid", currentUserId);

    if (leaderboardNameError) {
      console.warn("Leaderboard name sync failed:", leaderboardNameError);
    }

    $("userNameInput").disabled = true; $("saveNameBtn").style.display = "none"; $("editNameBtn").style.display = "grid";
    showToast("Edited successfully");
  } catch (error) { console.error("Error updating name:", error); showToast("नाम अपडेट गर्न सकिएन।"); }
};
$("userNameInput").addEventListener("keydown", e => { if (e.key === "Enter" && !e.target.disabled) saveNameUpdate(); });

window.triggerPhotoUpload = () => $("avatarFileInput").click();
window.handlePhotoChange = function (event) {
  const file = event.target.files[0]; if (!file) return;
  if (!file.type.startsWith("image/")) { showToast("कृपया फोटो फाइल छान्नुहोस्।"); return; }
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image(); img.src = e.target.result;
    img.onload = async () => {
      const canvas = document.createElement("canvas");
      let w = img.width, h = img.height;
      if (w > h && w > 200) { h *= 200 / w; w = 200; } else if (h > 200) { w *= 200 / h; h = 200; }
      canvas.width = w; canvas.height = h;
      canvas.getContext("2d").drawImage(img, 0, 0, w, h);
      const compressed = canvas.toDataURL("image/jpeg", 0.6);
      $("userAvatar").src = compressed;
      if (currentUserId) {
        try { await updateDoc(doc(db, "users", currentUserId), { photoURL: compressed }); showToast("Edited successfully"); }
        catch (err) { console.error(err); showToast("फोटो सेभ गर्न सकिएन।"); }
      }
    };
  };
  reader.readAsDataURL(file);
};

$("pwBtn").addEventListener("click", async () => {
  const u = auth.currentUser; if (!u || !u.email) return;
  if (!u.providerData.some(p => p.providerId === "password")) { showToast("तपाईंले Google बाट लगइन गर्नुभएको छ। पासवर्ड Google खाताबाट बदल्नुहोस्।"); return; }
  try { await sendPasswordResetEmail(auth, u.email); showToast("पासवर्ड रिसेट लिङ्क इमेलमा पठाइयो।"); }
  catch (err) { console.error(err); showToast("रिसेट इमेल पठाउन सकिएन।"); }
});
$("logoutBtn").addEventListener("click", () => { signOut(auth).then(() => { window.location.href = "login.html"; }); });
</script>
