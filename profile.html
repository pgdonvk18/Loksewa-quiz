<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>LoksewaQuest - User Profile</title>

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { background: #f8fafc; color: #1e293b; min-height: 100vh; padding-bottom: 90px; }

    .profile-header {
      background: linear-gradient(135deg, #0f2a4a 0%, #1e40af 100%);
      padding: 24px 20px 34px;
      border-radius: 0 0 30px 30px;
      color: white;
      position: relative;
      z-index: 1;
    }

    .nav-bar { display: flex; align-items: center; justify-content: space-between; margin-bottom: 25px; }
    .back-btn {
      background: rgba(255,255,255,0.15); border: none; width: 40px; height: 40px; border-radius: 12px;
      color: white; font-size: 16px; display: flex; align-items: center; justify-content: center; cursor: pointer; text-decoration: none; backdrop-filter: blur(5px);
    }
    .nav-bar h2 { font-size: 18px; font-weight: 700; }

    .user-profile-card { display: flex; align-items: center; gap: 16px; }
    .avatar-wrapper { position: relative; flex-shrink: 0; }
    .avatar-container { width: 76px; height: 76px; border-radius: 50%; background: #ffffff; padding: 3px; box-shadow: 0 8px 20px rgba(0,0,0,0.15); }
    .avatar-container img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
    .avatar-edit-btn {
      position: absolute; bottom: 0; right: 0; background: #2563eb; color: #ffffff; border: 2px solid #ffffff;
      width: 26px; height: 26px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 11px; cursor: pointer;
    }
    .avatar-edit-btn input { display: none; }

    .user-meta { flex: 1; min-width: 0; }
    .user-meta p { font-size: 13px; color: #cbd5e1; font-weight: 500; margin-bottom: 7px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .name-badge-row {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 5px;
    }

    .name-input-box {
      background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.3); border-radius: 10px;
      padding: 6px 12px; color: #ffffff; font-size: 17px; font-weight: 800; width: 150px; outline: none;
    }
    .name-input-box:disabled { background: transparent; border-color: transparent; padding: 0; width: auto; max-width: 180px; }

    .user-badge-logo {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 24px;
      height: 24px;
      border-radius: 6px;
      font-size: 12px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }

    .edit-name-btn, .save-name-btn {
      background: rgba(255,255,255,0.2); border: none; width: 34px; height: 34px; border-radius: 8px;
      color: #ffffff; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0;
    }
    .save-name-btn { background: #16a34a; display: none; }

    .address-badge {
      display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,0.15);
      padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 600; color: #fbbf24;
    }

    .container { padding: 0 20px; }

    .coin-display-card {
      background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%);
      border-radius: 20px; padding: 16px 18px; box-shadow: 0 6px 20px rgba(0,0,0,0.06); border: 1px solid #fde68a;
      display: flex; align-items: center; justify-content: space-between; margin-top: 18px; margin-bottom: 14px; position: relative; z-index: 2;
    }
    .coin-left { display: flex; align-items: center; gap: 13px; }
    .coin-icon { width: 50px; height: 50px; border-radius: 14px; background: #ffffff; display: flex; align-items: center; justify-content: center; color: #f59e0b; font-size: 25px; box-shadow: 0 3px 12px rgba(245,158,11,0.18); }
    .coin-info h4 { font-size: 11px; font-weight: 700; color: #92400e; text-transform: uppercase; margin-bottom: 2px; }
    .coin-info span { font-size: 22px; font-weight: 800; color: #78350f; }
    .redeem-btn { background: #d97706; color: white; border: none; padding: 8px 13px; border-radius: 10px; font-size: 11px; font-weight: 700; cursor: pointer; }

    .achievements-section { background: #ffffff; border-radius: 20px; padding: 15px 0 12px; margin-bottom: 18px; border: 1px solid #f1f5f9; box-shadow: 0 6px 20px rgba(0,0,0,0.05); }
    .achievement-header { padding: 0 16px; display: flex; align-items: center; justify-content: space-between; margin-bottom: 11px; }
    .achievement-title { display: flex; align-items: center; gap: 9px; }
    .achievement-title-icon { width: 34px; height: 34px; border-radius: 10px; background: #fff7ed; color: #d97706; display: flex; align-items: center; justify-content: center; font-size: 15px; }
    .achievement-title h3 { font-size: 14px; font-weight: 800; color: #0f172a; }
    .badge-count { background: #eff6ff; color: #2563eb; font-size: 10px; font-weight: 800; padding: 5px 9px; border-radius: 20px; }

    .badge-scroller { display: flex; gap: 9px; overflow-x: auto; padding: 2px 16px 7px; scrollbar-width: none; }
    .badge-scroller::-webkit-scrollbar { display: none; }

    .badge-card { min-width: 105px; width: 105px; height: 128px; background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 16px; padding: 10px 7px 8px; text-align: center; flex-shrink: 0; }
    .badge-card.unlocked { background: linear-gradient(145deg,#ffffff,#fffdf7); border-color: #fde68a; box-shadow: 0 4px 13px rgba(245,158,11,.12); }
    .badge-icon-wrap { width: 55px; height: 55px; margin: 0 auto 7px; border-radius: 16px; display: flex; align-items: center; justify-content: center; position: relative; background: #e2e8f0; color: #94a3b8; font-size: 23px; }
    .badge-card.unlocked .badge-icon-wrap { background: linear-gradient(145deg,#f59e0b,#d97706); color: #fff; }
    .badge-name { font-size: 10px; font-weight: 800; color: #334155; height: 25px; display: flex; align-items: center; justify-content: center; }
    .badge-status { font-size: 8px; color: #16a34a; font-weight: 700; margin-top: 3px; }

    .stats-grid { display: grid; grid-template-columns: repeat(2,1fr); gap: 14px; margin-bottom: 18px; }
    .stat-card { background: #ffffff; border-radius: 20px; padding: 17px; box-shadow: 0 6px 20px rgba(0,0,0,.05); border: 1px solid #f1f5f9; display: flex; flex-direction: column; gap: 10px; }
    .stat-icon { width: 42px; height: 42px; border-radius: 13px; display: flex; align-items: center; justify-content: center; font-size: 17px; }
    .stat-icon.solved { background: #eff6ff; color: #2563eb; }
    .stat-icon.time { background: #fff7ed; color: #ea580c; }
    .stat-icon.accuracy { background: #f0fdf4; color: #16a34a; }
    .stat-icon.rank { background: #fdf4ff; color: #c084fc; }
    .stat-info h4 { font-size: 11px; font-weight: 700; color: #64748b; text-transform: uppercase; margin-bottom: 3px; }
    .stat-info span { font-size: 19px; font-weight: 800; color: #0f172a; }

    .menu-card { background: #ffffff; border-radius: 20px; padding: 8px 16px; box-shadow: 0 6px 20px rgba(0,0,0,.05); border: 1px solid #f1f5f9; margin-bottom: 20px; }
    .menu-item { display: flex; align-items: center; justify-content: space-between; padding: 14px 4px; text-decoration: none; border-bottom: 1px solid #f8fafc; color: #334155; font-size: 14px; font-weight: 600; }
    .menu-item-left { display: flex; align-items: center; gap: 12px; }
    .menu-item-left i { font-size: 16px; color: #64748b; width: 24px; text-align: center; }
    .menu-item.logout { color: #dc2626; }

    #toastMessage {
      position: fixed; bottom: 90px; left: 50%; transform: translateX(-50%); background: #0f172a; color: #ffffff;
      padding: 10px 20px; border-radius: 30px; font-size: 13px; font-weight: 600; box-shadow: 0 4px 15px rgba(0,0,0,.2);
      z-index: 9999; display: none; text-align: center;
    }
  </style>
</head>
<body>

  <div id="toastMessage">Edited successfully</div>

  <div class="profile-header">
    <div class="nav-bar">
      <a href="dashboard.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
      <h2>My Profile</h2>
      <div style="width:40px;"></div>
    </div>

    <div class="user-profile-card">
      <div class="avatar-wrapper">
        <div class="avatar-container">
          <img id="userAvatar" src="https://www.svgrepo.com/show/382109/male-avatar-boy-face-man-user-9.svg" alt="Profile Photo">
        </div>
        <button type="button" class="avatar-edit-btn" onclick="triggerPhotoUpload()">
          <i class="fa-solid fa-pen"></i>
        </button>
        <input type="file" id="avatarFileInput" accept="image/*" style="display:none;" onchange="handlePhotoChange(event)">
      </div>

      <div class="user-meta">
        <div class="name-badge-row">
          <input type="text" id="userNameInput" class="name-input-box" value="Loading..." disabled>
          
          <div id="user-purchased-badges" style="display: flex; gap: 4px; align-items: center;"></div>

          <button type="button" class="edit-name-btn" id="editNameBtn" onclick="enableNameEdit()">
            <i class="fa-solid fa-pen"></i>
          </button>
          <button type="button" class="save-name-btn" id="saveNameBtn" onclick="saveNameUpdate()">
            <i class="fa-solid fa-check"></i>
          </button>
        </div>

        <p id="userEmail">fetching...</p>

        <div class="address-badge">
          <i class="fa-solid fa-location-dot"></i>
          <span>नेपाल</span>
        </div>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="coin-display-card">
      <div class="coin-left">
        <div class="coin-icon"><i class="fa-solid fa-coins"></i></div>
        <div class="coin-info">
          <h4>मेरो कोइन (Coins)</h4>
          <span id="userCoinsDisplay">0</span>
        </div>
      </div>
      <button class="redeem-btn" onclick="showToast('रिडिम फिचर छिट्टै आउँदैछ!')">रिडिम</button>
    </div>

    <div class="achievements-section">
      <div class="achievement-header">
        <div class="achievement-title">
          <div class="achievement-title-icon"><i class="fa-solid fa-trophy"></i></div>
          <div>
            <h3>Achievements</h3>
            <p>तपाईंका उपलब्धिहरू</p>
          </div>
        </div>
        <div class="badge-count" id="badgeCount">0/8</div>
      </div>
      <div class="badge-scroller" id="badgeScroller"></div>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon solved"><i class="fa-solid fa-circle-check"></i></div>
        <div class="stat-info">
          <h4>Solved Questions</h4>
          <span id="totalSolved">0</span>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon time"><i class="fa-solid fa-clock-rotate-left"></i></div>
        <div class="stat-info">
          <h4>Spent Time</h4>
          <span id="spentTime">0 hrs</span>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon accuracy"><i class="fa-solid fa-bullseye"></i></div>
        <div class="stat-info">
          <h4>Accuracy</h4>
          <span id="accuracyRate">0%</span>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon rank"><i class="fa-solid fa-award"></i></div>
        <div class="stat-info">
          <h4>Quiz Level</h4>
          <span id="userRank">Aspirant</span>
        </div>
      </div>
    </div>

    <div class="menu-card">
      <a href="#" class="menu-item" onclick="enableNameEdit(); return false;">
        <div class="menu-item-left"><i class="fa-solid fa-user-pen"></i><span>Edit Profile</span></div>
        <i class="fa-solid fa-chevron-right" style="font-size:12px;color:#cbd5e1;"></i>
      </a>
      <a href="#" class="menu-item">
        <div class="menu-item-left"><i class="fa-solid fa-shield-halved"></i><span>Change Password</span></div>
        <i class="fa-solid fa-chevron-right" style="font-size:12px;color:#cbd5e1;"></i>
      </a>
      <a href="#" id="logoutBtn" class="menu-item logout">
        <div class="menu-item-left"><i class="fa-solid fa-right-from-bracket"></i><span>Log Out</span></div>
      </a>
    </div>
  </div>

  <script src="components.js"></script>
  <script>loadBottomNav('profile');</script>
  <script src="main.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut, updateProfile } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCkKCU1re5b9MtdsAF1F4xI6rGxmxhGZak",
      authDomain: "loksewaquest-227b6.firebaseapp.com",
      projectId: "loksewaquest-227b6",
      storageBucket: "loksewaquest-227b6.firebasestorage.app",
      messagingSenderId: "779234903809",
      appId: "1:779234903809:web:dd0dd0ffb742e1c218bd00"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    let currentUserId = null;

    function showToast(message) {
      const toast = document.getElementById("toastMessage");
      toast.textContent = message;
      toast.style.display = "block";
      setTimeout(() => { toast.style.display = "none"; }, 2500);
    }
    window.showToast = showToast;

    function renderUserPurchasedBadges(inventory = []) {
      const container = document.getElementById("user-purchased-badges");
      container.innerHTML = "";

      let badgesHTML = "";
      if (inventory.includes('badge_aspirant')) {
        badgesHTML += `<span class="user-badge-logo" style="background: linear-gradient(135deg, #22c55e, #15803d); color: white;" title="Aspirant Badge"><i class="fa-solid fa-seedling"></i></span>`;
      }
      if (inventory.includes('badge_pro')) {
        badgesHTML += `<span class="user-badge-logo" style="background: linear-gradient(135deg, #3b82f6, #1d4ed8); color: white;" title="Pro Badge"><i class="fa-solid fa-bolt"></i></span>`;
      }
      if (inventory.includes('badge_master')) {
        badgesHTML += `<span class="user-badge-logo" style="background: linear-gradient(135deg, #f59e0b, #b45309); color: white;" title="Master Badge"><i class="fa-solid fa-award"></i></span>`;
      }
      if (inventory.includes('badge_loksewa_king')) {
        badgesHTML += `<span class="user-badge-logo" style="background: linear-gradient(135deg, #ec4899, #be185d); color: white;" title="Loksewa King"><i class="fa-solid fa-crown"></i></span>`;
      }
      container.innerHTML = badgesHTML;
    }

    function renderAchievements(userData) {
      const badgeScroller = document.getElementById("badgeScroller");
      badgeScroller.innerHTML = "";

      const allBadges = [
        { id: 'badge_aspirant', name: 'Aspirant', icon: 'fa-seedling' },
        { id: 'badge_pro', name: 'Quiz Pro', icon: 'fa-bolt' },
        { id: 'badge_master', name: 'Master', icon: 'fa-award' },
        { id: 'badge_loksewa_king', name: 'Loksewa King', icon: 'fa-crown' },
        { id: 'badge_streak_7', name: '7 Days Streak', icon: 'fa-fire' },
        { id: 'badge_scorer_100', name: 'Centurion', icon: 'fa-star' },
        { id: 'badge_speedy', name: 'Fast Fingers', icon: 'fa-stopwatch' },
        { id: 'badge_expert', name: 'Expert Level', icon: 'fa-graduation-cap' }
      ];

      const inventory = userData.inventory || [];
      const userBadges = userData.badges || [];
      let unlockedCount = 0;

      allBadges.forEach(badge => {
        const isUnlocked = inventory.includes(badge.id) || userBadges.includes(badge.id);
        if (isUnlocked) unlockedCount++;

        const badgeCard = document.createElement('div');
        badgeCard.className = `badge-card ${isUnlocked ? 'unlocked' : ''}`;
        badgeCard.innerHTML = `
          <div class="badge-icon-wrap">
            <i class="fa-solid ${badge.icon}"></i>
          </div>
          <div class="badge-name">${badge.name}</div>
          <div class="badge-status">${isUnlocked ? 'Unlocked' : 'Locked'}</div>
        `;
        badgeScroller.appendChild(badgeCard);
      });

      document.getElementById("badgeCount").textContent = `${unlockedCount}/${allBadges.length}`;
    }

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = "login.html";
        return;
      }
      currentUserId = user.uid;
      document.getElementById("userEmail").textContent = user.email || "No Email";

      let userData = {};
      const userDocRef = doc(db, "users", user.uid);

      try {
        const userDocSnap = await getDoc(userDocRef);
        if (userDocSnap.exists()) {
          userData = userDocSnap.data();
          
          document.getElementById("userCoinsDisplay").textContent = userData.coins !== undefined ? Number(userData.coins) : 0;
          
          if (userData.name) {
            document.getElementById("userNameInput").value = userData.name;
          } else {
            document.getElementById("userNameInput").value = user.displayName || user.email.split("@")[0];
          }

          if (userData.photoURL) {
            document.getElementById("userAvatar").src = userData.photoURL;
          }

          renderUserPurchasedBadges(userData.inventory || []);
          renderAchievements(userData);
        }
      } catch (err) {
        console.error("Error loading user profile:", err);
      }
    });

    window.enableNameEdit = function() {
      const input = document.getElementById("userNameInput");
      input.disabled = false;
      input.focus();
      document.getElementById("editNameBtn").style.display = "none";
      document.getElementById("saveNameBtn").style.display = "flex";
    };

    window.saveNameUpdate = async function() {
      const newName = document.getElementById("userNameInput").value.trim();
      if (!newName) {
        showToast("नाम खाली राख्न पाइँदैन।");
        return;
      }
      if (!currentUserId) return;

      try {
        await updateDoc(doc(db, "users", currentUserId), { name: newName });
        document.getElementById("userNameInput").disabled = true;
        document.getElementById("saveNameBtn").style.display = "none";
        document.getElementById("editNameBtn").style.display = "flex";
        showToast("Edited successfully");
      } catch (error) {
        showToast("नाम अपडेट गर्न सकिएन।");
      }
    };
  </script>
</body>
</html>
