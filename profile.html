<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LoksewaQuest - User Profile</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    body {
      background: #f8fafc;
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding-bottom: 80px;
    }

    .profile-header {
      background: linear-gradient(135deg, #0f2a4a 0%, #1e40af 100%);
      padding: 24px 20px 40px 20px;
      border-radius: 0 0 30px 30px;
      color: white;
      position: relative;
    }
    .nav-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 25px;
    }
    .back-btn {
      background: rgba(255, 255, 255, 0.15);
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 12px;
      color: white;
      font-size: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      text-decoration: none;
      backdrop-filter: blur(5px);
    }
    .nav-bar h2 {
      font-size: 18px;
      font-weight: 700;
    }

    .user-profile-card {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    
    .avatar-wrapper {
      position: relative;
      flex-shrink: 0;
    }
    .avatar-container {
      width: 76px;
      height: 76px;
      border-radius: 50%;
      background: #ffffff;
      padding: 3px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    }
    .avatar-container img {
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
    }
    .avatar-edit-btn {
      position: absolute;
      bottom: 0;
      right: 0;
      background: #2563eb;
      color: #ffffff;
      border: 2px solid #ffffff;
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      cursor: pointer;
      transition: background 0.2s;
    }
    .avatar-edit-btn:hover {
      background: #1d4ed8;
    }

    .user-meta {
      flex: 1;
    }
    .user-meta p {
      font-size: 13px;
      color: #cbd5e1;
      font-weight: 500;
      margin-bottom: 6px;
    }
    .user-meta .address-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(255, 255, 255, 0.15);
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      margin-top: 6px;
      color: #fbbf24;
    }

    .name-edit-wrapper {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 4px;
    }
    .name-input-box {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 10px;
      padding: 6px 12px;
      color: #ffffff;
      font-size: 17px;
      font-weight: 800;
      width: 100%;
      outline: none;
      backdrop-filter: blur(5px);
    }
    .name-input-box:disabled {
      background: transparent;
      border-color: transparent;
      padding: 0;
    }
    .name-input-box:focus:not(:disabled) {
      background: rgba(255, 255, 255, 0.25);
      border-color: #ffffff;
    }
    
    .edit-name-btn, .save-name-btn {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      width: 34px;
      height: 34px;
      border-radius: 8px;
      color: #ffffff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      transition: background 0.2s;
      flex-shrink: 0;
    }
    .edit-name-btn:hover, .save-name-btn:hover {
      background: rgba(255, 255, 255, 0.35);
    }
    .save-name-btn {
      background: #16a34a;
      display: none;
    }
    .save-name-btn:hover {
      background: #15803d;
    }

    .container {
      padding: 0 20px;
      margin-top: -20px;
      flex: 1;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 15px;
      margin-bottom: 24px;
    }
    .stat-card {
      background: #ffffff;
      border-radius: 20px;
      padding: 20px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.05);
      border: 1px solid #f1f5f9;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .stat-icon {
      width: 44px;
      height: 44px;
      border-radius: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 18px;
    }
    .stat-icon.solved { background: #eff6ff; color: #2563eb; }
    .stat-icon.time { background: #fff7ed; color: #ea580c; }
    .stat-icon.accuracy { background: #f0fdf4; color: #16a34a; }
    .stat-icon.rank { background: #fdf4ff; color: #c084fc; }

    .stat-info h4 {
      font-size: 12px;
      font-weight: 700;
      color: #64748b;
      text-transform: uppercase;
      margin-bottom: 4px;
      letter-spacing: 0.5px;
    }
    .stat-info span {
      font-size: 20px;
      font-weight: 800;
      color: #0f172a;
    }

    .menu-card {
      background: #ffffff;
      border-radius: 20px;
      padding: 8px 16px;
      box-shadow: 0 6px 20px rgba(0,0,0,0.05);
      border: 1px solid #f1f5f9;
      margin-bottom: 20px;
    }
    .menu-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 4px;
      text-decoration: none;
      border-bottom: 1px solid #f8fafc;
      color: #334155;
      font-size: 14px;
      font-weight: 600;
    }
    .menu-item:last-child { border-bottom: none; }
    .menu-item-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .menu-item-left i {
      font-size: 16px;
      color: #64748b;
      width: 24px;
      text-align: center;
    }
    .menu-item.logout { color: #dc2626; }
    .menu-item.logout i { color: #dc2626; }

    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background: #ffffff;
      display: flex;
      justify-content: space-around;
      padding: 10px 0 14px 0;
      box-shadow: 0 -4px 20px rgba(0,0,0,0.06);
      border-radius: 20px 20px 0 0;
      z-index: 100;
    }
    .nav-link {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
      color: #94a3b8;
      font-size: 11px;
      font-weight: 600;
      gap: 3px;
    }
    .nav-link i { font-size: 18px; }
    .nav-link.active { color: #2563eb; }

    /* पपअपको डिजाइन */
    .custom-popup-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center;
      z-index: 99999; opacity: 0; visibility: hidden; transition: all 0.3s ease;
    }
    .custom-popup-overlay.active { opacity: 1; visibility: visible; }
    .custom-popup-box {
      background: #ffffff; width: 90%; max-width: 380px; border-radius: 24px;
      padding: 26px; text-align: center; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
      transform: scale(0.9); transition: transform 0.3s ease;
    }
    .custom-popup-overlay.active .custom-popup-box { transform: scale(1); }
    .popup-icon-container {
      width: 60px; height: 60px; border-radius: 50%; margin: 0 auto 16px auto;
      display: flex; align-items: center; justify-content: center; font-size: 24px;
    }
    .popup-icon-container.success { background: #dcfce7; color: #16a34a; }
    .popup-icon-container.error { background: #fee2e2; color: #dc2626; }
    .custom-popup-box h3 { font-size: 18px; font-weight: 700; color: #0f172a; margin-bottom: 8px; }
    .custom-popup-box p { font-size: 14px; color: #64748b; margin-bottom: 24px; line-height: 1.5; }
    .popup-btn {
      background: #2563eb; color: white; border: none; width: 100%;
      padding: 12px; border-radius: 14px; font-size: 15px; font-weight: 600; cursor: pointer;
      transition: background 0.2s;
    }
    .popup-btn:hover { background: #1d4ed8; }
  </style>
</head>
<body>

  <div class="profile-header">
    <div class="nav-bar">
      <a href="home.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i></a>
      <h2>My Profile</h2>
      <div style="width: 40px;"></div>
    </div>

    <div class="user-profile-card">
      <div class="avatar-wrapper">
        <div class="avatar-container">
          <img id="userAvatar" src="https://www.svgrepo.com/show/382109/male-avatar-boy-face-man-user-9.svg" alt="Profile Photo">
        </div>
        <button type="button" class="avatar-edit-btn" onclick="triggerPhotoUpload()" title="फोटो परिवर्तन गर्नुहोस्">
          <i class="fa-solid fa-pen"></i>
        </button>
        <input type="file" id="avatarFileInput" accept="image/*" style="display: none;" onchange="handlePhotoChange(event)">
      </div>

      <div class="user-meta">
        <div class="name-edit-wrapper">
          <input type="text" id="userNameInput" class="name-input-box" value="Loading..." disabled>
          <button type="button" class="edit-name-btn" id="editNameBtn" onclick="enableNameEdit()" title="सम्पादन गर्नुहोस्">
            <i class="fa-solid fa-pen"></i>
          </button>
          <button type="button" class="save-name-btn" id="saveNameBtn" onclick="saveNameUpdate()" title="सेभ गर्नुहोस्">
            <i class="fa-solid fa-check"></i>
          </button>
        </div>
        <p id="userEmail">fetching...</p>
        <div class="address-badge">
          <i class="fa-solid fa-location-dot"><span>नेपाल</span></i>
        </div>
      </div>
    </div>
  </div>

  <div class="container">
    <div class="stats-grid">
      <div class="stat-card">
        <div class="stat-icon solved"><i class="fa-solid fa-circle-check"></i></div>
        <div class="stat-info">
          <h4>Solved Questions</h4>
          <span id="totalSolved">0</span>
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-icon time"><i class="fa-solid fa-clock-rotate-left"></i></div>
        <div class="stat-info">
          <h4>Spent Time</h4>
          <span id="spentTime">0 hrs</span>
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-icon accuracy"><i class="fa-solid fa-bullseye"></i></div>
        <div class="stat-info">
          <h4>Accuracy</h4>
          <span id="accuracyRate">0%</span>
        </div>
      </div>

      <div class="stat-card">
        <div class="stat-icon rank"><i class="fa-solid fa-award"></i></div>
        <div class="stat-info">
          <h4>Quiz Level</h4>
          <span id="userRank">Aspirant</span>
        </div>
      </div>
    </div>

    <div class="menu-card">
      <a href="#" class="menu-item" onclick="enableNameEdit(); return false;">
        <div class="menu-item-left"><i class="fa-solid fa-user-pen"></i><span>Edit Profile</span></div>
        <i class="fa-solid fa-chevron-right" style="font-size: 12px; color: #cbd5e1;"></i>
      </a>
      <a href="#" class="menu-item">
        <div class="menu-item-left"><i class="fa-solid fa-shield-halved"></i><span>Change Password</span></div>
        <i class="fa-solid fa-chevron-right" style="font-size: 12px; color: #cbd5e1;"></i>
      </a>
      <a href="#" id="logoutBtn" class="menu-item logout">
        <div class="menu-item-left"><i class="fa-solid fa-right-from-bracket"></i><span>Log Out</span></div>
      </a>
    </div>
  </div>

  <div class="bottom-nav">
    <a href="home.html" class="nav-link"><i class="fa-solid fa-house"></i><span>Home</span></a>
    <a href="study.html" class="nav-link"><i class="fa-solid fa-book-open"></i><span>Study</span></a>
    <a href="stats.html" class="nav-link"><i class="fa-solid fa-chart-pie"></i><span>Stats</span></a>
    <a href="profile.html" class="nav-link active"><i class="fa-solid fa-user"></i><span>Profile</span></a>
  </div>

  <!-- मुख्य साझा main.js फाइल लिङ्क -->
  <script src="main.js"></script>

  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <!-- Firebase र Supabase एकीकृत गरिएको स्क्रिप्ट -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged, signOut, updateProfile } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, setDoc, updateDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCkKCU1re5b9MtdsAF1F4xI6rGxmxhGZak",
      authDomain: "loksewaquest-227b6.firebaseapp.com",
      projectId: "loksewaquest-227b6",
      storageBucket: "loksewaquest-227b6.firebasestorage.app",
      messagingSenderId: "779234903809",
      appId: "1:779234903809:web:dd0dd0ffb742e1c218bd00"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    const SUPABASE_URL = "https://edyirdedkiarguvurpxq.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVkeWlyZGVka2lhcmd1dnVycHhxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwMTg2NjIsImV4cCI6MjEwNDU5NDY2Mn0.yhNn3YKmFSkxRdefk2F22qxTFhuKS90NH5fa3zzKSaY";
    
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let currentUserId = null;

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUserId = user.uid;
        const userEmail = user.email || "No Email";
        document.getElementById('userEmail').textContent = userEmail;

        if (user.photoURL) {
          document.getElementById('userAvatar').src = user.photoURL;
        }

        try {
          const userDocRef = doc(db, "users", user.uid);
          const userDocSnap = await getDoc(userDocRef);

          if (userDocSnap.exists() && userDocSnap.data().name) {
            document.getElementById('userNameInput').value = userDocSnap.data().name;
          } else {
            const defaultName = user.displayName || userEmail.split('@')[0];
            document.getElementById('userNameInput').value = defaultName;
            await setDoc(userDocRef, { name: defaultName, email: userEmail }, { merge: true });
          }
        } catch (err) {
          console.error("Firestore error:", err);
          document.getElementById('userNameInput').value = user.displayName || "User";
        }

        try {
          let { data, error } = await supabase
            .from('user_stats')
            .select('*')
            .eq('id', user.uid)
            .maybeSingle();

          if (data) {
            document.getElementById('totalSolved').textContent = data.total_solved || 0;
            let hours = (data.time_spent_minutes / 60).toFixed(1);
            document.getElementById('spentTime').textContent = hours + " hrs";
            document.getElementById('accuracyRate').textContent = (data.accuracy || 0) + "%";
          } else {
            await supabase.from('user_stats').insert([
              { id: user.uid, total_solved: 0, time_spent_minutes: 0, accuracy: 0 }
            ]);
          }
        } catch (dbError) {
          console.log("Supabase error: ", dbError.message);
        }

      } else {
        window.location.href = "login.html";
      }
    });

    // नाम सम्पादन सुरु गर्ने
    window.enableNameEdit = function() {
      const nameInput = document.getElementById('userNameInput');
      nameInput.disabled = false;
      nameInput.focus();
      
      document.getElementById('editNameBtn').style.display = 'none';
      document.getElementById('saveNameBtn').style.display = 'flex';
    };

    // नाम अपडेट गरेर सेभ गर्ने र 'Edited successfully' पपअप देखाउने
    window.saveNameUpdate = async function() {
      const newName = document.getElementById('userNameInput').value.trim();
      if (!newName) {
        showPopup("त्रुटि!", "नाम खाली राख्न पाइँदैन।", "error");
        return;
      }

      if (!currentUserId) return;

      try {
        if (auth.currentUser) {
          await updateProfile(auth.currentUser, { displayName: newName });
        }

        const userDocRef = doc(db, "users", currentUserId);
        await updateDoc(userDocRef, { name: newName });

        const nameInput = document.getElementById('userNameInput');
        nameInput.disabled = true;

        document.getElementById('saveNameBtn').style.display = 'none';
        document.getElementById('editNameBtn').style.display = 'flex';

        // नाम परिवर्तन सफलतापूर्वक हुँदा आउने पपअप
        showPopup("सफल भयो!", "Edited successfully", "success");
      } catch (error) {
        console.error("नाम अपडेट गर्दा त्रुटि:", error);
        showPopup("त्रुटि!", "नाम अपडेट गर्न सकिएन।", "error");
      }
    };

    // प्रोफाइल फोटोको पेन्सिल आइकन थिच्दा फाइल पिकर खोल्ने
    window.triggerPhotoUpload = function() {
      document.getElementById('avatarFileInput').click();
    };

    // युजरले फोटो छान्दा साइज कम्प्रेस गरेर Firebase मा सेभ गर्ने र पपअप देखाउने
    window.handlePhotoChange = async function(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const img = new Image();
        img.src = e.target.result;
        img.onload = async function() {
          const canvas = document.createElement('canvas');
          const MAX_WIDTH = 300;
          const MAX_HEIGHT = 300;
          let width = img.width;
          let height = img.height;

          if (width > height) {
            if (width > MAX_WIDTH) {
              height *= MAX_WIDTH / width;
              width = MAX_WIDTH;
            }
          } else {
            if (height > MAX_HEIGHT) {
              width *= MAX_HEIGHT / height;
              height = MAX_HEIGHT;
            }
          }

          canvas.width = width;
          canvas.height = height;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, width, height);

          const compressedBase64 = canvas.toDataURL('image/jpeg', 0.7);

          document.getElementById('userAvatar').src = compressedBase64;

          if (auth.currentUser) {
            try {
              await updateProfile(auth.currentUser, { photoURL: compressedBase64 });

              const userDocRef = doc(db, "users", currentUserId);
              await updateDoc(userDocRef, { photoURL: compressedBase64 });

              showPopup("सफल भयो!", "Edited successfully", "success");
            } catch (err) {
              console.error("फोटो सेभ गर्दा त्रुटि:", err);
              showPopup("त्रुटि!", "तस्वीर सेभ गर्न सकिएन।", "error");
            }
          }
        };
      };
      reader.readAsDataURL(file);
    };

    document.getElementById('logoutBtn').addEventListener('click', (e) => {
      e.preventDefault();
      signOut(auth).then(() => {
        window.location.href = "login.html";
      });
    });
  </script>

</body>
</html>
