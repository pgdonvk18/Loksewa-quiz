<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f2a4a">
<title>LoksewaQuest - Leaderboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
/* ===== Tokens ===== */
:root{--navy:#0f2a4a;--blue:#2563eb;--blue-d:#1d4ed8;--blue-l:#e8effd;--gold:#f5b301;--gold-d:#92620a;--gold-l:#fff6d6;--bg:#f4f6fa;--card:#fff;--text:#0f2a4a;--mute:#64748b;--line:#e2e8f0;--r:14px;--font:'Plus Jakarta Sans','Noto Sans Devanagari',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;font-family:var(--font)}
body{background:var(--bg);color:var(--text);min-height:100vh;min-height:100dvh;line-height:1.5;padding-bottom:calc(120px + env(safe-area-inset-bottom));overflow-x:hidden}
button{cursor:pointer;border:0;background:none;color:inherit;font-weight:600}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
/* ===== Header ===== */
.hero{background:var(--navy);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 14px 70px;position:relative}
.hero::before{content:"";position:absolute;inset:0;pointer-events:none;background-image:linear-gradient(rgba(255,255,255,.04) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.04) 1px,transparent 1px);background-size:28px 28px;-webkit-mask-image:linear-gradient(#000,transparent);mask-image:linear-gradient(#000,transparent)}
.bar{position:relative;max-width:640px;margin:0 auto;display:flex;align-items:center;justify-content:space-between}
.bar h1{font-size:16px;font-weight:600}
.back{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.12);color:#fff}.back:hover{background:rgba(255,255,255,.2)}
.seg{position:relative;max-width:640px;margin:12px auto 0;display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:12px;background:rgba(255,255,255,.1)}
.seg button{min-height:44px;border-radius:9px;font-size:13px;color:#cbd5e1;display:flex;align-items:center;justify-content:center;gap:8px;transition:background .15s,color .15s}
.seg button[aria-selected=true]{background:#fff;color:var(--navy)}
.seg button[data-category=coins][aria-selected=true] i{color:var(--gold-d)}
.tabs{position:relative;max-width:640px;margin:10px auto 0;display:flex;gap:8px}
.tabs button{flex:1;min-height:40px;border-radius:99px;font-size:13px;color:#cbd5e1;border:1px solid rgba(255,255,255,.2)}
.tabs button[aria-selected=true]{background:var(--blue);border-color:var(--blue);color:#fff}
.tabs.hide{display:none}
/* ===== Body ===== */
.wrap{max-width:640px;margin:-44px auto 0;padding:0 14px;position:relative}
.podium{display:flex;align-items:flex-end;justify-content:center;gap:10px;margin-bottom:14px}
.pc{flex:1;max-width:190px;min-width:0;text-align:center;background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px 8px 12px;animation:in .35s ease-out both}
.pc.first{padding-top:20px;padding-bottom:18px;border-color:#f3d36b;background:var(--gold-l)}
.pc .rk{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:50%;font-size:12px;font-weight:700;background:#e6ebf3;color:var(--navy);margin-bottom:6px}
.pc.first .rk{background:var(--gold)}.pc.third .rk{background:#f1dcc6;color:#7c4a1e}
.pc .crown{display:block;color:var(--gold-d);font-size:15px;margin-bottom:2px}
.av{width:48px;height:48px;border-radius:50%;margin:0 auto 8px;display:grid;place-items:center;font-weight:700;font-size:18px;background:var(--navy);color:#fff}
.pc.first .av{width:58px;height:58px;font-size:22px;background:var(--gold);color:var(--navy)}
.pc .nm{font-size:13px;font-weight:600;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pc .sc{font-size:17px;font-weight:700;margin-top:4px;font-variant-numeric:tabular-nums}.pc .sc small{font-size:11px;font-weight:500;color:var(--mute)}
.pc.first .sc{color:var(--gold-d)}
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);animation:in .3s ease-out both}
.row:last-child{border-bottom:0}
.row .r{width:34px;text-align:center;font-size:13px;font-weight:700;color:var(--mute);font-variant-numeric:tabular-nums}
.row .av{width:38px;height:38px;margin:0;font-size:15px;flex-shrink:0}
.row .in{flex:1;min-width:0}.row .nm{font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sub{font-size:11px;color:var(--mute)}
.row .sc{font-size:15px;font-weight:700;font-variant-numeric:tabular-nums;text-align:right}.row .sc small{font-size:11px;font-weight:500;color:var(--mute)}
.row.me,.mebar{background:var(--blue-l)}
.you{display:inline-block;margin-left:6px;padding:0 8px;border-radius:99px;font-size:10px;font-weight:700;background:var(--blue);color:#fff;vertical-align:middle}
.nb{display:inline-flex;align-items:center;gap:6px;max-width:100%}
.sb{display:inline-grid;place-items:center;width:18px;height:18px;border-radius:50%;background:var(--gold);color:var(--navy);font-size:9px;font-weight:800;flex-shrink:0}
.mebar{position:fixed;left:0;right:0;bottom:0;z-index:20;padding:8px 14px calc(8px + env(safe-area-inset-bottom));border-top:1px solid #c9d8f7;box-shadow:0 -6px 18px rgba(15,42,74,.08)}
.mebar .row{max-width:640px;margin:0 auto;border:0;padding:6px 0;background:none}
.state{text-align:center;padding:36px 16px;color:var(--mute);font-size:14px}
.state .ic{font-size:32px;margin-bottom:8px}.state button{margin-top:12px;min-height:44px;padding:0 20px;border-radius:10px;background:var(--blue);color:#fff}
.spin{width:30px;height:30px;border:3px solid var(--line);border-top-color:var(--blue);border-radius:50%;margin:0 auto 10px;animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(max-width:360px){.pc .nm{font-size:12px}.pc .sc{font-size:15px}.av{width:42px;height:42px}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>

<header class="hero">
  <div class="bar">
    <button class="back" id="backBtn" aria-label="पछाडि जानुहोस्"><i class="fa-solid fa-arrow-left" aria-hidden="true"></i></button>
    <h1>लिडरबोर्ड</h1>
    <div style="width:44px" aria-hidden="true"></div>
  </div>
  <div class="seg" role="tablist" aria-label="लिडरबोर्ड प्रकार">
    <button role="tab" aria-selected="true" data-category="questions"><i class="fa-solid fa-trophy" aria-hidden="true"></i>अंक</button>
    <button role="tab" aria-selected="false" data-category="coins"><i class="fa-solid fa-coins" aria-hidden="true"></i>कोइन</button>
  </div>
  <div class="tabs" id="timeFilterTabs" role="tablist" aria-label="समयावधि">
    <button role="tab" aria-selected="true" data-period="daily">दैनिक</button>
    <button role="tab" aria-selected="false" data-period="weekly">साताको</button>
    <button role="tab" aria-selected="false" data-period="monthly">मासिक</button>
  </div>
</header>

<main class="wrap">
  <div class="podium" id="podiumSection"></div>
  <div class="list" id="leaderboardList" aria-live="polite"><div class="state"><div class="spin"></div>डाटा लोड हुँदैछ...</div></div>
</main>
<div class="mebar" id="currentUserCard" style="display:none"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
import { getFirestore, collection, getDocs, doc, getDoc, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyCkKCU1re5b9MtdsAF1F4xI6rGxmxhGZak",
  authDomain: "loksewaquest-227b6.firebaseapp.com",
  projectId: "loksewaquest-227b6",
  storageBucket: "loksewaquest-227b6.firebasestorage.app",
  messagingSenderId: "779234903809",
  appId: "1:779234903809:web:dd0dd0ffb742e1c218bd00"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const SUPABASE_URL = 'https://edyirdedkiarguvurpxq.supabase.co';
const SUPABASE_ANON_KEY = '__SUPABASE_KEY__';
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LIMIT = 100;

let currentCategory = "questions", currentPeriod = "daily";
let currentUid = null, currentUserName = null;
let usersFirestoreCache = {};   // lowercase name -> badge data (loaded in the background)
let lastRender = null;          // so the list can re-render once badges arrive
let requestId = 0;              // FIX: ignore out-of-order responses when tabs are switched quickly

/* ---------- Name + store badge (user text is always escaped) ---------- */
function nameWithBadge(userName, userData) {
  const name = esc(userName || "Aspirant");
  const purchased = userData?.purchasedBadges || userData?.inventory || [];
  const key = userData?.equippedBadge || (Array.isArray(purchased) && purchased.length ? purchased[purchased.length - 1] : null);
  if (!key) return `<span class="nb"><span>${name}</span></span>`;
  let b = `<i class="fa-solid fa-crown" aria-hidden="true"></i>`;
  if (key.includes("aspirant")) b = "A"; else if (key.includes("pro")) b = "P"; else if (key.includes("master")) b = "M";
  return `<span class="nb"><span class="sb" title="Store Badge">${b}</span><span>${name}</span></span>`;
}

/* ---------- Ranking with ties (1,1,3) ---------- */
function withRanks(arr, key) {
  let prev = null, rank = 0;
  return arr.map((u, i) => { const v = Number(u[key]) || 0; if (v !== prev) { rank = i + 1; prev = v; } return { ...u, _rank: rank, _score: v }; });
}
const isMe = u => (currentUid && u.uid === currentUid) || (!u.uid && currentUserName && String(u.display_name || "").trim().toLowerCase() === currentUserName.toLowerCase());
const initial = n => (String(n || "L").trim().charAt(0) || "L").toUpperCase();
const fmt = n => Number(n).toLocaleString();
const dataFor = u => usersFirestoreCache[String(u.display_name || "").trim().toLowerCase()] || u;

/* ---------- Rendering ---------- */
function state(icon, msg, retry) {
  $("podiumSection").innerHTML = ""; $("currentUserCard").style.display = "none";
  $("leaderboardList").innerHTML = `<div class="state"><div class="ic" aria-hidden="true">${icon}</div>${esc(msg)}${retry ? '<br><button type="button" id="retryBtn">फेरि प्रयास गर्नुहोस्</button>' : ''}</div>`;
  if (retry) $("retryBtn").onclick = loadCurrent;
}
function render(rows, key, unit) {
  lastRender = { rows, key, unit };
  const ranked = withRanks(rows, key);
  const top = ranked.slice(0, 3);
  const order = [top[1] && ["second", top[1]], top[0] && ["first", top[0]], top[2] && ["third", top[2]]].filter(Boolean);
  $("podiumSection").innerHTML = order.map(([cls, u]) => `
    <div class="pc ${cls}"><span class="rk">${u._rank}</span>${cls === "first" ? '<i class="fa-solid fa-crown crown" aria-hidden="true"></i>' : ''}
      <div class="av" aria-hidden="true">${esc(initial(u.display_name))}</div>
      <div class="nm">${nameWithBadge(u.display_name, dataFor(u))}</div>
      <div class="sc">${fmt(u._score)} <small>${unit}</small></div></div>`).join("");
  const rest = ranked.slice(3);
  $("leaderboardList").innerHTML = rest.length ? rest.map(u => `
    <div class="row${isMe(u) ? " me" : ""}"><div class="r">#${u._rank}</div><div class="av" aria-hidden="true">${esc(initial(u.display_name))}</div>
      <div class="in"><div class="nm">${nameWithBadge(u.display_name, dataFor(u))}${isMe(u) ? '<span class="you">तपाईं</span>' : ''}</div><div class="sub">Loksewa Aspirant</div></div>
      <div class="sc">${fmt(u._score)} <small>${unit}</small></div></div>`).join("")
    : `<div class="state">अन्य सहभागीहरू छैनन्</div>`;

  const mine = ranked.find(isMe);
  const bar = $("currentUserCard");
  if (mine) {
    bar.style.display = "block";
    bar.innerHTML = `<div class="row"><div class="r" style="color:var(--blue-d);font-size:15px">#${mine._rank}</div><div class="av" style="background:var(--blue)" aria-hidden="true">${esc(initial(mine.display_name))}</div>
      <div class="in"><div class="nm">${nameWithBadge(mine.display_name, dataFor(mine))}<span class="you">तपाईं</span></div><div class="sub">तपाईंको स्थान</div></div>
      <div class="sc" style="color:var(--blue-d)">${fmt(mine._score)} <small>${unit}</small></div></div>`;
  } else bar.style.display = "none";
}

/* ---------- Data ---------- */
async function fetchLeaderboardData(period) {
  const id = ++requestId;
  $("leaderboardList").innerHTML = `<div class="state"><div class="spin"></div>डाटा लोड हुँदैछ...</div>`; $("podiumSection").innerHTML = ""; $("currentUserCard").style.display = "none";
  const col = period === 'weekly' ? 'weekly_score' : period === 'monthly' ? 'monthly_score' : 'daily_score';
  let res;
  try {
    res = await supabaseClient.from('v_exam_leaderboard_summary').select(`display_name, ${col}`).gt(col, 0).order(col, { ascending: false }).limit(LIMIT);
  } catch (e) { res = { error: e }; }
  if (id !== requestId) return;
  if (res.error) { console.error(res.error); return state("⚠️", "डाटा लोड गर्न असफल भयो।", true); }
  const rows = (res.data || []).filter(r => r.display_name && Number(r[col]) > 0);
  if (!rows.length) return state("📭", "यो समयावधिमा अहिलेसम्म कुनै डाटा उपलब्ध छैन।");
  render(rows, col, "अंक");
}

async function fetchCoinsLeaderboard() {
  const id = ++requestId;
  $("leaderboardList").innerHTML = `<div class="state"><div class="spin"></div>कोइन डाटा लोड हुँदैछ...</div>`; $("podiumSection").innerHTML = ""; $("currentUserCard").style.display = "none";
  try {
    // FIX: ask Firestore for the top 100 only instead of downloading every user.
    const snap = await getDocs(query(collection(db, "users"), orderBy("coins", "desc"), limit(LIMIT)));
    if (id !== requestId) return;
    const rows = [];
    snap.forEach(d => {
      const u = d.data(), coins = Number(u.coins || 0);
      if (coins > 0) rows.push({ ...u, uid: d.id, display_name: u.name || (u.email ? u.email.split('@')[0] : "Aspirant"), coins });
    });
    if (!rows.length) return state("📭", "अहिलेसम्म कोइन भएको कुनै प्रयोगकर्ता छैन।");
    render(rows, 'coins', "कोइन");
  } catch (err) {
    if (id !== requestId) return;
    console.error("Firebase fetch error:", err); state("⚠️", "कोइन डाटा लोड गर्न असफल भयो।", true);
  }
}

const loadCurrent = () => currentCategory === 'coins' ? fetchCoinsLeaderboard() : fetchLeaderboardData(currentPeriod);

/* ---------- Controls ---------- */
function setSelected(nodes, active) { nodes.forEach(b => b.setAttribute("aria-selected", b === active)); }
document.querySelectorAll(".seg button").forEach(btn => btn.addEventListener("click", () => {
  currentCategory = btn.dataset.category;
  setSelected(document.querySelectorAll(".seg button"), btn);
  $("timeFilterTabs").classList.toggle("hide", currentCategory === 'coins');
  loadCurrent();
}));
document.querySelectorAll("#timeFilterTabs button").forEach(btn => btn.addEventListener("click", () => {
  if (currentCategory === 'coins') return;
  setSelected(document.querySelectorAll("#timeFilterTabs button"), btn);
  currentPeriod = btn.dataset.period; fetchLeaderboardData(currentPeriod);
}));
$("backBtn").addEventListener("click", () => { history.length > 1 ? history.back() : (location.href = "dashboard.html"); });

/* ---------- Startup ---------- */
// FIX: the app signs in with Firebase, so identify the user from Firebase (the old code asked
// Supabase Auth, which is always empty, so the "your rank" card never appeared).
onAuthStateChanged(auth, async (user) => {
  if (user) {
    currentUid = user.uid;
    currentUserName = user.displayName || (user.email ? user.email.split('@')[0] : null);
    try { const s = await getDoc(doc(db, "users", user.uid)); if (s.exists() && s.data().name) currentUserName = s.data().name; } catch (e) { console.error(e); }
  }
  loadCurrent();
  // Badge lookup by name is loaded in the background; the list re-renders when it arrives.
  getDocs(collection(db, "users")).then(snap => {
    snap.forEach(d => { const u = d.data(), k = (u.name || "").trim().toLowerCase(); if (k) usersFirestoreCache[k] = { purchasedBadges: u.purchasedBadges, inventory: u.inventory, equippedBadge: u.equippedBadge }; });
    if (lastRender) render(lastRender.rows, lastRender.key, lastRender.unit);
  }).catch(e => console.error("Badge cache error:", e));
});
</script>
</body>
</html>
