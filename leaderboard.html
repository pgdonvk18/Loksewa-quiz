<style>
:root{
  --navy:#0c1932;
  --navy2:#142b55;
  --blue:#2d63d7;
  --blue-soft:#edf3ff;
  --gold:#d99a00;
  --gold-soft:#fff7df;
  --bg:#f6f7f9;
  --card:#fff;
  --text:#18243b;
  --muted:#718096;
  --line:#e5e8ed;

  --sans:"Noto Sans Devanagari",sans-serif;

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
}

body{
  min-height:100vh;
  min-height:100dvh;
  background:
    radial-gradient(circle at 100% 0,rgba(45,99,215,.09),transparent 28%),

  color:var(--text);
  font-family:var(--sans);
  padding-bottom:105px;
  -webkit-font-smoothing:antialiased;
}

button{
  font:inherit;
  border:0;
  cursor:pointer;
}

button:focus-visible{
  outline:3px solid #8db1ff;
  outline-offset:2px;
}

/* HEADER */

.hero{
  position:relative;
  overflow:hidden;
  color:#fff;
  background:
    radial-gradient(circle at 90% 5%,rgba(99,145,255,.3),transparent 27%),
    linear-gradient(135deg,#09152d,#142c58 65%,#214da1);
  padding:12px 15px 65px;
}

.hero::after{
  content:"";
  position:absolute;
  width:230px;
  height:230px;
  right:-130px;
  top:-125px;
  border:1px solid rgba(255,255,255,.1);
  border-radius:50%;
}

.bar{
  position:relative;
  z-index:2;
  width:min(700px,100%);
  margin:auto;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.back{
  width:42px;
  height:42px;
  display:grid;
  place-items:center;
  border-radius:12px;
  color:#fff;
  background:rgba(255,255,255,.1);
}

.back:active{
  transform:scale(.94);
}

.bar h1{
  font-family:var(--serif);
  font-size:20px;
  font-weight:700;
}

/* CATEGORY */

.segment{
  position:relative;
  z-index:2;
  width:min(700px,100%);
  margin:13px auto 0;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:4px;
  padding:4px;

}

}

}

/* PERIOD */

  z-index:2;

<script type="module">

/*
  IMPORTANT FIX

  The old leaderboard was querying:

      v_exam_leaderboard_summary

  with daily_score / weekly_score / monthly_score.

  But the actual quiz pages in this project save question
  results into:

      exam_leaderboard

  with:

      username
      set_name
      score
      correct_count
      wrong_count
      skipped_count
      total_questions
      created_at

  Therefore the old query could return nothing even though
  quiz results existed.

  This version reads the real exam_leaderboard table and
  calculates daily / weekly / monthly totals in the browser.
*/


const SUPABASE_URL =
  "https://edyirdedkiarguvurpxq.supabase.co";

const SUPABASE_ANON_KEY =
  "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVkeWlyZGVka2lhcmd1dnVycHhxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwMTg2NjIsImV4cCI6MjEwNDU5NDY2Mn0.yhNn3YKmFSkxRdefk2F22qxTFhuKS90NH5fa3zzKSaY";


const supabase =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


const leaderboardEl =
  document.getElementById("leaderboard");

const podiumEl =
  document.getElementById("podium");

const periodsEl =
  document.getElementById("periods");

const myPositionEl =
  document.getElementById("myPosition");


let category = "questions";
let period = "daily";
let requestNumber = 0;


/* --------------------------------
   HELPERS
-------------------------------- */

function esc(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function initial(name){

  const clean =
    String(name || "L").trim();

  return esc(
    clean.charAt(0).toUpperCase()
  );

}


function number(value){

  return Number(value || 0)
    .toLocaleString("en-US");

}


function startOfDay(){

  const d = new Date();

  d.setHours(0,0,0,0);

  return d;

}


function startOfWeek(){

  const d = startOfDay();

  const day = d.getDay();

  const difference =
    day === 0 ? 6 : day - 1;

  d.setDate(
    d.getDate() - difference
  );

  return d;

}


function startOfMonth(){

  const d = startOfDay();

  d.setDate(1);

  return d;

}


function periodStart(){

  if(period === "weekly")
    return startOfWeek();

  if(period === "monthly")
    return startOfMonth();

  return startOfDay();

}


/*
  Supabase timestamps can be ISO strings,
  timestamps, or Date-compatible values.
*/
function validDate(value){

  if(!value)
    return null;

  const d =
    new Date(value);

  return isNaN(d.getTime())
    ? null
    : d;

}


/* --------------------------------

-------------------------------- */

function loading(){

  document

}

  leaderboardEl.innerHTML = `

/* --------------------------------
   GET QUESTION LEADERBOARD
-------------------------------- */

async function getQuestionLeaderboard(){

  /*
    Do NOT use the broken view.

    We fetch actual records from exam_leaderboard.
  */

  const { data, error } =
    await supabase
      .from("exam_leaderboard")
      .select(`
        username,
        score,
        correct_count,
        wrong_count,
        skipped_count,
        total_questions,
        created_at
      `)
      .order("created_at",{
        ascending:false
      })
      .limit(1000);


  if(error)
    throw error;


  const beginning =
    periodStart().getTime();


  /*
    Aggregate all attempts belonging to the
    same username.

    This makes the leaderboard work even when
    different quiz sets have separate rows.
  */

  const users = new Map();


  (data || []).forEach(row=>{

    const date =
      validDate(row.created_at);

    if(!date)
      return;

    if(
      date.getTime() <
      beginning
    )
      return;


    const username =
      String(
        row.username ||
        "Loksewa Aspirant"
      ).trim();


    if(!username)
      return;


    const key =
      username.toLowerCase();


    if(!users.has(key)){

      users.set(key,{
        display_name:username,
        score:0,
        correct:0,
        wrong:0,
        skipped:0,
        attempts:0
      });

    }


    const user =
      users.get(key);


    user.score +=
      Number(row.score || 0);

    user.correct +=
      Number(row.correct_count || 0);

    user.wrong +=
      Number(row.wrong_count || 0);

    user.skipped +=
      Number(row.skipped_count || 0);

    user.attempts += 1;

  });


  return Array.from(
    users.values()
  )
  .filter(user => user.score > 0)
  .sort((a,b)=>{

    if(b.score !== a.score)
      return b.score - a.score;

    if(b.correct !== a.correct)
      return b.correct - a.correct;

    return a.wrong - b.wrong;

  })
  .slice(0,100);

}


/* --------------------------------
   COINS
-------------------------------- */

async function getCoinsLeaderboard(){

  /*
    Coins remain in Firebase because the project
    stores user coin balances there.
  */

  try{

    const {
      initializeApp
    } =
      await import(
        "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js"
      );

    const {
      getFirestore,
      collection,
      getDocs,
      query,
      orderBy,
      limit
    } =
      await import(
        "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js"
      );


    const firebaseConfig = {

      apiKey:
        "AIzaSyCkKCU1re5b9MtdsAF1F4xI6rGxmxhGZak",

      authDomain:
        "loksewaquest-227b6.firebaseapp.com",

      projectId:
        "loksewaquest-227b6",

      storageBucket:
        "loksewaquest-227b6.firebasestorage.app",

      messagingSenderId:
        "779234903809",

      appId:
        "1:779234903809:web:dd0dd0ffb742e1c218bd00"

    };


    const firebase =
      initializeApp(
        firebaseConfig,
        "leaderboardCoins"
      );


    const db =
      getFirestore(firebase);


    const snapshot =
      await getDocs(
        query(
          collection(db,"users"),
          orderBy("coins","desc"),
          limit(100)
        )
      );


    const rows=[];


    snapshot.forEach(doc=>{

      const u =
        doc.data();


      const coins =
        Number(u.coins || 0);


      if(coins <= 0)
        return;


      rows.push({

        display_name:
          u.name ||
          (
            u.email
              ? u.email.split("@")[0]
              : "Aspirant"
          ),

        score:coins,
        correct:0,
        wrong:0,
        skipped:0,
        attempts:0

      });

    });


    return rows;

  }catch(error){

    console.error(
      "Coins leaderboard error:",
      error
    );

    throw error;

  }

}


/* --------------------------------
   RENDER
-------------------------------- */

function render(rows){

  if(!rows.length){

    emptyState();

    return;

  }


  const top =
    rows.slice(0,3);


  /*
    Visual order:
    2nd — 1st — 3rd
  */

  const visual = [

    top[1]
      ? {
          item:top[1],
          rank:2,
          cls:""
        }
      : null,

    top[0]
      ? {
          item:top[0],
          rank:1,
          cls:"first"
        }
      : null,

    top[2]
      ? {
          item:top[2],
          rank:3,
          cls:""
        }
      : null

  ].filter(Boolean);


  podiumEl.innerHTML =
    visual.map(item=>`

      <div class="podium-card ${item.cls}">

        <div class="rank">
          ${item.rank}
        </div>

        ${
          item.rank === 1
            ? `<div class="crown">
                 <i class="fa-solid fa-crown"></i>
               </div>`
            : ""
        }

        <div class="avatar">
          ${initial(item.item.display_name)}
        </div>

        <div class="name">
          ${esc(item.item.display_name)}
        </div>

        <div class="score">
          ${number(item.item.score)}
          <small>
            ${category==="coins" ? "कोइन" : "अंक"}
          </small>
        </div>

      </div>

    `).join("");


  const rest =
    rows.slice(3);


  leaderboardEl.innerHTML =
    rest.length

      ? rest.map((item,index)=>{

          const rank =
            index + 4;

          return `

            <div class="row">

              <div class="position">
                #${rank}
              </div>

              <div class="avatar">
                ${initial(item.display_name)}
              </div>

              <div class="info">

                <div class="row-name">

                  <span class="row-name-text">
                    ${esc(item.display_name)}
                  </span>

                </div>

                <div class="sub">

                  ${
                    category === "coins"
                      ? "LoksewaQuest"
                      : `${number(item.correct)} सही उत्तर`
                  }

                </div>

              </div>

              <div class="row-score">

                ${number(item.score)}

                <small>
                  ${category==="coins" ? "कोइन" : "अंक"}
                </small>

              </div>

            </div>

          `;

        }).join("")

      : `
        <div class="state">
          शीर्ष ३ पछि अरू सहभागी छैनन्।
        </div>
      `;


  /*
    Current user's name can be read from localStorage
    when the project already stores it there.

    We deliberately support several existing naming
    conventions used by the project.
  */

  const currentName =
    localStorage.getItem("candidateName") ||
    localStorage.getItem("userName") ||
    localStorage.getItem("displayName") ||
    localStorage.getItem("username");


  if(!currentName)
    return;


  const index =
    rows.findIndex(
      x =>
        String(x.display_name)
          .trim()
          .toLowerCase() ===
        String(currentName)
          .trim()
          .toLowerCase()
    );


  if(index === -1)
    return;


  const me =
    rows[index];


  myPositionEl.style.display =
    "block";


  myPositionEl.innerHTML = `

    <div class="my-inner">

      <div class="my-rank">
        #${index + 1}
      </div>

      <div class="avatar">
        ${initial(me.display_name)}
      </div>

      <div class="my-info">

        <div class="my-name">
          ${esc(me.display_name)}
        </div>

        <div class="my-label">
          तपाईंको स्थान
        </div>

      </div>

      <div class="my-score">

        ${number(me.score)}
        <small>
          ${category==="coins" ? "कोइन" : "अंक"}
        </small>

      </div>

    </div>

  `;

}


/* --------------------------------
   LOAD
-------------------------------- */

async function loadLeaderboard(){

  const id =
    ++requestNumber;


  loading();


  try{

    const rows =
      category === "coins"

        ? await getCoinsLeaderboard()

        : await getQuestionLeaderboard();


    /*
      If the user switched tabs while the
      request was running, don't overwrite the
      newer screen.
    */

    if(id !== requestNumber)
      return;


    render(rows);

  }catch(error){

    if(id !== requestNumber)
      return;


    console.error(
      "Leaderboard error:",
      error
    );


    errorState(
      category === "coins"
        ? "कोइन leaderboard लोड गर्न सकिएन।"
        : "प्रश्न leaderboard लोड गर्न सकिएन।"
    );

  }

}


/* --------------------------------
   CATEGORY BUTTONS
-------------------------------- */

document
  .querySelectorAll(".segment button")
  .forEach(button=>{

    button.addEventListener(
      "click",
      ()=>{

        document
          .querySelectorAll(
            ".segment button"
          )
          .forEach(x=>
            x.classList.remove("active")
          );


        button.classList.add("active");


        category =
          button.dataset.category;


        periodsEl.style.display =
          category === "coins"
            ? "none"
            : "flex";


        loadLeaderboard();

      }
    );

  });


/* --------------------------------
   PERIOD BUTTONS
-------------------------------- */

document
  .querySelectorAll(".periods button")
  .forEach(button=>{

    button.addEventListener(
      "click",
      ()=>{

        document
          .querySelectorAll(
            ".periods button"
          )
          .forEach(x=>
            x.classList.remove("active")
          );


        button.classList.add("active");


        period =
          button.dataset.period;


        loadLeaderboard();

      }
    );

  });


/* --------------------------------
   BACK
-------------------------------- */

document
  .getElementById("backBtn")
  .addEventListener(
    "click",
    ()=>{

      if(
        window.history.length > 1
      ){

        window.history.back();

      }else{

        window.location.href =
          "dashboard.html";

      }

    }
  );


/* --------------------------------
   START
-------------------------------- */

loadLeaderboard();

</script>
