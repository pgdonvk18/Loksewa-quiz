<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#2563eb">
  <title>LoksewaQuest - Leaderboard</title>

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      min-height: 100vh;
      background: #f8fafc;
      color: #1e293b;
      padding-bottom: 90px;
    }

    .header {
      background: linear-gradient(135deg, #172554 0%, #1d4ed8 100%);
      color: white;
      padding: 24px 20px 30px;
      border-bottom-left-radius: 28px;
      border-bottom-right-radius: 28px;
      box-shadow: 0 10px 25px rgba(29, 78, 216, 0.2);
    }

    .header-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 20px;
    }

    .back-btn {
      background: rgba(255, 255, 255, 0.15);
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 12px;
      color: white;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.2s;
    }

    .back-btn:hover {
      background: rgba(255, 255, 255, 0.25);
    }

    .header h1 {
      font-size: 20px;
      font-weight: 800;
    }

    .filter-tabs {
      display: flex;
      background: rgba(0, 0, 0, 0.2);
      padding: 5px;
      border-radius: 14px;
      gap: 6px;
    }

    .tab-btn {
      flex: 1;
      background: transparent;
      border: none;
      padding: 11px 8px;
      color: rgba(255, 255, 255, 0.75);
      font-size: 13px;
      font-weight: 700;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.25s ease;
      text-align: center;
      outline: none;
    }

    .tab-btn:hover {
      color: #ffffff;
      background: rgba(255, 255, 255, 0.1);
    }

    .tab-btn:active {
      transform: scale(0.96);
    }

    .tab-btn.active {
      background: #ffffff;
      color: #1d4ed8;
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
      transform: translateY(-1px);
    }

    .container {
      max-width: 600px;
      margin: -15px auto 0;
      padding: 0 16px;
    }

    .podium-section {
      display: flex;
      align-items: flex-end;
      justify-content: center;
      gap: 12px;
      margin-bottom: 25px;
      padding-top: 10px;
    }

    .podium-card {
      background: #ffffff;
      flex: 1;
      border-radius: 20px;
      padding: 18px 10px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      position: relative;
      border: 1px solid #e2e8f0;
    }

    .podium-card.first {
      transform: translateY(-15px);
      border-color: #f59e0b;
      background: linear-gradient(to bottom, #fffbeb, #ffffff);
    }

    .podium-rank {
      position: absolute;
      top: -12px;
      left: 50%;
      transform: translateX(-50%);
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 12px;
      font-weight: 800;
      color: white;
    }

    .first .podium-rank { background: #f59e0b; }
    .second .podium-rank { background: #94a3b8; }
    .third .podium-rank { background: #d97706; }

    .podium-avatar {
      width: 48px;
      height: 48px;
      border-radius: 50%;
      background: #e2e8f0;
      margin: 8px auto 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: #475569;
      font-size: 16px;
      border: 2px solid white;
      box-shadow: 0 4px 10px rgba(0,0,0,0.08);
    }

    .podium-name {
      font-size: 13px;
      font-weight: 700;
      color: #0f172a;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      margin-bottom: 4px;
    }

    .podium-score {
      font-size: 12px;
      color: #2563eb;
      font-weight: 800;
    }

    .leaderboard-list {
      background: #ffffff;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05);
      border: 1px solid #e2e8f0;
      overflow: hidden;
      margin-bottom: 20px;
    }

    .leaderboard-item {
      display: flex;
      align-items: center;
      padding: 14px 18px;
      border-bottom: 1px solid #f1f5f9;
      transition: 0.2s;
    }

    .leaderboard-item:last-child {
      border-bottom: none;
    }

    .leaderboard-item:hover {
      background: #f8fafc;
    }

    .item-rank {
      width: 30px;
      font-size: 14px;
      font-weight: 700;
      color: #64748b;
      text-align: center;
    }

    .item-avatar {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: #e2e8f0;
      margin-left: 10px;
      margin-right: 14px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      color: #475569;
      font-size: 14px;
    }

    .item-info {
      flex: 1;
    }

    .item-name {
      font-size: 14px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 2px;
    }

    .item-sub {
      font-size: 11px;
      color: #94a3b8;
    }

    .item-score {
      font-size: 14px;
      font-weight: 800;
      color: #2563eb;
      text-align: right;
    }

    .current-user-card {
      background: linear-gradient(135deg, #eff6ff, #dbeafe);
      border: 1px solid #bfdbfe;
      border-radius: 16px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      box-shadow: 0 4px 15px rgba(37, 99, 235, 0.08);
    }

    .loading-state, .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #64748b;
      font-size: 14px;
    }

    .spinner {
      width: 30px;
      height: 30px;
      border: 3px solid #cbd5e1;
      border-top-color: #2563eb;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 12px;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>

<body>

  <div class="header">
    <div class="header-top">
      <button class="back-btn" onclick="history.back()" aria-label="Go back">
        <i class="fa-solid fa-arrow-left"></i>
      </button>
      <h1>लिडरबोर्ड (Leaderboard)</h1>
      <div style="width: 40px;"></div>
    </div>

    <!-- Filter Tabs -->
    <div class="filter-tabs">
      <button class="tab-btn active" data-period="daily" type="button">दैनिक (Daily)</button>
      <button class="tab-btn" data-period="weekly" type="button">साताको (Weekly)</button>
      <button class="tab-btn" data-period="monthly" type="button">मासिक (Monthly)</button>
    </div>
  </div>

  <div class="container">
    <!-- Podium for Top 3 -->
    <div id="podiumSection" class="podium-section"></div>

    <!-- Rest of the List -->
    <div class="leaderboard-list" id="leaderboardList">
      <div class="loading-state">
        <div class="spinner"></div>
        डाटा लोड हुँदैछ...
      </div>
    </div>

    <!-- Current User's Rank Card -->
    <div id="currentUserCard" style="display: none;" class="current-user-card"></div>
  </div>

  <!-- Supabase CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = 'https://edyirdedkiarguvurpxq.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVkeWlyZGVka2lhcmd1dnVycHhxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwMTg2NjIsImV4cCI6MjEwNDU5NDY2Mn0.yhNn3YKmFSkxRdefk2F22qxTFhuKS90NH5fa3zzKSaY';
    
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentPeriod = "daily";
    let currentUserId = null;
    let currentUserSessionName = null;
    let currentUserEmail = null;

    const tabButtons = document.querySelectorAll(".tab-btn");
    tabButtons.forEach(btn => {
      btn.addEventListener("click", (e) => {
        e.preventDefault();
        tabButtons.forEach(b => b.classList.remove("active"));
        btn.classList.add("active");
        currentPeriod = btn.getAttribute("data-period");
        fetchCombinedLeaderboard(currentPeriod);
      });
    });

    document.addEventListener("DOMContentLoaded", async () => {
      const { data: { session } } = await supabaseClient.auth.getSession();
      if (session && session.user) {
        currentUserId = session.user.id;
        currentUserEmail = session.user.email;
        
        if (session.user.user_metadata && session.user.user_metadata.full_name) {
          currentUserSessionName = session.user.user_metadata.full_name;
        } else if (session.user.user_metadata && session.user.user_metadata.name) {
          currentUserSessionName = session.user.user_metadata.name;
        } else if (currentUserEmail) {
          let emailPrefix = currentUserEmail.split('@')[0];
          currentUserSessionName = emailPrefix.charAt(0).toUpperCase() + emailPrefix.slice(1);
        }
      }
      fetchCombinedLeaderboard(currentPeriod);
    });

    async function fetchCombinedLeaderboard(period) {
      const leaderboardList = document.getElementById("leaderboardList");
      const podiumSection = document.getElementById("podiumSection");
      const currentUserCard = document.getElementById("currentUserCard");

      leaderboardList.innerHTML = `<div class="loading-state"><div class="spinner"></div>डाटा लोड हुँदैछ...</div>`;
      podiumSection.innerHTML = "";
      currentUserCard.style.display = "none";

      try {
        const tables = [
          'leaderboard',
          'leaderboard_geography',
          'leaderboard_set1',
          'leaderboard_world_geography'
        ];

        let scoreColumn = 'solved_questions';
        if (period === 'daily') scoreColumn = 'solved_daily';
        else if (period === 'weekly') scoreColumn = 'solved_weekly';
        else if (period === 'monthly') scoreColumn = 'solved_monthly';

        let userScoresMap = {};

        for (const tableName of tables) {
          const { data, error } = await supabaseClient
            .from(tableName)
            .select(`user_id, username, name, ${scoreColumn}`);

          if (!error && data) {
            data.forEach(row => {
              // युजर छुट्याउन युनिभर्सल आइडी (user_id वा username) प्रयोग गर्ने
              const uKey = row.user_id || row.username || row.name;
              
              // डेटाबेसमा भएको 'username' वा 'name' मध्ये जुन छ त्यसलाई प्राथमिकता दिने
              let displayName = row.username || row.name;

              if (!displayName || displayName.trim() === "" || displayName.toLowerCase() === "aspirant") {
                if (row.user_id === currentUserId && currentUserSessionName) {
                  displayName = currentUserSessionName;
                } else {
                  displayName = "Loksewa Aspirant";
                }
              }

              const score = Number(row[scoreColumn]) || Number(row.solved_questions) || 0;

              if (!userScoresMap[uKey]) {
                userScoresMap[uKey] = { id: uKey, name: displayName, totalScore: 0 };
              } else {
                if ((userScoresMap[uKey].name === "Loksewa Aspirant" || userScoresMap[uKey].name === "Loksewa Candidate") && 
                    displayName !== "Loksewa Aspirant" && displayName !== "Loksewa Candidate") {
                  userScoresMap[uKey].name = displayName;
                }
              }

              userScoresMap[uKey].totalScore += score;
            });
          }
        }

        let combinedUsers = Object.values(userScoresMap);

        if (currentUserId && !userScoresMap[currentUserId] && currentUserSessionName) {
          combinedUsers.push({
            id: currentUserId,
            name: currentUserSessionName,
            totalScore: 0
          });
        }

        combinedUsers.sort((a, b) => b.totalScore - a.totalScore);

        if (combinedUsers.length === 0) {
          leaderboardList.innerHTML = `<div class="empty-state">अहिले कुनै डाटा उपलब्ध छैन।</div>`;
          podiumSection.style.display = "none";
          return;
        }

        podiumSection.style.display = "flex";

        // Podium (Top 3)
        let podiumHTML = "";
        const top3 = combinedUsers.slice(0, 3);
        const orderedPodium = [];
        if (top3[1]) orderedPodium.push({ user: top3[1], rank: 2, cls: "second" });
        if (top3[0]) orderedPodium.push({ user: top3[0], rank: 1, cls: "first" });
        if (top3[2]) orderedPodium.push({ user: top3[2], rank: 3, cls: "third" });

        orderedPodium.forEach(item => {
          const name = item.user.name;
          const score = item.user.totalScore;
          const initials = name ? name.charAt(0).toUpperCase() : "L";

          podiumHTML += `
            <div class="podium-card ${item.cls}">
              <div class="podium-rank">${item.rank}</div>
              <div class="podium-avatar">${initials}</div>
              <div class="podium-name">${name}</div>
              <div class="podium-score">${score} प्रश्न</div>
            </div>
          `;
        });
        podiumSection.innerHTML = podiumHTML;

        // Remaining List
        let listHTML = "";
        const remainingUsers = combinedUsers.slice(3);

        if (remainingUsers.length === 0 && combinedUsers.length <= 3) {
          leaderboardList.innerHTML = `<div style="padding: 20px; text-align: center; color: #94a3b8; font-size: 13px;">अन्य सहभागीहरू छैनन्</div>`;
        } else {
          remainingUsers.forEach((user, index) => {
            const rank = index + 4;
            const name = user.name;
            const score = user.totalScore;
            const initials = name ? name.charAt(0).toUpperCase() : "L";

            listHTML += `
              <div class="leaderboard-item">
                <div class="item-rank">${rank}</div>
                <div class="item-avatar">${initials}</div>
                <div class="item-info">
                  <div class="item-name">${name}</div>
                  <div class="item-sub">Loksewa Aspirant</div>
                </div>
                <div class="item-score">${score} <span style="font-size: 11px; font-weight: 500; color: #64748b;">प्र.</span></div>
              </div>
            `;
          });
          leaderboardList.innerHTML = listHTML;
        }

        // Current User Rank Card
        if (currentUserId) {
          const userIndex = combinedUsers.findIndex(u => u.id === currentUserId || u.id === currentUserSessionName);
          if (userIndex !== -1) {
            const loggedUser = combinedUsers[userIndex];
            const myRank = userIndex + 1;
            const myInitials = loggedUser.name ? loggedUser.name.charAt(0).toUpperCase() : "L";

            currentUserCard.style.display = "flex";
            currentUserCard.innerHTML = `
              <div class="item-rank" style="color: #2563eb;">#${myRank}</div>
              <div class="item-avatar" style="background: #2563eb; color: white;">${myInitials}</div>
              <div class="item-info">
                <div class="item-name">${loggedUser.name} (तपाईं)</div>
                <div class="item-sub">तपाईँको समग्र स्थान</div>
              </div>
              <div class="item-score">${loggedUser.totalScore} प्रश्न</div>
            `;
          }
        }

      } catch (error) {
        console.error("Combined Leaderboard error:", error);
        leaderboardList.innerHTML = `<div class="empty-state">डाटा लोड गर्न असफल भयो।</div>`;
      }
    }
  </script>
</body>
</html>
