<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f2a4a">
<title>LoksewaQuest - Live Quiz Game</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/contrib/auto-render.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ===== Design tokens ===== */
:root{--navy:#0f2a4a;--blue:#2563eb;--blue-d:#1d4ed8;--blue-l:#e8effd;--gold:#f5b301;--gold-d:#92620a;--gold-l:#fff6d6;--ok:#15803d;--ok-l:#dcfce7;--bad:#dc2626;--bad-l:#fee2e2;--bg:#f4f6fa;--card:#fff;--text:#0f2a4a;--mute:#64748b;--line:#e2e8f0;--r:12px;--font:'Plus Jakarta Sans','Noto Sans Devanagari',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0;font-family:var(--font)}
body{background:var(--bg);color:var(--text);height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden;line-height:1.5}
footer,.global-site-footer,#globalFooter{display:none!important}
button{cursor:pointer;color:inherit;font-weight:600;border:0;background:none}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
/* ===== Header ===== */
.hdr{background:var(--navy);color:#fff;padding:8px 12px;padding-top:calc(8px + env(safe-area-inset-top));display:flex;align-items:center;gap:10px;z-index:70}
.logo{display:flex;align-items:center;gap:8px;font-weight:700;font-size:15px;flex:1;min-width:0}
.flag{width:22px;height:26px;background:var(--gold);clip-path:polygon(0 0,100% 38%,45% 42%,100% 100%,0 100%);flex-shrink:0}
.logo small{display:block;font-size:10px;font-weight:500;opacity:.7;line-height:1.1}
.chip-h{background:rgba(255,255,255,.12);border-radius:8px;padding:6px 10px;font-size:12px;font-weight:600;white-space:nowrap;min-height:34px;display:flex;align-items:center;gap:6px}
.dot{width:8px;height:8px;border-radius:50%;background:#4ade80}.dot.off{background:#f87171}
.chatbtn{background:var(--blue);color:#fff;border-radius:8px;padding:0 12px;min-height:44px;min-width:44px;font-size:13px;display:flex;align-items:center;gap:6px;position:relative}
.chatbtn:hover{background:var(--blue-d)}.chatbtn .bd{position:absolute;top:6px;right:6px;width:9px;height:9px;border-radius:50%;background:var(--gold);display:none}
/* ===== Layout ===== */
main{flex:1;overflow-y:auto;padding:14px 12px calc(24px + env(safe-area-inset-bottom));position:relative}
.wrap{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;animation:in .25s ease-out}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.btn{min-height:46px;padding:0 16px;border-radius:10px;font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;transition:background .15s,transform .1s}
.btn:active:not(:disabled){transform:scale(.98)}
.btn.p{background:var(--blue);color:#fff}.btn.p:hover:not(:disabled){background:var(--blue-d)}
.btn.s{background:#fff;border:1px solid #cbd5e1}.btn.s:hover{background:var(--bg)}
.btn.g{background:var(--ok);color:#fff}
.btn:disabled{opacity:.5}
.muted{color:var(--mute);font-size:12px}
/* ===== Lobby ===== */
.hero{text-align:center}
.hero h1{font-size:13px;font-weight:700;letter-spacing:.08em;color:var(--mute)}
.code{display:inline-flex;align-items:center;gap:10px;margin:8px 0 4px;background:var(--blue-l);border:1px dashed var(--blue);border-radius:12px;padding:6px 8px 6px 18px}
.code b{font-size:26px;letter-spacing:.14em;font-weight:700;color:var(--navy)}
.code button{background:var(--blue);color:#fff;min-height:44px;min-width:44px;border-radius:8px;padding:0 12px;font-size:13px}
.tag{font-size:12px;color:var(--mute);margin-top:6px}
.wait::after{content:'';animation:dots 1.4s steps(4,end) infinite}
@keyframes dots{0%{content:''}25%{content:'.'}50%{content:'..'}75%{content:'...'}}
.exp{display:inline-flex;gap:6px;align-items:center;font-size:12px;font-weight:600;color:var(--gold-d);background:var(--gold-l);padding:4px 10px;border-radius:99px;margin-top:8px}
.sec{font-size:13px;font-weight:700;margin:14px 0 8px;text-align:left}
.plist{display:grid;gap:8px}
.pc{display:flex;align-items:center;gap:10px;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:8px 10px;text-align:left}
.av{width:36px;height:36px;border-radius:50%;background:var(--navy);color:#fff;display:grid;place-items:center;font-weight:700;font-size:14px;flex-shrink:0}
.pc .n{flex:1;min-width:0;font-size:14px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.badge{font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--ok-l);color:var(--ok)}.badge.h{background:var(--gold-l);color:var(--gold-d)}
.kick{background:var(--bad-l);color:var(--bad);border-radius:8px;min-height:36px;padding:0 10px;font-size:12px}
.topics{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tp{display:flex;align-items:center;gap:8px;text-align:left;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;min-height:48px;font-size:13px;transition:border-color .15s,background .15s}
.tp i{color:var(--mute);width:18px;text-align:center}
.tp:hover:not(:disabled){border-color:#94a3b8}
.tp.on{border-color:var(--blue);background:var(--blue-l);box-shadow:inset 0 0 0 1px var(--blue)}.tp.on i{color:var(--blue)}
.tp:disabled:not(.on){opacity:.6}
.step{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1.5px solid var(--line);border-radius:10px;padding:6px 6px 6px 12px;font-size:13px}
.step div{display:flex;align-items:center;gap:6px}.step b{min-width:28px;text-align:center;font-size:16px}
.step button{width:44px;height:36px;background:var(--blue-l);color:var(--blue);border-radius:8px;font-size:16px}.step button:disabled{opacity:.4}
/* ===== Playing ===== */
.prog{display:flex;flex-direction:column;gap:6px}
.prog .row{display:flex;justify-content:space-between;gap:8px;font-size:12px;font-weight:600}
.bar{height:6px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue);border-radius:9px;transition:width .3s}
.tb{display:inline-block;background:var(--blue-l);color:var(--blue-d);border-radius:99px;padding:2px 10px;font-size:12px;font-weight:600}
.turn{display:flex;align-items:center;gap:12px;border-radius:var(--r);padding:12px 14px;background:#fff;border:1px solid var(--line);animation:in .25s ease-out}
.turn.me{background:var(--navy);color:#fff;border-color:var(--navy)}
.turn .tx{flex:1;min-width:0}.turn .tt{font-size:15px;font-weight:700}.turn .ts{font-size:12px;opacity:.75}
.turn.me .av{background:var(--gold);color:var(--navy)}
.timer{position:relative;width:52px;height:52px;flex-shrink:0}
.timer svg{width:52px;height:52px;transform:rotate(-90deg)}
.timer circle{fill:none;stroke-width:5}.timer .bg{stroke:rgba(148,163,184,.3)}
.timer .fg{stroke:var(--blue);stroke-linecap:round;stroke-dasharray:138.2;transition:stroke-dashoffset 1s linear,stroke .3s}
.turn.me .timer .fg{stroke:var(--gold)}
.timer span{position:absolute;inset:0;display:grid;place-items:center;font-size:17px;font-weight:700;font-variant-numeric:tabular-nums}
.timer.warn .fg{stroke:#f59e0b}.timer.crit .fg{stroke:var(--bad)}
.timer.crit span{color:var(--bad);animation:pulse 1s ease-in-out infinite}.turn.me .timer.crit span{color:#fecaca}
@keyframes pulse{50%{transform:scale(1.15)}}
.q{padding:18px 16px}.q .ql{font-size:12px;font-weight:600;color:var(--mute);margin-bottom:6px}
.q h2{font-size:19px;font-weight:600;line-height:1.55;white-space:pre-line;overflow-wrap:anywhere}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:var(--r);padding:10px 14px;min-height:52px;font-size:15px;font-weight:500;transition:border-color .15s,background .15s,transform .1s}
.opt .l{width:30px;height:30px;border-radius:8px;background:var(--blue-l);color:var(--blue-d);display:grid;place-items:center;font-weight:700;font-size:13px;flex-shrink:0}
.opt .o{flex:1;overflow-wrap:anywhere}
.opt:hover:not(:disabled){border-color:var(--blue);background:#f8faff}.opt:active:not(:disabled){transform:scale(.99)}
.opt:disabled{background:#f1f5f9;color:#64748b}.opt:disabled .l{background:#e2e8f0;color:var(--mute)}
.opt.sel{border-color:var(--blue);background:var(--blue-l);color:var(--navy)}.opt.sel .l{background:var(--blue);color:#fff}
.skip{margin-top:10px;color:var(--mute);min-height:44px;width:100%;font-size:13px;border-radius:10px}.skip:hover:not(:disabled){background:var(--bg)}
.spec{text-align:center;color:var(--mute);font-size:12px;margin-top:12px}
.strip{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}.strip::-webkit-scrollbar{display:none}
.chip{position:relative;display:flex;align-items:center;gap:6px;background:#fff;border:1.5px solid var(--line);border-radius:10px;padding:6px 10px;font-size:13px;white-space:nowrap;flex:0 0 auto}
.chip .nm{max-width:90px;overflow:hidden;text-overflow:ellipsis;font-weight:500}.chip.me .nm{font-weight:700}
.chip.act{border-color:var(--blue);background:var(--blue-l)}
.chip b{font-variant-numeric:tabular-nums}
.fl{position:absolute;right:6px;top:-4px;font-weight:700;font-size:14px;animation:fl 1.2s ease-out forwards;pointer-events:none}
.fl.up{color:var(--ok)}.fl.dn{color:var(--bad)}
@keyframes fl{to{transform:translateY(-22px);opacity:0}}
/* ===== Result ===== */
.res{text-align:center}.res .big{font-size:44px;line-height:1.2}
.res h2{font-size:21px;font-weight:700;margin-top:4px}
.rwd{display:inline-flex;align-items:center;gap:8px;background:var(--gold-l);color:var(--gold-d);border:1px solid #f3d36b;border-radius:12px;padding:8px 16px;font-weight:700;margin-top:12px;animation:pop .4s ease-out}
@keyframes pop{from{transform:scale(.85);opacity:0}}
.lb{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;border:1px solid var(--line);background:#fff;text-align:left}
.lb.me{border-color:var(--blue);background:var(--blue-l)}.lb.first{background:var(--gold-l);border-color:#f3d36b}
.lb .rk{width:30px;text-align:center;font-weight:700;font-size:16px}.lb .n{flex:1;min-width:0;font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rv{border:1px solid var(--line);border-left:4px solid var(--mute);border-radius:10px;padding:10px 12px;background:#fff;text-align:left;font-size:13px}
.rv.ok{border-left-color:var(--ok)}.rv.no{border-left-color:var(--bad)}
.rv .qh{display:flex;justify-content:space-between;font-size:11px;font-weight:700;color:var(--mute)}
.rv p{font-weight:600;margin:4px 0 6px;overflow-wrap:anywhere}
.rv .a{display:flex;gap:6px;align-items:baseline;margin-top:2px}.rv .a em{font-style:normal;color:var(--mute);font-size:11px;min-width:84px}
.rv .a.g{color:var(--ok);font-weight:600}.rv .bad{color:var(--bad);font-weight:600}
.dl{font-weight:700}.dl.p{color:var(--ok)}.dl.m{color:var(--bad)}
.acts{display:grid;gap:8px}
/* ===== States / toast / modal ===== */
.state{text-align:center;padding:36px 16px}.state .ic{font-size:36px;margin-bottom:8px}.state h3{font-size:16px}.state p{font-size:13px;color:var(--mute);margin:4px 0 14px}
.spin{width:32px;height:32px;border:3px solid var(--line);border-top-color:var(--blue);border-radius:50%;margin:0 auto 12px;animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.toasts{position:fixed;top:calc(62px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:6px;width:calc(100% - 24px);max-width:400px;pointer-events:none}
.toast{background:var(--navy);color:#fff;padding:9px 12px;border-radius:10px;font-size:13px;font-weight:500;display:flex;gap:8px;align-items:center;box-shadow:0 4px 14px rgba(15,42,74,.25);animation:ti 3.5s forwards}
@keyframes ti{0%{opacity:0;transform:translateY(-10px)}8%,88%{opacity:1;transform:none}100%{opacity:0;transform:translateY(-6px)}}
.fe{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:80}
.fe span{position:absolute;bottom:0;font-size:40px;animation:fu 2.4s ease-out forwards}
@keyframes fu{to{transform:translateY(-70vh) rotate(15deg);opacity:0}}
.ov{position:fixed;inset:0;background:rgba(15,42,74,.55);display:flex;align-items:center;justify-content:center;z-index:100;opacity:0;pointer-events:none;transition:opacity .2s;padding:16px}
.ov.on{opacity:1;pointer-events:auto}
.modal{background:#fff;width:100%;max-width:340px;border-radius:16px;padding:22px;text-align:center;transform:scale(.95);transition:transform .2s}.ov.on .modal{transform:none}
.modal .mi{font-size:40px}.modal h3{font-size:17px;margin:6px 0 4px}.modal p{font-size:13px;color:var(--mute);margin-bottom:16px}
/* ===== Chat ===== */
.chat{position:fixed;inset:0;z-index:60;pointer-events:none}.chat.open{pointer-events:auto}
.scrim{position:absolute;inset:0;background:rgba(15,42,74,.4);opacity:0;transition:opacity .25s}.chat.open .scrim{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;height:80vh;height:80dvh;background:#fff;border-radius:16px 16px 0 0;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .25s ease;padding-bottom:env(safe-area-inset-bottom)}
.chat.open .sheet{transform:none}
.ch{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);font-weight:700;font-size:14px}
.ch button{min-width:44px;min-height:44px;font-size:16px;color:var(--mute)}
.msgs{flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--bg);min-height:0}
.m{max-width:85%;background:#fff;border:1px solid var(--line);border-radius:12px 12px 12px 4px;padding:6px 10px;font-size:13px;overflow-wrap:anywhere;align-self:flex-start}
.m.me{align-self:flex-end;background:var(--blue);color:#fff;border-color:var(--blue);border-radius:12px 12px 4px 12px}
.m .u{font-size:11px;font-weight:700;color:var(--blue)}.m.me .u{color:#bfdbfe}.m .tm{font-size:10px;opacity:.6;margin-left:6px;font-weight:500}
.qe{display:flex;gap:6px;padding:8px 12px;overflow-x:auto;border-top:1px solid var(--line)}
.qe button{border:1px solid var(--line);border-radius:99px;min-width:44px;min-height:40px;font-size:18px;background:#fff}
.cf{display:flex;gap:8px;padding:8px 12px 10px}
.cf input{flex:1;min-width:0;padding:0 12px;min-height:44px;border:1.5px solid #cbd5e1;border-radius:10px;font-size:16px;outline:none;color:var(--text)}.cf input:focus{border-color:var(--blue)}
.cf button{background:var(--blue);color:#fff;min-width:48px;min-height:44px;border-radius:10px}
@media(min-width:900px){
 .sheet{left:auto;top:58px;width:340px;height:auto;border-radius:0;border-left:1px solid var(--line);transform:translateX(100%)}
 .scrim{display:none}.chat{pointer-events:none}.chat.open .sheet{pointer-events:auto}
 .q h2{font-size:21px}
}
@media(max-width:380px){.code b{font-size:22px}.topics{grid-template-columns:1fr}.logo small{display:none}}
@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<header class="hdr">
  <div class="logo"><span class="flag" aria-hidden="true"></span><div>LoksewaQuest<small>प्रतिस्पर्धा गरौँ। सिकौँ। जितौँ।</small></div></div>
  <div class="chip-h" title="Room code"><span class="dot" id="netDot" aria-hidden="true"></span><span id="roomCodeDisplay">----</span></div>
  <div class="chip-h" aria-label="खेलाडी संख्या"><i class="fa-solid fa-users" aria-hidden="true"></i><span id="pCount">0</span></div>
  <button class="chatbtn" id="chatToggle" aria-label="च्याट खोल्नुहोस्" aria-expanded="false"><i class="fa-solid fa-comments" aria-hidden="true"></i><span class="bd" id="chatBadge"></span></button>
</header>

<main id="mainArea">
  <div class="wrap" id="gameBody"><div class="state"><div class="spin"></div><h3>खेल लोड हुँदैछ...</h3><p>रुममा जोडिँदै</p></div></div>
</main>

<div class="toasts" id="toastContainer" aria-live="polite"></div>
<div class="fe" id="floatingEmojiContainer" aria-hidden="true"></div>

    <div class="ch"><span id="chTitle">ग्रुप च्याट</span><button id="chatClose" aria-label="च्याट बन्द गर्नुहोस्"><i class="fa-solid fa-xmark" aria-hidden="true"></i></button></div>
    <div class="msgs" id="chatMessagesContainer" aria-live="polite"><div class="muted" style="text-align:center">च्याट लोड हुँदैछ...</div></div>
    <div class="qe" id="quickEmojis"></div>
    <form class="cf" id="chatForm"><input id="chatInputText" placeholder="सन्देश लेख्नुहोस्..." autocomplete="off" maxlength="300" enterkeyhint="send" aria-label="सन्देश"><button type="submit" aria-label="पठाउनुहोस्"><i class="fa-solid fa-paper-plane" aria-hidden="true"></i></button></form>
  </div>
</aside>

<div class="ov" id="customModalOverlay"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="modalTitle" aria-describedby="modalDesc">
  <div class="mi" id="modalIcon" aria-hidden="true">🎉</div><h3 id="modalTitle"></h3><p id="modalDesc"></p>
  <button class="btn p" id="modalActionBtn">हुन्छ (OK)</button></div></div>

  authDomain: "loksewaquest-227b6.firebaseapp.com",

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const SUPABASE_URL = 'https://edyirdedkiarguvurpxq.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVkeWlyZGVka2lhcmd1dnVycHhxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwMTg2NjIsImV4cCI6MjEwNDU5NDY2Mn0.yhNn3YKmFSkxRdefk2F22qxTFhuKS90NH5fa3zzKSaY';

const reduced = matchMedia('(prefers-reduced-motion: reduce)').matches;
const TOPICS = [["all","सबै विषय","fa-shuffle"],["Nepal Geography","नेपालको भूगोल","fa-mountain"],["nepal_history","नेपालको इतिहास","fa-landmark"],["world_history","विश्वको इतिहास","fa-earth-asia"],["science&tech","Science & Technology","fa-flask"],["iq","IQ","fa-brain"],["16thYojana","१६ औँ योजना","fa-chart-line"],["Budget2083-84","बजेट २०८३/८४","fa-coins"]];
const topicName = t => (TOPICS.find(x => x[0] === t) || [0, t === 'World_geography' ? 'World Geography' : t])[1];
const EMOJIS = ['👍','🔥','👏','😂','❤️','🎯','😎','💡'];
let currentUser = null, currentUserName = "Aspirant", roomDataGlobal = null;
let roomExpiryTimerInterval = null, expiryFor = 0, questionTimerInterval = null;
let lastProcessedNotificationId = null, isAnswerSubmitting = false, coinAlreadyDistributed = false;
let initDone = false, lastKey = '', celebrated = false, prevScores = {}, kickedShown = false;
let chatOpen = false, chatLoaded = false, lastChatCount = 0;

function escapeHTML(str) {
  if (!str) return '';
  return String(str).replace(/[&<>'"]/g, t => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[t] || t));
}
function renderMath(el) {
  setTimeout(() => {
    if (el && window.renderMathInElement) window.renderMathInElement(el, {
      delimiters: [{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false},{left:'\\(',right:'\\)',display:false},{left:'\\[',right:'\\]',display:true}],
      throwOnError: false });
  }, 50);
}
window.showToast = (msg, icon = '🎯') => {
  const t = document.createElement('div'); t.className = 'toast';
  t.innerHTML = `<span aria-hidden="true">${icon}</span><span>${escapeHTML(msg)}</span>`;
  $('toastContainer').appendChild(t); setTimeout(() => t.remove(), 3500);
};
function triggerFloatingEmoji(ch) {
  if (reduced) return;
  const c = $('floatingEmojiContainer'), s = document.createElement('span');
  s.textContent = ch; s.style.left = (20 + Math.random() * Math.max(innerWidth - 90, 10)) + 'px';
  c.appendChild(s); setTimeout(() => s.remove(), 2500);
}
let modalCb = null, lastFocus = null;
window.showCustomModal = (title, desc, icon = "🎉", btn = "हुन्छ (OK)", cb = null) => {
  $('modalTitle').textContent = title; $('modalDesc').textContent = desc;
  $('modalIcon').textContent = icon; $('modalActionBtn').textContent = btn;

};
$('modalActionBtn').onclick = closeCustomModal;

});
const stateHTML = (ic, title, msg, btn) => `<div class="card state">${ic === 'spin' ? '<div class="spin"></div>' : `<div class="ic" aria-hidden="true">${ic}</div>`}<h3>${title}</h3><p>${msg}</p>${btn || ''}</div>`;
addEventListener('online', () => { $('netDot').classList.remove('off'); showToast('इन्टरनेट जोडियो', '✅'); });
addEventListener('offline', () => { $('netDot').classList.add('off'); showToast('इन्टरनेट सम्पर्क छुट्यो', '⚠️'); });

/* ================= AUTH ================= */
onAuthStateChanged(auth, async (user) => {
  if (!user) { location.href = "login.html"; return; }
  currentUser = user;
  currentUserName = user.displayName || (user.email ? user.email.split('@')[0] : "Aspirant");
  try {
    const snap = await getDoc(doc(db, "users", user.uid));
    if (snap.exists() && snap.data().name) currentUserName = snap.data().name;
  } catch (e) { console.log(e); }
  if (initDone) return;           // fix: never attach listeners twice
  initDone = true;
  initGameListener(); initChatListener();
  addEventListener('beforeunload', handleUserLeave);
});

async function handleUserLeave() {
  if (!roomId || !currentUser || !roomDataGlobal || roomDataGlobal.status === 'finished') return;
  const roomRef = doc(db, "quiz_rooms", roomId);
  try {
    const left = roomDataGlobal.players.filter(p => p.uid !== currentUser.uid);
    if (left.length === 0) await deleteDoc(roomRef);
    else {
      let idx = roomDataGlobal.currentTurnIndex; if (idx >= left.length) idx = 0;
      await updateDoc(roomRef, { players: left, currentTurnIndex: idx });
    }
  } catch (e) {}
}

/* ================= COINS (logic unchanged) ================= */
function calcCoins(room, uid) {
  const sorted = [...room.players].sort((a, b) => b.score - a.score);
  const i = sorted.findIndex(p => p.uid === uid);
  if (i < 0) return 0;
  return 10 + (i === 0 ? 40 : 0) + (sorted[i].score > 0 ? sorted[i].score : 0);
}
async function distributeCoinsForGame(room) {
  if (!room.players || !Array.isArray(room.players) || coinAlreadyDistributed) return;
  coinAlreadyDistributed = true;
  const me = room.players.find(p => currentUser && p.uid === currentUser.uid);
  if (!me) return;
  const earned = calcCoins(room, me.uid);
  try {
    const userRef = doc(db, "users", currentUser.uid);
    const snap = await getDoc(userRef);
    let cur = (snap.exists() && snap.data().coins !== undefined) ? Number(snap.data().coins) : 0;
    await updateDoc(userRef, { coins: cur + earned });
    showToast(`तपाईंले ${earned} Coins कमाउनुभयो!`, '🪙');
  } catch (err) { console.error("कोइन अपडेट गर्दा त्रुटी आयो:", err); }
}

/* ================= ROOM LISTENER ================= */
function initGameListener() {
  onSnapshot(doc(db, "quiz_rooms", roomId), async (snap) => {
    if (!snap.exists()) {
      clearInterval(questionTimerInterval); clearInterval(roomExpiryTimerInterval);
      $('gameBody').innerHTML = stateHTML('🚪', 'रुम फेला परेन', 'यो रुम हटाइएको वा समय समाप्त भएको छ।', '<button class="btn p" data-a="lobby">लबीमा जानुहोस्</button>');
      showCustomModal("रुम बन्द भयो", "यो रुम हटाइएको वा समय समाप्त भएको छ।", "⚠️", "लबीमा जानुहोस्", () => location.href = "quizlobby.html");
      return;
    }
    const data = snap.data();
    if (data.latestNotification && data.latestNotification.id !== lastProcessedNotificationId) {
      const first = lastProcessedNotificationId === null;
      lastProcessedNotificationId = data.latestNotification.id;
      if (!first) showToast(data.latestNotification.text);
    }
    roomDataGlobal = data;
    if (data.status === 'finished') await distributeCoinsForGame(data);
    else { coinAlreadyDistributed = false; celebrated = false; }
    renderGameUI(data);
  }, (err) => {
    console.error(err);
    $('gameBody').innerHTML = stateHTML('📡', 'नेटवर्क समस्या', 'रुमसँग जोडिन सकिएन। इन्टरनेट जाँच गरी फेरि प्रयास गर्नुहोस्।', '<button class="btn p" onclick="location.reload()">फेरि प्रयास गर्नुहोस्</button>');
  });
}

/* ================= RENDER ================= */
function renderGameUI(room) {
  const body = $('gameBody');
  const players = room.players || [];
  $('pCount').textContent = players.length;
  if (!players.some(p => p.uid === currentUser.uid)) {
    clearInterval(questionTimerInterval);
    if (!kickedShown) {
      kickedShown = true;
      body.innerHTML = stateHTML('👋', 'तपाईं रुमबाट हटाइनुभयो', 'होस्टले तपाईंलाई रुमबाट हटाएको छ।', '<button class="btn p" data-a="lobby">लबीमा जानुहोस्</button>');
      showCustomModal("रुमबाट हटाइयो", "होस्टले तपाईंलाई यो रुमबाट हटाएको छ।", "🚫", "लबीमा जानुहोस्", () => location.href = "quizlobby.html");
    }
    return;
  }
  if (room.status === 'waiting') {
    clearInterval(questionTimerInterval); prevScores = {}; lastKey = '';
    const ms = room.createdAt && room.createdAt.toMillis ? room.createdAt.toMillis() : 0;
    if (ms && ms !== expiryFor) { expiryFor = ms; startRoomExpiryCountdown(ms); }
    renderLobby(room);
  } else if (room.status === 'playing') {
    clearInterval(roomExpiryTimerInterval); expiryFor = 0;
    if (!room.currentQuestion) { body.innerHTML = stateHTML('spin', 'प्रश्न लोड हुँदैछ...', 'कृपया केही क्षण पर्खनुहोस्।'); lastKey = ''; return; }
    const key = `p${room.questionCount}|${room.currentTurnIndex}|${room.passAttempt || 0}`;
    if (key !== lastKey) { lastKey = key; renderQuestion(room); }  // fix: timer restarts only on a real turn change
    paintStrip(room);
  } else if (room.status === 'finished') {
    clearInterval(questionTimerInterval); clearInterval(roomExpiryTimerInterval); expiryFor = 0; prevScores = {};
    if (lastKey !== 'f') { lastKey = 'f'; renderResult(room); }
    if (!celebrated) { celebrated = true; triggerFireworks(room.players.slice().sort((a, b) => b.score - a.score)[0].uid === currentUser.uid); }
  }
}

    <div class="sec">राउन्ड संख्या</div>

function renderQuestion(room) {
  const players = room.players, total = room.settings?.totalRounds || 3, pc = players.length;
  const qc = room.questionCount || 1, rnd = Math.floor((qc - 1) / pc) + 1, planned = total * pc;
  const cur = players[room.currentTurnIndex] || players[0], mine = cur.uid === currentUser.uid, q = room.currentQuestion;
  const init = escapeHTML((cur.name || '?').trim().charAt(0).toUpperCase());
  $('gameBody').innerHTML = `
  <div class="card prog">
    <div class="row"><span>राउन्ड ${NP(rnd)} / ${NP(total)}</span><span>प्रश्न ${NP(qc)} / ${NP(planned)}</span></div>
    <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="${planned}" aria-valuenow="${qc - 1}"><i style="width:${Math.min(100, (qc - 1) / planned * 100)}%"></i></div>
    <div><span class="tb">${escapeHTML(topicName(room.settings?.topic || 'all'))}</span></div>
  </div>
  <div class="turn${mine ? ' me' : ''}" aria-live="polite">
    <div class="av" aria-hidden="true">${mine ? '🎯' : init}</div>
    <div class="tx"><div class="tt">${mine ? 'तपाईंको पालो' : escapeHTML(cur.name) + 'को पालो'}</div><div class="ts">${mine ? 'प्रश्नको उत्तर दिनुहोस्' : 'अहिले ' + escapeHTML(cur.name) + 'ले उत्तर दिँदैछन्...'}</div></div>
    <div class="timer" id="timer" role="timer" aria-label="बाँकी समय"><svg viewBox="0 0 52 52" aria-hidden="true"><circle class="bg" cx="26" cy="26" r="22"/><circle class="fg" id="timerRing" cx="26" cy="26" r="22"/></svg><span id="timerNum">15</span></div>
  </div>
  <div class="strip" id="strip" aria-label="स्कोरबोर्ड"></div>
  <div class="card q" id="activeQuestionCard">
    <div class="ql">प्रश्न ${NP(qc)}</div>
    <h2>${escapeHTML(q.text)}</h2>
    <div class="opts" style="margin-top:16px">${q.options.map((o, i) => `<button class="opt" data-a="opt" data-v="${i}" ${mine ? '' : 'disabled'}><span class="l">${'ABCDEFGH'[i] || i + 1}</span><span class="o">${escapeHTML(o)}</span></button>`).join('')}</div>
    ${mine ? '<button class="skip" data-a="skip">स्किप गर्नुहोस् (Skip)</button>' : `<p class="spec">तपाईं हेर्दै हुनुहुन्छ · ${escapeHTML(cur.name)} को पालो</p>`}
  </div>`;
  renderMath($('activeQuestionCard'));
  startQuestionTimer(mine);
}

function paintStrip(room) {
  const el = $('strip'); if (!el) return;
  const act = room.players[room.currentTurnIndex]?.uid, s = [...room.players].sort((a, b) => b.score - a.score);
  el.innerHTML = s.map((p, i) => `<div class="chip${p.uid === act ? ' act' : ''}${p.uid === currentUser.uid ? ' me' : ''}" data-u="${escapeHTML(p.uid)}"><span aria-hidden="true">${['🏆','🥈','🥉'][i] || NP(i + 1)}</span><span class="nm">${escapeHTML(p.name)}</span><b>${p.score}</b></div>`).join('');
  s.forEach(p => {
    const d = p.score - (prevScores[p.uid] ?? p.score);
    if (d) {
      const c = el.querySelector(`[data-u="${CSS.escape(p.uid)}"]`);
      if (c) { const f = document.createElement('span'); f.className = 'fl ' + (d > 0 ? 'up' : 'dn'); f.textContent = (d > 0 ? '+' : '') + d + ' अंक'; c.appendChild(f); }
    }
    prevScores[p.uid] = p.score;
  });
}

function reviewDelta(h) {
  if (h.isCorrect) return 5;
  if (/Timeout/.test(h.selectedAnswer)) return -1;
  if (/Skipped/.test(h.selectedAnswer)) return 0;
  return -2;
}
function renderResult(room) {
  const sorted = [...room.players].sort((a, b) => b.score - a.score);
  const rank = sorted.findIndex(p => p.uid === currentUser.uid) + 1, win = rank === 1, me = sorted[rank - 1] || { score: 0 };
  const coins = calcCoins(room, currentUser.uid), host = currentUser.uid === room.hostId;
  const lb = sorted.map((p, i) => `<div class="lb${p.uid === currentUser.uid ? ' me' : ''}${i === 0 ? ' first' : ''}"><span class="rk">${['🥇','🥈','🥉'][i] || NP(i + 1)}</span><span class="n">${escapeHTML(p.name)}${p.uid === currentUser.uid ? ' (तपाईं)' : ''}</span><b>${p.score}</b></div>`).join('');
  const rv = (room.history || []).map((h, i) => {
    const d = reviewDelta(h);
    return `<div class="rv ${h.isCorrect ? 'ok' : 'no'}"><div class="qh"><span>Q${NP(i + 1)} · ${escapeHTML(h.playerName)}</span><span class="dl ${d > 0 ? 'p' : d < 0 ? 'm' : ''}">${d > 0 ? '+' : ''}${d}</span></div><p>${escapeHTML(h.questionText)}</p><div class="a"><em>दिइएको उत्तर</em><span class="${h.isCorrect ? '' : 'bad'}">${escapeHTML(h.selectedAnswer)} ${h.isCorrect ? '✓' : '✗'}</span></div><div class="a g"><em>सही उत्तर</em><span>${escapeHTML(h.correctAnswer)} ✓</span></div></div>`;
  }).join('') || '<div class="muted" style="text-align:center;padding:12px">समीक्षा डाटा उपलब्ध छैन।</div>';
  $('gameBody').innerHTML = `
  <div class="card res" id="resultCardContainer">
    <div class="big" aria-hidden="true">${win ? '🎉' : '👏'}</div>
    <h2>${win ? 'बधाई छ!' : 'राम्रो प्रयास!'}</h2>
    <p class="muted" style="font-size:14px">${win ? 'तपाईं पहिलो स्थानमा आउनुभयो!' : `तपाईं ${NP(rank)} औँ स्थानमा आउनुभयो।`}</p>
    <p style="margin-top:6px;font-weight:700">#${rank} · ${me.score} अंक</p>
    <div class="rwd"><span aria-hidden="true">🪙</span> +${coins} Coins</div>
    <p class="muted" style="margin-top:6px">यो खेलबाट तपाईंले ${NP(coins)} Coins कमाउनुभयो</p>
  </div>
  <div class="card"><div class="sec" style="margin-top:0">अन्तिम स्थान</div><div class="plist">${lb}</div></div>
  <div class="card"><div class="sec" style="margin-top:0">उत्तर समीक्षा</div><div class="plist">${rv}</div></div>
  <div class="acts">${host ? '<button class="btn g" data-a="rematch"><i class="fa-solid fa-rotate" aria-hidden="true"></i> फेरि खेल्नुहोस्</button>' : '<p class="muted" style="text-align:center">होस्टले रिम्याच सुरु नगरेसम्म पर्खनुहोस्...</p>'}<button class="btn s" data-a="lobby"><i class="fa-solid fa-house" aria-hidden="true"></i> लबीमा फर्कनुहोस्</button></div>`;
  renderMath($('gameBody'));
}

function triggerFireworks(isWinner) {
  if (reduced || !window.confetti) return;
  if (!isWinner) { confetti({ particleCount: 60, spread: 70, origin: { y: .6 } }); return; }
  const end = Date.now() + 2500, d = { startVelocity: 30, spread: 360, ticks: 60, zIndex: 1000 }, r = (a, b) => Math.random() * (b - a) + a;
  const iv = setInterval(() => {
    const left = end - Date.now(); if (left <= 0) return clearInterval(iv);
    const c = 40 * (left / 2500);
    confetti({ ...d, particleCount: c, origin: { x: r(.1, .3), y: Math.random() - .2 } });
    confetti({ ...d, particleCount: c, origin: { x: r(.7, .9), y: Math.random() - .2 } });
  }, 250);
}

/* ================= EVENT DELEGATION ================= */
$('gameBody').addEventListener('click', e => {
  const b = e.target.closest('[data-a]'); if (!b || b.disabled) return;
  const v = b.dataset.v;
  ({
    copy: () => copyCode(b), topic: () => updateRoomTopic(v), rounds: () => setRounds(+v), kick: () => kickPlayer(v),
    start: startGameSession, rematch: triggerRematch, lobby: () => location.href = 'quizlobby.html',
    opt: () => pick(b, false), skip: () => pick(b, true)
  })[b.dataset.a]?.();
});
function copyCode(b) {
  const done = () => { b.innerHTML = '<i class="fa-solid fa-check" aria-hidden="true"></i> कपी भयो'; showToast('रुम कोड कपी भयो', '📋'); };
  if (navigator.clipboard) navigator.clipboard.writeText(roomId).then(done, () => showToast('कपी गर्न सकिएन', '⚠️')); else showToast('कोड: ' + roomId, '📋');
}
function pick(b, skipped) {
  if (isAnswerSubmitting || !roomDataGlobal) return;
  document.querySelectorAll('.opt,[data-a=skip]').forEach(x => x.disabled = true);
  b.classList.add('sel');
  const q = roomDataGlobal.currentQuestion;
  submitAnswer(skipped ? '' : q.options[+b.dataset.v], skipped);
}

/* ================= HOST ACTIONS ================= */
async function updateRoomTopic(t) {
  if (!roomDataGlobal || currentUser.uid !== roomDataGlobal.hostId) return;
  await updateDoc(doc(db, "quiz_rooms", roomId), { settings: { ...(roomDataGlobal.settings || {}), topic: t } });
}
async function setRounds(n) {
  if (!roomDataGlobal || currentUser.uid !== roomDataGlobal.hostId || n < 1 || n > 10) return;
  await updateDoc(doc(db, "quiz_rooms", roomId), { settings: { ...(roomDataGlobal.settings || {}), totalRounds: n } });
}
async function kickPlayer(uid) {
  if (!roomDataGlobal || currentUser.uid !== roomDataGlobal.hostId) return;
  await updateDoc(doc(db, "quiz_rooms", roomId), { players: roomDataGlobal.players.filter(p => p.uid !== uid) });
}
async function triggerRematch() {
  if (!roomDataGlobal || currentUser.uid !== roomDataGlobal.hostId) return;
  try {
    await updateDoc(doc(db, "quiz_rooms", roomId), {
      status: "waiting", players: roomDataGlobal.players.map(p => ({ ...p, score: 0 })),
      currentTurnIndex: 0, questionCount: 0, currentQuestion: null, askedQuestionIds: [], history: [],
      createdAt: serverTimestamp(), // fresh lobby countdown so the room is not deleted as "expired"
      latestNotification: { id: Date.now(), text: "रिम्याच सुरु भएको छ! होस्टले गेम सुरु गर्न सक्नुहुन्छ।" }
    });
  } catch (e) { showCustomModal("त्रुटि", "रिम्याच गर्न सकिएन।", "❌"); }
}
async function startGameSession() {
  if (!roomDataGlobal) return;
  if (!roomDataGlobal.players || roomDataGlobal.players.length < 2) { showCustomModal("खेलाडी नपुगेको", "खेल सुरु गर्न कम्तीमा २ जना खेलाडी आवश्यक छ।", "⚠️"); return; }
  const btn = document.querySelector('[data-a=start]'); if (btn) btn.disabled = true;
  const firstQ = await fetchQuestionByTopic(roomDataGlobal.settings?.topic || 'all', []);
  try {
    await updateDoc(doc(db, "quiz_rooms", roomId), {
      status: "playing", currentTurnIndex: 0, roundStarterIndex: 0, questionCount: 1, passAttempt: 0,
      players: roomDataGlobal.players.map(p => ({ ...p, score: 0 })),
      currentQuestion: firstQ, askedQuestionIds: [firstQ.id], history: [],
      latestNotification: { id: Date.now(), text: "खेल सुरु भयो! शुभकामना!" }
    });
  } catch (e) { if (btn) btn.disabled = false; showCustomModal("त्रुटि", "खेल सुरु गर्न सकिएन।", "❌"); }
}

/* ================= TIMERS ================= */
function startRoomExpiryCountdown(createdMs) {
  clearInterval(roomExpiryTimerInterval);
  const expiry = createdMs + 2 * 60 * 1000;
  roomExpiryTimerInterval = setInterval(async () => {
    const left = expiry - Date.now(), el = $('lobbyTimerText');
    if (left <= 0) {
      clearInterval(roomExpiryTimerInterval);
      try { await deleteDoc(doc(db, "quiz_rooms", roomId)); } catch (e) {}
      showCustomModal("समय समाप्त", "२ मिनेटभित्र खेल सुरु नभएकोले रुम बन्द भयो।", "⏰", "लबीमा जानुहोस्", () => location.href = "quizlobby.html");
      return;
    }
    if (el) el.textContent = `${Math.floor(left / 60000)}:${String(Math.floor(left % 60000 / 1000)).padStart(2, '0')}`;
  }, 1000);
}
function paintTimer(t) {
  const n = $('timerNum'); if (!n) return;
  t = Math.max(t, 0); n.textContent = t;
  $('timerRing').style.strokeDashoffset = 138.2 * (1 - t / 15);
  $('timer').className = 'timer' + (t <= 5 ? ' crit' : t <= 8 ? ' warn' : '');
}
function startQuestionTimer(mine) {
  clearInterval(questionTimerInterval);
  let t = 15; paintTimer(t);
  questionTimerInterval = setInterval(() => {
    t--; paintTimer(t);
    if (t <= 0) { clearInterval(questionTimerInterval); if (mine && roomDataGlobal && roomDataGlobal.status === 'playing') resolveTurn({ timeout: true }); }
  }, 1000);
}

/* ================= QUESTIONS (Supabase, unchanged) ================= */
async function fetchQuestionByTopic(topicName, excludedIds = []) {
  try {
    let query = supabaseClient.from('quizzes').select('*');
    if (topicName && topicName !== 'all') query = query.eq('topic', topicName);
    let { data, error } = await query;
    if (error || !data || data.length === 0) { const fb = await supabaseClient.from('quizzes').select('*'); data = fb.data || []; }
    if (data.length === 0) return getFallbackQuestion();
    let avail = data.filter(q => !excludedIds.includes(q.id));
    if (avail.length === 0) avail = data;
    const row = avail[Math.floor(Math.random() * avail.length)];
    let options = [];
    if (Array.isArray(row.options)) options = [...row.options];
    else if (typeof row.options === 'object' && row.options !== null) options = Object.values(row.options);
    else if (typeof row.options === 'string') { try { options = JSON.parse(row.options); } catch (e) { options = []; } }
    if (options.length === 0) options = ["विकल्प क", "विकल्प ख", "विकल्प ग", "विकल्प घ"];
    options.sort(() => Math.random() - 0.5);
    return { id: row.id, text: row.question || "प्रश्न फेला परेन", options, correctAnswer: row.answer || options[0] };
  } catch (err) { return getFallbackQuestion(); }
}
function getFallbackQuestion() {
  return { id: Math.random(), text: "नेपालको राष्ट्रिय बोट कुन हो?", options: ["पिपल", "गुराँस", "साल", "सल्ला"].sort(() => Math.random() - 0.5), correctAnswer: "गुराँस" };
}

/* ================= TURN RESOLUTION (same rules: +5 / -2 / -1 / skip 0) ================= */
window.submitAnswer = (selected, isSkipped) => resolveTurn({ selected, isSkipped });
async function resolveTurn({ selected, isSkipped, timeout }) {
  if (isAnswerSubmitting || !roomDataGlobal) return;
  isAnswerSubmitting = true; clearInterval(questionTimerInterval);
  const r = roomDataGlobal, ref = doc(db, "quiz_rooms", roomId), players = r.players.map(p => ({ ...p }));
  const idx = r.currentTurnIndex, q = r.currentQuestion, me = players[idx];
  if (!me || me.uid !== currentUser.uid) { isAnswerSubmitting = false; return; }
  const history = [...(r.history || [])], asked = [...(r.askedQuestionIds || [])];
  let correct = false, label;
  if (timeout) { me.score -= 1; label = 'समय समाप्त (Timeout)'; }
  else if (isSkipped) label = 'स्किप गरिएको (Skipped)';
  else { correct = selected === q.correctAnswer; me.score += correct ? 5 : -2; label = selected; }
  history.push({ questionText: q.text, correctAnswer: q.correctAnswer, playerName: me.name, selectedAnswer: label, isCorrect: correct });
  const qc = r.questionCount || 1, total = (r.settings?.totalRounds || 3) * players.length, pass = (r.passAttempt || 0) + 1;
  try {
    if (correct || pass >= players.length) {
      if (qc >= total) { await updateDoc(ref, { players, history, status: "finished" }); return; }
      const next = await fetchQuestionByTopic(r.settings?.topic || 'all', asked);
      if (next && next.id) asked.push(next.id);
      const starter = ((r.roundStarterIndex !== undefined ? r.roundStarterIndex : 0) + 1) % players.length;
      await updateDoc(ref, {
        players, history, currentTurnIndex: starter, roundStarterIndex: starter, questionCount: qc + 1, passAttempt: 0,
        currentQuestion: next, askedQuestionIds: asked,
        latestNotification: { id: Date.now(), text: correct ? `${me.name} ले सही उत्तर मिलाउनुभयो! (+५ अंक)` : timeout ? "कसैले पनि मिलाएनन्! नयाँ प्रश्न सुरु भयो।" : `कसैले मिलाएनन्! सही उत्तर: ${q.correctAnswer}` }
      });
    } else {
      await updateDoc(ref, {
        players, history, currentTurnIndex: (idx + 1) % players.length, passAttempt: pass,
        latestNotification: { id: Date.now(), text: timeout ? "समय समाप्त! प्रश्न अर्को खेलाडीलाई पास हुँदैछ।" : `${me.name} ले गलत उत्तर दिनुभयो। प्रश्न पास भयो!` }
      });
    }
  } catch (err) { console.error(err); showToast('उत्तर पठाउन सकिएन। फेरि प्रयास गर्नुहोस्।', '⚠️'); lastKey = ''; renderGameUI(roomDataGlobal); }
  finally { setTimeout(() => { isAnswerSubmitting = false; }, 500); }
}

/* ================= CHAT ================= */
$('quickEmojis').innerHTML = EMOJIS.map(e => `<button type="button" data-e="${e}" aria-label="${e} पठाउनुहोस्">${e}</button>`).join('');
$('quickEmojis').addEventListener('click', e => { const b = e.target.closest('[data-e]'); if (b) sendMsg(b.dataset.e); });
function toggleChat() {
  chatOpen = !chatOpen;
  $('chatDrawer').classList.toggle('open', chatOpen);
  $('chatToggle').setAttribute('aria-expanded', chatOpen);
  if (chatOpen) { $('chatBadge').style.display = 'none'; const m = $('chatMessagesContainer'); m.scrollTop = m.scrollHeight; }
}
$('chatToggle').onclick = toggleChat; $('chatClose').onclick = toggleChat; $('chatScrim').onclick = toggleChat;

function initChatListener() {
  onSnapshot(collection(db, "quiz_rooms", roomId, "room_chat"), (snap) => {
    const box = $('chatMessagesContainer');
    if (snap.empty) { box.innerHTML = '<div class="muted" style="text-align:center;padding:20px">अहिलेसम्म कुनै सन्देश छैन। पहिलो सन्देश पठाउनुहोस्!</div>'; chatLoaded = true; return; }
    const msgs = []; snap.forEach(d => msgs.push({ id: d.id, ...d.data() }));
    msgs.sort((a, b) => (a.createdAt?.toMillis() || Infinity) - (b.createdAt?.toMillis() || Infinity));
    const last = msgs[msgs.length - 1];
    if (chatLoaded && msgs.length > lastChatCount) {
      if (/^\p{Extended_Pictographic}[\p{Extended_Pictographic}\uFE0F\u200D]*$/u.test((last.text || '').trim())) triggerFloatingEmoji(last.text.trim());
      if (!chatOpen && last.uid !== currentUser?.uid) $('chatBadge').style.display = 'block';
    }
    lastChatCount = msgs.length; chatLoaded = true;
    box.innerHTML = msgs.map(m => {
      const mine = currentUser && m.uid === currentUser.uid, tm = m.createdAt?.toDate ? m.createdAt.toDate().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
      return `<div class="m${mine ? ' me' : ''}"><div class="u">${escapeHTML(m.senderName)}<span class="tm">${tm}</span></div><div>${escapeHTML(m.text)}</div></div>`;
    }).join('');
    box.scrollTop = box.scrollHeight;
  }, () => { $('chatMessagesContainer').innerHTML = '<div class="muted" style="text-align:center;padding:20px">च्याट लोड गर्न सकिएन।</div>'; });
}
async function sendMsg(text) {
  if (!text || !currentUser) return;
  try { await addDoc(collection(db, "quiz_rooms", roomId, "room_chat"), { text, uid: currentUser.uid, senderName: currentUserName, createdAt: serverTimestamp() }); }
  catch (e) { showToast('सन्देश पठाउन सकिएन', '⚠️'); }
}
$('chatForm').addEventListener('submit', e => {
  e.preventDefault();
  const i = $('chatInputText'), t = i.value.trim(); if (!t) return;
  i.value = ''; sendMsg(t);
});
</script>
