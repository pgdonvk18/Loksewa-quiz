<!DOCTYPE html>
<html lang="ne">
<head>
  <link rel="manifest" href="/manifest.json">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0F1F3D">
  <title>LoksewaQuest - Login</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700;800&family=Figtree:wght@400;500;600;700&family=Mukta:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    :root {
      --ink: #0F1F3D;
      --ink-2: #1B3460;
      --blue: #2554B8;
      --blue-d: #1B418F;
      --blue-bg: #E8EEFA;
      --paper: #F4F6FA;
      --card: #FFFFFF;
      --line: #E1E6EF;
      --text: #15213A;
      --muted: #5B6A82;
      --live: #D93A4C;
      --ok: #1E7F5C;
      --gold: #D6A233;
      --gold-bg: #FBF1D9;
      --gold-ink: #7A5A10;
      --head: 'Bricolage Grotesque', 'Mukta', sans-serif;
      --shadow: 0 1px 2px rgba(15, 31, 61, 0.05), 0 8px 24px rgba(15, 31, 61, 0.06);
    }

    body.dark {
      --ink-2: #18305A;
      --blue: #6E97EA;
      --blue-d: #8DB0F4;
      --blue-bg: #1B2B4D;
      --paper: #0B1322;
      --card: #14203A;
      --line: #25345A;
      --text: #E8EDF6;
      --muted: #9AA8C0;
      --gold-bg: #3A2F14;
      --gold-ink: #F0CB74;
      --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.25);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Figtree', 'Mukta', sans-serif;
      background: var(--paper);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    /* HERO SECTION */
    .hero-section {
      background: var(--ink);
      color: #fff;
      padding: calc(40px + env(safe-area-inset-top, 0px)) 20px 80px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }

    .hero-section::after {
      content: "";
      position: absolute;
      bottom: -1px;
      left: 0;
      right: 0;
      height: 60px;
      background: var(--paper);
      clip-path: polygon(0 60%, 2% 50%, 4% 60%, 6% 45%, 8% 60%, 10% 48%, 12% 60%, 14% 50%, 16% 60%, 18% 48%, 20% 60%, 22% 50%, 24% 60%, 26% 48%, 28% 60%, 30% 50%, 32% 60%, 34% 48%, 36% 60%, 38% 50%, 40% 60%, 42% 48%, 44% 60%, 46% 50%, 48% 60%, 50% 48%, 52% 60%, 54% 50%, 56% 60%, 58% 48%, 60% 60%, 62% 50%, 64% 60%, 66% 48%, 68% 60%, 70% 50%, 72% 60%, 74% 48%, 76% 60%, 78% 50%, 80% 60%, 82% 48%, 84% 60%, 86% 50%, 88% 60%, 90% 48%, 92% 60%, 94% 50%, 96% 60%, 98% 48%, 100% 60%);
    }

    .hero-content {
      position: relative;
      z-index: 1;
    }

    .hero-logo {
      width: 64px;
      height: 64px;
      border-radius: 16px;
      object-fit: cover;
      margin-bottom: 16px;
      border: 1.5px solid rgba(255, 255, 255, 0.25);
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: rgba(255, 255, 255, 0.12);
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #AEBDD8;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 0.3px;
      margin-bottom: 22px;
    }

    .hero-badge i {
      font-size: 13px;
      color: #8DB0F4;
    }

    .hero-section h1 {
      font-family: var(--head);
      font-size: 32px;
      font-weight: 800;
      line-height: 1.2;
      letter-spacing: -0.5px;
      margin-bottom: 10px;
    }

    .hero-section h1 span {
      color: #8DB0F4;
      font-weight: 700;
    }

    .hero-section p {
      font-size: 14px;
      color: #AEBDD8;
      line-height: 1.5;
      max-width: 380px;
      margin: 0 auto;
    }

    /* MAIN CONTAINER */
    .main-wrapper {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      position: relative;
    }

    .login-card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border-radius: 16px;
      border: 1px solid var(--line);
      padding: 32px 24px;
      box-shadow: var(--shadow);
      animation: cardIn 0.4s ease;
    }

    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(15px) scale(0.98);
      }
      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    /* FORM GROUP */
    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 8px;
      letter-spacing: 0.2px;
    }

    .input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;
      left: 14px;
      color: var(--muted);
      font-size: 15px;
      pointer-events: none;
      z-index: 1;
    }

    .form-group input {
      width: 100%;
      padding: 12px 14px 12px 44px;
      border: 1.5px solid var(--line);
      border-radius: 12px;
      font-size: 14px;
      font-family: 'Figtree', sans-serif;
      color: var(--text);
      background: var(--paper);
      outline: none;
      transition: all 0.2s ease;
    }

    .form-group input::placeholder {
      color: var(--muted);
    }

    .form-group input:focus {
      border-color: var(--blue);
      background: var(--card);
      box-shadow: 0 0 0 3px var(--blue-bg);
    }

    .password-toggle {
      position: absolute;
      right: 14px;
      background: transparent;
      border: none;
      color: var(--muted);
      cursor: pointer;
      font-size: 15px;
      padding: 4px;
      z-index: 2;
      transition: color 0.2s;
    }

    .password-toggle:active {
      color: var(--blue);
    }

    /* FORGOT PASSWORD */
    .forgot-password-container {
      display: flex;
      justify-content: flex-end;
      margin-top: -12px;
      margin-bottom: 18px;
    }

    .forgot-password-link {
      font-size: 12px;
      font-weight: 700;
      color: var(--blue);
      text-decoration: none;
      cursor: pointer;
      transition: opacity 0.2s;
    }

    .forgot-password-link:active {
      opacity: 0.7;
    }

    /* BUTTONS */
    .submit-btn {
      width: 100%;
      min-height: 48px;
      background: var(--blue);
      color: #fff;
      border: none;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s ease;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 6px;
    }

    .submit-btn:active {
      background: var(--blue-d);
      transform: scale(0.98);
    }

    .submit-btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .loading-spinner {
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.65s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* DIVIDER */
    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 24px 0;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .divider::before,
    .divider::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--line);
    }

    /* GOOGLE BUTTON */
    .google-btn {
      width: 100%;
      min-height: 48px;
      background: var(--card);
      border: 1.5px solid var(--line);
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      font-family: inherit;
      color: var(--text);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      transition: all 0.2s ease;
    }

    .google-btn:active {
      background: var(--paper);
      transform: scale(0.98);
    }

    .google-btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .google-icon {
      width: 18px;
      height: 18px;
    }

    /* REGISTER LINK */
    .register-link {
      text-align: center;
      margin-top: 22px;
      font-size: 13px;
      color: var(--muted);
      line-height: 1.5;
    }

    .register-link a {
      color: var(--blue);
      font-weight: 700;
      text-decoration: none;
      transition: opacity 0.2s;
    }

    .register-link a:active {
      opacity: 0.7;
    }

    /* MODAL POPUP */
    .popup-overlay {
      position: fixed;
      inset: 0;
      background: rgba(8, 15, 30, 0.65);
      backdrop-filter: blur(5px);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      z-index: 99999;
      opacity: 0;
      visibility: hidden;
      transition: all 0.25s ease;
    }

    .popup-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .popup-card {
      width: 100%;
      max-width: 380px;
      background: var(--card);
      border-radius: 16px;
      border: 1px solid var(--line);
      padding: 28px 24px;
      box-shadow: var(--shadow);
      animation: popupIn 0.3s ease;
    }

    @keyframes popupIn {
      from {
        opacity: 0;
        transform: scale(0.92);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    .popup-icon-container {
      width: 56px;
      height: 56px;
      margin: 0 auto 16px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
    }

    .popup-icon-container.success {
      background: rgba(30, 127, 92, 0.12);
      color: var(--ok);
    }

    .popup-icon-container.error {
      background: rgba(217, 58, 76, 0.12);
      color: var(--live);
    }

    .popup-icon-container.warning {
      background: rgba(214, 162, 51, 0.12);
      color: var(--gold);
    }

    .popup-title {
      font-family: var(--head);
      font-size: 18px;
      font-weight: 700;
      text-align: center;
      margin-bottom: 8px;
      color: var(--text);
    }

    .popup-message {
      font-size: 13.5px;
      text-align: center;
      color: var(--muted);
      line-height: 1.55;
      margin-bottom: 20px;
    }

    .popup-action-btn {
      width: 100%;
      min-height: 46px;
      border: none;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s ease;
      background: var(--blue);
      color: #fff;
    }

    .popup-action-btn:active {
      background: var(--blue-d);
      transform: scale(0.98);
    }

    :focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

    /* RESPONSIVE */
    @media (min-width: 700px) {
      .hero-section {
        padding: calc(60px + env(safe-area-inset-top, 0px)) 40px 120px;
      }

      .hero-section h1 {
        font-size: 38px;
      }

      .login-card {
        padding: 40px 32px;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>

<body>

<!-- HERO SECTION -->
<div class="hero-section">
  <div class="hero-content">
    <img src="launchericon-512x512.png" alt="LoksewaQuest Logo" class="hero-logo" onerror="this.style.display='none'">
    <h1>Loksewa<span>Quest</span></h1>
    <p>लोकसेवा आयोग तयारीका लागि भरपर्दो डिजिटल चौतारी</p>
  </div>
</div>

<!-- LOGIN CONTAINER -->
<div class="main-wrapper">
  <div class="login-card">

    <!-- EMAIL FORM -->
    <form id="loginForm" novalidate>
      <div class="form-group">
        <label for="loginEmail">इमेल (Email)</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-envelope input-icon"></i>
          <input
            type="email"
            id="loginEmail"
            placeholder="name@example.com"
            autocomplete="email"
          >
        </div>
      </div>

      <div class="form-group">
        <label for="loginPassword">पासवर्ड (Password)</label>
        <div class="input-wrapper">
          <i class="fa-solid fa-lock input-icon"></i>
          <input
            type="password"
            id="loginPassword"
            placeholder="••••••••"
            autocomplete="current-password"
          >
          <button type="button" class="password-toggle" id="passwordToggle" aria-label="Show password">
            <i id="passwordIcon" class="fa-solid fa-eye"></i>
          </button>
        </div>
      </div>

      <div class="forgot-password-container">
        <a href="#" class="forgot-password-link" id="forgotPasswordLink">पासवर्ड बिर्सनुभयो? (Forgot Password)</a>
      </div>

      <button type="submit" class="submit-btn" id="loginButton">
        <span id="loginButtonText">Login</span>
      </button>
    </form>

    <!-- DIVIDER -->
    <div class="divider">अथवा</div>

    <!-- GOOGLE LOGIN -->
    <button type="button" class="google-btn" id="googleLoginBtn">
      <svg class="google-icon" viewBox="0 0 24 24" aria-hidden="true">
        <path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.66-5.17 3.66-9.17z"/>
        <path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.13 0-5.78-2.11-6.73-4.96H1.19v3.14C3.21 21.35 7.3 24 12 24z"/>
        <path fill="#FBBC05" d="M5.27 14.24c-.25-.72-.38-1.49-.38-2.24s.13-1.52.38-2.24V6.62H1.19C.43 8.15 0 9.89 0 11.7s.43 3.55 1.19 5.08l4.08-2.54z"/>
        <path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.3 0 3.21 2.65 1.19 6.62l4.08 3.14c.95-2.85 3.6-4.96 6.73-4.96z"/>
      </svg>
      <span id="googleButtonText">Google बाट लगइन गर्नुहोस्</span>
    </button>

    <!-- REGISTER LINK -->
    <div class="register-link">
      अकाउन्ट छैन? <a href="register.html">रजिस्टर गर्नुहोस्</a>
    </div>

  </div>
</div>

<!-- POPUP MODAL -->
<div class="popup-overlay" id="customPopup" role="dialog" aria-modal="true" aria-labelledby="popupTitle">
  <div class="popup-card">
    <div class="popup-icon-container" id="popupIcon">
      <i id="popupIconSymbol" class="fa-solid fa-circle-check"></i>
    </div>
    <h2 class="popup-title" id="popupTitle">त्रुटि</h2>
    <p class="popup-message" id="popupMessage">सन्देश यहाँ आउनेछ...</p>
    <button class="popup-action-btn" id="popupActionBtn" type="button">ठीक छ (OK)</button>
  </div>
</div>

<script>
  if (localStorage.getItem('theme') === 'dark') document.body.classList.add('dark');
</script>

<!-- FIREBASE -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
import {
  getAuth,
  setPersistence,
  browserLocalPersistence,
  onAuthStateChanged,
  getRedirectResult,
  signInWithPopup,
  signInWithRedirect,
  GoogleAuthProvider,
  signInWithEmailAndPassword,
  sendPasswordResetEmail
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

/* FIREBASE CONFIG */
const firebaseConfig = {
  apiKey: "AIzaSyCkKCU1re5b9MtdsAF1F4xI6rGxmxhGZak",
  authDomain: "loksewaquest-227b6.firebaseapp.com",
  projectId: "loksewaquest-227b6",
  storageBucket: "loksewaquest-227b6.firebasestorage.app",
  messagingSenderId: "779234903809",
  appId: "1:779234903809:web:dd0dd0ffb742e1c218bd00"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const googleProvider = new GoogleAuthProvider();

/* PERSISTENCE & SESSION CHECK */
setPersistence(auth, browserLocalPersistence)
  .then(() => {
    onAuthStateChanged(auth, (user) => {
      if (user) {
        window.location.href = "dashboard.html";
      }
    });
  })
  .catch((error) => {
    console.error("Persistence Error:", error);
  });

/* REDIRECT RESULT HANDLER */
document.addEventListener("DOMContentLoaded", async () => {
  try {
    const result = await getRedirectResult(auth);
    if (result && result.user) {
      window.location.href = "dashboard.html";
    }
  } catch (error) {
    console.error("Google Redirect Result Error:", error);
    handleGoogleError(error);
  }
});

/* DOM ELEMENTS */
const loginForm = document.getElementById("loginForm");
const emailInput = document.getElementById("loginEmail");
const passwordInput = document.getElementById("loginPassword");
const loginButton = document.getElementById("loginButton");
const passwordToggle = document.getElementById("passwordToggle");
const passwordIcon = document.getElementById("passwordIcon");
const googleLoginBtn = document.getElementById("googleLoginBtn");
const forgotPasswordLink = document.getElementById("forgotPasswordLink");

const popup = document.getElementById("customPopup");
const popupTitle = document.getElementById("popupTitle");
const popupMessage = document.getElementById("popupMessage");
const popupIcon = document.getElementById("popupIcon");
const popupIconSymbol = document.getElementById("popupIconSymbol");
const popupActionBtn = document.getElementById("popupActionBtn");

let popupCallback = null;

/* POPUP FUNCTIONS */
function showPopup(title, message, type = "error", callback = null) {
  popupTitle.textContent = title;
  popupMessage.textContent = message;
  popupCallback = callback;

  popupIcon.className = "popup-icon-container " + type;
  if (type === "success") {
    popupIconSymbol.className = "fa-solid fa-circle-check";
  } else if (type === "warning") {
    popupIconSymbol.className = "fa-solid fa-circle-exclamation";
  } else {
    popupIconSymbol.className = "fa-solid fa-triangle-exclamation";
  }

  popup.classList.add("active");
}

function closePopup() {
  popup.classList.remove("active");
  if (typeof popupCallback === "function") {
    const callback = popupCallback;
    popupCallback = null;
    callback();
  }
}

popupActionBtn.addEventListener("click", closePopup);

popup.addEventListener("click", (event) => {
  if (event.target === popup) {
    closePopup();
  }
});

document.addEventListener("keydown", (event) => {
  if (event.key === "Escape" && popup.classList.contains("active")) {
    closePopup();
  }
});

/* PASSWORD TOGGLE */
passwordToggle.addEventListener("click", (e) => {
  e.preventDefault();
  const isPassword = passwordInput.type === "password";
  if (isPassword) {
    passwordInput.type = "text";
    passwordIcon.className = "fa-solid fa-eye-slash";
    passwordToggle.setAttribute("aria-label", "Hide password");
  } else {
    passwordInput.type = "password";
    passwordIcon.className = "fa-solid fa-eye";
    passwordToggle.setAttribute("aria-label", "Show password");
  }
});

/* LOADING STATE */
function setLoading(loading) {
  if (loading) {
    loginButton.disabled = true;
    loginButton.innerHTML = `
      <span class="loading-spinner"></span>
      <span>Login हुँदैछ...</span>
    `;
  } else {
    loginButton.disabled = false;
    loginButton.innerHTML = `<span id="loginButtonText">Login</span>`;
  }
}

/* GOOGLE ERROR HANDLER */
function handleGoogleError(error) {
  googleLoginBtn.disabled = false;
  googleLoginBtn.style.opacity = "1";

  if (error.code === 'auth/account-exists-with-different-credential') {
    const email = error.customData ? error.customData.email : "";
    showPopup(
      "अकाउन्ट पहिले नै अवस्थित छ!",
      `यो इमेल (${email}) बाट पहिले नै इमेल/पासवर्ड विधिबाट अकाउन्ट बनिसकेको छ। कृपया माथि इमेल र पासवर्ड राखेर लगइन गर्नुहोस्।`,
      "warning"
    );
  } else if (error.code === 'auth/popup-closed-by-user' || error.code === 'auth/cancelled-popup-request') {
    return;
  } else {
    console.error("Google Login Error:", error);
    showPopup("गुगल लगइन असफल", "Google बाट लगइन गर्दा समस्या आयो: " + error.message, "error");
  }
}

/* FORGOT PASSWORD */
forgotPasswordLink.addEventListener("click", async (event) => {
  event.preventDefault();
  const email = emailInput.value.trim();

  if (!email) {
    showPopup("इमेल आवश्यक छ", "कृपया पासवर्ड रिसेट गर्न माथिको इमेल बक्समा आफ्नो इमेल ठेगाना लेख्नुहोस् र फेरि 'पासवर्ड बिर्सनुभयो?' मा क्लिक गर्नुहोस्।", "warning");
    emailInput.focus();
    return;
  }

  if (!emailInput.checkValidity()) {
    showPopup("अमान्य इमेल", "कृपया सही इमेल ठेगाना राख्नुहोस्।", "error");
    emailInput.focus();
    return;
  }

  try {
    await sendPasswordResetEmail(auth, email);
    showPopup(
      "लिंक पठाइयो! ✉️",
      `तपाईंको इमेल (${email}) मा पासवर्ड रिसेट गर्ने लिङ्क पठाइएको छ। कृपया आफ्नो इमेल चेक गरेर नयाँ पासवर्ड सेट गर्नुहोस्।`,
      "success"
    );
  } catch (error) {
    console.error("Password Reset Error:", error);
    let message = "पासवर्ड रिसेट इमेल पठाउन सकिएन।";
    if (error.code === 'auth/user-not-found') {
      message = "यो इमेलसँग सम्बन्धित कुनै अकाउन्ट फेला परेन।";
    } else if (error.code === 'auth/invalid-email') {
      message = "अमान्य इमेल ठेगाना।";
    }
    showPopup("त्रुटि!", message, "error");
  }
});

/* EMAIL/PASSWORD LOGIN */
loginForm.addEventListener("submit", async (event) => {
  event.preventDefault();

  const email = emailInput.value.trim();
  const password = passwordInput.value;

  if (!email) {
    showPopup("इमेल आवश्यक छ", "कृपया आफ्नो इमेल ठेगाना राख्नुहोस्।", "warning");
    emailInput.focus();
    return;
  }

  if (!emailInput.checkValidity()) {
    showPopup("अमान्य इमेल", "कृपया सही इमेल ठेगाना राख्नुहोस्।", "error");
    emailInput.focus();
    return;
  }

  if (!password) {
    showPopup("पासवर्ड आवश्यक छ", "कृपया आफ्नो पासवर्ड राख्नुहोस्।", "warning");
    passwordInput.focus();
    return;
  }

  setLoading(true);

  try {
    await signInWithEmailAndPassword(auth, email, password);

    showPopup(
      "लगइन सफल! 🎉",
      "स्वागत छ। तपाईंलाई Dashboard मा लगिँदैछ...",
      "success",
      () => {
        window.location.href = "dashboard.html";
      }
    );

  } catch (error) {
    console.error("Firebase Login Error:", error);
    let message = "लगइन गर्न सकिएन। कृपया फेरि प्रयास गर्नुहोस्।";

    switch (error.code) {
      case "auth/invalid-credential":
      case "auth/wrong-password":
      case "auth/user-not-found":
        message = "तपाईंले राख्नुभएको इमेल वा पासवर्ड मिलेन।";
        break;
      case "auth/invalid-email":
        message = "अमान्य इमेल ठेगाना।";
        break;
      case "auth/too-many-requests":
        message = "धेरैपटक गलत प्रयास गरियो। कृपया केही समयपछि फेरि प्रयास गर्नुहोस्।";
        break;
      case "auth/network-request-failed":
        message = "इन्टरनेट connection मा समस्या भयो। कृपया आफ्नो Internet जाँच गर्नुहोस्।";
        break;
      case "auth/user-disabled":
        message = "यो account administrator द्वारा disable गरिएको छ।";
        break;
      default:
        message = "Login Error: " + error.code;
    }

    showPopup("लगइन असफल!", message, "error");
  } finally {
    setLoading(false);
  }
});

/* GOOGLE LOGIN */
googleLoginBtn.addEventListener("click", async () => {
  try {
    googleLoginBtn.disabled = true;
    googleLoginBtn.style.opacity = "0.7";

    await signInWithPopup(auth, googleProvider);
    window.location.href = "dashboard.html";
  } catch (error) {
    if (error.code === 'auth/popup-blocked') {
      try {
        await signInWithRedirect(auth, googleProvider);
        return;
      } catch (redirectError) {
        handleGoogleError(redirectError);
        return;
      }
    }
    handleGoogleError(error);
  }
});

/* ENTER KEY SUBMISSION */
passwordInput.addEventListener("keydown", (event) => {
  if (event.key === "Enter") {
    loginForm.requestSubmit();
  }
});

console.log("LoksewaQuest Login initialized successfully.");
</script>
