<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LoksewaQuest - Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    
    /* स्क्रिनसटमा जस्तै निलो र आकर्षक थिम */
    body {
      background: linear-gradient(135deg, #1e3a8a 0%, #1d4ed8 50%, #3b82f6 100%);
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-card {
      background: #ffffff;
      width: 100%;
      max-width: 420px;
      padding: 35px;
      border-radius: 28px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
      border: 1px solid #e2e8f0;
    }

    /* ब्यानर (लोगो, नाम र विवरण) को डिजाइन */
    .app-banner {
      text-align: center;
      margin-bottom: 24px;
    }
    .app-logo {
      width: 75px;
      height: 75px;
      border-radius: 20px;
      object-fit: cover;
      margin-bottom: 12px;
      box-shadow: 0 8px 16px rgba(37, 99, 235, 0.2);
    }
    .app-banner h1 {
      font-size: 24px;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 4px;
    }
    .app-banner p {
      font-size: 13px;
      color: #64748b;
      line-height: 1.4;
    }

    .form-group {
      margin-bottom: 18px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: #334155;
      margin-bottom: 8px;
    }
    .input-box {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-box i {
      position: absolute;
      left: 16px;
      color: #94a3b8;
      font-size: 16px;
    }
    .input-box input {
      width: 100%;
      padding: 14px 16px 14px 46px;
      border: 1px solid #cbd5e1;
      border-radius: 14px;
      font-size: 14px;
      outline: none;
      background: #f8fafc;
      color: #0f172a;
      transition: all 0.2s;
    }
    .input-box input::placeholder {
      color: #94a3b8;
    }
    .input-box input:focus {
      border-color: #2563eb;
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
    }

    .submit-btn {
      width: 100%;
      background: #2563eb;
      color: white;
      border: none;
      padding: 15px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 10px;
      box-shadow: 0 10px 20px rgba(37, 99, 235, 0.2);
    }
    .submit-btn:hover {
      background: #1d4ed8;
    }

    .register-redirect {
      text-align: center;
      margin-top: 24px;
      font-size: 13px;
      color: #64748b;
    }
    .register-redirect a {
      color: #2563eb;
      font-weight: 700;
      text-decoration: none;
    }
    .register-redirect a:hover {
      text-decoration: underline;
    }

    /* main.js ले कन्ट्रोल गर्ने पपअपको डिजाइन (CSS) */
    .custom-popup-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center;
      z-index: 99999; opacity: 0; visibility: hidden; transition: all 0.3s ease;
    }
    .custom-popup-overlay.active { opacity: 1; visibility: visible; }
    .custom-popup-box {
      background: #ffffff; width: 90%; max-width: 380px; border-radius: 24px;
      padding: 26px; text-align: center; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
      transform: scale(0.9); transition: transform 0.3s ease;
    }
    .custom-popup-overlay.active .custom-popup-box { transform: scale(1); }
    .popup-icon-container {
      width: 60px; height: 60px; border-radius: 50%; margin: 0 auto 16px auto;
      display: flex; align-items: center; justify-content: center; font-size: 24px;
    }
    .popup-icon-container.success { background: #dcfce7; color: #16a34a; }
    .popup-icon-container.error { background: #fee2e2; color: #dc2626; }
    .custom-popup-box h3 { font-size: 18px; font-weight: 700; color: #0f172a; margin-bottom: 8px; }
    .custom-popup-box p { font-size: 14px; color: #64748b; margin-bottom: 24px; line-height: 1.5; }
    .popup-btn {
      background: #2563eb; color: white; border: none; width: 100%;
      padding: 12px; border-radius: 14px; font-size: 15px; font-weight: 600; cursor: pointer;
      transition: background 0.2s;
    }
    .popup-btn:hover { background: #1d4ed8; }
  </style>
</head>
<body>

  <div class="login-card">
    <!-- एपको लोगो, नाम र विवरणसहितको ब्यानर -->
    <div class="app-banner">
      <img src="launchericon-512x512.png" alt="LoksewaQuest Logo" class="app-logo">
      <h1>LoksewaQuest</h1>
      <p>लोकसेवा आयोग तयारीका लागि भरपर्दो डिजिटल चौतारी</p>
    </div>

    <form id="loginForm" onsubmit="handleLogin(event)">
      <div class="form-group">
        <label>इमेल (Email)</label>
        <div class="input-box">
          <i class="fa-solid fa-envelope"></i>
          <input type="email" id="loginEmail" placeholder="name@example.com" required>
        </div>
      </div>

      <div class="form-group">
        <label>पासवर्ड (Password)</label>
        <div class="input-box">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="loginPassword" placeholder="••••••••" required>
        </div>
      </div>

      <button type="submit" class="submit-btn">Login</button>
    </form>

    <div class="register-redirect">
      अकाउन्ट छैन? <a href="register.html">रजिस्टर गर्नुहोस्</a>
    </div>
  </div>

  <!-- मुख्य साझा main.js फाइल लिङ्क -->
  <script src="main.js"></script>

  <!-- Firebase & Login Logic -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, setPersistence, browserSessionPersistence } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCkKCU1re5b9MtdsAF1F4xI6rGxmxhGZak",
      authDomain: "loksewaquest-227b6.firebaseapp.com",
      projectId: "loksewaquest-227b6",
      storageBucket: "loksewaquest-227b6.firebasestorage.app",
      messagingSenderId: "779234903809",
      appId: "1:779234903809:web:dd0dd0ffb742e1c218bd00"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // ब्राउजर वा ट्याब खुला रहुन्जेल मात्र सेसन कायम राख्ने (Session Storage)
    setPersistence(auth, browserSessionPersistence)
      .catch((error) => {
        console.error("Persistence Error: ", error);
      });

    window.handleLogin = async function(event) {
      event.preventDefault();
      
      const email = document.getElementById('loginEmail').value;
      const password = document.getElementById('loginPassword').value;

      try {
        await signInWithEmailAndPassword(auth, email, password);

        // main.js को showPopup मार्फत सफलता सन्देश देखाएर home.html मा लाने
        showPopup("सफल भयो!", "सफलतापूर्वक लगइन भयो!", "success", () => {
          window.location.href = "home.html";
        });

      } catch (error) {
        let errorMessage = "इमेल یا पासवर्ड मिलेन।";
        if (error.code === 'auth/invalid-credential' || error.code === 'auth/wrong-password' || error.code === 'auth/user-not-found') {
          errorMessage = "Invalid email or password";
        }
        showPopup("त्रुटि!", errorMessage, "error");
      }
    };
  </script>

</body>
</html>
