<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0,
        maximum-scale=1.0, user-scalable=no">

  <meta name="theme-color" content="#2563eb">

  <title>LoksewaQuest - Login</title>

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>

    /* =========================
       RESET
    ========================= */

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }


    /* =========================
       BODY
    ========================= */

    body {
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 20px;

      background:
        radial-gradient(
          circle at top left,
          rgba(96, 165, 250, 0.35),
          transparent 35%
        ),
        linear-gradient(
          135deg,
          #172554 0%,
          #1d4ed8 50%,
          #3b82f6 100%
        );

      color: #1e293b;
    }


    /* =========================
       LOGIN CARD
    ========================= */

    .login-card {
      width: 100%;
      max-width: 420px;

      background: #ffffff;

      padding: 35px;

      border-radius: 28px;

      border: 1px solid rgba(255,255,255,0.5);

      box-shadow:
        0 25px 50px rgba(0,0,0,0.20);

      animation: cardIn 0.5s ease;
    }


    @keyframes cardIn {
      from {
        opacity: 0;
        transform: translateY(20px) scale(0.98);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }


    /* =========================
       APP BANNER
    ========================= */

    .app-banner {
      text-align: center;
      margin-bottom: 28px;
    }

    .app-logo {
      width: 78px;
      height: 78px;

      border-radius: 20px;

      object-fit: cover;

      margin-bottom: 12px;

      box-shadow:
        0 10px 25px rgba(37,99,235,0.25);
    }

    .app-banner h1 {
      font-size: 25px;
      font-weight: 800;

      color: #0f172a;

      margin-bottom: 5px;
    }

    .app-banner p {
      font-size: 13px;

      color: #64748b;

      line-height: 1.5;
    }


    /* =========================
       FORM
    ========================= */

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;

      font-size: 13px;

      font-weight: 700;

      color: #334155;

      margin-bottom: 8px;
    }


    /* =========================
       INPUT
    ========================= */

    .input-box {
      position: relative;

      display: flex;
      align-items: center;
    }

    .input-icon {
      position: absolute;

      left: 16px;

      color: #94a3b8;

      font-size: 16px;

      pointer-events: none;
    }

    .input-box input {
      width: 100%;

      padding:
        14px
        48px
        14px
        46px;

      border: 1px solid #cbd5e1;

      border-radius: 14px;

      font-size: 14px;

      outline: none;

      background: #f8fafc;

      color: #0f172a;

      transition: 0.2s;
    }

    .input-box input::placeholder {
      color: #94a3b8;
    }

    .input-box input:focus {
      border-color: #2563eb;

      background: #ffffff;

      box-shadow:
        0 0 0 4px rgba(37,99,235,0.10);
    }


    /* =========================
       PASSWORD TOGGLE
    ========================= */

    .password-toggle {
      position: absolute;

      right: 15px;

      border: none;

      background: transparent;

      color: #94a3b8;

      cursor: pointer;

      font-size: 16px;

      padding: 5px;
    }

    .password-toggle:hover {
      color: #2563eb;
    }


    /* =========================
       LOGIN BUTTON
    ========================= */

    .submit-btn {
      width: 100%;

      background: #2563eb;

      color: white;

      border: none;

      padding: 15px;

      border-radius: 14px;

      font-size: 15px;

      font-weight: 700;

      cursor: pointer;

      margin-top: 8px;

      box-shadow:
        0 10px 20px rgba(37,99,235,0.20);

      transition: 0.2s;

      position: relative;
    }

    .submit-btn:hover {
      background: #1d4ed8;

      transform: translateY(-1px);
    }

    .submit-btn:active {
      transform: translateY(0);
    }

    .submit-btn:disabled {
      cursor: not-allowed;

      opacity: 0.75;

      transform: none;
    }


    /* =========================
       LOADING
    ========================= */

    .loading-content {
      display: flex;

      justify-content: center;

      align-items: center;

      gap: 9px;
    }

    .spinner {
      width: 18px;
      height: 18px;

      border: 2px solid rgba(255,255,255,0.4);

      border-top-color: #ffffff;

      border-radius: 50%;

      animation: spin 0.7s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }


    /* =========================
       REGISTER
    ========================= */

    .register-redirect {
      text-align: center;

      margin-top: 24px;

      font-size: 13px;

      color: #64748b;
    }

    .register-redirect a {
      color: #2563eb;

      font-weight: 700;

      text-decoration: none;
    }

    .register-redirect a:hover {
      text-decoration: underline;
    }


    /* =========================
       POPUP OVERLAY
    ========================= */

    .custom-popup-overlay {
      position: fixed;

      inset: 0;

      width: 100%;
      height: 100%;

      background: rgba(15,23,42,0.65);

      backdrop-filter: blur(5px);

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 20px;

      z-index: 99999;

      opacity: 0;

      visibility: hidden;

      transition:
        opacity 0.25s ease,
        visibility 0.25s ease;
    }

    .custom-popup-overlay.active {
      opacity: 1;

      visibility: visible;
    }


    /* =========================
       POPUP BOX
    ========================= */

    .custom-popup-box {
      width: 100%;

      max-width: 380px;

      background: #ffffff;

      border-radius: 24px;

      padding: 28px;

      text-align: center;

      box-shadow:
        0 25px 60px rgba(0,0,0,0.25);

      transform: scale(0.88);

      transition: transform 0.25s ease;
    }

    .custom-popup-overlay.active
    .custom-popup-box {
      transform: scale(1);
    }


    /* =========================
       POPUP ICON
    ========================= */

    .popup-icon-container {
      width: 64px;
      height: 64px;

      border-radius: 50%;

      margin:
        0 auto
        17px;

      display: flex;

      align-items: center;

      justify-content: center;

      font-size: 25px;
    }

    .popup-icon-container.success {
      background: #dcfce7;

      color: #16a34a;
    }

    .popup-icon-container.error {
      background: #fee2e2;

      color: #dc2626;
    }

    .popup-icon-container.warning {
      background: #fef3c7;

      color: #d97706;
    }


    /* =========================
       POPUP TEXT
    ========================= */

    .custom-popup-box h3 {
      font-size: 19px;

      font-weight: 800;

      color: #0f172a;

      margin-bottom: 8px;
    }

    .custom-popup-box p {
      font-size: 14px;

      color: #64748b;

      margin-bottom: 22px;

      line-height: 1.6;
    }


    /* =========================
       POPUP BUTTON
    ========================= */

    .popup-btn {
      width: 100%;

      background: #2563eb;

      color: white;

      border: none;

      padding: 13px;

      border-radius: 14px;

      font-size: 15px;

      font-weight: 700;

      cursor: pointer;

      transition: 0.2s;
    }

    .popup-btn:hover {
      background: #1d4ed8;
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 480px) {

      body {
        padding: 15px;
      }

      .login-card {
        padding: 28px 22px;

        border-radius: 24px;
      }

      .app-logo {
        width: 70px;
        height: 70px;
      }

      .app-banner h1 {
        font-size: 23px;
      }

      .custom-popup-box {
        padding: 25px 20px;
      }
    }

  </style>
</head>


<body>


  <!-- =========================
       LOGIN CARD
  ========================= -->

  <div class="login-card">

    <div class="app-banner">

      <img
        src="launchericon-512x512.png"
        alt="LoksewaQuest Logo"
        class="app-logo"
        onerror="this.style.display='none'"
      >

      <h1>LoksewaQuest</h1>

      <p>
        लोकसेवा आयोग तयारीका लागि
        भरपर्दो डिजिटल चौतारी
      </p>

    </div>


    <!-- LOGIN FORM -->

    <form id="loginForm" novalidate>


      <!-- EMAIL -->

      <div class="form-group">

        <label for="loginEmail">
          इमेल (Email)
        </label>

        <div class="input-box">

          <i class="fa-solid fa-envelope input-icon"></i>

          <input
            type="email"
            id="loginEmail"
            placeholder="name@example.com"
            autocomplete="email"
          >

        </div>

      </div>


      <!-- PASSWORD -->

      <div class="form-group">

        <label for="loginPassword">
          पासवर्ड (Password)
        </label>

        <div class="input-box">

          <i class="fa-solid fa-lock input-icon"></i>

          <input
            type="password"
            id="loginPassword"
            placeholder="••••••••"
            autocomplete="current-password"
          >

          <button
            type="button"
            id="passwordToggle"
            class="password-toggle"
            aria-label="Show password"
          >
            <i
              id="passwordIcon"
              class="fa-solid fa-eye"
            ></i>
          </button>

        </div>

      </div>


      <!-- LOGIN BUTTON -->

      <button
        type="submit"
        id="loginButton"
        class="submit-btn"
      >
        <span id="loginButtonText">
          Login
        </span>
      </button>

    </form>


    <!-- REGISTER -->

    <div class="register-redirect">

      अकाउन्ट छैन?

      <a href="register.html">
        रजिस्टर गर्नुहोस्
      </a>

    </div>

  </div>



  <!-- =========================
       POPUP
  ========================= -->

  <div
    id="customPopup"
    class="custom-popup-overlay"
    role="dialog"
    aria-modal="true"
    aria-labelledby="popupTitle"
  >

    <div class="custom-popup-box">

      <div
        id="popupIcon"
        class="popup-icon-container error"
      >

        <i
          id="popupIconSymbol"
          class="fa-solid fa-triangle-exclamation"
        ></i>

      </div>


      <h3 id="popupTitle">
        त्रुटि
      </h3>


      <p id="popupMessage">
        सन्देश यहाँ आउनेछ...
      </p>


      <button
        id="popupActionBtn"
        class="popup-btn"
        type="button"
      >
        ठीक छ (OK)
      </button>

    </div>

  </div>



  <!-- =========================
       FIREBASE
  ========================= -->

  <script type="module">

    import {
      initializeApp
    }
    from
    "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";


    import {
      getAuth,
      signInWithEmailAndPassword,
      setPersistence,
      browserSessionPersistence
    }
    from
    "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";



    /* =========================
       FIREBASE CONFIG
    ========================= */

    const firebaseConfig = {

      apiKey:
        "AIzaSyCkKCU1re5b9MtdsAF1F4xI6rGxmxhGZak",

      authDomain:
        "loksewaquest-227b6.firebaseapp.com",

      projectId:
        "loksewaquest-227b6",

      storageBucket:
        "loksewaquest-227b6.firebasestorage.app",

      messagingSenderId:
        "779234903809",

      appId:
        "1:779234903809:web:dd0dd0ffb742e1c218bd00"
    };



    /* =========================
       INITIALIZE
    ========================= */

    const app =
      initializeApp(firebaseConfig);

    const auth =
      getAuth(app);



    /* =========================
       SESSION
    ========================= */

    try {

      await setPersistence(
        auth,
        browserSessionPersistence
      );

    } catch (error) {

      console.error(
        "Persistence Error:",
        error
      );

    }



    /* =========================
       ELEMENTS
    ========================= */

    const loginForm =
      document.getElementById("loginForm");

    const emailInput =
      document.getElementById("loginEmail");

    const passwordInput =
      document.getElementById("loginPassword");

    const loginButton =
      document.getElementById("loginButton");

    const loginButtonText =
      document.getElementById("loginButtonText");

    const passwordToggle =
      document.getElementById("passwordToggle");

    const passwordIcon =
      document.getElementById("passwordIcon");



    /* =========================
       POPUP ELEMENTS
    ========================= */

    const popup =
      document.getElementById("customPopup");

    const popupTitle =
      document.getElementById("popupTitle");

    const popupMessage =
      document.getElementById("popupMessage");

    const popupIcon =
      document.getElementById("popupIcon");

    const popupIconSymbol =
      document.getElementById("popupIconSymbol");

    const popupActionBtn =
      document.getElementById("popupActionBtn");



    let popupCallback = null;



    /* =========================
       SHOW POPUP
    ========================= */

    function showPopup(
      title,
      message,
      type = "error",
      callback = null
    ) {

      popupTitle.textContent =
        title;

      popupMessage.textContent =
        message;

      popupCallback =
        callback;


      popupIcon.className =
        "popup-icon-container " + type;


      if (type === "success") {

        popupIconSymbol.className =
          "fa-solid fa-circle-check";

      }

      else if (type === "warning") {

        popupIconSymbol.className =
          "fa-solid fa-circle-exclamation";

      }

      else {

        popupIconSymbol.className =
          "fa-solid fa-triangle-exclamation";
      }


      popup.classList.add("active");

    }



    /* =========================
       CLOSE POPUP
    ========================= */

    function closePopup() {

      popup.classList.remove("active");


      if (
        typeof popupCallback === "function"
      ) {

        const callback =
          popupCallback;

        popupCallback = null;

        callback();

      }

    }


    popupActionBtn
      .addEventListener(
        "click",
        closePopup
      );



    /* =========================
       CLOSE WHEN CLICK OUTSIDE
    ========================= */

    popup.addEventListener(
      "click",
      function(event) {

        if (
          event.target === popup
        ) {

          closePopup();

        }

      }
    );



    /* =========================
       ESC KEY
    ========================= */

    document.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Escape" &&
          popup.classList.contains("active")
        ) {

          closePopup();

        }

      }
    );



    /* =========================
       SHOW / HIDE PASSWORD
    ========================= */

    passwordToggle.addEventListener(
      "click",
      function() {

        const isPassword =
          passwordInput.type === "password";


        if (isPassword) {

          passwordInput.type =
            "text";

          passwordIcon.className =
            "fa-solid fa-eye-slash";

          passwordToggle
            .setAttribute(
              "aria-label",
              "Hide password"
            );

        }

        else {

          passwordInput.type =
            "password";

          passwordIcon.className =
            "fa-solid fa-eye";

          passwordToggle
            .setAttribute(
              "aria-label",
              "Show password"
            );

        }

      }
    );



    /* =========================
       LOADING STATE
    ========================= */

    function setLoading(
      loading
    ) {

      if (loading) {

        loginButton.disabled =
          true;

        loginButton.innerHTML = `
          <span class="loading-content">
            <span class="spinner"></span>
            Login हुँदैछ...
          </span>
        `;

      }

      else {

        loginButton.disabled =
          false;

        loginButton.innerHTML = `
          <span id="loginButtonText">
            Login
          </span>
        `;

      }

    }



    /* =========================
       LOGIN
    ========================= */

    loginForm.addEventListener(
      "submit",
      async function(event) {

        event.preventDefault();


        const email =
          emailInput.value.trim();

        const password =
          passwordInput.value;


        /* EMPTY EMAIL */

        if (!email) {

          showPopup(
            "इमेल आवश्यक छ",
            "कृपया आफ्नो इमेल ठेगाना राख्नुहोस्।",
            "warning"
          );

          emailInput.focus();

          return;
        }


        /* EMAIL FORMAT */

        if (
          !emailInput.checkValidity()
        ) {

          showPopup(
            "अमान्य इमेल",
            "कृपया सही इमेल ठेगाना राख्नुहोस्।",
            "error"
          );

          emailInput.focus();

          return;
        }


        /* EMPTY PASSWORD */

        if (!password) {

          showPopup(
            "पासवर्ड आवश्यक छ",
            "कृपया आफ्नो पासवर्ड राख्नुहोस्।",
            "warning"
          );

          passwordInput.focus();

          return;
        }


        /* LOGIN START */

        setLoading(true);


        try {

          await signInWithEmailAndPassword(
            auth,
            email,
            password
          );


          /* SUCCESS */

          showPopup(
            "लगइन सफल! 🎉",
            "स्वागत छ। तपाईंलाई Dashboard मा लगिँदैछ...",
            "success",
            function() {

              window.location.href =
                "dashboard.html";

            }
          );


        }

        catch (error) {

          console.error(
            "Firebase Login Error:",
            error
          );


          let message =
            "लगइन गर्न सकिएन। कृपया फेरि प्रयास गर्नुहोस्।";


          switch (error.code) {


            case "auth/invalid-credential":

            case "auth/wrong-password":

            case "auth/user-not-found":

              message =
                "तपाईंले राख्नुभएको इमेल वा पासवर्ड मिलेन।";

              break;


            case "auth/invalid-email":

              message =
                "अमान्य इमेल ठेगाना।";

              break;


            case "auth/too-many-requests":

              message =
                "धेरैपटक गलत प्रयास गरियो। कृपया केही समयपछि फेरि प्रयास गर्नुहोस्।";

              break;


            case "auth/network-request-failed":

              message =
                "इन्टरनेट connection मा समस्या भयो। कृपया आफ्नो Internet जाँच गर्नुहोस्।";

              break;


            case "auth/user-disabled":

              message =
                "यो account administrator द्वारा disable गरिएको छ।";

              break;


            case "auth/operation-not-allowed":

              message =
                "Email/Password Login Firebase मा enable गरिएको छैन।";

              break;


            default:

              message =
                "Login Error: " +
                error.code;

          }


          showPopup(
            "लगइन असफल!",
            message,
            "error"
          );

        }


        finally {

          setLoading(false);

        }

      }
    );



    /* =========================
       ENTER KEY SUPPORT
    ========================= */

    passwordInput.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "Enter"
        ) {

          loginForm.requestSubmit();

        }

      }
    );



    /* =========================
       DEBUG
    ========================= */

    console.log(
      "LoksewaQuest Login initialized successfully."
    );

  </script>

</body>
</html>
