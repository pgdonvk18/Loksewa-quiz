<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LoksewaQuest - Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    body {
      background: linear-gradient(135deg, #0f2a4a 0%, #1e40af 100%);
      color: #1e293b;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 40px 24px;
      overflow: hidden;
    }

    .login-header {
      text-align: center;
      margin-top: 40px;
    }
    .app-logo {
      width: 72px;
      height: 72px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 20px auto;
      color: #fbbf24;
      font-size: 32px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    }
    .login-header h1 {
      font-size: 26px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
    }
    .login-header h1 span {
      color: #fbbf24;
    }
    .login-header p {
      font-size: 14px;
      color: #cbd5e1;
      font-weight: 500;
    }

    .login-card-container {
      background: #ffffff;
      border-radius: 28px;
      padding: 30px 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      width: 100%;
      max-width: 400px;
      margin: 0 auto;
    }

    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      color: #475569;
      margin-bottom: 6px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .input-box {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-box i {
      position: absolute;
      left: 16px;
      color: #94a3b8;
      font-size: 16px;
    }
    .input-box input {
      width: 100%;
      padding: 14px 14px 14px 46px;
      border: 1.5px solid #e2e8f0;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 600;
      color: #0f172a;
      outline: none;
      background: #f8fafc;
      transition: all 0.2s;
    }
    .input-box input:focus {
      border-color: #2563eb;
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
    }

    .btn-login {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      border: none;
      width: 100%;
      padding: 15px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 15px rgba(37, 99, 235, 0.3);
      margin-top: 10px;
      transition: transform 0.2s;
    }
    .btn-login:active {
      transform: scale(0.98);
    }

    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 20px 0;
      color: #94a3b8;
      font-size: 12px;
      font-weight: 600;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid #e2e8f0;
    }
    .divider::before { margin-right: 10px; }
    .divider::after { margin-left: 10px; }

    .btn-google {
      background: #ffffff;
      color: #1e293b;
      border: 1.5px solid #e2e8f0;
      width: 100%;
      padding: 14px;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.03);
      transition: background 0.2s;
    }
    .btn-google:hover {
      background: #f8fafc;
    }
    .btn-google img {
      width: 20px;
      height: 20px;
    }

    .signup-link {
      text-align: center;
      margin-top: 25px;
      font-size: 13px;
      color: #cbd5e1;
      font-weight: 500;
    }
    .signup-link a {
      color: #fbbf24;
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <div class="login-header">
    <div class="app-logo">
      <i class="fa-solid fa-graduation-cap"></i>
    </div>
    <h1>Welcome Back to <span>LoksewaQuest</span></h1>
    <p>Login to continue your preparation</p>
  </div>

  <div class="login-card-container">
    
    <!-- सहि इमेल र पासवर्ड मिले मात्र लगइन हुने फर्म -->
    <form id="loginForm">
      <div class="form-group">
        <label>Email Address</label>
        <div class="input-box">
          <i class="fa-regular fa-envelope"></i>
          <input type="email" id="loginEmail" placeholder="name@example.com" required>
        </div>
      </div>

      <div class="form-group" style="margin-bottom: 20px;">
        <label>Password</label>
        <div class="input-box">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="loginPassword" placeholder="••••••••" required>
        </div>
      </div>

      <button type="submit" class="btn-login">Login</button>
    </form>

    <div class="divider">OR</div>

    <button type="button" id="googleLoginBtn" class="btn-google">
      <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google logo">
      Continue with Google
    </button>

  </div>

  <div class="signup-link">
    Don't have an account? <a href="register.html">Sign Up</a>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCkKCU1re5b9MtdsAF1F4xI6rGxmxhGZak",
      authDomain: "loksewaquest-227b6.firebaseapp.com",
      projectId: "loksewaquest-227b6",
      storageBucket: "loksewaquest-227b6.firebasestorage.app",
      messagingSenderId: "779234903809",
      appId: "1:779234903809:web:dd0dd0ffb742e1c218bd00"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // १. इमेल र पासवर्ड भेरिफाइड भएर मात्र ड्यासबोर्डमा जाने कोड
    const loginForm = document.getElementById('loginForm');
    if (loginForm) {
      loginForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('loginEmail').value;
        const password = document.getElementById('loginPassword').value;

        try {
          // Firebase मार्फत डाटाबेस चेक गर्ने (मिलेमा मात्र अगाडि बढ्छ)
          await signInWithEmailAndPassword(auth, email, password);
          window.location.href = "dashboard.html";
        } catch (error) {
          alert("लगइन असफल भयो: इमेल वा पासवर्ड मिलेन!");
        }
      });
    }

    // २. गुगल लगइन
    const googleLoginBtn = document.getElementById('googleLoginBtn');
    if (googleLoginBtn) {
      googleLoginBtn.addEventListener('click', async () => {
        const provider = new GoogleAuthProvider();
        try {
          await signInWithPopup(auth, provider);
          window.location.href = "dashboard.html";
        } catch (error) {
          alert("गुगल लगइनमा समस्या आयो: " + error.message);
        }
      });
    }
  </script>

</body>
</html>
