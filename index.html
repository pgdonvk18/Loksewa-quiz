  <style>
    /* सुरुमा पेज लुकाउने ताकि युजर लगइन भएको बेला वेलकम पेज झ्याप्प नदेखियोस् */
    body {
      display: none; 
      background: linear-gradient(180deg, rgba(15, 32, 39, 0.85) 0%, rgba(32, 58, 67, 0.9) 50%, rgba(44, 83, 100, 0.95) 100%), 
                  url('https://images.unsplash.com/photo-1544735716-392fe2489ffa?q=80&w=1000&auto=format&fit=crop') no-repeat center center/cover;
      color: #ffffff;
      height: 100vh;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 50px 20px;
      text-align: center;
      overflow: hidden;
      margin: 0;
      font-family: 'Poppins', sans-serif;
      box-sizing: border-box;
    }
    * {
      box-sizing: border-box;
    }
    .content-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-top: 30px;
    }
    .flag-icon {
      font-size: 60px;
      margin-bottom: 15px;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.3));
    }
    h1 {
      font-size: 34px;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 8px;
      letter-spacing: 0.5px;
    }
    h1 span {
      color: #fbbf24;
    }
    p {
      font-size: 14px;
      color: #e2e8f0;
      max-width: 280px;
      line-height: 1.5;
      font-weight: 300;
    }
    .footer-section {
      width: 100%;
      max-width: 380px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-bottom: 20px;
    }
    .features-text {
      font-size: 11px;
      letter-spacing: 1.5px;
      color: #cbd5e1;
      text-transform: uppercase;
      margin-bottom: -5px;
    }
    .btn-get-started {
      background-color: #fbbf24;
      color: #0f172a;
      font-size: 16px;
      font-weight: 600;
      padding: 16px;
      border-radius: 30px;
      border: none;
      width: 100%;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(251, 191, 36, 0.4);
      text-decoration: none;
      display: block;
      transition: transform 0.2s;
    }
    .btn-get-started:active {
      transform: scale(0.98);
    }
    .login-text {
      font-size: 14px;
      color: #cbd5e1;
    }
    .login-text a {
      color: #fbbf24;
      text-decoration: none;
      font-weight: 600;
    }
  </style>

  <!-- Firebase Auth & Session Check Script -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getAuth, setPersistence, browserLocalPersistence, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCkKCU1re5b9MtdsAF1F4xI6rGxmxhGZak",
      authDomain: "loksewaquest-227b6.firebaseapp.com",
      projectId: "loksewaquest-227b6",
      storageBucket: "loksewaquest-227b6.firebasestorage.app",
      messagingSenderId: "779234903809",
      appId: "1:779234903809:web:dd0dd0ffb742e1c218bd00"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    setPersistence(auth, browserLocalPersistence)
      .then(() => {
        onAuthStateChanged(auth, (user) => {
          if (user) {
            // युजर पहिले नै लगइन छ भने सिधै ड्यासबोर्डमा पठाउने
            window.location.replace("dashboard.html");
          } else {
            // युजर लगइन छैन भने मात्र यो वेलकम पेज देखाउने
            document.body.style.display = "flex";
          }
        });
      })
      .catch((error) => {
        console.error("Persistence Error:", error);
        document.body.style.display = "flex"; // एरर आए पनि पेज देखियोस्
      });
  </script>
</head>
<body>

  <div class="content-container">

    <a href="register.html" class="btn-get-started">Get Started →</a>
    
    <div class="login-text">
      Already have an account? <a href="login.html">Login</a>
    </div>
  </div>

</body>
