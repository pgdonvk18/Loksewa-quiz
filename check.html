<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LokSewaQuest - Upload Source</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f4f7f6; padding: 40px; }
    .card { max-width: 500px; margin: 0 auto; background: #fff; padding: 24px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-weight: bold; margin-bottom: 8px; }
    input[type="file"] { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
    button { background: #2563eb; color: white; padding: 10px 16px; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; }
    button:disabled { background: #93c5fd; }
    #statusMsg { margin-top: 16px; font-weight: bold; color: #333; }
  </style>
  <!-- Supabase CDN Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

  <div class="card">
    <h2>LokSewaQuest Source Upload</h2>
    <div class="form-group">
      <label for="fileInput">Select Loksewa Material (PDF / Text)</label>
      <input type="file" id="fileInput" accept=".pdf,.txt">
    </div>
    <button id="uploadBtn">Upload & Process Document</button>
    <p id="statusMsg"></p>
  </div>

  <script src="app.js"></script>
</body>
</html>
