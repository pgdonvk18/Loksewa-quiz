<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LokSewaQuest - Upload & Extract</title>
  
  <style>
    body { font-family: Arial, sans-serif; background: #f4f7f6; padding: 20px; margin: 0; }
    .card { max-width: 600px; margin: 20px auto; background: #fff; padding: 24px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    .form-group { margin-bottom: 16px; }
    label { display: block; font-weight: bold; margin-bottom: 8px; }
    input[type="file"] { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    button { background: #2563eb; color: white; padding: 10px 16px; border: none; border-radius: 4px; cursor: pointer; width: 100%; font-size: 16px; margin-top: 8px; }
    button:disabled { background: #93c5fd; }
    #statusMsg { margin-top: 16px; font-weight: bold; color: #1e40af; }
    .preview-box { margin-top: 16px; max-height: 200px; overflow-y: auto; background: #f8fafc; padding: 12px; border: 1px solid #e2e8f0; border-radius: 4px; font-size: 13px; white-space: pre-wrap; }
  </style>

  <!-- CDNs must be in the correct order -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body>

  <div class="card">
    <h2>LokSewaQuest Source Parser</h2>
    
    <!-- Auth Bar -->
    <div style="background: #e0f2fe; padding: 10px; border-radius: 6px; margin-bottom: 16px; display: flex; justify-content: space-between; align-items: center;">
      <span id="userStatus" style="font-size: 14px; color: #0369a1;">Checking login status...</span>
      <button id="anonLoginBtn" style="width: auto; padding: 6px 12px; margin: 0; font-size: 13px; background: #0284c7;">Quick Guest Login</button>
    </div>

    <div class="form-group">
      <label for="fileInput">Select PDF / Text File</label>
      <input type="file" id="fileInput" accept=".pdf,.txt">
    </div>

    <button id="uploadBtn">Upload & Process Document</button>
    
    <p id="statusMsg"></p>
    
    <div id="previewContainer" style="display: none;">
      <h4>Extracted Text Sample (Chunk 1):</h4>
      <div id="textPreview" class="preview-box"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
