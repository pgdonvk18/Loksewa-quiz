<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#2563eb">
  <title>LoksewaQuest - Badge Store</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
    body { min-height: 100vh; background: #f8fafc; color: #1e293b; padding-bottom: 90px; }
    
    .header { background: linear-gradient(135deg, #172554 0%, #1d4ed8 100%); color: white; padding: 24px 20px 30px; border-bottom-left-radius: 32px; border-bottom-right-radius: 32px; box-shadow: 0 10px 25px rgba(29, 78, 216, 0.2); display: flex; align-items: center; justify-content: space-between; }
    .back-btn { background: rgba(255, 255, 255, 0.15); border: none; width: 40px; height: 40px; border-radius: 12px; color: white; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .header h1 { font-size: 20px; font-weight: 800; }
    .coin-display { background: rgba(255, 255, 255, 0.2); padding: 6px 14px; border-radius: 20px; font-weight: 700; font-size: 13px; display: flex; align-items: center; gap: 6px; }

    .container { max-width: 600px; margin: -15px auto 0; padding: 0 16px; }
    
    .section-title { font-size: 16px; font-weight: 800; color: #0f172a; margin: 20px 0 12px; display: flex; align-items: center; gap: 8px; }

    /* Store Grid Cards */
    .store-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
    .store-card { background: #ffffff; border-radius: 20px; padding: 18px 14px; text-align: center; border: 2px solid #e2e8f0; box-shadow: 0 8px 20px rgba(0,0,0,0.04); display: flex; flex-direction: column; align-items: center; position: relative; transition: 0.2s; }
    
    .badge-icon-box { width: 56px; height: 56px; border-radius: 50%; background: #fef3c7; display: flex; align-items: center; justify-content: center; font-size: 22px; color: #d97706; margin-bottom: 10px; border: 3px solid #fde68a; box-shadow: 0 4px 10px rgba(217,119,6,0.15); }
    .badge-name { font-size: 14px; font-weight: 700; color: #0f172a; margin-bottom: 4px; }
    .badge-desc { font-size: 11px; color: #64748b; margin-bottom: 12px; line-height: 1.3; }

    .badge-price { font-size: 13px; font-weight: 800; color: #d97706; margin-bottom: 12px; display: flex; align-items: center; gap: 4px; }

    .buy-btn { width: 100%; background: #2563eb; color: white; border: none; padding: 10px; border-radius: 12px; font-size: 13px; font-weight: 700; cursor: pointer; transition: 0.2s; box-shadow: 0 4px 12px rgba(37,99,235,0.2); }
    .buy-btn:active { transform: scale(0.97); }
    
    /* Already Owned Button Style */
    .buy-btn.owned { background: #10b981 !important; color: white; cursor: not-allowed; box-shadow: none; opacity: 0.9; }

    .loading-state { text-align: center; padding: 40px; color: #64748b; font-size: 14px; grid-column: span 2; }
  </style>
</head>

<body>

  <div class="header">
    <button class="back-btn" onclick="history.back()"><i class="fa-solid fa-arrow-left"></i></button>
    <h1>ब्याज स्टोर (Badge Store)</h1>
    <div class="coin-display" id="userCoinsDisplay"><i class="fa-solid fa-coins" style="color: #fde047;"></i> <span id="coinVal">0</span></div>
  </div>

  <div class="container">
    <div class="section-title"><i class="fa-solid fa-store" style="color: #2563eb;">}</i> उपलब्ध विशेष ब्याजेजहरू</div>
    
    <div class="store-grid" id="storeGrid">
      <div class="loading-state"><div class="spinner"></div>स्टोर लोड हुँदैछ...</div>
    </div>
  </div>

  <!-- Firebase SDKs -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
    import { getFirestore, doc, getDoc, updateDoc, arrayUnion } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCkKCU1re5b9MtdsAF1F4xI6rGxmxhGZak",
      authDomain: "loksewaquest-227b6.firebaseapp.com",
      projectId: "loksewaquest-227b6",
      storageBucket: "loksewaquest-227b6.firebasestorage.app",
      messagingSenderId: "779234903809",
      appId: "1:779234903809:web:dd0dd0ffb742e1c218bd00"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);
    const db = getFirestore(app);

    // बिक्रीमा उपलब्ध ब्याजेजहरूको सूची
    const availableBadges = [
      { id: "badge_aspirant", name: "Aspirant Pro", desc: "सुरुवाती लोकसेवा तयारीकर्ताको विशेष पहिचान।", price: 100, icon: "fa-award" },
      { id: "badge_pro", name: "Loksewa Expert", desc: "नियमित अभ्यास गर्ने दक्ष विधार्थीको प्रतीक।", price: 250, icon: "fa-medal" },
      { id: "badge_master", name: "Quest Master", desc: "सबैभन्दा उत्कृष्ट र उच्च स्तरको प्रतिष्ठित ब्याज।", price: 500, icon: "fa-crown" },
      { id: "badge_legend", name: "Loksewa Legend", desc: "पढाइ र लिडरबोर्डमा तहल्का मच्चाउने लिजेन्ड।", price: 1000, icon: "fa-star" }
    ];

    let currentUser = null;
    let userDataCache = null;

    onAuthStateChanged(auth, async (user) => {
      if (user) {
        currentUser = user;
        await fetchUserDataAndRenderStore(user.uid);
      } else {
        document.getElementById("storeGrid").innerHTML = `<div class="loading-state">लगइन गर्नुहोला।</div>`;
      }
    });

    async function fetchUserDataAndRenderStore(uid) {
      try {
        const userDocRef = doc(db, "users", uid);
        const userSnap = await getDoc(userDocRef);

        if (userSnap.exists()) {
          userDataCache = userSnap.data();
          let coins = Number(userDataCache.coins || 0);
          document.getElementById("coinVal").innerText = coins;
          
          renderStoreItems(userDataCache);
        }
      } catch (e) {
        console.error("Error fetching user data:", e);
      }
    }

    function renderStoreItems(uData) {
      const storeGrid = document.getElementById("storeGrid");
      let html = "";

      // युusztसँग भएका (purchased) ब्याजेजहरूको सूची (Array)
      let purchasedList = uData.purchasedBadges || uData.inventory || [];

      availableBadges.forEach(badge => {
        let isAlreadyOwned = purchasedList.includes(badge.id);

        html += `
          <div class="store-card">
            <div class="badge-icon-box"><i class="fa-solid ${badge.icon}"></i></div>
            <div class="badge-name">${badge.name}</div>
            <div class="badge-desc">${badge.desc}</div>
            <div class="badge-price"><i class="fa-solid fa-coins"></i> ${badge.price}</div>
            
            ${isAlreadyOwned 
              ? `<button class="buy-btn owned" disabled><i class="fa-solid fa-check"></i> Already Owned</button>` 
              : `<button class="buy-btn" onclick="buyBadge('${badge.id}',${badge.price})">किनौं (Buy)</button>`
            }
          </div>
        `;
      });

      storeGrid.innerHTML = html;
    }

    // ब्याज खरिद गर्ने फंक्सन
    window.buyBadge = async function(badgeId, price) {
      if (!currentUser) {
        alert("कृपया लगइन गर्नुहोस्!");
        return;
      }

      let currentCoins = Number(userDataCache.coins || 0);
      if (currentCoins < price) {
        alert("तपाईंसँग पर्याप्त कोइन (Coins) छैन!");
        return;
      }

      if (!confirm("के तपाईँ यो ब्याज खरिद गर्न चाहनुहुन्छ?")) return;

      try {
        const userDocRef = doc(db, "users", currentUser.uid);
        let updatedCoins = currentCoins - price;

        // Firestore मा कोइन घटाउने र purchasedBadges मा badgeId थप्ने
        await updateDoc(userDocRef, {
          coins: updatedCoins,
          purchasedBadges: arrayUnion(badgeId),
          equippedBadge: badgeId // खरिद गर्दा स्वचालित रूपमा सुसज्जित (Equip) पनि हुने
        });

        alert("ब्याज सफलतापूर्वक खरिद गरियो!");
        
        // लोकल डाटा अपडेट गरेर स्टोर रि-रेन्डर गर्ने
        userDataCache.coins = updatedCoins;
        if (!userDataCache.purchasedBadges) userDataCache.purchasedBadges = [];
        userDataCache.purchasedBadges.push(badgeId);
        userDataCache.equippedBadge = badgeId;

        document.getElementById("coinVal").innerText = updatedCoins;
        renderStoreItems(userDataCache);

      } catch (err) {
        console.error("Purchase error:", err);
        alert("खरिद गर्ას समस्या आयो। फेरि प्रयास गर्नुहोला।");
      }
    };
  </script>
</body>
</html>
