<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>LoksewaQuest - Nepal Geography Quiz</title>

<script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #f5f7fb;
    }

    .option {
        transition: .2s;
    }

    .option:hover {
        transform: translateY(-1px);
    }

    .correct {
        border-color: #16a34a !important;
        background: #dcfce7 !important;
    }

    .wrong {
        border-color: #dc2626 !important;
        background: #fee2e2 !important;
    }

    .disabled {
        pointer-events: none;
    }

    .hide {
        display: none !important;
    }

    .loader {
        width: 45px;
        height: 45px;
        border: 5px solid #ddd;
        border-top-color: #2563eb;
        border-radius: 50%;
        animation: spin 1s linear infinite;
        margin: auto;
    }

    @keyframes spin {
        to {
            transform: rotate(360deg);
        }
    }
</style>

<body>

<!-- ================= HEADER ================= -->

<header class="bg-blue-700 text-white shadow">
    <div class="max-w-4xl mx-auto px-4 py-4 flex justify-between items-center">

        <div>
            <h1 class="text-xl font-bold">
                <i class="fa-solid fa-earth-asia mr-2"></i>
                Nepal Geography
            </h1>

            <p class="text-blue-100 text-sm">
                LoksewaQuest
            </p>
        </div>

        <div id="timerBox"
             class="bg-blue-800 px-4 py-2 rounded-xl font-bold hide">
            <i class="fa-regular fa-clock mr-1"></i>
            <span id="timer">00:00</span>
        </div>

    </div>
</header>


<!-- ================= MAIN ================= -->

<main class="max-w-4xl mx-auto px-4 py-6">

    <!-- LOGIN / START -->

    <section id="startScreen"
             class="bg-white rounded-2xl shadow p-6">

        <div class="text-center">

            <div class="text-blue-600 text-5xl mb-4">
                <i class="fa-solid fa-mountain-sun"></i>
            </div>

            <h2 class="text-2xl font-bold text-gray-800">
                Nepal Geography Quiz

    <!-- ================= LOADING ================= -->

        <div class="loader"></div>

        <p class="mt-5 text-gray-600">

            </div>


            <!-- Question -->

            <h2 id="questionText"
                class="text-lg md:text-xl font-bold text-gray-800 leading-relaxed">
            </h2>


            <!-- Options -->

            <div id="optionsContainer"
                 class="mt-6 space-y-3">
            </div>


            <!-- Explanation -->

            <div id="explanationBox"
                 class="mt-5 p-4 rounded-xl bg-blue-50 border border-blue-200 hide">

                <div class="font-bold text-blue-700 mb-1">
                    <i class="fa-solid fa-lightbulb mr-1"></i>
                    Explanation

                <div id="explanationText"
                     class="text-gray-700 text-sm leading-relaxed">

            <!-- Navigation -->

                    class="flex-1 bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl">

                    Next

                <button
                    id="finishBtn"

                    class="flex-1 bg-green-600 hover:bg-green-700 text-white font-bold py-3 rounded-xl hide">

                    <i class="fa-solid fa-flag-checkered mr-1"></i>

        </div>

    </section>


    <!-- ================= RESULT ================= -->

    <section id="resultScreen"
             class="bg-white rounded-2xl shadow p-6 hide">

        <div class="text-center">

            <div class="text-green-600 text-5xl mb-3">
                <i class="fa-solid fa-circle-check"></i>
            </div>

            <h2 class="text-2xl font-bold">
                Quiz Completed
            </h2>

            <p id="resultName"
               class="text-gray-500 mt-1">
            </p>

        </div>


        <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mt-6">

            <div class="bg-blue-50 rounded-xl p-4 text-center">
                <div class="text-gray-500 text-sm">
                    Solved
                </div>
                <div id="resultSolved"
                     class="text-2xl font-bold text-blue-600">
                    0
                </div>
            </div>

            <div class="bg-green-50 rounded-xl p-4 text-center">
                <div class="text-gray-500 text-sm">
                    Correct
                </div>
                <div id="resultCorrect"
                     class="text-2xl font-bold text-green-600">
                    0
                </div>
            </div>

            <div class="bg-red-50 rounded-xl p-4 text-center">
                <div class="text-gray-500 text-sm">
                    Wrong
                </div>
                <div id="resultWrong"
                     class="text-2xl font-bold text-red-600">
                    0
                </div>
            </div>

            <div class="bg-purple-50 rounded-xl p-4 text-center">
                <div class="text-gray-500 text-sm">
                    Accuracy
                </div>
                <div id="resultAccuracy"
                     class="text-2xl font-bold text-purple-600">
                    0%
                </div>
            </div>

        </div>


        <div class="bg-gray-50 rounded-xl p-4 mt-5 text-center">

            <span class="text-gray-500">
                Time Spent:
            </span>

            <strong id="resultTime">
                00:00
            </strong>

        </div>


        <div class="flex flex-col md:flex-row gap-3 mt-6">

            <button
                onclick="showReview()"
                class="flex-1 bg-gray-800 text-white py-3 rounded-xl font-bold">

                <i class="fa-solid fa-list-check mr-1"></i>
                Review Answers

            </button>

            <button
                id="retryMistakesBtn"
                onclick="startMistakeRetry()"
                class="flex-1 bg-orange-500 text-white py-3 rounded-xl font-bold hide">

                <i class="fa-solid fa-rotate-right mr-1"></i>
                Retry Mistakes

            <button
                onclick="location.reload()"
                class="flex-1 bg-blue-600 text-white py-3 rounded-xl font-bold">

                <i class="fa-solid fa-rotate mr-1"></i>
                New Quiz

            </button>

        </div>


        <div id="saveStatus"
             class="text-center text-sm mt-4">
        </div>

    </section>


    <!-- ================= REVIEW ================= -->

    <section id="reviewScreen"
             class="bg-white rounded-2xl shadow p-5 mt-5 hide">

        <div class="flex justify-between items-center mb-5">

            <h2 class="text-xl font-bold">
                Answer Review
            </h2>

            <button
                onclick="backToResult()"
                class="text-blue-600 font-semibold">

            </button>

        </div>

             class="space-y-5">
        </div>

    </section>

</main>

/* =====================================================

===================================================== */

async function startPractice() {

/* =====================================================
   LOAD QUESTION
===================================================== */

function loadQuestion() {

    const q =
        activeQuestions[currentIdx];


    if (!q) {
        return;
    }


    document.getElementById("questionNumber")
        .textContent =
        `Question ${currentIdx + 1}`;


    document.getElementById("progressText")
        .textContent =
        `${currentIdx + 1} / ${activeQuestions.length}`;


    const percentage =
        ((currentIdx + 1) /
        activeQuestions.length) * 100;


    document.getElementById("progressBar")
        .style.width =
        percentage + "%";


    document.getElementById("questionText")
        .textContent =
        q.question || q.Question || "Question unavailable";


    const optionsContainer =
        document.getElementById("optionsContainer");

    optionsContainer.innerHTML = "";


    document.getElementById("explanationBox")
        .classList.add("hide");


    document.getElementById("explanationText")
        .textContent = "";


    /*
      Support different possible
      Supabase option formats.
    */

    let options = getOptions(q);


    if (!options.length) {

        optionsContainer.innerHTML = `
            <div class="p-4 bg-red-50 text-red-600 rounded-xl">
                Options भेटिएनन्।
            </div>
        `;

        return;
    }


    options.forEach((option, index) => {

        const value =
            getOptionValue(option);

        const button =
            document.createElement("button");


        button.className =
            "option w-full text-left border-2 border-gray-200 rounded-xl p-4 bg-white hover:border-blue-400";


        button.innerHTML = `
            <span class="font-bold text-blue-600 mr-2">
                ${String.fromCharCode(65 + index)}.
            </span>
            ${escapeHTML(String(value))}
        `;


        button.onclick = () =>
            selectAnswer(value, button);


        optionsContainer.appendChild(button);

    });


    /* If already answered */

    if (
        userAnswers[currentIdx] !== undefined
    ) {

        const saved =
            userAnswers[currentIdx];

        const buttons =
            optionsContainer.querySelectorAll("button");

        buttons.forEach(btn => {

            const text =
                btn.textContent
                    .replace(/^[A-D]\.\s*/, "")
                    .trim();

            if (String(text) === String(saved)) {

                btn.classList.add("border-blue-600");

            }

        });

    }


    /* Navigation */

    if (
        currentIdx ===
        activeQuestions.length - 1
    ) {

        document.getElementById("nextBtn")
            .classList.add("hide");

        document.getElementById("finishBtn")
            .classList.remove("hide");

    } else {

        document.getElementById("nextBtn")
            .classList.remove("hide");

        document.getElementById("finishBtn")
            .classList.add("hide");

    }

}


/* =====================================================
   GET OPTIONS
===================================================== */

function getOptions(q) {

    /*
      Format 1:
      options = ["A", "B", "C", "D"]
    */

    if (Array.isArray(q.options)) {
        return q.options;
    }


    /*
      Format 2:
      options stored as JSON string
    */

    if (typeof q.options === "string") {

        try {

            const parsed =
                JSON.parse(q.options);

            if (Array.isArray(parsed)) {
                return parsed;
            }

            if (
                parsed &&
                typeof parsed === "object"
            ) {

                return Object.values(parsed);

            }

        } catch (e) {

            console.warn(
                "Could not parse options JSON",
                e
            );

        }

    }


    /*
      Format 3:
      option_a / option_b / option_c / option_d
    */

    const result = [];

    [
        "option_a",
        "option_b",
        "option_c",
        "option_d"
    ].forEach(key => {

        if (
            q[key] !== undefined &&
            q[key] !== null
        ) {

            result.push(q[key]);

        }

    });


    return result;

}


/* =====================================================
   OPTION VALUE
===================================================== */

function getOptionValue(option) {

    if (
        typeof option === "object" &&
        option !== null
    ) {

        return (
            option.text ??
            option.label ??
            option.value ??
            option.option ??
            ""
        );

    }

    return option;

}


/* =====================================================
   SELECT ANSWER
===================================================== */

function selectAnswer(selected, clickedButton) {

    const q =
        activeQuestions[currentIdx];


    const correctAnswer =
        getCorrectAnswer(q);


    userAnswers[currentIdx] =
        selected;


    const buttons =
        document
            .getElementById("optionsContainer")
            .querySelectorAll("button");


    buttons.forEach(btn =>
        btn.classList.add("disabled")
    );


    const selectedCorrect =
        normalize(selected) ===
        normalize(correctAnswer);


    if (selectedCorrect) {

        clickedButton.classList.add("correct");

    } else {

        clickedButton.classList.add("wrong");


        buttons.forEach(btn => {

            const visibleText =
                btn.textContent
                    .replace(/^[A-D]\.\s*/, "")
                    .trim();


            if (
                normalize(visibleText) ===
                normalize(correctAnswer)
            ) {

                btn.classList.add("correct");

            }

        });

    }


    /* Explanation */

    const explanation =
        q.explanation ||
        q.Explanation ||
        q.explain ||
        "No explanation available.";


    document.getElementById("explanationText")
        .textContent =
        explanation;


    document.getElementById("explanationBox")
        .classList.remove("hide");

}


/* =====================================================
   CORRECT ANSWER
===================================================== */

function getCorrectAnswer(q) {

    return (
        q.answer ??
        q.correct_answer ??
        q.correctAnswer ??
        q.correct_option ??
        q.correct ??
        ""
    );

}


/* =====================================================
   NORMALIZE
===================================================== */

function normalize(value) {

    if (value === null || value === undefined) {
        return "";
    }

    return String(value)
        .trim()
        .toLowerCase();

}


/* =====================================================
   NEXT
===================================================== */

function nextQuestion() {

    if (
        currentIdx <
        activeQuestions.length - 1
    ) {

        currentIdx++;

        loadQuestion();

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });

    }

}


/* =====================================================
   FINISH QUIZ
===================================================== */

async function finishQuiz() {

    stopTimer();


    let correct = 0;
    let wrong = 0;
    let solved = 0;


    wrongQuestionsList = [];


    activeQuestions.forEach((q, index) => {

        const userAnswer =
            userAnswers[index];


        if (
            userAnswer === undefined ||
            userAnswer === null ||
            userAnswer === ""
        ) {

            return;

        }


        solved++;


        const correctAnswer =
            getCorrectAnswer(q);


        if (
            normalize(userAnswer) ===
            normalize(correctAnswer)
        ) {

            correct++;

        } else {

            wrong++;

            wrongQuestionsList.push(q);

        }

    });


    const totalQuestions =
        activeQuestions.length;


    const accuracy =
        solved > 0
            ? ((correct / solved) * 100)
            : 0;


    const timeSeconds =
        getElapsedSeconds();


    /* Result */

    document.getElementById("quizScreen")
        .classList.add("hide");

    document.getElementById("timerBox")
        .classList.add("hide");

    document.getElementById("resultScreen")
        .classList.remove("hide");


    document.getElementById("resultName")
        .textContent =
        candidateName;


    document.getElementById("resultSolved")
        .textContent =
        solved;


    document.getElementById("resultCorrect")
        .textContent =
        correct;


    document.getElementById("resultWrong")
        .textContent =
        wrong;


    document.getElementById("resultAccuracy")
        .textContent =
        accuracy.toFixed(1) + "%";


    document.getElementById("resultTime")
        .textContent =
        formatTime(timeSeconds);


    /* Retry button */

    if (wrongQuestionsList.length > 0) {

        document.getElementById("retryMistakesBtn")
            .classList.remove("hide");

    } else {

        document.getElementById("retryMistakesBtn")
            .classList.add("hide");

    }


    /*
      IMPORTANT:
      Mistake retry is NOT counted
      in cumulative analytics.
    */

    if (
        !isMistakeRetry &&
        solved > 0
    ) {

        await saveQuizAttempt({

            totalQuestions,
            solved,
            correct,
            wrong,
            accuracy,
            timeSeconds

        });

    }

}


/* =====================================================
   SAVE QUIZ ATTEMPT
===================================================== */

async function saveQuizAttempt(stats) {

    const status =
        document.getElementById("saveStatus");


    status.textContent =
        "Saving your quiz statistics...";

    status.className =
        "text-center text-sm mt-4 text-blue-600";


    try {

        const { data, error } =
            await supabaseClient
                .from("quiz_attempts")
                .insert({

                    user_id:
                        currentUserId,

                    user_email:
                        userEmail,

                    username:
                        candidateName,

                    topic:
                        "Nepal Geography",

                    total_questions:
                        stats.totalQuestions,

                    solved:
                        stats.solved,

                    correct:
                        stats.correct,

                    wrong:
                        stats.wrong,

                    accuracy:
                        Number(stats.accuracy.toFixed(2)),

                    time_spent_seconds:
                        stats.timeSeconds,

                    is_retry:
                        false

                })
                .select();


        if (error) {

            throw error;

        }


        console.log(
            "Quiz attempt saved:",
            data
        );


        status.textContent =
            "✓ Quiz statistics saved successfully.";

        status.className =
            "text-center text-sm mt-4 text-green-600";


    } catch (error) {

        console.error(
            "SAVE ATTEMPT ERROR:",
            error
        );


        status.textContent =
            "Statistics save हुन सकेन: " +
            error.message;

        status.className =
            "text-center text-sm mt-4 text-red-600";

    }

}

   REVIEW
===================================================== */

    container.innerHTML = "";


    activeQuestions.forEach((q, index) => {

        const userAnswer =
            userAnswers[index];

        const correctAnswer =
            getCorrectAnswer(q);


        const isCorrect =
            userAnswer !== undefined &&
            normalize(userAnswer) ===
            normalize(correctAnswer);


        const card =
            document.createElement("div");


        card.className =
            "border rounded-xl p-4";


        card.innerHTML = `

            <div class="flex justify-between gap-3 mb-3">

                <h3 class="font-bold text-gray-800">
                    Q${index + 1}. ${escapeHTML(
                        q.question || ""
                    )}
                </h3>

                <span class="${
                    isCorrect
                        ? "text-green-600"
                        : "text-red-600"
                }">

                    ${
                        isCorrect
                            ? "✓"
                            : "✗"
                    }

                </span>

            </div>

            <div class="text-sm space-y-2">

                <div>
                    <strong>Your answer:</strong>
                    ${
                        userAnswer !== undefined
                            ? escapeHTML(String(userAnswer))
                            : "Not answered"
                    }
                </div>

                <div class="text-green-700">
                    <strong>Correct answer:</strong>
                    ${escapeHTML(String(correctAnswer))}
                </div>

                <div class="bg-blue-50 p-3 rounded-lg">
                    <strong>Explanation:</strong>
                    ${escapeHTML(
                        q.explanation ||
                        q.Explanation ||
                        q.explain ||
                        "No explanation available."
                    )}
                </div>

            </div>

        `;


        container.appendChild(card);

    });

}


function backToResult() {

    document.getElementById("reviewScreen")
        .classList.add("hide");

    document.getElementById("resultScreen")
        .classList.remove("hide");

}


/* =====================================================
   MISTAKE RETRY
===================================================== */

function startMistakeRetry() {

    if (
        !wrongQuestionsList.length
    ) {

        return;

    }


    activeQuestions =
        [...wrongQuestionsList];


    currentIdx = 0;

    userAnswers = {};

    isMistakeRetry = true;

    wrongQuestionsList = [];


    document.getElementById("resultScreen")
        .classList.add("hide");

    document.getElementById("reviewScreen")
        .classList.add("hide");

    document.getElementById("quizScreen")
        .classList.remove("hide");

    document.getElementById("timerBox")
        .classList.remove("hide");


    quizStartTime = Date.now();

    startTimer();

    loadQuestion();


    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });

}


/* =====================================================
   TIMER
===================================================== */

function startTimer() {

    stopTimer();


    updateTimer();


    quizTimerInterval =
        setInterval(
            updateTimer,
            1000
        );

}


function stopTimer() {

    if (quizTimerInterval) {

        clearInterval(
            quizTimerInterval
        );

        quizTimerInterval = null;

    }

}


function updateTimer() {

    const seconds =
        getElapsedSeconds();


    document.getElementById("timer")
        .textContent =
        formatTime(seconds);

}


function getElapsedSeconds() {

    if (!quizStartTime) {
        return 0;
    }


    return Math.floor(
        (Date.now() - quizStartTime) /
        1000
    );

}


function formatTime(totalSeconds) {

    totalSeconds =
        Math.max(
            0,
            Number(totalSeconds) || 0
        );


    const hours =
        Math.floor(
            totalSeconds / 3600
        );


    const minutes =
        Math.floor(
            (totalSeconds % 3600) / 60
        );


    const seconds =
        totalSeconds % 60;


    if (hours > 0) {

        return [
            String(hours).padStart(2, "0"),
            String(minutes).padStart(2, "0"),
            String(seconds).padStart(2, "0")
        ].join(":");

    }


    return [
        String(minutes).padStart(2, "0"),
        String(seconds).padStart(2, "0")
    ].join(":");

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHTML(value) {

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}
