<!DOCTYPE html>
<html lang="ne">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoksewaQuest - Hot Seat PRO v3</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Poppins', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-white min-h-screen flex flex-col justify-between">

    <!-- Loading / Splash Screen (जबसम्म Auth चेक हुन्छ) -->
    <div id="loading-screen" class="fixed inset-0 bg-slate-950 flex flex-col items-center justify-center z-50 transition-opacity duration-300">
        <div class="animate-spin rounded-full h-16 w-16 border-t-4 border-amber-500 border-b-4 border-slate-700 mb-4"></div>
        <p class="text-slate-300 font-medium text-lg">लोडिङ हुँदैछ...</p>
    </div>

    <!-- MAIN APP CONTAINER -->
    <div id="app-container" class="hidden flex-grow flex flex-col">
        
        <!-- Header -->
        <header class="bg-slate-800 border-b border-slate-700 p-4 shadow-md flex justify-between items-center">
            <h1 class="text-xl font-bold text-amber-400">LoksewaQuest <span class="text-xs bg-amber-500 text-slate-950 px-2 py-0.5 rounded font-bold">PRO v3</span></h1>
            <div class="flex items-center gap-4">
                <span id="user-email" class="text-sm text-slate-300 hidden sm:inline"></span>
                <button id="logout-btn" class="bg-rose-600 hover:bg-rose-700 text-white text-sm px-3 py-1.5 rounded-lg transition font-medium">लगआउट</button>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="flex-grow flex items-center justify-center p-4">
            
            <!-- LOGIN SECTION (यदि युजर लगइन छैन भने देखिन्छ) -->
            <div id="login-section" class="w-full max-w-md bg-slate-800 p-8 rounded-2xl shadow-xl border border-slate-700 hidden">
                <h2 class="text-2xl font-bold text-center mb-6 text-amber-400">लगइन गर्नुहोस्</h2>
                <form id="login-form" class="space-y-4">
                    <div>
                        <label class="block text-sm text-slate-400 mb-1">इमेल ठेगाना</label>
                        <input type="email" id="login-email" required class="w-full px-4 py-2.5 rounded-lg bg-slate-900 border border-slate-700 text-white focus:outline-none focus:border-amber-500">
                    </div>
                    <div>
                        <label class="block text-sm text-slate-400 mb-1">पासवर्ड</label>
                        <input type="password" id="login-password" required class="w-full px-4 py-2.5 rounded-lg bg-slate-900 border border-slate-700 text-white focus:outline-none focus:border-amber-500">
                    </div>
                    <p id="login-error" class="text-rose-500 text-xs hidden"></p>
                    <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-slate-950 font-bold py-3 rounded-lg transition shadow-lg">प्रवेश गर्नुहोस्</button>
                </form>
            </div>

            <!-- DASHBOARD / QUIZ SECTION (यदि युजर लगइन छ भने देखिन्छ) -->
            <div id="dashboard-section" class="w-full max-w-2xl bg-slate-800 p-8 rounded-2xl shadow-xl border border-slate-700 text-center hidden">
                <h2 class="text-3xl font-bold mb-4 text-amber-400">स्वागत छ! 🎉</h2>
                <p class="text-slate-300 mb-6">तपाईं LoksewaQuest Hot Seat PRO v3 मा सफलतापूर्वक लगइन हुनुहुन्छ। अब तपाईं क्विज खेल्न सक्नुहुन्छ।</p>
                
                <div class="bg-slate-900 p-6 rounded-xl border border-slate-700 mb-6 text-left">
                    <h3 class="font-semibold text-amber-400 mb-2">तपाईँको युजर प्रोफाइल:</h3>
                    <p class="text-sm text-slate-300">UID: <span id="profile-uid" class="font-mono text-amber-300 font-semibold">-</span></p>
                    <p class="text-sm text-slate-300 mt-1">इमेल: <span id="profile-email" class="font-mono text-slate-300">-</span></p>
                </div>

                <button id="start-quiz-btn" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-8 py-3 rounded-xl transition shadow-lg">क्विज सुरु गर्नुहोस्</button>
            </div>

        </main>

        <!-- Footer -->
        <footer class="text-center p-4 text-xs text-slate-500 border-t border-slate-800">
            &copy; 2026 LoksewaQuest. All rights reserved.
        </footer>

    </div>

    <!-- Firebase SDK (Modular v10) र एप लजिक -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { 
            getAuth, 
            signInWithEmailAndPassword, 
            signOut, 
            setPersistence, 
            browserLocalPersistence, 
            onAuthStateChanged 
        } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // Firebase कन्फिगरेसन
        const firebaseConfig = {
          apiKey: "AIzaSyCkKCU1re5b9MtdsAF1F4xI6rGxmxhGZak",
          authDomain: "loksewaquest-227b6.firebaseapp.com",
          projectId: "loksewaquest-227b6",
          storageBucket: "loksewaquest-227b6.firebasestorage.app",
          messagingSenderId: "779234903809",
          appId: "1:779234903809:web:dd0dd0ffb742e1c218bd00"
        };

        // Firebase Initialize
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // DOM Elements
        const loadingScreen = document.getElementById('loading-screen');
        const appContainer = document.getElementById('app-container');
        const loginSection = document.getElementById('login-section');
        const dashboardSection = document.getElementById('dashboard-section');
        const loginForm = document.getElementById('login-form');
        const loginError = document.getElementById('login-error');
        const logoutBtn = document.getElementById('logout-btn');
        const userEmailDisplay = document.getElementById('user-email');
        const profileUid = document.getElementById('profile-uid');
        const profileEmail = document.getElementById('profile-email');

        // १. Persistence सेट गर्ने (ब्राउजर बन्द गरे पनि वा पेज रिफ्रेस गर्दा लगइन नरहने समस्या हटाउन)
        setPersistence(auth, browserLocalPersistence)
            .then(() => {
                // युजर स्टेट ट्र्याक गर्ने मुख्य लजिक (Session & User ID Auto-detect)
                onAuthStateChanged(auth, async (user) => {
                    // लोडिङ स्क्रिन हटाउने
                    loadingScreen.style.opacity = '0';
                    setTimeout(() => loadingScreen.classList.add('hidden'), 300);
                    appContainer.classList.remove('hidden');

                    if (user) {
                        // युजर लगइन छ (Session Active)
                        console.log("Active User ID:", user.uid);
                        
                        // स्वतः युजरको इमेल र UID देखाउने
                        userEmailDisplay.textContent = user.email;
                        profileUid.textContent = user.uid;
                        profileEmail.textContent = user.email;

                        // Firestore मा युजर డాక్యुमेन्ट (profile) स्वतः चेक गरी सेभ/अपडेट गर्ने
                        try {
                            const userRef = doc(db, "users", user.uid);
                            const userSnap = await getDoc(userRef);

                            if (!userSnap.exists()) {
                                // यदि पहिलो पटक लगइन हो भने Firestore मा युजरको डाटा राख्ने
                                await setDoc(userRef, {
                                    uid: user.uid,
                                    email: user.email,
                                    createdAt: new Date().toISOString()
                                });
                                console.log("New user profile created in Firestore.");
                            } else {
                                console.log("User profile already exists in Firestore.");
                            }
                        } catch (err) {
                            console.error("Error checking/creating user profile in Firestore:", err);
                        }

                        // लगइन सेक्सन लुकाएर ड्याशबोर्ड देखाउने
                        loginSection.classList.add('hidden');
                        dashboardSection.classList.remove('hidden');
                    } else {
                        // युजर लगइन छैन (Not Logged In)
                        console.log("No active session found.");
                        dashboardSection.classList.add('hidden');
                        loginSection.classList.remove('hidden');
                    }
                });
            })
            .catch((error) => {
                console.error("Persistence Error:", error.message);
            });

        // २. इमेल र पासवर्डबाट लगइन गर्ने ह्यान्डलिङ
        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            loginError.classList.add('hidden');
            
            const email = document.getElementById('login-email').value.trim();
            const password = document.getElementById('login-password').value;

            try {
                await signInWithEmailAndPassword(auth, email, password);
                // सफल भएपछि माथिको onAuthStateChanged ले आफैं युजर डिटेक्ट गरेर ड्याशबोर्ड देखाउनेछ
            } catch (error) {
                console.error("Login Error:", error.message);
                loginError.textContent = "लगइन असफल भयो: इमेल वा पासवर्ड मिलटेन।";
                loginError.classList.add('hidden'); // Fix toggle if needed, ensure error shows properly
                loginError.classList.remove('hidden');
            }
        });

        // ३. लगआउट (Logout) ह्यान्डलिङ
        logoutBtn.addEventListener('click', async () => {
            try {
                await signOut(auth);
                // लगआउट भएपछि onAuthStateChanged ले आफैं लगइन स्क्रिनमा फर्काउनेछ
            } catch (error) {
                console.error("Logout Error:", error.message);
            }
        });

        // ४. क्विज सुरु गर्ने बटनको एक्शन
        document.getElementById('start-quiz-btn').addEventListener('click', () => {
            // हाल लगइन भएका युजरको UID यहाँ सीधै लिन सकिन्छ
            const currentUserId = auth.currentUser ? auth.currentUser.uid : null;
            alert("क्विज सुरु हुँदैछ! हालको युजर UID: " + currentUserId);
            // यहाँबाट तपाईं Firestore मा युजरको स्कोर सेभ गर्ने वा क्विज डेटा लोड गर्ने काम गर्न सक्नुहुन्छ।
        });
    </script>
</body>
</html>
