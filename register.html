<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LoksewaQuest - Register</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    
    /* आकर्षक ब्याकग्राउन्ड र थेम */
    body {
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      color: #f8fafc;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .register-card {
      background: rgba(30, 41, 59, 0.7);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      width: 100%;
      max-width: 420px;
      padding: 35px;
      border-radius: 28px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      border: 1px solid rgba(255, 255, 255, 0.1);
    }

    .register-header {
      text-align: center;
      margin-bottom: 28px;
    }
    .register-header h2 {
      font-size: 26px;
      font-weight: 800;
      color: #ffffff;
      margin-bottom: 8px;
    }
    .register-header p {
      font-size: 14px;
      color: #94a3b8;
    }

    .form-group {
      margin-bottom: 18px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 8px;
    }
    .input-box {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-box i {
      position: absolute;
      left: 16px;
      color: #64748b;
      font-size: 16px;
    }
    .input-box input {
      width: 100%;
      padding: 14px 16px 14px 46px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 14px;
      font-size: 14px;
      outline: none;
      background: rgba(15, 23, 42, 0.6);
      color: #ffffff;
      transition: all 0.3s;
    }
    .input-box input::placeholder {
      color: #64748b;
    }
    .input-box input:focus {
      border-color: #3b82f6;
      background: rgba(15, 23, 42, 0.9);
      box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.15);
    }

    .submit-btn {
      width: 100%;
      background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
      color: white;
      border: none;
      padding: 15px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.3s;
      margin-top: 10px;
      box-shadow: 0 10px 20px rgba(37, 99, 235, 0.3);
    }
    .submit-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 15px 25px rgba(37, 99, 235, 0.4);
    }

    .login-redirect {
      text-align: center;
      margin-top: 24px;
      font-size: 13px;
      color: #94a3b8;
    }
    .login-redirect a {
      color: #60a5fa;
      font-weight: 700;
      text-decoration: none;
    }
    .login-redirect a:hover {
      text-decoration: underline;
    }

    /* main.js ले कन्ट्रोल गर्ने पपअपको डिजाइन (CSS) */
    .custom-popup-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(6px);
      display: flex; align-items: center; justify-content: center;
      z-index: 99999; opacity: 0; visibility: hidden; transition: all 0.3s ease;
    }
    .custom-popup-overlay.active { opacity: 1; visibility: visible; }
    .custom-popup-box {
      background: #1e293b; width: 90%; max-width: 380px; border-radius: 24px;
      padding: 26px; text-align: center; box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.1);
      transform: scale(0.9); transition: transform 0.3s ease;
    }
    .custom-popup-overlay.active .custom-popup-box { transform: scale(1); }
    .popup-icon-container {
      width: 60px; height: 60px; border-radius: 50%; margin: 0 auto 16px auto;
      display: flex; align-items: center; justify-content: center; font-size: 24px;
    }
    .popup-icon-container.success { background: rgba(22, 163, 74, 0.2); color: #4ade80; }
    .popup-icon-container.error { background: rgba(220, 38, 38, 0.2); color: #f87171; }
    .custom-popup-box h3 { font-size: 18px; font-weight: 700; color: #ffffff; margin-bottom: 8px; }
    .custom-popup-box p { font-size: 14px; color: #94a3b8; margin-bottom: 24px; line-height: 1.5; }
    .popup-btn {
      background: #2563eb; color: white; border: none; width: 100%;
      padding: 12px; border-radius: 14px; font-size: 15px; font-weight: 600; cursor: pointer;
      transition: background 0.2s;
    }
    .popup-btn:hover { background: #1d4ed8; }
  </style>
</head>
<body>

  <div class="register-card">
    <div class="register-header">
      <h2>अकाउन्ट बनाउनुहोस्</h2>
      <p>LoksewaQuest मा स्वागत छ</p>
    </div>

    <form id="registerForm" onsubmit="handleRegister(event)">
      <div class="form-group">
        <label>पूरा नाम (Full Name)</label>
        <div class="input-box">
          <i class="fa-solid fa-user"></i>
          <input type="text" id="fullName" placeholder="तपाईंको नाम" required>
        </div>
      </div>

      <div class="form-group">
        <label>इमेल (Email)</label>
        <div class="input-box">
          <i class="fa-solid fa-envelope"></i>
          <input type="email" id="registerEmail" placeholder="name@example.com" required>
        </div>
      </div>

      <div class="form-group">
        <label>पासवर्ड (Password)</label>
        <div class="input-box">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="registerPassword" placeholder="••••••••" required>
        </div>
      </div>

      <button type="submit" class="submit-btn">Register</button>
    </form>

    <div class="login-redirect">
      पहिले नै अकाउन्ट छ? <a href="login.html">लगइन गर्नुहोस्</a>
    </div>
  </div>

  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- EmailJS SDK CDN -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <script type="text/javascript">
    (function() {
      emailjs.init("YOUR_EMAILJS_PUBLIC_KEY"); // यहाँ आफ्नो EmailJS Public Key राख्नुहोला
    })();
  </script>

  <!-- मुख्य साझा main.js फाइल लिङ्क (यसले पपअप चलाउँछ) -->
  <script src="main.js"></script>

  <!-- Firebase & Registration Logic -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCkKCU1re5b9MtdsAF1F4xI6rGxmxhGZak",
      authDomain: "loksewaquest-227b6.firebaseapp.com",
      projectId: "loksewaquest-227b6",
      storageBucket: "loksewaquest-227b6.firebasestorage.app",
      messagingSenderId: "779234903809",
      appId: "1:779234903809:web:dd0dd0ffb742e1c218bd00"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const SUPABASE_URL = "https://edyirdedkiarguvurpxq.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVkeWlyZGVka2lhcmd1dnVycHhxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwMTg2NjIsImV4cCI6MjEwNDU5NDY2Mn0.yhNn3YKmFSkxRdefk2F22qxTFhuKS90NH5fa3zzKSaY";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    window.handleRegister = async function(event) {
      event.preventDefault();
      
      const fullName = document.getElementById('fullName').value;
      const email = document.getElementById('registerEmail').value;
      const password = document.getElementById('registerPassword').value;

      // ६-अङ्कको अनियमित ओटीपी कोड (OTP Code) जेनेरेट गर्ने
      const otpCode = Math.floor(100000 + Math.random() * 900000).toString();

      try {
        // १. Firebase मा युजर सिर्जना गर्ने
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;

        // २. Firebase Auth मा नाम अपडेट गर्ने
        await updateProfile(user, { displayName: fullName });

        // ३. Supabase मा युजरको डेटा र OTP कोड सेभ गर्ने
        await supabase.from('user_stats').upsert([
          { id: user.uid, total_solved: 0, time_spent_minutes: 0, accuracy: 0, otp_code: otpCode }
        ]);

        // ४. EmailJS मार्फत जिमेलमा OTP पठाउने
        const templateParams = {
          to_email: email,
          to_name: fullName,
          otp_code: otpCode
        };

        await emailjs.send('YOUR_SERVICE_ID', 'YOUR_TEMPLATE_ID', templateParams);

        // ५. main.js को showPopup मार्फत राम्रो पपअप देखाउने
        showPopup("सफल भयो!", "सफलतापूर्वक रजिस्टर भयो! तपाईंको जिमेलमा ६-अङ्कको भेरिफिकेसन कोड पठाइएको छ।", "success", () => {
          window.location.href = "login.html";
        });

      } catch (error) {
        showPopup("त्रुटि!", error.message, "error");
      }
    };
  </script>

</body>
</html>
