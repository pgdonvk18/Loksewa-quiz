<!DOCTYPE html>
<html lang="ne">
<head><script src="main.js"></script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LoksewaQuest - Register</title>
  <!-- प्रिमियम आधुनिक फन्ट -->
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- व्यावसायिक आइकनहरूको लागि FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    body {
      background: linear-gradient(135deg, #0f2a4a 0%, #1e40af 100%);
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 30px 24px;
    }

    .register-header {
      text-align: center;
      margin-top: 20px;
    }
    .app-logo {
      width: 64px;
      height: 64px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 15px auto;
      color: #fbbf24;
      font-size: 28px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.2);
    }
    .register-header h1 {
      font-size: 24px;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.5px;
      margin-bottom: 6px;
    }
    .register-header h1 span {
      color: #fbbf24;
    }
    .register-header p {
      font-size: 13px;
      color: #cbd5e1;
      font-weight: 500;
    }

    .register-card-container {
      background: #ffffff;
      border-radius: 28px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      width: 100%;
      max-width: 400px;
      margin: 20px auto;
    }

    .form-group {
      margin-bottom: 14px;
    }
    .form-group label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      color: #475569;
      margin-bottom: 5px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .input-box {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-box i {
      position: absolute;
      left: 14px;
      color: #94a3b8;
      font-size: 15px;
    }
    .input-box input {
      width: 100%;
      padding: 12px 14px 12px 42px;
      border: 1.5px solid #e2e8f0;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 600;
      color: #0f172a;
      outline: none;
      background: #f8fafc;
      transition: all 0.2s;
    }
    .input-box input:focus {
      border-color: #2563eb;
      background: #ffffff;
      box-shadow: 0 0 0 4px rgba(37, 99, 235, 0.1);
    }

    .btn-register {
      background: linear-gradient(135deg, #2563eb, #1d4ed8);
      color: white;
      border: none;
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 6px 15px rgba(37, 99, 235, 0.3);
      margin-top: 6px;
      transition: transform 0.2s;
    }
    .btn-register:active {
      transform: scale(0.98);
    }

    .divider {
      display: flex;
      align-items: center;
      text-align: center;
      margin: 16px 0;
      color: #94a3b8;
      font-size: 11px;
      font-weight: 600;
    }
    .divider::before, .divider::after {
      content: '';
      flex: 1;
      border-bottom: 1px solid #e2e8f0;
    }
    .divider::before { margin-right: 10px; }
    .divider::after { margin-left: 10px; }

    .btn-google {
      background: #ffffff;
      color: #1e293b;
      border: 1.5px solid #e2e8f0;
      width: 100%;
      padding: 12px;
      border-radius: 12px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.03);
      transition: background 0.2s;
    }
    .btn-google:hover {
      background: #f8fafc;
    }
    .btn-google img {
      width: 18px;
      height: 18px;
    }

    .login-link {
      text-align: center;
      margin-top: 15px;
      font-size: 13px;
      color: #cbd5e1;
      font-weight: 500;
    }
    .login-link a {
      color: #fbbf24;
      text-decoration: none;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <div class="register-header">
    <div class="app-logo">
      <i class="fa-solid fa-user-plus"></i>
    </div>
    <h1>Create Account</h1>
    <p>Join LoksewaQuest to start learning</p>
  </div>

  <div class="register-card-container">
    
    <!-- इमेल रजिस्टर फर्म -->
    <form id="registerForm">
      <div class="form-group">
        <label>Full Name</label>
        <div class="input-box">
          <i class="fa-regular fa-user"></i>
          <input type="text" id="fullName" placeholder="Your Name" required>
        </div>
      </div>

      <div class="form-group">
        <label>Email Address</label>
        <div class="input-box">
          <i class="fa-regular fa-envelope"></i>
          <input type="email" id="signupEmail" placeholder="name@example.com" required>
        </div>
      </div>

      <div class="form-group" style="margin-bottom: 18px;">
        <label>Password</label>
        <div class="input-box">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="signupPassword" placeholder="Create password" required>
        </div>
      </div>

      <button type="submit" class="btn-register">Sign Up</button>
    </form>

    <div class="divider">OR</div>

    <!-- गुगल पपअप खुल्ने बटन -->
    <button type="button" id="googleSignInBtn" class="btn-google">
      <img src="https://www.svgrepo.com/show/475656/google-color.svg" alt="Google logo">
      Sign up with Google
    </button>

  </div>

  <div class="login-link">
    Already have an account? <a href="login.html">Login</a>
  </div>

  <!-- Firebase JavaScript SDK र Authentication को कोड -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
    import { getAnalytics } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-analytics.js";
    import { getAuth, createUserWithEmailAndPassword, GoogleAuthProvider, signInWithPopup } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

    // तपाईंको आफ्नै कन्फिगरेसन
    const firebaseConfig = {
      apiKey: "AIzaSyCkKCU1re5b9MtdsAF1F4xI6rGxmxhGZak",
      authDomain: "loksewaquest-227b6.firebaseapp.com",
      projectId: "loksewaquest-227b6",
      storageBucket: "loksewaquest-227b6.firebasestorage.app",
      messagingSenderId: "779234903809",
      appId: "1:779234903809:web:dd0dd0ffb742e1c218bd00",
      measurementId: "G-1FHRQJYW5P"
    };

    // Initialize Firebase
    const app = initializeApp(firebaseConfig);
    const analytics = getAnalytics(app);
    const auth = getAuth(app);

    // १. इमेल र पासवर्डमार्फत रजिस्टर गर्ने प्रणाली
    const registerForm = document.getElementById('registerForm');
    if (registerForm) {
      registerForm.addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('signupEmail').value;
        const password = document.getElementById('signupPassword').value;

        try {
          await createUserWithEmailAndPassword(auth, email, password);
          alert("सफल रूपमा खाता सिर्जना भयो!");
          window.location.href = "dashboard.html";
        } catch (error) {
          alert("त्रुटि: " + error.message);
        }
      });
    }

    // २. "Sign up with Google" थिच्दा गुगल पपअप खुल्ने प्रणाली
    const googleSignInBtn = document.getElementById('googleSignInBtn');
    if (googleSignInBtn) {
      googleSignInBtn.addEventListener('click', async () => {
        const provider = new GoogleAuthProvider();
        try {
          const result = await signInWithPopup(auth, provider);
          const user = result.user;
          alert("स्वागत छ, " + (user.displayName || "User") + "!");
          window.location.href = "dashboard.html";
        } catch (error) {
          alert("गुगल लगइन रद्द भयो वा समस्या आयो: " + error.message);
        }
      });
    }
  </script>

</body>
</html>
