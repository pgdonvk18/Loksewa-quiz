<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>LoksewaQuest - Register</title>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  
  <!-- Custom Popup CSS -->
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }
    body {
      background: #f8fafc;
      color: #1e293b;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .register-card {
      background: #ffffff;
      width: 100%;
      max-width: 400px;
      padding: 30px;
      border-radius: 24px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      border: 1px solid #f1f5f9;
    }

    .register-header {
      text-align: center;
      margin-bottom: 24px;
    }
    .register-header h2 {
      font-size: 24px;
      font-weight: 800;
      color: #0f172a;
      margin-bottom: 6px;
    }
    .register-header p {
      font-size: 14px;
      color: #64748b;
    }

    .form-group {
      margin-bottom: 16px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      color: #334155;
      margin-bottom: 6px;
    }
    .input-box {
      position: relative;
      display: flex;
      align-items: center;
    }
    .input-box i {
      position: absolute;
      left: 14px;
      color: #94a3b8;
      font-size: 15px;
    }
    .input-box input {
      width: 100%;
      padding: 12px 14px 12px 42px;
      border: 1px solid #e2e8f0;
      border-radius: 12px;
      font-size: 14px;
      outline: none;
      background: #f8fafc;
      color: #0f172a;
      transition: all 0.2s;
    }
    .input-box input:focus {
      border-color: #2563eb;
      background: #ffffff;
      box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
    }

    .submit-btn {
      width: 100%;
      background: #2563eb;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 10px;
    }
    .submit-btn:hover {
      background: #1d4ed8;
    }

    .login-redirect {
      text-align: center;
      margin-top: 20px;
      font-size: 13px;
      color: #64748b;
    }
    .login-redirect a {
      color: #2563eb;
      font-weight: 700;
      text-decoration: none;
    }

    /* Custom Popup Overlay Styles */
    .custom-popup-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(15, 23, 42, 0.6); backdrop-filter: blur(4px);
      display: flex; align-items: center; justify-content: center;
      z-index: 99999; opacity: 0; visibility: hidden; transition: all 0.3s ease;
    }
    .custom-popup-overlay.active { opacity: 1; visibility: visible; }
    .custom-popup-box {
      background: #ffffff; width: 90%; max-width: 380px; border-radius: 24px;
      padding: 24px; text-align: center; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1);
      transform: scale(0.9); transition: transform 0.3s ease;
    }
    .custom-popup-overlay.active .custom-popup-box { transform: scale(1); }
    .popup-icon-container {
      width: 60px; height: 60px; border-radius: 50%; margin: 0 auto 16px auto;
      display: flex; align-items: center; justify-content: center; font-size: 24px;
    }
    .popup-icon-container.success { background: #dcfce7; color: #16a34a; }
    .popup-icon-container.error { background: #fee2e2; color: #dc2626; }
    .custom-popup-box h3 { font-size: 18px; font-weight: 700; color: #0f172a; margin-bottom: 8px; }
    .custom-popup-box p { font-size: 14px; color: #64748b; margin-bottom: 24px; line-height: 1.5; }
    .popup-btn {
      background: #2563eb; color: white; border: none; width: 100%;
      padding: 12px; border-radius: 14px; font-size: 15px; font-weight: 600; cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="register-card">
    <div class="register-header">
      <h2>अकाउन्ट बनाउनुहोस्</h2>
      <p>LoksewaQuest मा स्वागत छ</p>
    </div>

    <form id="registerForm" onsubmit="handleRegister(event)">
      <div class="form-group">
        <label>पूरा नाम (Full Name)</label>
        <div class="input-box">
          <i class="fa-solid fa-user"></i>
          <input type="text" id="fullName" placeholder="तपाईंको नाम" required>
        </div>
      </div>

      <div class="form-group">
        <label>इमेल (Email)</label>
        <div class="input-box">
          <i class="fa-solid fa-envelope"></i>
          <input type="email" id="registerEmail" placeholder="name@example.com" required>
        </div>
      </div>

      <div class="form-group">
        <label>पासवर्ड (Password)</label>
        <div class="input-box">
          <i class="fa-solid fa-lock"></i>
          <input type="password" id="registerPassword" placeholder="••••••••" required>
        </div>
      </div>

      <button type="submit" class="submit-btn">Register</button>
    </form>

    <div class="login-redirect">
      पहिले नै अकाउन्ट छ? <a href="login.html">लगइन गर्नुहोस्</a>
    </div>
  </div>

  <!-- Custom Popup HTML Structure -->
  <div id="globalPopup" class="custom-popup-overlay">
    <div class="custom-popup-box">
      <div id="popupIcon" class="popup-icon-container success">
        <i id="popupIconClass" class="fa-solid fa-check"></i>
      </div>
      <h3 id="popupTitle">सुचना</h3>
      <p id="popupMessage">म्यासेज...</p>
      <button class="popup-btn" onclick="closePopup()">ठीक छ (OK)</button>
    </div>
  </div>

  <!-- Supabase JS Client -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  
  <!-- EmailJS SDK CDN -->
  <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
  <script type="text/javascript">
    (function() {
      emailjs.init("YOUR_EMAILJS_PUBLIC_KEY"); // यहाँ आफ्नो EmailJS Public Key राख्नुहोला
    })();
  </script>

  <!-- Popup Functions -->
  <script>
    window.showPopup = function(title, message, type = 'success', callback = null) {
      const popup = document.getElementById('globalPopup');
      document.getElementById('popupTitle').textContent = title;
      document.getElementById('popupMessage').textContent = message;

      const popupIcon = document.getElementById('popupIcon');
      const popupIconClass = document.getElementById('popupIconClass');

      popupIcon.className = "popup-icon-container " + type;
      popupIconClass.className = (type === 'success') ? "fa-solid fa-check" : "fa-solid fa-triangle-exclamation";

      popup.classList.add('active');
      window.popupCallback = callback;
    };

    window.closePopup = function() {
      const popup = document.getElementById('globalPopup');
      popup.classList.remove('active');

      if (typeof window.popupCallback === 'function') {
        window.popupCallback();
        window.popupCallback = null;
      }
    };
  </script>

  <!-- Firebase & Registration Logic -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getAuth, createUserWithEmailAndPassword, updateProfile } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyCkKCU1re5b9MtdsAF1F4xI6rGxmxhGZak",
      authDomain: "loksewaquest-227b6.firebaseapp.com",
      projectId: "loksewaquest-227b6",
      storageBucket: "loksewaquest-227b6.firebasestorage.app",
      messagingSenderId: "779234903809",
      appId: "1:779234903809:web:dd0dd0ffb742e1c218bd00"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const SUPABASE_URL = "https://edyirdedkiarguvurpxq.supabase.co";
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVkeWlyZGVka2lhcmd1dnVycHhxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwMTg2NjIsImV4cCI6MjEwNDU5NDY2Mn0.yhNn3YKmFSkxRdefk2F22qxTFhuKS90NH5fa3zzKSaY";
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    window.handleRegister = async function(event) {
      event.preventDefault();
      
      const fullName = document.getElementById('fullName').value;
      const email = document.getElementById('registerEmail').value;
      const password = document.getElementById('registerPassword').value;

      // ६-अङ्कको अनियमित ओटीपी कोड (OTP Code) जेनेरेट गर्ने
      const otpCode = Math.floor(100000 + Math.random() * 900000).toString();

      try {
        // १. Firebase मा युजर सिर्जना गर्ने
        const userCredential = await createUserWithEmailAndPassword(auth, email, password);
        const user = userCredential.user;

        // २. Firebase Auth मा नाम अपडेट गर्ने
        await updateProfile(user, { displayName: fullName });

        // ३. Supabase मा युजरको डेटा र OTP कोड सेभ गर्ने
        await supabase.from('user_stats').upsert([
          { id: user.uid, total_solved: 0, time_spent_minutes: 0, accuracy: 0, otp_code: otpCode }
        ]);

        // ४. EmailJS मार्फत जिमेलमा OTP पठाउने
        const templateParams = {
          to_email: email,
          to_name: fullName,
          otp_code: otpCode
        };

        await emailjs.send('YOUR_SERVICE_ID', 'YOUR_TEMPLATE_ID', templateParams);

        // ५. कस्टम पपअप देखाएर लगइन पेजमा पठाउने
        showPopup("सफल भयो!", "सफलतापूर्वक रजिस्टर भयो! तपाईंको जिमेलमा ६-अङ्कको भेरिफिकेसन कोड पठाइएको छ।", "success", () => {
          window.location.href = "login.html";
        });

      } catch (error) {
        showPopup("त्रुटि!", error.message, "error");
      }
    };
  </script>

</body>
</html>
