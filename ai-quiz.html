<div style="background: #ffffff; padding: 18px; border-radius: 24px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.04); border: 1px solid #f1f5f9; max-width: 500px; margin: 15px auto; font-family: inherit;">
  
  <div style="display: flex; align-items: center; gap: 10px; margin-bottom: 14px;">
    <div style="width: 38px; height: 38px; background: #eff6ff; color: #2563eb; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 16px;">
      <i class="fa-solid fa-brain"></i>
    </div>
    <div>
      <h2 style="font-size: 15px; font-weight: 800; color: #0f172a; margin: 0;">AI लोकसेवा क्विज जेनरेटर</h2>
      <p style="font-size: 11px; color: #64748b; margin: 2px 0 0 0;">आफ्नो रोजाइको टपिक र प्रश्न संख्या छान्नुहोस्</p>
    </div>
  </div>

  <div style="margin-bottom: 12px;">
    <label style="display: block; font-size: 12px; font-weight: 700; color: #334155; margin-bottom: 6px;">विषय वा टपिक छान्नुहोस्:</label>
    <div style="display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px;">
      <button type="button" onclick="setTopic('नेपालको भूगोल')" class="topic-chip" style="background: #f8fafc; border: 1px solid #e2e8f0; padding: 6px 12px; border-radius: 20px; font-size: 11px; font-weight: 600; color: #475569; cursor: pointer;">नेपालको भूगोल</button>
      <button type="button" onclick="setTopic('विश्वको भूगोल')" class="topic-chip" style="background: #f8fafc; border: 1px solid #e2e8f0; padding: 6px 12px; border-radius: 20px; font-size: 11px; font-weight: 600; color: #475569; cursor: pointer;">विश्वको भूगोल</button>
      <button type="button" onclick="setTopic('नेपालको इतिहास')" class="topic-chip" style="background: #f8fafc; border: 1px solid #e2e8f0; padding: 6px 12px; border-radius: 20px; font-size: 11px; font-weight: 600; color: #475569; cursor: pointer;">नेपालको इतिहास</button>
      <button type="button" onclick="setTopic('World History')" class="topic-chip" style="background: #f8fafc; border: 1px solid #e2e8f0; padding: 6px 12px; border-radius: 20px; font-size: 11px; font-weight: 600; color: #475569; cursor: pointer;">World History</button>
      <button type="button" onclick="setTopic('Constitution of Nepal')" class="topic-chip" style="background: #f8fafc; border: 1px solid #e2e8f0; padding: 6px 12px; border-radius: 20px; font-size: 11px; font-weight: 600; color: #475569; cursor: pointer;">संविधान</button>
    </div>
    <input type="text" id="aiTopicInput" placeholder="वा आफैं लेख्नुहोस् (जस्तै: विज्ञान, अर्थशास्त्र)..." style="width: 100%; padding: 11px 14px; border: 1px solid #cbd5e1; border-radius: 12px; font-size: 13px; outline: none; box-sizing: border-box;">
  </div>

  <div style="margin-bottom: 16px;">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px;">
      <label style="font-size: 12px; font-weight: 700; color: #334155;">प्रश्न संख्या:</label>
      <span id="countDisplay" style="font-size: 12px; font-weight: 800; color: #2563eb; background: #eff6ff; padding: 2px 8px; border-radius: 6px;">5 वटा</span>
    </div>
    <input type="range" id="aiQuestionCount" min="3" max="15" value="5" step="1" oninput="document.getElementById('countDisplay').innerText = this.value + ' वटा'" style="width: 100%; accent-color: #2563eb; cursor: pointer;">
  </div>

  <button onclick="generateAIQuiz()" id="generateBtn" style="width: 100%; background: linear-gradient(135deg, #1e3a8a 0%, #2563eb 100%); color: white; border: none; padding: 12px; border-radius: 12px; font-weight: 700; font-size: 13px; cursor: pointer; box-shadow: 0 4px 12px rgba(37, 99, 235, 0.2);">
    AI क्विज सुरु गर्नुहोस्
  </button>
</div>

<div id="aiQuizContainer" style="max-width: 500px; margin: 0 auto; padding-bottom: 40px;"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  const SUPABASE_URL = "https://edyirdedkiarguvurpxq.supabase.co";
  const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVkeWlyZGVka2lhcmd1dnVycHhxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwMTg2NjIsImV4cCI6MjEwNDU5NDY2Mn0.yhNn3YKmFSkxRdefk2F22qxTFhuKS90NH5fa3zzKSaY";
  const localSupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  let userAnswers = {};
  let quizDataList = [];

  function setTopic(topicName) {
    document.getElementById("aiTopicInput").value = topicName;
  }

  async function generateAIQuiz() {
    const topic = document.getElementById("aiTopicInput").value.trim();
    const count = document.getElementById("aiQuestionCount").value;
    const container = document.getElementById("aiQuizContainer");
    const btn = document.getElementById("generateBtn");

    if (!topic) {
      alert("कृपया विषय छान्नुहोस् वा लेख्नुहोस्!");
      return;
    }

    btn.disabled = true;
    btn.innerText = "AI ले प्रश्न तयार गर्दैछ...";
    container.style.display = "block";
    container.innerHTML = `
      <div style="background: white; padding: 30px; border-radius: 20px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.04); border: 1px solid #f1f5f9; margin: 15px auto;">
        <div style="width: 28px; height: 28px; border: 3px solid #cbd5e1; border-top-color: #2563eb; border-radius: 50%; animation: spin 0.7s linear infinite; margin: 0 auto 12px;"></div>
        <div style="color: #64748b; font-size: 13px; font-weight: 600;">${count} वटा प्रश्नहरू बन्दैछन्, कृपया प्रतीक्षा गर्नुहोस्...</div>
      </div>
    `;

    try {
      // Note: Make sure your Edge Function code is updated to accept the 'count' parameter if needed, 
      // or it will generate default questions.
      const { data, error } = await localSupabase.functions.invoke('ai-quiz', {
        body: { topic: topic, count: parseInt(count) }
      });

      if (error) throw error;
      if (!data || !data.questions) throw new Error("डेटा सहि आएन");
      
      quizDataList = data.questions;
      userAnswers = {};
      renderAIQuiz(quizDataList);
    } catch (err) {
      console.error(err);
      container.innerHTML = `
        <div style="background: #fef2f2; border: 1px solid #fca5a5; padding: 15px; border-radius: 14px; text-align: center; color: #991b1b; font-size: 12px; font-weight: 600; margin: 15px auto;">
          प्रश्न जेनेरेट गर्न सकिएन। फेरि प्रयास गर्नुहोस्।
        </div>
      `;
    } finally {
      btn.disabled = false;
      btn.innerText = "AI क्विज सुरु गर्नुहोस्";
    }
  }

  function renderAIQuiz(questions) {
    const container = document.getElementById("aiQuizContainer");
    let html = `<div style="background: white; padding: 18px; border-radius: 24px; box-shadow: 0 10px 25px rgba(0,0,0,0.04); border: 1px solid #f1f5f9;">`;
    
    questions.forEach((q, qIndex) => {
      html += `
        <div style="margin-bottom: 20px; border-bottom: 1px solid #f8fafc; padding-bottom: 16px;" id="q-block-${qIndex}">
          <p style="font-weight: 700; font-size: 13px; margin-bottom: 10px; color: #0f172a; line-height: 1.4;">${qIndex + 1}. ${q.question}</p>
          <div style="display: flex; flex-direction: column; gap: 6px;">
            ${q.options.map((opt, optIndex) => `
              <button type="button" onclick="selectOption(${qIndex}, ${optIndex}, ${q.correct})" id="btn-${qIndex}-${optIndex}" style="padding: 10px 12px; border: 1px solid #e2e8f0; background: #f8fafc; border-radius: 10px; text-align: left; cursor: pointer; font-size: 12px; color: #334155; font-weight: 500; transition: all 0.2s;">
                ${opt}
              </button>
            `).join('')}
          </div>
        </div>
      `;
    });

    html += `
      <button type="button" onclick="submitAIQuiz()" id="submitQuizBtn" style="width: 100%; background: #16a34a; color: white; border: none; padding: 12px; border-radius: 12px; font-weight: 700; font-size: 13px; cursor: pointer; margin-top: 10px; box-shadow: 0 4px 12px rgba(22, 163, 74, 0.2);">
        नतिजा हेर्नुहोस् (Submit)
      </button>
    </div>`;
    
    container.innerHTML = html;
  }

  function selectOption(qIndex, optIndex, correctIndex) {
    userAnswers[qIndex] = optIndex;
    
    // Highlight selected option visually before submission
    const parent = document.getElementById(`btn-${qIndex}-0`).parentElement;
    const buttons = parent.querySelectorAll('button');
    buttons.forEach((b, idx) => {
      if (idx === optIndex) {
        b.style.background = "#eff6ff";
        b.style.borderColor = "#2563eb";
        b.style.color = "#1e40af";
        b.style.fontWeight = "700";
      } else {
        b.style.background = "#f8fafc";
        b.style.borderColor = "#e2e8f0";
        b.style.color = "#334155";
        b.style.fontWeight = "500";
      }
    });
  }

  function submitAIQuiz() {
    if (Object.keys(userAnswers).length === 0) {
      alert("कम्तिमा एउटा प्रश्नको उत्तर छान्नुहोस्!");
      return;
    }

    let score = 0;
    quizDataList.forEach((q, qIndex) => {
      const selected = userAnswers[qIndex];
      const correct = q.correct;
      
      const parent = document.getElementById(`btn-${qIndex}-0`).parentElement;
      const buttons = parent.querySelectorAll('button');

      buttons.forEach((b, idx) => {
        b.disabled = true;
        b.style.cursor = "default";
        if (idx === correct) {
          b.style.background = "#dcfce7";
          b.style.borderColor = "#22c55e";
          b.style.color = "#166534";
          b.style.fontWeight = "700";
        } else if (idx === selected && selected !== correct) {
          b.style.background = "#fee2e2";
          b.style.borderColor = "#ef4444";
          b.style.color = "#991b1b";
        }
      });

      if (selected === correct) {
        score++;
      }
    });

    const submitBtn = document.getElementById("submitQuizBtn");
    submitBtn.style.display = "none";

    const container = document.getElementById("aiQuizContainer");
    const summaryCard = document.createElement("div");
    summaryCard.style.cssText = "background: #f8fafc; border: 1px solid #e2e8f0; padding: 16px; border-radius: 16px; margin-top: 15px; text-align: center;";
    summaryCard.innerHTML = `
      <h3 style="font-size: 15px; color: #0f172a; margin: 0 0 6px 0; font-weight: 800;">क्विज सम्पन्न भयो! 🎉</h3>
      <p style="font-size: 13px; color: #334155; margin: 0 0 12px 0;">तपाईंले <b>${quizDataList.length}</b> मध्ये <b>${score}</b> वटा प्रश्नको सही उत्तर मिलाउनुभयो।</p>
      <button onclick="generateAIQuiz()" style="background: #2563eb; color: white; border: none; padding: 10px 20px; border-radius: 10px; font-weight: 700; font-size: 12px; cursor: pointer;">फेरी खेल्नुहोस्</button>
    `;
    container.appendChild(summaryCard);
  }
</script>

<style>
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  .topic-chip:hover {
    background: #eff6ff !important;
    border-color: #2563eb !important;
    color: #2563eb !important;
  }
</style>
