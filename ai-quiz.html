<div style="background: #ffffff; padding: 20px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0, 0, 0, 0.05); border: 1px solid #e2e8f0; margin: 20px auto; max-width: 600px;">
  <h2 style="font-size: 16px; font-weight: 800; color: #0f172a; margin-bottom: 8px;">🤖 AI टपिक क्विज जेनेरेटर</h2>
  <p style="font-size: 13px; color: #64748b; margin-bottom: 14px;">तपाईंलाई कुन टपिकमा प्रश्न अभ्यास गर्न मन छ, तल लेख्नुहोस्:</p>
  
  <input type="text" id="aiTopicInput" placeholder="जस्तै: नेपालको भूगोल, Constitution..." style="width: 100%; padding: 12px 14px; border: 1px solid #cbd5e1; border-radius: 12px; font-size: 14px; margin-bottom: 12px; outline: none;">
  
  <button onclick="generateAIQuiz()" id="generateBtn" style="width: 100%; background: #2563eb; color: white; border: none; padding: 12px; border-radius: 12px; font-weight: 700; font-size: 14px; cursor: pointer;">
    प्रश्नहरू जेनेरेट गर्नुहोस्
  </button>
</div>

<div id="aiQuizContainer" style="max-width: 600px; margin: 0 auto;"></div>

<!-- Load Supabase JS SDK -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  // Initialized with your provided Supabase credentials
  const SUPABASE_URL = "https://edyirdedkiarguvurpxq.supabase.co";
  const SUPABASE_ANON_KEY = "AIzaSyBQR-v3w6y4xnNdAGcPFgYITSwFDId63hs";
  
  const localSupabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  async function generateAIQuiz() {
    const topic = document.getElementById("aiTopicInput").value.trim();
    const container = document.getElementById("aiQuizContainer");
    const btn = document.getElementById("generateBtn");

    if (!topic) {
      alert("कृपया टपिक लेख्नुहोस्!");
      return;
    }

    btn.disabled = true;
    btn.innerText = "AI ले प्रश्न बनाउँदैछ...";
    container.style.display = "block";
    container.innerHTML = `<div style="background: white; padding: 20px; border-radius: 16px; text-align: center; color: #64748b; font-size: 13px;">कृपया प्रतीक्षा गर्नुहोस्...</div>`;

    try {
      const { data, error } = await localSupabase.functions.invoke('generate-ai-quiz', {
        body: { topic: topic }
      });

      if (error) throw error;
      if (!data || !data.questions) throw new Error("डेटा सहि आएन");
      
      renderAIQuiz(data.questions);
    } catch (err) {
      console.error(err);
      container.innerHTML = `
        <div style="background: #fef2f2; border: 1px solid #fca5a5; padding: 15px; border-radius: 14px; color: #991b1b; font-size: 12px; word-break: break-all;">
          <b>एरर आयो:</b> ${err.message || JSON.stringify(err)}
        </div>
      `;
    } finally {
      btn.disabled = false;
      btn.innerText = "प्रश्नहरू जेनेरेट गर्नुहोस्";
    }
  }

  function renderAIQuiz(questions) {
    const container = document.getElementById("aiQuizContainer");
    let html = `<div style="background: white; padding: 20px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; margin-bottom: 20px;">`;
    
    questions.forEach((q, index) => {
      html += `
        <div style="margin-bottom: 20px; border-bottom: 1px solid #f1f5f9; padding-bottom: 15px;">
          <p style="font-weight: 700; font-size: 14px; margin-bottom: 10px; color: #0f172a;">${index + 1}. ${q.question}</p>
          <div style="display: flex; flex-direction: column; gap: 8px;">
            ${q.options.map((opt, i) => `
              <button onclick="checkAIAnswer(this, ${i}, ${q.correct})" style="padding: 10px 14px; border: 1px solid #e2e8f0; background: #f8fafc; border-radius: 10px; text-align: left; cursor: pointer; font-size: 13px; color: #334155;">
                ${opt}
              </button>
            `).join('')}
          </div>
        </div>
      `;
    });

    html += `</div>`;
    container.innerHTML = html;
  }

  function checkAIAnswer(btn, selected, correct) {
    const parent = btn.parentElement;
    const buttons = parent.querySelectorAll('button');
    
    buttons.forEach((b, idx) => {
      b.disabled = true;
      if (idx === correct) {
        b.style.background = "#dcfce7";
        b.style.borderColor = "#22c55e";
        b.style.color = "#166534";
        b.style.fontWeight = "700";
      } else if (idx === selected) {
        b.style.background = "#fee2e2";
        b.style.borderColor = "#ef4444";
        b.style.color = "#991b1b";
      }
    });
  }
</script>
