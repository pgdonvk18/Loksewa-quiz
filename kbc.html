<!DOCTYPE html>
<html lang="ne">
<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>LoksewaQuest - Hot Seat</title>

<style>

/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

:root{
    --bg:#02030a;
    --bg2:#061536;

    --blue:#2563eb;
    --blue2:#38bdf8;
    --cyan:#22d3ee;

    --gold:#facc15;
    --gold2:#f59e0b;

    --green:#22c55e;
    --red:#ef4444;

    --white:#f8fafc;
    --muted:#94a3b8;

    --panel:#07152f;
    --panel2:#0b1d3d;

    --border:rgba(148,163,184,.20);
}


/* =========================================================
   BODY
========================================================= */

html,
body{
    min-height:100%;
}

body{

    min-height:100vh;

    color:var(--white);

    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;

    background:

        radial-gradient(
            circle at 50% 18%,
            rgba(37,99,235,.35),
            transparent 30%
        ),

        radial-gradient(
            circle at 10% 80%,
            rgba(14,165,233,.10),
            transparent 30%
        ),

        radial-gradient(
            circle at 90% 70%,
            rgba(30,64,175,.12),
            transparent 30%
        ),

        linear-gradient(
            180deg,
            #010207 0%,
            #020817 45%,
            #01030a 100%
        );

    overflow-x:hidden;
}


/* =========================================================
   GAME LIGHTS
========================================================= */

body::before{

    content:"";

    position:fixed;

    inset:0;

    pointer-events:none;

    z-index:-1;

    background:

        linear-gradient(
            110deg,
            transparent 35%,
            rgba(56,189,248,.035) 50%,
            transparent 65%
        );

    animation:
        stageLight 7s ease-in-out infinite;

}

@keyframes stageLight{

    0%,100%{
        transform:translateX(-15%);
    }

    50%{
        transform:translateX(15%);
    }

}


/* =========================================================
   LOADING
========================================================= */

#loadingScreen{

    position:fixed;

    inset:0;

    z-index:9999;

    display:flex;

    justify-content:center;

    align-items:center;

    background:

        radial-gradient(
            circle,
            #09245a,
            #020617 55%
        );

}

.loader-box{

    width:min(90%,400px);

    text-align:center;

    padding:35px;

}

.loader-ring{

    width:75px;

    height:75px;

    border-radius:50%;

    border:4px solid
        rgba(255,255,255,.10);

    border-top-color:
        var(--gold);

    border-right-color:
        var(--blue2);

    animation:
        spin .9s linear infinite;

    margin:
        0 auto 25px;

    box-shadow:
        0 0 35px
        rgba(250,204,21,.22);

}

.loader-title{

    font-size:26px;

    font-weight:1000;

    letter-spacing:.5px;

}

.loading-text{

    color:var(--muted);

    margin-top:8px;

    font-size:14px;

}

@keyframes spin{

    to{
        transform:rotate(360deg);
    }

}


/* =========================================================
   ERROR
========================================================= */

#errorScreen{

    position:fixed;

    inset:0;

    z-index:9998;

    display:none;

    align-items:center;

    justify-content:center;

    padding:20px;

    background:#020617;

}

.error-card{

    width:min(100%,430px);

    padding:30px;

    border-radius:25px;

    text-align:center;

    background:

        linear-gradient(
            145deg,
            rgba(15,23,42,.98),
            rgba(2,6,23,.98)
        );

    border:
        1px solid
        rgba(239,68,68,.35);

    box-shadow:
        0 30px 90px
        rgba(0,0,0,.6);

}

.error-icon{

    font-size:50px;

    margin-bottom:15px;

}

.error-title{

    font-size:24px;

    font-weight:1000;

}

.error-message{

    color:#cbd5e1;

    margin-top:10px;

    line-height:1.65;

    font-size:14px;

    white-space:pre-wrap;

}

.retry-btn{

    width:100%;

    margin-top:22px;

    padding:14px;

    border:0;

    border-radius:14px;

    color:#fff;

    font-weight:900;

    cursor:pointer;

    background:

        linear-gradient(
            135deg,
            #2563eb,
            #1d4ed8
        );

}


/* =========================================================
   MAIN
========================================================= */

#game{

    display:none;

    min-height:100vh;

}


/* =========================================================
   TOP BAR
========================================================= */

.topbar{

    position:sticky;

    top:0;

    z-index:100;

    height:68px;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:0 18px;

    background:
        rgba(2,6,23,.86);

    backdrop-filter:
        blur(18px);

    border-bottom:
        1px solid
        rgba(148,163,184,.12);

}

.brand{

    display:flex;

    align-items:center;

    gap:10px;

}

.brand-orb{

    width:40px;

    height:40px;

    border-radius:50%;

    display:flex;

    align-items:center;

    justify-content:center;

    font-size:11px;

    font-weight:1000;

    color:#172554;

    background:

        radial-gradient(
            circle at 35% 25%,
            white 0%,
            #fde68a 15%,
            #facc15 35%,
            #f59e0b 65%,
            #92400e 100%
        );

    box-shadow:

        0 0 20px
        rgba(250,204,21,.45),

        inset 0 0 8px
        rgba(255,255,255,.7);

}

.brand-name{

    font-size:16px;

    font-weight:1000;

}

.brand-sub{

    margin-top:2px;

    color:#64748b;

    font-size:9px;

    letter-spacing:1.6px;

    text-transform:uppercase;

}

.user-area{

    display:flex;

    align-items:center;

    gap:8px;

}

.coin-box{

    display:flex;

    align-items:center;

    gap:6px;

    padding:8px 13px;

    border-radius:999px;

    background:
        rgba(250,204,21,.08);

    border:
        1px solid
        rgba(250,204,21,.28);

    color:var(--gold);

    font-size:13px;

    font-weight:1000;

}


/* =========================================================
   LAYOUT
========================================================= */

.layout{

    width:min(1280px,100%);

    margin:auto;

    display:grid;

    grid-template-columns:
        minmax(0,1fr)
        275px;

    gap:22px;

    padding:22px;

}

.main-stage{

    min-width:0;

}


/* =========================================================
   GAME HEADER
========================================================= */

.game-header{

    display:flex;

    justify-content:space-between;

    align-items:center;

    margin-bottom:14px;

}

.question-counter{

    color:#cbd5e1;

    font-size:13px;

}

.question-counter strong{

    color:white;

    font-size:22px;

    margin:0 3px;

}

.topic-badge{

    max-width:55%;

    overflow:hidden;

    text-overflow:ellipsis;

    white-space:nowrap;

    padding:7px 12px;

    border-radius:999px;

    color:#7dd3fc;

    background:
        rgba(56,189,248,.07);

    border:
        1px solid
        rgba(56,189,248,.24);

    font-size:11px;

    font-weight:900;

}


/* =========================================================
   HOT SEAT STAGE
========================================================= */

.stage{

    position:relative;

    margin-bottom:18px;

    padding:12px;

    border-radius:28px;

    background:

        radial-gradient(
            ellipse at 50% 100%,
            rgba(37,99,235,.22),
            transparent 55%
        );

}

.stage::before{

    content:"";

    position:absolute;

    left:50%;

    bottom:-15px;

    transform:translateX(-50%);

    width:65%;

    height:50px;

    background:
        radial-gradient(
            ellipse,
            rgba(37,99,235,.25),
            transparent 70%
        );

    filter:blur(10px);

    pointer-events:none;

}


/* =========================================================
   TIMER
========================================================= */

.timer-row{

    display:flex;

    justify-content:center;

    margin:
        4px 0 22px;

}

.timer{

    width:82px;

    height:82px;

    position:relative;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:50%;

    background:

        radial-gradient(
            circle,
            #071936 52%,
            #020617 53%
        );

    border:
        3px solid
        rgba(59,130,246,.28);

    box-shadow:

        0 0 30px
        rgba(37,99,235,.18),

        inset 0 0 25px
        rgba(37,99,235,.15);

}

.timer::before{

    content:"";

    position:absolute;

    inset:-5px;

    border-radius:50%;

    border:
        4px solid
        var(--blue2);

    border-right-color:
        transparent;

    border-bottom-color:
        rgba(56,189,248,.15);

    transform:rotate(-35deg);

}

.timer.warning{

    border-color:
        rgba(239,68,68,.45);

}

.timer.warning::before{

    border-color:
        var(--red);

    border-right-color:
        transparent;

    animation:
        timerPulse .6s infinite;

}

.timer-number{

    font-size:26px;

    font-weight:1000;

    z-index:1;

}

.timer-label{

    position:absolute;

    bottom:-21px;

    color:#64748b;

    font-size:8px;

    text-transform:uppercase;

    letter-spacing:1px;

}

@keyframes timerPulse{

    50%{
        transform:
            rotate(-35deg)
            scale(1.06);
    }

}


/* =========================================================
   QUESTION CARD
========================================================= */

.question-card{

    position:relative;

    padding:
        34px 26px 24px;

    border-radius:28px;

    background:

        radial-gradient(
            circle at 50% 0%,
            rgba(37,99,235,.20),
            transparent 45%
        ),

        linear-gradient(
            145deg,
            rgba(12,29,62,.98),
            rgba(2,8,25,.98)
        );

    border:
        1px solid
        rgba(96,165,250,.30);

    box-shadow:

        0 30px 90px
        rgba(0,0,0,.55),

        inset 0 0 60px
        rgba(37,99,235,.035);

    overflow:hidden;

}

.question-card::before{

    content:"";

    position:absolute;

    top:-190px;

    left:50%;

    transform:
        translateX(-50%);

    width:400px;

    height:400px;

    border-radius:50%;

    background:

        radial-gradient(
            circle,
            rgba(56,189,248,.15),
            transparent 68%
        );

    pointer-events:none;

}

.question-card::after{

    content:"";

    position:absolute;

    left:0;

    right:0;

    top:0;

    height:1px;

    background:

        linear-gradient(
            90deg,
            transparent,
            rgba(56,189,248,.7),
            transparent
        );

}

.question-label{

    position:relative;

    text-align:center;

    color:#60a5fa;

    font-size:10px;

    letter-spacing:2.4px;

    text-transform:uppercase;

    font-weight:1000;

    margin-bottom:19px;

}

.question-text{

    position:relative;

    text-align:center;

    max-width:900px;

    margin:auto;

    font-size:
        clamp(20px,3vw,30px);

    line-height:1.5;

    font-weight:800;

    min-height:70px;

    display:flex;

    align-items:center;

    justify-content:center;

}


/* =========================================================
   QUESTION REVEAL
========================================================= */

.question-reveal{

    animation:
        questionReveal .55s ease;

}

@keyframes questionReveal{

    from{

        opacity:0;

        transform:
            translateY(12px)
            scale(.98);

        filter:blur(7px);

    }

    to{

        opacity:1;

        transform:none;

        filter:none;

    }

}


/* =========================================================
   OPTIONS
========================================================= */

.options{

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:13px;

    margin-top:26px;

}

.option{

    position:relative;

    min-height:72px;

    display:flex;

    align-items:center;

    gap:13px;

    padding:13px 15px;

    border-radius:17px;

    border:
        1px solid
        rgba(96,165,250,.25);

    background:

        linear-gradient(
            145deg,
            rgba(15,23,42,.96),
            rgba(7,20,47,.92)
        );

    color:#f8fafc;

    cursor:pointer;

    transition:
        transform .18s ease,
        border .18s ease,
        background .18s ease,
        box-shadow .18s ease;

    text-align:left;

    overflow:hidden;

}

.option::before{

    content:"";

    position:absolute;

    inset:0;

    background:

        linear-gradient(
            90deg,
            transparent,
            rgba(56,189,248,.06),
            transparent
        );

    transform:
        translateX(-100%);

    transition:.5s;

}

.option:hover::before{

    transform:
        translateX(100%);

}

.option:hover{

    transform:
        translateY(-2px);

    border-color:
        rgba(56,189,248,.8);

    box-shadow:
        0 10px 28px
        rgba(14,165,233,.12);

}

.option-letter{

    flex:0 0 38px;

    width:38px;

    height:38px;

    border-radius:50%;

    display:flex;

    align-items:center;

    justify-content:center;

    border:
        1px solid
        rgba(250,204,21,.45);

    color:var(--gold);

    font-weight:1000;

    background:
        rgba(250,204,21,.06);

}

.option-text{

    font-size:14px;

    line-height:1.45;

    font-weight:650;

}

.option.selected{

    border-color:
        var(--gold);

    background:

        linear-gradient(
            135deg,
            rgba(30,58,138,.95),
            rgba(8,47,73,.95)
        );

    box-shadow:

        0 0 0 1px
        rgba(250,204,21,.20),

        0 0 30px
        rgba(250,204,21,.10);

}

.option.locked{

    cursor:default;

}

.option.correct{

    border-color:
        var(--green) !important;

    background:

        linear-gradient(
            135deg,
            rgba(20,100,55,.9),
            rgba(8,60,40,.85)
        ) !important;

    box-shadow:

        0 0 25px
        rgba(34,197,94,.20);

    animation:
        correctFlash .65s ease;

}

.option.wrong{

    border-color:
        var(--red) !important;

    background:

        linear-gradient(
            135deg,
            rgba(120,25,35,.85),
            rgba(65,15,25,.85)
        ) !important;

    animation:
        wrongShake .45s ease;

}

.option.hidden-option{

    visibility:hidden;

    pointer-events:none;

}

@keyframes correctFlash{

    0%{
        transform:scale(1);
    }

    40%{
        transform:scale(1.025);
    }

    100%{
        transform:scale(1);
    }

}

@keyframes wrongShake{

    0%,100%{
        transform:translateX(0);
    }

    25%{
        transform:translateX(-6px);
    }

    75%{
        transform:translateX(6px);
    }

}


/* =========================================================
   LOCK ANIMATION
========================================================= */

.locking{

    animation:
        lockPulse .5s ease;

}

@keyframes lockPulse{

    50%{
        transform:scale(.96);
        box-shadow:
            0 0 35px
            rgba(250,204,21,.45);
    }

}


/* =========================================================
   ACTIONS
========================================================= */

.actions{

    display:flex;

    justify-content:center;

    gap:10px;

    flex-wrap:wrap;

    margin-top:20px;

}

.lock-btn{

    min-width:205px;

    padding:15px 24px;

    border:0;

    border-radius:999px;

    background:

        linear-gradient(
            135deg,
            #fde047,
            #f59e0b
        );

    color:#172554;

    font-weight:1000;

    font-size:14px;

    cursor:pointer;

    box-shadow:

        0 10px 35px
        rgba(245,158,11,.20);

    transition:.18s;

}

.lock-btn:not(:disabled):hover{

    transform:
        translateY(-2px);

    box-shadow:

        0 15px 40px
        rgba(245,158,11,.35);

}

.lock-btn:disabled{

    opacity:.35;

    cursor:not-allowed;

}

.quit-btn{

    padding:13px 19px;

    border-radius:999px;

    background:transparent;

    border:
        1px solid
        rgba(148,163,184,.25);

    color:#cbd5e1;

    font-weight:750;

    cursor:pointer;

}


/* =========================================================
   LIFELINES
========================================================= */

.lifelines{

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:9px;

    margin-top:19px;

}

.life{

    position:relative;

    padding:12px 5px;

    border-radius:14px;

    border:
        1px solid
        rgba(148,163,184,.2);

    background:
        rgba(15,23,42,.72);

    color:#e2e8f0;

    text-align:center;

    cursor:pointer;

    font-size:11px;

    font-weight:850;

    transition:.18s;

}

.life:hover{

    border-color:
        rgba(56,189,248,.55);

    transform:
        translateY(-2px);

}

.life-icon{

    display:block;

    font-size:19px;

    margin-bottom:4px;

}

.life.used{

    opacity:.28;

    filter:grayscale(1);

    pointer-events:none;

}


/* =========================================================
   PROGRESS
========================================================= */

.progress-box{

    margin-top:20px;

}

.progress-top{

    display:flex;

    justify-content:space-between;

    color:#64748b;

    font-size:10px;

    margin-bottom:7px;

}

.progress{

    height:5px;

    background:#0f172a;

    border-radius:999px;

    overflow:hidden;

}

.progress-bar{

    height:100%;

    width:0%;

    background:

        linear-gradient(
            90deg,
            #2563eb,
            #38bdf8,
            #facc15
        );

    transition:
        width .45s ease;

}


/* =========================================================
   LADDER
========================================================= */

.ladder{

    position:sticky;

    top:88px;

    padding:17px;

    border-radius:23px;

    background:

        linear-gradient(
            145deg,
            rgba(15,23,42,.96),
            rgba(2,6,23,.96)
        );

    border:
        1px solid
        rgba(148,163,184,.16);

    box-shadow:
        0 20px 60px
        rgba(0,0,0,.35);

}

.ladder-title{

    text-align:center;

    color:var(--gold);

    font-size:13px;

    font-weight:1000;

    letter-spacing:1.2px;

    margin-bottom:12px;

}

.level{

    position:relative;

    display:flex;

    align-items:center;

    justify-content:space-between;

    padding:9px 11px;

    border-radius:10px;

    margin-bottom:4px;

    color:#64748b;

    font-size:12px;

    transition:
        .35s ease;

}

.level.safe{

    color:#facc15;

}

.level.completed{

    color:#dbeafe;

}

.level.current{

    color:white;

    background:

        linear-gradient(
            90deg,
            rgba(37,99,235,.48),
            rgba(30,64,175,.15)
        );

    border:
        1px solid
        rgba(96,165,250,.4);

    box-shadow:
        0 0 18px
        rgba(37,99,235,.12);

}

.level.completed::after{

    content:"✓";

    position:absolute;

    right:8px;

    color:var(--green);

    font-weight:1000;

}

.level.climbing{

    animation:
        ladderClimb .8s ease;

    background:

        linear-gradient(
            90deg,
            rgba(250,204,21,.25),
            rgba(245,158,11,.06)
        );

    color:#fff;

    box-shadow:

        0 0 25px
        rgba(250,204,21,.25);

}

.level-number{

    font-weight:900;

}

.level-prize{

    font-weight:900;

}

@keyframes ladderClimb{

    0%{
        transform:
            scale(.9)
            translateY(10px);

        opacity:.5;
    }

    50%{
        transform:
            scale(1.06)
            translateY(-2px);
    }

    100%{
        transform:
            scale(1)
            translateY(0);

        opacity:1;
    }

}


/* =========================================================
   LADDER CLIMB OVERLAY
========================================================= */

#climbOverlay{

    position:fixed;

    inset:0;

    z-index:3500;

    display:none;

    align-items:center;

    justify-content:center;

    pointer-events:none;

    background:

        radial-gradient(
            circle,
            rgba(250,204,21,.08),
            transparent 45%
        );

}

#climbOverlay.show{

    display:flex;

    animation:
        overlayFlash .9s ease;

}

.climb-content{

    text-align:center;

}

.climb-small{

    color:#fef08a;

    font-size:13px;

    letter-spacing:3px;

    text-transform:uppercase;

    font-weight:1000;

}

.climb-level{

    margin-top:7px;

    font-size:clamp(48px,12vw,90px);

    line-height:1;

    font-weight:1000;

    color:var(--gold);

    text-shadow:

        0 0 20px
        rgba(250,204,21,.55),

        0 0 60px
        rgba(245,158,11,.25);

}

.climb-prize{

    margin-top:8px;

    font-size:20px;

    font-weight:900;

    color:white;

}

@keyframes overlayFlash{

    0%{
        opacity:0;
        transform:scale(.96);
    }

    25%{
        opacity:1;
        transform:scale(1);
    }

    75%{
        opacity:1;
    }

    100%{
        opacity:0;
    }

}


/* =========================================================
   MODAL
========================================================= */

.modal{

    position:fixed;

    inset:0;

    z-index:3000;

    display:none;

    align-items:center;

    justify-content:center;

    padding:18px;

    background:
        rgba(0,0,0,.78);

    backdrop-filter:
        blur(12px);

}

.modal.show{

    display:flex;

}

.modal-card{

    width:min(100%,470px);

    max-height:90vh;

    overflow:auto;

    padding:29px;

    border-radius:27px;

/* =========================================================

let audioContext = null;


function ensureAudio(){

    try{

        if(!audioContext){

            audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

        }


        if(
            audioContext.state ===
            "suspended"
        ){

            audioContext.resume();

        }

    }catch(error){

        console.log(
            "Audio unavailable"
        );

    }

}


/* =========================================================
   BASIC TONE
========================================================= */

function tone(
    frequency,
    duration,
    type="sine",
    volume=.045
){

    try{

        ensureAudio();

        if(!audioContext){
            return;
        }


        const oscillator =
            audioContext.createOscillator();

        const gain =
            audioContext.createGain();


        oscillator.type =
            type;

        oscillator.frequency.setValueAtTime(
            frequency,
            audioContext.currentTime
        );


        gain.gain.setValueAtTime(
            .0001,
            audioContext.currentTime
        );


        gain.gain.exponentialRampToValueAtTime(
            volume,
            audioContext.currentTime + .015
        );


        gain.gain.exponentialRampToValueAtTime(
            .0001,
            audioContext.currentTime + duration
        );


        oscillator.connect(gain);

        gain.connect(
            audioContext.destination
        );


        oscillator.start();

        oscillator.stop(
            audioContext.currentTime +
            duration
        );

    }catch(error){}

}

/* =========================================================
   SHUFFLE
========================================================= */

function shuffleArray(array){

    for(
        let i=array.length-1;
        i>0;
        i--
    ){

        const j =
            Math.floor(
                Math.random() *
                (i+1)
            );


        [
            array[i],
            array[j]
        ] =
        [
            array[j],
            array[i]
        ];

    }

    return array;

}


/* =========================================================
   NORMALIZE
========================================================= */

function normalizeText(value){

    return String(
        value ?? ""
    )
    .normalize("NFKC")
    .trim()
    .replace(
        /\s+/g,
        " "
    )
    .toLocaleLowerCase();

}


/* =========================================================
   PARSE OPTIONS
========================================================= */

function parseOptions(raw){

    if(Array.isArray(raw)){

        return raw.map(
            item => {

                if(
                    typeof item ===
                    "object" &&
                    item !== null
                ){

                    return String(
                        item.label ??
                        item.text ??
                        item.value ??
                        ""
                    );

                }

                return String(item);

            }
        );

    }


    if(
        typeof raw ===
        "string"
    ){

        try{

            const parsed =
                JSON.parse(raw);


            if(
                Array.isArray(parsed)
            ){

                return parsed.map(
                    item => {

                        if(
                            typeof item ===
                            "object" &&
                            item !== null
                        ){

                            return String(
                                item.label ??
                                item.text ??
                                item.value ??
                                ""
                            );

                        }

                        return String(item);

                    }
                );

            }

        }catch(error){

            console.warn(
                "Options parse error:",
                error
            );

        }

    }


    return [];

}


/* =========================================================
   FIND CORRECT INDEX
========================================================= */

function getCorrectIndex(
    question,
    options
){

    const raw =
        String(
            question.answer ??
            ""
        ).trim();


    if(!raw){
        return -1;
    }


    const normalized =
        normalizeText(raw);


    const exact =
        options.findIndex(
            option =>
                normalizeText(option) ===
                normalized
        );


    if(exact >= 0){

        return exact;

    }


    if(
        /^[ABCD]$/i.test(raw)
    ){

        return (
            raw
                .toUpperCase()
                .charCodeAt(0) - 65
        );

    }


    if(
        /^\d+$/.test(raw)
    ){

        const number =
            Number(raw);


        if(
            number >= 0 &&
            number <= 3
        ){

            return number;

        }


        if(
            number >= 1 &&
            number <= 4
        ){

            return number - 1;

        }

    }


    return -1;

}


/* =========================================================
   LOAD SUPABASE QUESTIONS
========================================================= */

async function loadQuizBank(){

    console.log(
        "📡 Loading from Supabase..."
    );


    const {
        data,
        error
    } =
    await supabase
        .from("quizzes")
        .select(
            "id,topic,question,options,answer,explanation"
        );


    if(error){

        throw new Error(
            "Supabase error: " +
            error.message
        );

    }


    if(
        !data ||
        data.length === 0
    ){

        throw new Error(
            "quizzes table मा कुनै प्रश्न भेटिएन।"
        );

    }


    const valid =
        data.filter(
            question => {

                const options =
                    parseOptions(
                        question.options
                    );


                const answerIndex =
                    getCorrectIndex(
                        question,
                        options
                    );


                return (

                    question.id != null &&

                    String(
                        question.question ??
                        ""
                    ).trim() !== "" &&

                    options.length >= 4 &&

                    answerIndex >= 0

                );

            }
        );


    if(
        valid.length === 0
    ){

        throw new Error(
            "Questions भेटिए तर options/answer format गलत छ।"
        );

    }


    return valid;

}

   LOAD PLAYED QUESTIONS

async function loadPlayedQuestions(){

    if(!currentUser){

        throw new Error(
            "Firebase user भेटिएन।"
        );

    }


    const played =
        new Set();


    const ref =
        collection(
            db,
            "users",
            currentUser.uid,
            "played_questions"
        );


    const snapshot =
        await getDocs(ref);


    snapshot.forEach(
        item => {

            played.add(
                String(
                    item.id
                )
            );

        }
    );


    return played;

}


/* =========================================================
   START GAME
========================================================= */

async function startGame(){

    try{

        showLoading(
            "Hot Seat तयार हुँदैछ..."
        );


        hideErrorScreen();


        if(!currentUser){

            throw new Error(
                "Login आवश्यक छ।"
            );

        }


        allValidQuestions =
            await loadQuizBank();


        playedIds =
            await loadPlayedQuestions();


        const unseen =
            allValidQuestions.filter(
                question =>
                    !playedIds.has(
                        String(question.id)
                    )
            );


        if(
            unseen.length === 0
        ){

            showNoQuestions();

            return;

        }


        shuffleArray(
            unseen
        );


        gameQuestions =
            unseen.slice(
                0,
                Math.min(
                    10,
                    unseen.length
                )
            );


        currentQuestionIndex = 0;

        selectedAnswerIndex = null;

        locked = false;

        gameOver = false;

        payoutDone = false;

        currentGameId =
            generateGameId();


        resetLifelines();

        renderLadder();


        hideLoading();


        game.style.display =
            "block";


        await showQuestion();


    }catch(error){

        console.error(
            "QUIZ LOAD ERROR:",
            error
        );


        showErrorScreen(

            "Quiz load हुन सकेन।\n\n" +

            error.message +

            "\n\n" +

            "Supabase table, RLS policy र Firebase login check गर्नुहोस्।"

        );

    }

}

/* =========================================================
   SHOW QUESTION
========================================================= */

async function showQuestion(){

    clearTimer();


    if(
        currentQuestionIndex >=
        gameQuestions.length
    ){

        await finishGame();

        return;

    }


    const question =
        gameQuestions[
            currentQuestionIndex
        ];


    selectedAnswerIndex =
        null;

    locked =
        false;


    const options =
        parseOptions(
            question.options
        );


    questionNumber.textContent =
        currentQuestionIndex + 1;


    topicBadge.textContent =
        question.topic ||
        "General";


    questionText.classList.remove(
        "question-reveal"
    );


    void questionText.offsetWidth;


    questionText.textContent =
        question.question;


    questionText.classList.add(
        "question-reveal"
    );


    optionsBox.innerHTML =
        "";


    options.forEach(
        (optionText,index) => {

            const button =
                document.createElement(
                    "button"
                );


            button.className =
                "option";


            button.dataset.index =
                index;


            const letter =
                document.createElement(
                    "span"
                );


            letter.className =
                "option-letter";


            letter.textContent =
                String.fromCharCode(
                    65 + index
                );


            const text =
                document.createElement(
                    "span"
                );


            text.className =
                "option-text";


            text.textContent =
                optionText;


            button.appendChild(
                letter
            );

            button.appendChild(
                text
            );


            button.addEventListener(
                "click",
                () =>
                    selectAnswer(index)
            );


            optionsBox.appendChild(
                button
            );

        }
    );


    lockBtn.disabled =
        true;


    const progress =
        (
            currentQuestionIndex /
            gameQuestions.length
        ) * 100;


    progressBar.style.width =
        progress + "%";


    progressText.textContent =
        Math.round(progress) +
        "%";


    renderLadder();


    /*
       IMPORTANT:
       Mark as played as soon as
       question is shown.
    */

    try{

        await markQuestionPlayed(
            question
        );

    }catch(error){

        console.error(
            "Played question save error:",
            error
        );


        /*
           We stop here because otherwise
           the no-repeat guarantee is not
           reliable.
        */

        throw new Error(
            "Question history save हुन सकेन। Firebase rules/database check गर्नुहोस्।"
        );

    }


    startTimer();

}


/* =========================================================
   SELECT ANSWER
========================================================= */

function selectAnswer(index){

    if(
        locked ||
        gameOver
    ){

        return;

    }


    ensureAudio();


    selectedAnswerIndex =
        index;


    document
        .querySelectorAll(".option")
        .forEach(
            button =>
                button.classList.remove(
                    "selected"
                )
        );


    const selected =
        document.querySelector(
            `.option[data-index="${index}"]`
        );


    if(selected){

        selected.classList.add(
            "selected"
        );

    }


    lockBtn.disabled =
        false;


    playSelectSound();

}


/* =========================================================
   LOCK ANSWER
========================================================= */

async function lockAnswer(){

    if(
        locked ||
        selectedAnswerIndex === null ||
        gameOver
    ){

        return;

    }


    locked = true;

    clearTimer();

    ensureAudio();


    lockBtn.classList.add(
        "locking"
    );


    lockBtn.disabled =
        true;


    document
        .querySelectorAll(".option")
        .forEach(
            option =>
                option.classList.add(
                    "locked"
                )
        );


    playLockSound();


    /*
       Dramatic pause before reveal
    */

    await wait(1050);


    const question =
        gameQuestions[
            currentQuestionIndex
        ];


    const options =
        parseOptions(
            question.options
        );


    const correctIndex =
        getCorrectIndex(
            question,
            options
        );


    const selected =
        selectedAnswerIndex;


    if(
        selected === correctIndex
    ){

        await handleCorrectAnswer(
            correctIndex
        );

    }else{

        await handleWrongAnswer(
            selected,
            correctIndex
        );

    }

}


/* =========================================================
   CORRECT ANSWER
========================================================= */

async function handleCorrectAnswer(
    correctIndex
){

    const option =
        document.querySelector(
            `.option[data-index="${correctIndex}"]`
        );


    if(option){

        option.classList.add(
            "correct"
        );

    }


    playCorrectSound();


    const prize =
        PRIZES[
            currentQuestionIndex
        ];


    /*
       Suspense pause after
       answer reveal
    */

    await wait(700);


    showToast(
        "✓ सही उत्तर! +" +
        prize.coins +
        " coins"
    );


    /*
       BIG LADDER CLIMB
    */

    await showLadderClimb(
        prize.level,
        prize.coins
    );


    /*
       Advance
    */

    currentQuestionIndex++;


    renderLadder();


    await wait(300);


    if(
        currentQuestionIndex >=
        gameQuestions.length
    ){

        await finishGame();

    }else{

        lockBtn.classList.remove(
            "locking"
        );

        await showQuestion();

    }

}

){

        );

    );

/* =========================================================
   TIMER
========================================================= */

function startTimer(){

    clearTimer();


    timeLeft = 30;


    updateTimer();


    timerInterval =
        setInterval(
            () => {

                timeLeft--;

                updateTimer();


                if(
                    timeLeft <= 10 &&
                    timeLeft > 0
                ){

                    suspenseTick();

                }


                if(
                    timeLeft <= 0
                ){

                    clearTimer();

                    handleTimeOut();

                }

            },
            1000
        );

}


/* =========================================================
   UPDATE TIMER
========================================================= */

function updateTimer(){

    timerNumber.textContent =
        timeLeft;


    if(
        timeLeft <= 10
    ){

        timer.classList.add(
            "warning"
        );

    }else{

        timer.classList.remove(
            "warning"
        );

    }

}


/* =========================================================
   CLEAR TIMER
========================================================= */

function clearTimer(){

    if(timerInterval){

        clearInterval(
            timerInterval
        );

        timerInterval =
            null;

    }

}

========================================================= */

    }


    locked = true;


    lockBtn.disabled =

    const question =
        gameQuestions[
            currentQuestionIndex

        safePrize
    );

}


/* =========================================================
   SAFE PRIZE
========================================================= */

function getSafePrize(
    questionIndex
){

    let safe = 0;


    for(
        let i=0;
        i<questionIndex;
        i++
    ){

        if(
            PRIZES[i] &&
            PRIZES[i].safe
        ){

            safe =
                PRIZES[i].coins;

        }

    }


    return safe;

}


/* =========================================================
   CURRENT WINNINGS
========================================================= */

function getCurrentWinnings(){

    if(
        currentQuestionIndex <= 0
    ){

        return 0;

    }


    return (
        PRIZES[
            currentQuestionIndex - 1
        ]?.coins || 0
    );

}

/* =========================================================
   SAVE COIN HISTORY
========================================================= */

async function saveCoinHistory(
    amount,
    status
){

    if(payoutDone){

        return;

    }


    if(!currentUser){

        showToast(
            "⚠️ Firebase login भेटिएन।"
        );

        return;

    }


    try{

        const historyRef =
            doc(
                db,
                "users",
                currentUser.uid,
                "coin_history",
                currentGameId
            );


        const userRef =
            doc(
                db,
                "users",
                currentUser.uid
            );


        const numericAmount =
            Number(amount || 0);


        const result =
            await runTransaction(
                db,
                async transaction => {

                    const historySnap =
                        await transaction.get(
                            historyRef
                        );


                    /*
                       Idempotency:

                       same gameId already paid?
                       Then do nothing.
                    */

                    if(
                        historySnap.exists()
                    ){

                        return false;

                    }


                    const userSnap =
                        await transaction.get(
                            userRef
                        );


                    let oldCoins = 0;


                    if(
                        userSnap.exists()
                    ){

                        oldCoins =
                            Number(
                                userSnap.data()
                                    ?.coins || 0
                            );

                    }


                    const newCoins =
                        oldCoins +
                        numericAmount;


                    if(
                        userSnap.exists()
                    ){

                        transaction.update(
                            userRef,
                            {

                                coins:
                                    newCoins,

                                updatedAt:
                                    serverTimestamp()

                            }
                        );

                    }else{

                        transaction.set(
                            userRef,
                            {

                                coins:
                                    newCoins,

                                createdAt:
                                    serverTimestamp(),

                                updatedAt:
                                    serverTimestamp()

                            }
                        );

                    }


                    transaction.set(
                        historyRef,
                        {

                            gameId:
                                currentGameId,

                            coins_won:
                                numericAmount,

                            status:
                                status,

                            level:
                                Math.min(
                                    currentQuestionIndex,
                                    10
                                ),

                            question_count:
                                gameQuestions.length,

                            timestamp:
                                serverTimestamp()

                        }
                    );


                    return true;

                }
            );


        payoutDone = true;


        if(result){

            await refreshCoinBalance();

        }


    }catch(error){

        console.error(
            "COIN SAVE ERROR:",
            error
        );


        showToast(
            "⚠️ Coin save हुन सकेन।"
        );

    }

}

/* =========================================================
   50:50
========================================================= */

function useFifty(){

    if(
        lifelines.fifty ||
        locked ||
        gameOver
    ){

        return;

    }


    const question =
        gameQuestions[
            currentQuestionIndex
        ];


    const options =
        parseOptions(
            question.options
        );


    const correct =
        getCorrectIndex(
            question,
            options
        );


    if(correct < 0){
        return;
    }


    const wrong =
        options
            .map(
                (_,index) =>
                    index
            )
            .filter(
                index =>
                    index !== correct
            );


    shuffleArray(wrong);


    wrong
        .slice(0,2)
        .forEach(
            index => {

                const button =
                    document.querySelector(
                        `.option[data-index="${index}"]`
                    );


                if(button){

                    button.classList.add(
                        "hidden-option"
                    );

                }

            }
        );


    lifelines.fifty = true;


    document
        .getElementById(
            "fiftyBtn"
        )
        .classList.add(
            "used"
        );


    tone(
        600,
        .15
    );


    showToast(
        "50:50 प्रयोग गरियो"
    );

}


/* =========================================================
   AUDIENCE
========================================================= */

function useAudience(){

    if(
        lifelines.audience ||
        locked ||
        gameOver
    ){

        return;

    }


    const question =
        gameQuestions[
            currentQuestionIndex
        ];


    const options =
        parseOptions(
            question.options
        );


    const correct =
        getCorrectIndex(
            question,
            options
        );


    if(correct < 0){
        return;
    }


    let values =
        [0,0,0,0];


    let remaining = 100;


    const correctPercent =
        Math.floor(
            42 +
            Math.random() * 27
        );


    values[correct] =
        correctPercent;


    remaining -=
        correctPercent;


    const wrong =
        [0,1,2,3]
            .filter(
                index =>
                    index !== correct
            );


    wrong.forEach(
        (index,pos) => {

            if(
                pos ===
                wrong.length - 1
            ){

                values[index] =
                    remaining;

            }else{

                const value =
                    Math.floor(
                        Math.random() *
                        (remaining + 1)
                    );


                values[index] =
                    value;


                remaining -=
                    value;

            }

        }
    );


    lifelines.audience =
        true;


    document
        .getElementById(
            "audienceBtn"
        )
        .classList.add(
            "used"
        );


    showPollModal(
        values,
        options
    );

}

/* =========================================================
   PHONE
========================================================= */

function usePhone(){

    if(
        lifelines.phone ||
        locked ||
        gameOver
    ){

        return;

    }


    const question =
        gameQuestions[
            currentQuestionIndex
        ];


    const options =
        parseOptions(
            question.options
        );


    const correct =
        getCorrectIndex(
            question,
            options
        );


    if(correct < 0){
        return;
    }


    lifelines.phone =
        true;


    document
        .getElementById(
            "phoneBtn"
        )
        .classList.add(
            "used"
        );


    const confidence =
        Math.floor(
            62 +
            Math.random() * 28
        );


    const knowsCorrect =
        Math.random() < .72;


    let suggested;


    if(knowsCorrect){

        suggested =
            correct;

    }else{

        const wrong =
            [0,1,2,3]
                .filter(
                    index =>
                        index !== correct
                );


        suggested =
            wrong[
                Math.floor(
                    Math.random() *
                    wrong.length
                )
            ];

    }


    modalIcon.textContent =
        "📞";


    modalTitle.textContent =
        "Phone-a-Friend";


    modalMessage.innerHTML = `

        तपाईंको साथीले करिब

        <strong>
            ${confidence}%
        </strong>

        confidence का साथ

        <br><br>

        “मलाई लाग्छ उत्तर

        <strong>
            ${String.fromCharCode(
                65 + suggested
            )}
        </strong>

        हुन सक्छ।”

    `;


    modalPrize.textContent =
        "";


    modalButtons.innerHTML =
        "";


    const close =
        document.createElement(
            "button"
        );


    close.className =
        "modal-btn modal-primary";


    close.textContent =
        "ठीक छ";


    close.onclick =
        closeModal;


    modalButtons.appendChild(
        close
    );


    modal.classList.add(
        "show"
    );

}


/* =========================================================
   FLIP
========================================================= */

async function useFlip(){

    if(
        lifelines.flip ||
        locked ||
        gameOver
    ){

        return;

    }


    try{

        const currentId =
            String(
                gameQuestions[
                    currentQuestionIndex
                ].id
            );


        const usedIds =
            new Set(
                gameQuestions
                    .map(
                        question =>
                            String(
                                question.id
                            )
                    )
            );


        /*
           Also exclude every question
           already played by this user.
        */

        const candidates =
            allValidQuestions.filter(
                question =>

                    String(
                        question.id
                    ) !== currentId &&

                    !usedIds.has(
                        String(
                            question.id
                        )
                    ) &&

                    !playedIds.has(
                        String(
                            question.id
                        )
                    )
            );


        if(
            candidates.length === 0
        ){

            showToast(
                "Flip गर्न नयाँ question छैन।"
            );

            return;

        }


        const replacement =
            candidates[
                Math.floor(
                    Math.random() *
                    candidates.length
                )
            ];


        /*
           Current question was already
           marked played.

           Replacement is also immediately
           marked played when shown.
        */

        gameQuestions[
            currentQuestionIndex
        ] =
            replacement;


        lifelines.flip =
            true;


        document
            .getElementById(
                "flipBtn"
            )
            .classList.add(
                "used"
            );


        closeModal();


        tone(
            420,
            .12
        );


        showToast(
            "🔄 नयाँ question!"
        );


        await showQuestion();


    }catch(error){

        console.error(
            "Flip error:",
            error
        );


        showToast(
            "Flip गर्न सकिएन।"
        );

    }

}

/* =========================================================
   LADDER
========================================================= */

function renderLadder(){

    ladderLevels.innerHTML =
        "";


    [...PRIZES]
        .reverse()
        .forEach(
            prize => {

                const div =
                    document.createElement(
                        "div"
                    );


                div.className =
                    "level";


                div.dataset.level =
                    prize.level;


                if(prize.safe){

                    div.classList.add(
                        "safe"
                    );

                }


                const actualIndex =
                    prize.level - 1;


                if(
                    actualIndex <
                    currentQuestionIndex
                ){

                    div.classList.add(
                        "completed"
                    );

                }


                if(
                    actualIndex ===
                    currentQuestionIndex
                ){

                    div.classList.add(
                        "current"
                    );

                }


                div.innerHTML = `

                    <span class="level-number">

                        ${prize.level}

                        ${
                            prize.safe
                                ? " 🔒"
                                : ""
                        }

                    </span>


                    <span class="level-prize">

                        🪙
                        ${prize.coins}

                    </span>

                `;


                ladderLevels.appendChild(
                    div
                );

            }
        );

}
