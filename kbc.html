<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width,
      initial-scale=1.0,
      maximum-scale=1.0,
      user-scalable=no">

<title>LoksewaQuest — Quiz Arena</title>

<style>

/* =========================================================
   GLOBAL
========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    font-family:
        "Segoe UI",
        "Noto Sans Devanagari",
        Arial,
        sans-serif;

    background:
        radial-gradient(
            circle at 50% 35%,
            #102f59 0%,
            #07182d 35%,
            #020914 75%,
            #01050b 100%
        );

    color:#fff;
    overflow-x:hidden;
}


/* =========================================================
   GAME BACKGROUND
========================================================= */

.game-bg{
    position:fixed;
    inset:0;
    pointer-events:none;
    z-index:-2;
}

.game-bg::before{
    content:"";
    position:absolute;
    top:-20%;
    left:50%;
    transform:translateX(-50%);

    width:700px;
    height:700px;

    background:
        radial-gradient(
            ellipse,
            rgba(255,215,80,.16) 0%,
            rgba(255,215,80,.05) 35%,
            transparent 70%
        );

    filter:blur(20px);
}

.game-bg::after{
    content:"";
    position:absolute;
    inset:0;

    background:
        repeating-linear-gradient(
            90deg,
            transparent 0,
            transparent 90px,
            rgba(255,255,255,.012) 91px,
            transparent 92px
        );
}


/* =========================================================
   TOP BAR
========================================================= */

.topbar{
    position:sticky;
    top:0;
    z-index:50;

    display:flex;
    align-items:center;
    justify-content:space-between;

    min-height:64px;

    padding:
        9px
        max(14px, env(safe-area-inset-right))
        9px
        max(14px, env(safe-area-inset-left));

    background:
        linear-gradient(
            180deg,
            rgba(2,8,18,.98),
            rgba(4,14,28,.94)
        );

    border-bottom:1px solid rgba(255,215,90,.35);

    backdrop-filter:blur(14px);
}


/* BRAND */

.brand{
    display:flex;
    align-items:center;
    gap:9px;
}

.brand-icon{
    width:40px;
    height:40px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            circle,
            #fff5bd 0%,
            #d9aa2b 42%,
            #8b5f00 100%
        );

    color:#081224;

    font-size:19px;

    box-shadow:
        0 0 14px rgba(255,205,70,.35);
}

.brand-text strong{
    display:block;

    font-size:14px;
    color:#ffd95a;
    letter-spacing:.5px;
}

.brand-text span{
    display:block;

    font-size:10px;
    color:#8293a9;
    margin-top:1px;
}


/* CURRENT PRIZE */

.current-prize{
    text-align:right;
}

.current-prize small{
    display:block;
    color:#8da0b7;
    font-size:9px;
    text-transform:uppercase;
}

.current-prize strong{
    display:block;
    color:#ffd54d;
    font-size:17px;
    margin-top:1px;
}


/* =========================================================
   MAIN LAYOUT
========================================================= */

.game-layout{
    width:100%;
    max-width:1100px;

    margin:0 auto;

    display:grid;

    grid-template-columns:
        minmax(0,1fr)
        235px;

    gap:22px;

    padding:18px;
}


/* =========================================================
   MAIN GAME
========================================================= */

.main-game{
    min-width:0;
}


/* =========================================================
   TOP INFO
========================================================= */

.game-info{
    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:10px;

    margin-bottom:14px;
}

.topic-pill{
    display:inline-flex;
    align-items:center;

    padding:7px 12px;

    border-radius:20px;

    background:
        rgba(19,52,91,.7);

    border:1px solid rgba(255,215,90,.35);

    color:#eac65a;

    font-size:11px;
    font-weight:700;
}

.question-counter{
    color:#8da0b7;
    font-size:12px;
}


/* =========================================================
   TIMER
========================================================= */

.timer-wrap{
    display:flex;
    justify-content:center;

    margin-bottom:13px;
}

.timer{
    position:relative;

    width:56px;
    height:56px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        radial-gradient(
            circle,
            #102b4d,
            #071527
        );

    border:2px solid #d6a72e;

    box-shadow:
        0 0 20px rgba(214,167,46,.22),
        inset 0 0 12px rgba(255,215,90,.08);

    color:#fff;
    font-size:21px;
    font-weight:800;
}

.timer.warning{
    color:#ffce4b;
    border-color:#ffb300;
    animation:timerPulse .8s infinite;
}

.timer.danger{
    color:#ff5b5b;
    border-color:#ff3e3e;
    animation:timerPulse .45s infinite;
}

@keyframes timerPulse{
    50%{
        transform:scale(1.07);
    }
}


/* =========================================================
   QUESTION
========================================================= */

.question-card{
    position:relative;

    width:100%;

    padding:
        28px
        24px
        27px;

    margin-bottom:18px;

    border-radius:22px;

    background:
        linear-gradient(
            145deg,
            rgba(16,48,84,.98),
            rgba(4,16,31,.98)
        );

    border:
        1px solid
        rgba(255,215,80,.65);

    box-shadow:
        0 0 0 1px rgba(255,255,255,.025),
        0 15px 45px rgba(0,0,0,.45),
        0 0 35px rgba(25,104,180,.12);
}

.question-card::before{
    content:"";

    position:absolute;

    top:0;
    left:12%;
    right:12%;

    height:2px;

    background:
        linear-gradient(
            90deg,
            transparent,
            #f0c94a,
            transparent
        );

    box-shadow:
        0 0 15px #f0c94a;
}

.question-label{
    text-align:center;

    color:#9cb0c7;

    font-size:11px;

    margin-bottom:11px;

    letter-spacing:1.5px;

    text-transform:uppercase;
}

.question-text{
    min-height:62px;

    display:flex;
    align-items:center;
    justify-content:center;

    text-align:center;

    font-size:
        clamp(
            18px,
            3vw,
            25px
        );

    line-height:1.55;

    font-weight:650;

    color:#fff;
}


/* =========================================================
   OPTIONS
========================================================= */

.options{
    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:12px;
}

.option{
    position:relative;

    min-height:60px;

    padding:
        12px
        14px
        12px
        48px;

    border-radius:14px;

    border:
        1px solid
        rgba(96,125,155,.55);

    background:
        linear-gradient(
            145deg,
            rgba(20,48,78,.95),
            rgba(7,20,36,.98)
        );

    color:#fff;

    font-size:15px;

    text-align:left;

    cursor:pointer;

    transition:
        transform .18s,
        border-color .18s,
        background .18s,
        box-shadow .18s;
}

.option:hover:not(:disabled){
    transform:translateY(-2px);

    border-color:#e4bf4d;

    box-shadow:
        0 6px 20px rgba(0,0,0,.25);
}

.option:active:not(:disabled){
    transform:scale(.98);
}

.option-letter{
    position:absolute;

    left:15px;
    top:50%;

    transform:translateY(-50%);

    width:25px;
    height:25px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    border:1px solid #d8ae38;

    color:#eac64f;

    font-size:11px;
    font-weight:800;
}

.option.selected{
    background:
        linear-gradient(
            135deg,
            #765900,
            #d6a82e,
            #806000
        );

    color:#050b12;

    border-color:#ffe797;

    box-shadow:
        0 0 20px rgba(255,202,63,.22);
}

.option.selected .option-letter{
    color:#000;
    border-color:#000;
}

.option.correct{
    background:
        linear-gradient(
            135deg,
            #075e43,
            #0ca66c
        ) !important;

    border-color:#54ffc2 !important;

    animation:
        correctPulse .8s ease;
}

.option.correct .option-letter{
    color:#fff;
    border-color:#fff;
}

.option.wrong{
    background:
        linear-gradient(
            135deg,
            #681e25,
            #b7353d
        ) !important;

    border-color:#ff747b !important;

    animation:
        wrongShake .45s ease;
}

.option.hidden{
    opacity:.12;
    pointer-events:none;
    transform:scale(.96);
}

.option.disabled{
    opacity:.35;
    pointer-events:none;
}

@keyframes correctPulse{
    50%{
        box-shadow:
            0 0 35px rgba(50,255,180,.45);
    }
}

@keyframes wrongShake{
    25%{transform:translateX(-5px)}
    50%{transform:translateX(5px)}
    75%{transform:translateX(-3px)}
}


/* =========================================================
   LIFELINES
========================================================= */

.lifelines{
    display:flex;

    justify-content:center;

    gap:9px;

    margin:
        20px 0
        15px;
}

.lifeline{
    position:relative;

    width:57px;
    height:38px;

    border-radius:20px;

    background:
        linear-gradient(
            145deg,
            #142d49,
            #071526
        );

    border:
        1px solid
        rgba(221,185,65,.6);

    color:#e9c34f;

    cursor:pointer;

    font-size:17px;

    transition:.2s;
}

.lifeline:hover:not(:disabled){
    transform:translateY(-2px);

    background:#1d4269;

    box-shadow:
        0 0 15px rgba(230,190,70,.2);
}

.lifeline:disabled{
    opacity:.28;
    cursor:not-allowed;
    filter:grayscale(1);
}

.lifeline span{
    position:absolute;

    bottom:-15px;
    left:50%;

    transform:translateX(-50%);

    white-space:nowrap;

    font-size:7px;

    color:#687c94;
}


/* =========================================================
   LOCK BUTTON
========================================================= */

.lock-area{
    display:flex;
    justify-content:center;

    margin-top:5px;
}

.lock-btn{
    min-width:190px;

    padding:
        13px 28px;

    border-radius:28px;

    border:
        1px solid
        #ffe27d;

    background:
        linear-gradient(
            135deg,
            #806000,
            #dcb33d,
            #846200
        );

    color:#060b12;

    font-size:15px;
    font-weight:900;

    letter-spacing:.4px;

    cursor:pointer;

    box-shadow:
        0 6px 25px rgba(218,172,52,.2);

    transition:.2s;
}

.lock-btn:hover:not(:disabled){
    transform:translateY(-2px);

    box-shadow:
        0 9px 30px rgba(218,172,52,.3);
}

.lock-btn:disabled{
    opacity:.35;
    cursor:not-allowed;
    filter:saturate(.4);
}


/* =========================================================
   EXPLANATION
========================================================= */

.explanation{
    display:none;

    margin-top:15px;

    padding:13px 15px;

    border-radius:12px;

    background:
        rgba(30,100,75,.18);

    border:
        1px solid
        rgba(55,220,160,.35);

    color:#9cf0cc;

    text-align:center;

    font-size:13px;

    line-height:1.5;
}

.explanation.show{
    display:block;

    animation:
        fadeUp .35s ease;
}


/* =========================================================
   MONEY LADDER
========================================================= */

.ladder{
    align-self:start;

    position:sticky;
    top:82px;

    padding:12px;

    border-radius:18px;

    background:
        linear-gradient(
            180deg,
            rgba(7,20,36,.96),
            rgba(2,10,19,.96)
        );

    border:
        1px solid
        rgba(224,186,62,.35);

    box-shadow:
        0 15px 45px rgba(0,0,0,.3);
}

.ladder-title{
    text-align:center;

    color:#ffd45b;

    font-weight:800;

    font-size:13px;

    padding:
        7px 0 11px;

    border-bottom:
        1px solid
        rgba(255,255,255,.08);

    margin-bottom:8px;
}

.money-list{
    display:flex;

    flex-direction:column-reverse;

    gap:4px;
}

.money-row{
    display:flex;

    justify-content:space-between;
    align-items:center;

    padding:
        7px 10px;

    border-radius:7px;

    color:#71859b;

    font-size:11px;
}

.money-row .amount{
    color:#d7ad3c;

    font-weight:800;
}

.money-row.safe{
    border-top:
        1px solid
        rgba(255,255,255,.15);

    color:#aebbc9;
}

.money-row.active{
    background:
        linear-gradient(
            90deg,
            #b88718,
            #f0ca55,
            #a87512
        );

    color:#000;

    transform:scale(1.02);

    box-shadow:
        0 0 18px rgba(237,194,68,.2);
}

.money-row.active .amount{
    color:#000;
}


/* =========================================================
   RESULT MODAL
========================================================= */

.modal{
    position:fixed;

    inset:0;

    z-index:1000;

    display:none;

    align-items:center;
    justify-content:center;

    padding:20px;

    background:
        rgba(0,4,10,.88);

    backdrop-filter:blur(9px);
}

.modal.show{
    display:flex;
}

.result-card{
    width:min(420px,100%);

    padding:28px 22px;

    text-align:center;

    border-radius:24px;

    background:
        radial-gradient(
            circle at 50% 0%,
            #183e68,
            #07182c 55%,
            #020914
        );

    border:
        1px solid
        #dcb43e;

    box-shadow:
        0 0 50px rgba(223,181,54,.15);
}

.result-icon{
    width:75px;
    height:75px;

    margin:
        0 auto 14px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    font-size:35px;

    background:
        radial-gradient(
            circle,
            #ffe889,
            #c18d16
        );

    color:#08111e;
}

.result-title{
    color:#ffd75c;

    font-size:24px;

    margin-bottom:8px;
}

.result-message{
    color:#b3c0ce;

    font-size:13px;

    line-height:1.5;

    margin-bottom:17px;
}

.final-coins{
    font-size:32px;

    font-weight:900;

    color:#ffd34f;

    margin-bottom:18px;
}

.restart{
    width:100%;

    padding:13px;

    border:none;

    border-radius:25px;

    background:
        linear-gradient(
            135deg,
            #8a660d,
            #e4bd4e,
            #87620a
        );

    color:#050a11;

    font-weight:900;

    cursor:pointer;
}


/* =========================================================
   LOADING
========================================================= */

.loading{
    position:fixed;

    inset:0;

    z-index:2000;

    display:flex;

    flex-direction:column;

    align-items:center;
    justify-content:center;

    background:#020914;
}

.loading.hidden{
    display:none;
}

.loader{
    width:48px;
    height:48px;

    border-radius:50%;

    border:
        3px solid
        rgba(255,255,255,.1);

    border-top-color:#e2b83e;

    animation:
        spin .8s linear infinite;

    margin-bottom:15px;
}

.loading-text{
    color:#aab8c8;

    font-size:13px;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

@keyframes fadeUp{
    from{
        opacity:0;
        transform:translateY(8px);
    }

    to{
        opacity:1;
        transform:none;
    }
}


/* =========================================================
   RESPONSIVE
========================================================= */

@media(max-width:760px){

    .game-layout{
        grid-template-columns:1fr;

        padding:
            14px 12px 25px;
    }

    .ladder{
        position:fixed;

        top:0;
        right:-290px;

        width:275px;

        height:100vh;

        z-index:500;

        border-radius:0;

        transition:.3s;

        overflow-y:auto;

        padding-top:75px;
    }

    .ladder.open{
        right:0;
    }

    .ladder-toggle{
        display:flex;
    }

    .question-card{
        padding:
            23px 15px;
    }

    .options{
        grid-template-columns:1fr;
    }

    .option{
        min-height:57px;

        font-size:14px;
    }

    .brand-text{
        display:none;
    }

    .lifelines{
        gap:7px;
    }

    .lifeline{
        width:53px;
    }
}


/* =========================================================
   DESKTOP LADDER BUTTON
========================================================= */

.ladder-toggle{
    display:none;

    position:fixed;

    right:12px;
    bottom:18px;

    z-index:600;

    width:48px;
    height:48px;

    border-radius:50%;

    background:#d9ae38;

    border:2px solid #fff;

    color:#07111e;

    font-size:18px;
}

@media(max-width:760px){
    .ladder-toggle{
        display:flex;
        align-items:center;
        justify-content:center;
    }
}

</style>
</head>


<body>

<div class="game-bg"></div>


<!-- =======================================================
     LOADING
======================================================= -->

<div class="loading" id="loadingScreen">

    <div class="loader"></div>

    <div class="loading-text">
        Quiz Arena तयार हुँदैछ...
    </div>

</div>


<!-- =======================================================
     TOP BAR
======================================================= -->

<header class="topbar">

    <div class="brand">

        <div class="brand-icon">
            🏆
        </div>

        <div class="brand-text">

            <strong>LOKSEWAQUEST</strong>

            <span>QUIZ ARENA</span>

        </div>

    </div>


    <div class="current-prize">

        <small>Current Winnings</small>

        <strong id="currentPrize">
            🪙 0
        </strong>

    </div>

</header>


<!-- =======================================================
     GAME
======================================================= -->

<main class="game-layout">


<section class="main-game">


    <!-- INFO -->

    <div class="game-info">

        <div
            class="topic-pill"
            id="topic">
            Loksewa
        </div>

        <div
            class="question-counter"
            id="questionCounter">
            Question 1 of 10
        </div>

    </div>


    <!-- TIMER -->

    <div class="timer-wrap">

        <div
            class="timer"
            id="timer">
            30
        </div>

    </div>


    <!-- QUESTION -->

    <div class="question-card">

        <div class="question-label">
            Question for
            <span id="questionPrize">
                10 Coins
            </span>
        </div>

        <div
            class="question-text"
            id="questionText">

            प्रश्न load हुँदैछ...

        </div>

    </div>


    <!-- OPTIONS -->

    <div
        class="options"
        id="options">

        <button
            class="option"
            id="opt0"
            onclick="selectOption(0)">

            <span class="option-letter">
                A
            </span>

            <span class="option-text"></span>

        </button>


        <button
            class="option"
            id="opt1"
            onclick="selectOption(1)">

            <span class="option-letter">
                B
            </span>

            <span class="option-text"></span>

        </button>


        <button
            class="option"
            id="opt2"
            onclick="selectOption(2)">

            <span class="option-letter">
                C
            </span>

            <span class="option-text"></span>

        </button>


        <button
            class="option"
            id="opt3"
            onclick="selectOption(3)">

            <span class="option-letter">
                D
            </span>

            <span class="option-text"></span>

        </button>

    </div>


    <!-- LIFELINES -->

    <div class="lifelines">

        <button
            class="lifeline"
            id="ll5050"
            onclick="use5050()">

            50:50

            <span>HALF</span>

        </button>


        <button
            class="lifeline"
            id="llPhone"
            onclick="usePhone()">

            📞

            <span>PHONE</span>

        </button>


        <button
            class="lifeline"
            id="llAudience"
            onclick="useAudience()">

            👥

            <span>POLL</span>

        </button>


        <button
            class="lifeline"
            id="llFlip"
            onclick="useFlip()">

            🔄

            <span>FLIP</span>

        </button>

    </div>


    <!-- LOCK -->

    <div class="lock-area">

        <button
            class="lock-btn"
            id="lockBtn"
            onclick="lockAnswer()"
            disabled>

            🔒 LOCK ANSWER

        </button>

    </div>


    <!-- EXPLANATION -->

    <div
        class="explanation"
        id="explanation">

    </div>


</section>


<!-- =======================================================
     MONEY LADDER
======================================================= -->

<aside
    class="ladder"
    id="ladder">

    <div class="ladder-title">
        🪙 COIN LADDER
    </div>

    <div
        class="money-list"
        id="moneyList">

    </div>

</aside>


</main>


<!-- MOBILE LADDER BUTTON -->

<button
    class="ladder-toggle"
    onclick="toggleLadder()">

    🪙

</button>


<!-- =======================================================
     RESULT MODAL
======================================================= -->

<div
    class="modal"
    id="resultModal">

    <div class="result-card">

        <div
            class="result-icon"
            id="resultIcon">

            🏆

        </div>

        <h2
            class="result-title"
            id="resultTitle">

            Game Over

        </h2>

        <p
            class="result-message"
            id="resultMessage">

        </p>

        <div
            class="final-coins"
            id="finalCoins">

            🪙 0

        </div>

        <button
            class="restart"
            onclick="restartGame()">

            🎮 PLAY AGAIN

        </button>

    </div>

</div>


<script type="module">

/* =========================================================
   IMPORTS
========================================================= */

import {
    createClient
}
from
'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';


import {
    initializeApp

async function startGame(){

        showLoading(true);

        resetGameState();

        /*
           1. Load user's played questions
        */

        const playedIds =
        await getPlayedQuestionIds();


        /*
           2. Get ALL questions from Supabase
        */

        await fetchQuestions();


        /*
           3. Remove previously played
        */

        const unseenQuestions =
        allQuestions.filter(
            q =>
            !playedIds.has(
                String(q.id)
            )
        );


        /*
           No questions left
        */

        if(unseenQuestions.length === 0){

            showNoQuestions();

            return;
        }


        /*
           Shuffle
        */

        shuffle(unseenQuestions);


        /*
           Pick maximum 10
        */

        questions =
        unseenQuestions.slice(
            0,
            GAME_LENGTH
        );


        /*

        buildMoneyLadder();

           Load first question

        await loadQuestion();


        showLoading(false);

    }
    catch(error){

        console.error(
            "GAME START ERROR:",

        showFatalError(
            "Quiz load हुन सकेन। Internet connection र database check गर्नुहोस्।"

/* =========================================================
   NORMALIZE OPTIONS
========================================================= */

function normalizeOptions(options){

    if(
        Array.isArray(options)
    ){

        return options;

    }


    if(
        typeof options === "string"
    ){

        try{

            const parsed =
            JSON.parse(options);

            if(
                Array.isArray(parsed)
            ){

                return parsed;

            }

        }
        catch(error){

            console.warn(
                "Options JSON parse error",
                error
            );

        }

    }


    return [];

}

/* =========================================================
   FIND CORRECT ANSWER
========================================================= */

function findCorrectIndex(
    answer,
    options
){

    const correct =
    String(
        answer ?? ""
    )
    .trim();


    /*
       If answer is numeric:
       0 / 1 / 2 / 3
    */

    if(
        /^[0-3]$/.test(correct)
    ){

        return Number(correct);

    }


    /*
       If answer is A/B/C/D
    */

    if(
        /^[A-Da-d]$/.test(correct)
    ){

        return (
            correct.toUpperCase()
                .charCodeAt(0)
            -
            65
        );

    }


    /*
       Text match
    */

    const lower =
    correct.toLowerCase();


    return options.findIndex(
        option =>
        String(option)
            .trim()
            .toLowerCase()
            ===
        lower
    );

}


/* =========================================================
   TIMER
========================================================= */

function startTimer(){

    clearInterval(
        timerInterval
    );


    timeLeft =
    QUESTION_TIME;


    updateTimerUI();


    timerInterval =
    setInterval(
        async() => {

            if(
                questionLocked ||
                gameEnded
            ){

                return;

            }


            timeLeft--;

            updateTimerUI();


            if(
                timeLeft <= 0
            ){

                clearInterval(
                    timerInterval
                );


                questionLocked =
                true;


                await handleTimeout();

            }

        },
        1000
    );

}

        "money-row";


        if(
            SAFE_LEVELS.includes(
                level
            )
        ){

            row.classList.add(
                "safe"
            );

        }


        row.id =
        "money-" + i;


        row.innerHTML = `

            <span>
                ${level}
                ${SAFE_LEVELS.includes(level) ? " 🔒" : ""}
            </span>

            <span class="amount">
                🪙 ${coinLadder[i]}
            </span>

        `;


        list.appendChild(
            row
        );

    }


    updateMoneyLadder();

}


/* =========================================================
   UPDATE MONEY LADDER
========================================================= */

function updateMoneyLadder(){

    for(
        let i = 0;
        i < coinLadder.length;
        i++
    ){

        const row =
        document.getElementById(
            "money-" + i
        );


        if(!row){

            continue;

        }


        row.classList.remove(
            "active"
        );


        if(
            i === currentQuestionIndex
        ){

            row.classList.add(
                "active"
            );

        }

    }

}


/* =========================================================
   FINISH GAME
========================================================= */

async function finishGame(
    wonAll,
    message
){

    if(gameEnded){

        return;

    }


    gameEnded =
    true;


    clearInterval(
        timerInterval
    );


    /*
       Final coins
    */

    const finalCoins =
    wonAll
        ? currentWinnings
        : safeWinnings;


    /*
       Save to Firebase
    */

    await saveGameResult(
        finalCoins,
        wonAll
            ? "Completed"
            : "Game Over"
    );


    /*
       Show result
    */

    document
        .getElementById("resultIcon")
        .textContent =
        wonAll
            ? "🏆"
            : "🎯";


    document
        .getElementById("resultTitle")
        .textContent =
        wonAll
            ? "अभिनन्दन! 🎉"
            : "Game Over";


    document
        .getElementById("resultMessage")
        .textContent =
        message;


    document
        .getElementById("finalCoins")
        .textContent =
        `🪙 ${finalCoins}`;


    const restart =
    document.querySelector(
        ".restart"
    );


    restart.textContent =
    "🎮 PLAY AGAIN";


    restart.onclick =
    restartGame;


    document
        .getElementById(
            "resultModal"
        )
        .classList.add(
            "show"
        );

}


/* =========================================================
   SAVE GAME RESULT
========================================================= */

async function saveGameResult(
    coins,
    status
){

    if(
        !currentUser ||
        coins <= 0
    ){

        return;

    }


    /*
       IMPORTANT:
       One gameSessionId = one payout.

       This prevents accidental double
       coin addition if finishGame is
       called twice.
    */

    const historyRef =
    doc(
        db,
        "users",
        currentUser.uid,
        "coin_history",
        gameSessionId
    );


    const userRef =
    doc(
        db,
        "users",
        currentUser.uid
    );


    try{

        await runTransaction(
            db,
            async(transaction) => {

                const historySnap =
                await transaction.get(
                    historyRef
                );


                /*
                   Already paid
                */

                if(
                    historySnap.exists()
                ){

                    console.log(
                        "Game already paid."
                    );

                    return;

                }


                /*
                   Add coins
                */

                transaction.update(
                    userRef,
                    {

                        coins:
                        increment(
                            coins
                        )

                    }
                );


                /*
                   Save history
                */

                transaction.set(
                    historyRef,
                    {

                        coins_won:
                        coins,

                        status:
                        status,

                        gameType:
                        "quiz_arena",

                        gameSessionId:
                        gameSessionId,

                        questionsPlayed:
                        questions.length,

                        createdAt:
                        serverTimestamp()

                    }
                );

            }
        );


        console.log(
            "Coins saved:",
            coins
        );

    }
    catch(error){

        console.error(
            "Coin save failed:",
            error
        );

    }

}

/* =========================================================
   SHUFFLE
========================================================= */

function shuffle(array){

    for(
        let i =
        array.length - 1;
        i > 0;
        i--
    ){

        const j =
        Math.floor(
            Math.random() *
            (i + 1)
        );


        [
            array[i],
            array[j]
        ] =
        [
            array[j],
            array[i]
        ];

    }

    return array;

}


/* =========================================================
   SLEEP
========================================================= */

function sleep(ms){

    return new Promise(
        resolve =>
        setTimeout(
            resolve,
            ms
        )
    );

}
