<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>LoksewaQuest — Quiz Arena</title>

<style>
/* =========================================================
   LOKSEWAQUEST QUIZ ARENA
   Premium Game Show Theme
========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

:root{
    --navy:#020817;
    --navy2:#07152d;
    --blue:#102d58;
    --blue2:#17457d;
    --gold:#f5c542;
    --gold2:#ffd95a;
    --orange:#ff8a00;
    --green:#16c784;
    --red:#ef4444;
    --white:#ffffff;
    --muted:#9fb1c9;
    --border:rgba(245,197,66,.55);
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    font-family:
        "Segoe UI",
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        sans-serif;

    color:white;
    background:
        radial-gradient(circle at 50% 25%,
            rgba(25,72,135,.45),
            transparent 35%),
        radial-gradient(circle at 50% 100%,
            rgba(212,150,20,.12),
            transparent 35%),
        linear-gradient(180deg,#030916 0%,#02050c 100%);

    min-height:100vh;
    overflow-x:hidden;
}

/* =========================================================
   BACKGROUND LIGHTS
========================================================= */

body::before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;

    background:
        radial-gradient(circle at 10% 20%,rgba(255,205,70,.08),transparent 20%),
        radial-gradient(circle at 90% 30%,rgba(30,100,220,.08),transparent 25%);

    z-index:-1;
}

/* =========================================================
   TOP BAR
========================================================= */

.topbar{
    min-height:68px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    gap:10px;
    padding:10px 15px;

    background:
        linear-gradient(180deg,
            rgba(4,13,29,.97),
            rgba(2,8,18,.94));

    border-bottom:1px solid rgba(245,197,66,.45);

    position:sticky;
    top:0;
    z-index:100;
}

.top-left,
.top-right{
    display:flex;
    align-items:center;
    gap:8px;
}

.game-logo{
    font-weight:900;
    font-size:17px;
    color:var(--gold2);
    letter-spacing:.3px;
}

.game-logo span{
    color:white;
}

.top-btn{
    border:1px solid rgba(245,197,66,.55);
    background:rgba(245,197,66,.08);
    color:var(--gold2);

    padding:8px 12px;
    border-radius:22px;

    font-weight:700;
    cursor:pointer;

    transition:.2s;
}

.top-btn:hover{
    background:var(--gold);
    color:#000;
}

.total-coins{
    border:1px solid rgba(245,197,66,.5);
    background:rgba(245,197,66,.08);

    padding:8px 12px;
    border-radius:22px;

    color:var(--gold2);
    font-weight:800;

    white-space:nowrap;
}

/* =========================================================
   MAIN GAME
========================================================= */

.game-shell{
    width:100%;
    max-width:900px;

    margin:0 auto;

    padding:
        18px
        18px
        35px;

    display:flex;
    flex-direction:column;
    align-items:center;
}

/* =========================================================
   PROGRESS
========================================================= */

.progress-area{
    width:100%;
    display:flex;
    align-items:center;
    gap:10px;
    margin-bottom:12px;
}

.question-number{
    color:var(--gold2);
    font-weight:900;
    white-space:nowrap;
}

.progress-track{
    flex:1;
    height:7px;

    background:#15233a;
    border-radius:20px;
    overflow:hidden;
}

.progress-bar{
    height:100%;
    width:10%;

    background:
        linear-gradient(90deg,
            #c28a12,
            #ffd95a,
            #fff1a4);

    border-radius:20px;

    transition:.5s;
}

/* =========================================================
   TIMER
========================================================= */

.timer-wrap{
    position:relative;

    width:86px;
    height:86px;

    margin:8px auto 18px;
}

.timer-ring{
    width:86px;
    height:86px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    background:
        conic-gradient(
            var(--gold2) var(--timer-progress,100%),
            #17253c 0
        );

    box-shadow:
        0 0 25px rgba(245,197,66,.25);
}

.timer-ring::before{
    content:"";

    position:absolute;

    width:70px;
    height:70px;

    background:#050c19;

    border-radius:50%;
}

.timer-number{
    position:relative;
    z-index:2;

    font-size:25px;
    font-weight:900;
    color:white;
}

.timer-danger{
    color:#ff5a5a;
    animation:pulse .8s infinite;
}

@keyframes pulse{
    50%{
        transform:scale(1.1);
    }
}

/* =========================================================
   QUESTION CARD
========================================================= */

.topic{
    padding:5px 14px;

    border-radius:20px;

    color:var(--gold2);
    border:1px solid rgba(245,197,66,.45);

    background:rgba(245,197,66,.07);

    font-size:12px;
    font-weight:800;

    text-transform:uppercase;

    margin-bottom:10px;
}

.question-card{
    width:100%;

    padding:25px 22px;

    text-align:center;

    background:
        linear-gradient(145deg,
            rgba(16,45,88,.96),
            rgba(3,13,30,.98));

    border:
        2px solid rgba(245,197,66,.75);

    border-radius:22px;

    position:relative;

    box-shadow:
        0 0 0 1px rgba(255,255,255,.03),
        0 10px 45px rgba(0,0,0,.55),
        0 0 35px rgba(245,197,66,.08);

    margin-bottom:20px;
}

.question-card::before{
    content:"";

    position:absolute;

    top:-2px;
    left:12%;
    right:12%;

    height:2px;

    background:
        linear-gradient(
            90deg,
            transparent,
            var(--gold2),
            transparent
        );
}

.question-text{
    font-size:clamp(18px,4vw,26px);

    line-height:1.55;

    font-weight:700;
}

/* =========================================================
   OPTIONS
========================================================= */

.options{
    width:100%;

    display:grid;
    grid-template-columns:1fr 1fr;

    gap:14px;
}

.option{
    min-height:68px;

    border:
        1.5px solid rgba(105,145,195,.45);

    background:
        linear-gradient(145deg,
            rgba(16,42,78,.95),
            rgba(6,17,34,.98));

    color:white;

    border-radius:15px;

    padding:13px 16px;

    display:flex;
    align-items:center;

    gap:12px;

    cursor:pointer;

    text-align:left;

    transition:.2s;

    font-size:16px;
}

.option:hover:not(:disabled){
    transform:translateY(-2px);

    border-color:var(--gold2);

    box-shadow:
        0 5px 20px rgba(245,197,66,.12);
}

.option-label{
    width:34px;
    height:34px;

    min-width:34px;

    border-radius:50%;

    display:flex;
    align-items:center;
    justify-content:center;

    border:1px solid var(--gold);

    color:var(--gold2);

    font-weight:900;
}

.option.selected{
    background:
        linear-gradient(145deg,
            #b97d08,
            #f5c542);

    color:#080808;

    border-color:#fff;

    box-shadow:
        0 0 25px rgba(245,197,66,.3);
}

.option.selected .option-label{
    color:#000;
    border-color:#000;
}

.option.correct{
    background:
        linear-gradient(145deg,#087a4e,#16c784) !important;

    border-color:#5cffbd !important;

    animation:correctGlow .8s ease;
}

.option.wrong{
    background:
        linear-gradient(145deg,#8d1616,#ef4444) !important;

    border-color:#ff9b9b !important;

    animation:shake .45s ease;
}

@keyframes correctGlow{
    50%{
        box-shadow:0 0 35px rgba(22,199,132,.65);
    }
}

@keyframes shake{
    25%{transform:translateX(-6px);}
    50%{transform:translateX(6px);}
    75%{transform:translateX(-4px);}
}

.option.hidden{
    visibility:hidden;
    pointer-events:none;
}

/* =========================================================
   ACTION AREA
========================================================= */

.action-area{
    display:flex;
    flex-direction:column;
    align-items:center;

    gap:10px;

    margin-top:20px;
}

.lock-btn{
    min-width:230px;

    border:none;

    padding:14px 30px;

    border-radius:30px;

    background:
        linear-gradient(135deg,
            #d28b0d,
            #ffd95a);

    color:#080808;

    font-size:17px;
    font-weight:900;

    cursor:pointer;

    box-shadow:
        0 8px 25px rgba(245,197,66,.2);

    transition:.2s;
}

.lock-btn:hover:not(:disabled){
    transform:translateY(-2px);

    box-shadow:
        0 10px 35px rgba(245,197,66,.35);
}

.lock-btn:disabled{
    opacity:.35;
    cursor:not-allowed;
}

.status-text{
    color:var(--muted);
    font-size:13px;
}

/* =========================================================
   LIFELINES
========================================================= */

.lifelines{
    width:100%;

    display:grid;
    grid-template-columns:repeat(4,1fr);

    gap:10px;

    margin-top:25px;
}

.lifeline{
    min-height:58px;

    border:
        1px solid rgba(245,197,66,.5);

    border-radius:14px;

    background:
        linear-gradient(145deg,
            rgba(20,47,84,.9),
            rgba(4,15,30,.95));

    color:white;

    font-weight:800;

    cursor:pointer;

    transition:.2s;
}

.lifeline:hover:not(:disabled){
    border-color:var(--gold2);

    color:var(--gold2);

    transform:translateY(-2px);
}

.lifeline:disabled{
    opacity:.3;
    cursor:not-allowed;
}

/* =========================================================
   EXPLANATION
========================================================= */

.explanation{
    width:100%;

    display:none;

    margin-top:16px;

    padding:14px 17px;

    border:
        1px dashed rgba(22,199,132,.7);

    background:rgba(22,199,132,.08);

    border-radius:14px;

    color:#8dffd0;

    line-height:1.6;

    text-align:center;
}

/* =========================================================
   MONEY LADDER
========================================================= */

.overlay{
    position:fixed;

    inset:0;

    background:rgba(0,0,0,.65);

    display:none;

    z-index:500;
}

.overlay.active{
    display:block;
}

.ladder{
    position:fixed;

    top:0;
    right:-330px;

    width:320px;
    height:100vh;

    z-index:600;

    padding:18px;

    background:
        linear-gradient(180deg,
            #07152c,
            #020711);

    border-left:
        1px solid rgba(245,197,66,.6);

    box-shadow:
        -10px 0 40px rgba(0,0,0,.5);

    transition:.35s;

    display:flex;
    flex-direction:column;
}

.ladder.open{
    right:0;
}

.ladder-head{
    display:flex;
    justify-content:space-between;
    align-items:center;

    padding-bottom:15px;

    border-bottom:1px solid rgba(245,197,66,.25);

    margin-bottom:12px;
}

.ladder-title{
    color:var(--gold2);
    font-size:18px;
    font-weight:900;
}

.close-btn{
    background:none;
    border:none;

    color:white;

    font-size:28px;

    cursor:pointer;
}

.money-list{
    list-style:none;

    display:flex;
    flex-direction:column;

    gap:5px;

    overflow:auto;
}

.money-row{
    display:flex;

    justify-content:space-between;
    align-items:center;

    padding:9px 14px;

    border-radius:9px;

    color:#7e91aa;

    font-weight:700;

    transition:.3s;
}

.money-row.safe{
    border-left:3px solid var(--gold);
}

.money-row.current{
    color:#000;

    background:
        linear-gradient(
            90deg,
            #d59a14,
            #ffd95a
        );

    box-shadow:
        0 0 18px rgba(245,197,66,.3);

    transform:scale(1.02);
}

.money-row.current span{
    color:#000;
}

.money-row.completed{
    color:#35dc9b;
}

.safe-label{
    font-size:10px;

    margin-left:5px;

    color:var(--gold2);
}

/* =========================================================
   MODAL
========================================================= */

.modal{
    position:fixed;

    inset:0;

    z-index:1000;

    display:none;

    align-items:center;
    justify-content:center;

    padding:20px;

    background:
        radial-gradient(circle,
            rgba(13,46,92,.7),
            rgba(0,0,0,.92));
}

.modal-card{
    width:100%;
    max-width:440px;

    padding:30px 22px;

    text-align:center;

    border:
        2px solid var(--gold);

    border-radius:25px;

    background:
        linear-gradient(145deg,
            #102e58,
            #030b19);

    box-shadow:
        0 20px 80px rgba(0,0,0,.8),
        0 0 50px rgba(245,197,66,.18);

    animation:modalIn .35s ease;
}

@keyframes modalIn{
    from{
        transform:scale(.8);
        opacity:0;
    }

    to{
        transform:scale(1);
        opacity:1;
    }
}

.modal-icon{
    font-size:55px;
    margin-bottom:8px;
}

.modal-title{
    color:var(--gold2);
    font-size:26px;
    font-weight:900;

    margin-bottom:10px;
}

.modal-desc{
    color:#d7e1ef;

    line-height:1.6;

    margin-bottom:18px;
}

.final-coins{
    font-size:32px;

    color:#ffd95a;

    font-weight:900;

    margin:10px 0 20px;
}

.restart-btn{
    width:100%;

    padding:14px;

    border:none;

    border-radius:28px;

    background:
        linear-gradient(
            135deg,
            #d58d0d,
            #ffd95a
        );

    color:#050505;

    font-weight:900;

    font-size:16px;

    cursor:pointer;
}

/* =========================================================
   LIFELINE MODAL
========================================================= */

.small-modal .modal-card{
    max-width:390px;
}

.poll-bars{
    display:flex;
    flex-direction:column;

    gap:10px;

    margin:18px 0;
}

.poll-row{
    display:grid;
    grid-template-columns:35px 1fr 45px;

    align-items:center;

    gap:8px;
}

.poll-bar{
    height:18px;

    background:#172942;

    border-radius:20px;

    overflow:hidden;
}

.poll-fill{
    height:100%;

    background:
        linear-gradient(
            90deg,
            #bd8211,
            #ffd95a
        );

    border-radius:20px;
}

/* =========================================================
   CONFETTI
========================================================= */

.confetti{
    position:fixed;

    width:8px;
    height:14px;

    top:-20px;

    z-index:2000;

    animation:fall 2.5s linear forwards;
}

@keyframes fall{
    to{
        transform:
            translateY(110vh)
            rotate(720deg);

        opacity:0;
    }
}

/* =========================================================
   MOBILE
========================================================= */

@media(max-width:650px){

    .topbar{
        padding:9px 10px;
    }

    .game-logo{
        font-size:14px;
    }

    .top-btn{
        padding:7px 9px;
        font-size:12px;
    }

    .total-coins{
        font-size:12px;
        padding:7px 9px;
    }

    .game-shell{
        padding:14px 12px 30px;
    }

    .question-card{
        padding:21px 15px;
        border-radius:18px;
    }

    .options{
        grid-template-columns:1fr;
        gap:10px;
    }

    .option{
        min-height:62px;
        font-size:15px;
    }

    .lifelines{
        grid-template-columns:1fr 1fr;
    }

    .lifeline{
        min-height:52px;
    }

    .ladder{
        width:290px;
    }
}

@media(max-width:380px){

    .game-logo{
        display:none;
    }

    .timer-wrap{
        transform:scale(.9);
        margin-bottom:10px;
    }

    .question-text{
        font-size:17px;
    }

    .option{
        font-size:14px;
    }
}
</style>
</head>

<body>

<!-- =======================================================
     TOP BAR
======================================================= -->

<header class="topbar">

    <div class="top-left">

        <button
            class="top-btn"
            onclick="toggleLadder()">
            ☰ Ladder
        </button>

        <div class="game-logo">
            <span>Loksewa</span>Quest
        </div>

    </div>

    <div class="top-right">

        <div
            class="total-coins"
            id="totalCoinsDisplay">
            🪙 0
        </div>

    </div>

</header>


<!-- =======================================================
     OVERLAY
======================================================= -->

<div
    class="overlay"
    id="overlay"
    onclick="toggleLadder()">
</div>


<!-- =======================================================
     MONEY LADDER
======================================================= -->

<aside
    class="ladder"
    id="moneyLadder">

    <div class="ladder-head">

        <div class="ladder-title">
            🪙 Coin Ladder
        </div>

        <button
            class="close-btn"
            onclick="toggleLadder()">
            ×
        </button>

    </div>

    <ul
        class="money-list"
        id="moneyList">
    </ul>

</aside>


<!-- =======================================================
     GAME
======================================================= -->

<main class="game-shell">

    <!-- Progress -->

    <div class="progress-area">

        <div
            class="question-number"
            id="questionNumber">
            Q1 / 10
        </div>

        <div class="progress-track">

            <div
                class="progress-bar"
                id="progressBar">
            </div>

        </div>

    </div>


    <!-- Timer -->

    <div class="timer-wrap">

        <div
            class="timer-ring"
            id="timerRing">

            <span
                class="timer-number"
                id="timer">
                30
            </span>

        </div>

    </div>


    <!-- Topic -->

    <div
        class="topic"
        id="topicBadge">
        LOKSEWA QUIZ
    </div>


    <!-- Question -->

    <section class="question-card">

        <div
            class="question-text"
            id="questionText">
            प्रश्न लोड हुँदैछ...
        </div>

    </section>


    <!-- Options -->

    <section
        class="options"
        id="optionsContainer">

        <button
            class="option"
            id="opt0"
            onclick="selectOption(0)">

            <span class="option-label">A</span>

            <span class="option-text"></span>

        </button>


        <button
            class="option"
            id="opt1"
            onclick="selectOption(1)">

            <span class="option-label">B</span>

            <span class="option-text"></span>

        </button>


        <button
            class="option"
            id="opt2"
            onclick="selectOption(2)">

            <span class="option-label">C</span>

            <span class="option-text"></span>

        </button>


        <button
            class="option"
            id="opt3"
            onclick="selectOption(3)">

            <span class="option-label">D</span>

            <span class="option-text"></span>

        </button>

    </section>


    <!-- Explanation -->

    <div
        class="explanation"
        id="explanation">
    </div>


    <!-- Lock -->

    <div class="action-area">

        <button
            class="lock-btn"
            id="lockBtn"
            onclick="lockAnswer()"
            disabled>

            🔒 LOCK ANSWER

        </button>

        <div
            class="status-text"
            id="statusText">

            उत्तर छान्नुहोस् अनि LOCK गर्नुहोस्

        </div>

    </div>


    <!-- Lifelines -->

    <section class="lifelines">

        <button
            class="lifeline"
            id="ll5050"
            onclick="use5050()">

            ½ 50:50

        </button>


        <button
            class="lifeline"
            id="llPhone"
            onclick="usePhone()">

            📞 Phone

        </button>


        <button
            class="lifeline"
            id="llAudience"
            onclick="useAudience()">

            👥 Audience

        </button>


        <button
            class="lifeline"
            id="llFlip"
            onclick="useFlip()">

            🔄 Flip

        </button>

    </section>

</main>


<!-- =======================================================
     GAME OVER MODAL
======================================================= -->

<div
    class="modal"
    id="gameModal">

    <div class="modal-card">

        <div
            class="modal-icon"
            id="modalIcon">
            🏆
        </div>

        <div
            class="modal-title"
            id="modalTitle">
            Congratulations!
        </div>

        <div
            class="modal-desc"
            id="modalDesc">
        </div>

        <div
            class="final-coins"
            id="finalCoins">
            🪙 0
        </div>

        <button
            class="restart-btn"
            onclick="restartGame()">

            🔄 फेरि खेल्नुहोस्

        </button>

    </div>

</div>


<!-- =======================================================
     LIFELINE MODAL
======================================================= -->

<div
    class="modal small-modal"
    id="lifelineModal">

    <div class="modal-card">

        <div
            class="modal-icon"
            id="lifeIcon">
            📞
        </div>

        <div
            class="modal-title"
            id="lifeTitle">
            Phone a Friend
        </div>

        <div
            class="modal-desc"
            id="lifeDescription">
        </div>

        <div
            class="poll-bars"
            id="pollBars"
            style="display:none;">
        </div>

        <button
            class="restart-btn"
            onclick="closeLifelineModal()">

            ठीक छ

        </button>

    </div>

</div>


<script type="module">

/* =========================================================
   IMPORTS
========================================================= */

import {
    createClient
} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm";

import {
    initializeApp
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";

import {
    getAuth,
    onAuthStateChanged,
    signInAnonymously
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

import {
    getFirestore,
    doc,
    getDoc,
    updateDoc,
    setDoc,
    collection,
    addDoc,
    serverTimestamp,
    increment
} from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";


/* =========================================================
   SUPABASE

/* =========================================================
   FIREBASE AUTH
========================================================= */

function waitForAuth(){

    return new Promise((resolve)=>{

        const unsubscribe =
            onAuthStateChanged(
                auth,
                async user => {

                    unsubscribe();

                    if(user){

                        currentUser = user;

                        resolve(user);

                        return;
                    }


                    try{

                        const result =
                            await signInAnonymously(auth);

                        currentUser =
                            result.user;

                        resolve(currentUser);

                    }catch(error){

                        console.error(
                            "Anonymous auth failed:",
                            error
                        );

                        resolve(null);
                    }

                }
            );

    });

}

/* =========================================================
   NORMALIZE OPTIONS
========================================================= */

function getOptions(question){

    let options =
        question.options;


    if(typeof options === "string"){

        try{

            options =
                JSON.parse(options);

        }catch(error){

            console.warn(
                "Could not parse options"
            );

        }

    }


    return Array.isArray(options)
        ? options
        : [];

}


/* =========================================================
   FIND CORRECT INDEX
========================================================= */

function getCorrectIndex(question){

    const options =
        getOptions(question);


    const answer =
        String(
            question.answer ?? ""
        )
        .trim();


    /*
     Answer can be:
     actual option text
     0/1/2/3
     A/B/C/D
    */

    const letter =
        answer.toUpperCase();


    if(["A","B","C","D"].includes(letter)){

        return "ABCD".indexOf(letter);

    }


    if(/^[0-3]$/.test(answer)){

        return Number(answer);

    }


    const index =
        options.findIndex(
            option =>
                String(option)
                .trim()
                .toLowerCase() ===
                answer.toLowerCase()
        );


    return index;

}

========================================================= */

    clearInterval(timerInterval);


    timeLeft =
        QUESTION_TIME;


    updateTimerUI();


    timerInterval =
        setInterval(()=>{

            if(answerLocked)
                return;


            timeLeft--;


            updateTimerUI();


            if(timeLeft <= 0){

                clearInterval(
                    timerInterval
                );


                handleTimeout();

            }

        },1000);

}

    const percentage =

/* =========================================================
   SAFE COINS
========================================================= */

function getSafeCoins(){

    /*
     Find highest completed safe level
    */

    let safe = 0;


    for(const level of SAFE_LEVELS){

        if(
            currentQuestionIndex + 1 >
            level
        ){

            safe =
                PRIZE_LADDER[level - 1];

        }

    }


    return safe;

}

            70 + Math.random() * 25
        );


    const letters =
        ["A","B","C","D"];


    let suggestedIndex =
        correctIndex;


    /*
     Small chance friend gives wrong suggestion
    */

    if(
        Math.random() > .88
    ){

        const alternatives =
            [0,1,2,3]
            .filter(
                x =>
                    x !== correctIndex
            );


        suggestedIndex =
            alternatives[
                Math.floor(
                    Math.random() *
                    alternatives.length
                )
            ];

    }


    showLifelineModal(

        "📞",

        "Phone a Friend",

        `साथीको अनुमान अनुसार <strong>${letters[suggestedIndex]}</strong> विकल्प सही हुन सक्छ।<br><br>
         Confidence: <strong>${confidence}%</strong>`

    );

};


/* =========================================================
   AUDIENCE POLL
========================================================= */

window.useAudience =
function(){

    if(
        lifelines["audience"] ||
        answerLocked
    )
        return;


    lifelines["audience"] =
        true;


    document.getElementById(
        "llAudience"
    ).disabled = true;


    const question =
        questions[
            currentQuestionIndex
        ];


    const correctIndex =
        getCorrectIndex(
            question
        );


    let percentages =
        [10,10,10,10];


    /*
     Generate realistic poll
    */

    let remaining = 100;


    for(let i=0;i<4;i++){

        if(
            i === correctIndex
        )
            continue;


        const max =
            Math.min(
                20,
                remaining
            );


        const value =
            Math.floor(
                Math.random() *
                max
            );


        percentages[i] =
            value;

        remaining -= value;

    }


    percentages[correctIndex] =
        remaining;


    /*
     Shuffle visual percentages
     slightly if needed
    */

    showPoll(percentages);

};


/* =========================================================
   SHOW POLL
========================================================= */

function showPoll(percentages){

    const modal =
        document.getElementById(
            "lifelineModal"
        );


    document.getElementById(
        "lifeIcon"
    ).innerText =
        "👥";


    document.getElementById(
        "lifeTitle"
    ).innerText =
        "Audience Poll";


    document.getElementById(
        "lifeDescription"
    ).innerText =
        "दर्शकहरूको अनुमान:";


    const bars =
        document.getElementById(
            "pollBars"
        );


    bars.style.display =
        "flex";


    bars.innerHTML = "";


    ["A","B","C","D"]
    .forEach((letter,index)=>{

        const row =
            document.createElement(
                "div"
            );


        row.className =
            "poll-row";


        row.innerHTML = `

            <strong>${letter}</strong>

            <div class="poll-bar">

                <div
                    class="poll-fill"
                    style="width:${percentages[index]}%">
                </div>

            </div>

            <strong>
                ${percentages[index]}%
            </strong>

        `;


        bars.appendChild(row);

    });


    modal.style.display =
        "flex";

}


/* =========================================================
   FLIP QUESTION
========================================================= */

window.useFlip =
function(){

    if(
        lifelines["flip"] ||
        answerLocked
    )
        return;


    lifelines["flip"] =
        true;


    document.getElementById(
        "llFlip"
    ).disabled = true;


    /*
     Find unused replacement
    */

    const usedQuestions =
        questions
        .slice(
            0,
            currentQuestionIndex + 1
        );


    const candidates =
        questions
        .filter(
            q =>
                !usedQuestions.includes(q)
        );


    if(candidates.length === 0){

        document.getElementById(
            "statusText"
        ).innerText =
            "🔄 नयाँ प्रश्न उपलब्ध छैन।";

        return;

    }


    const replacement =
        candidates[
            Math.floor(
                Math.random() *
                candidates.length
            )
        ];


    questions[
        currentQuestionIndex
    ] =
        replacement;


    selectedOptionIndex =
        null;


    document.getElementById(
        "statusText"
    ).innerText =
        "🔄 प्रश्न Flip गरियो!";


    loadQuestion();

};

/* =========================================================
   FINISH GAME
========================================================= */

async function finishGame(
    isWin,
    message
){

    if(rewardAlreadyProcessed)
        return;


    rewardAlreadyProcessed =
        true;


    clearInterval(
        timerInterval
    );


    const finalReward =
        Math.max(
            0,
            totalCoinsEarned
        );


    /*
     Firebase reward exactly once
    */

    if(
        finalReward > 0 &&
        currentUser
    ){

        await saveReward(
            finalReward,
            isWin
                ? "KBC Quiz Completed"
                : "KBC Quiz Safe Amount"
        );

    }


    document.getElementById(
        "modalIcon"
    ).innerText =
        isWin
            ? "🏆"
            : finalReward > 0
                ? "🪙"
                : "🎮";


    document.getElementById(
        "modalTitle"
    ).innerText =
        isWin
            ? "अभिनन्दन! 🏆"
            : "Khel Samapta";


    document.getElementById(
        "modalDesc"
    ).innerText =
        message;


    document.getElementById(
        "finalCoins"
    ).innerText =
        `🪙 ${finalReward.toLocaleString()} Coins`;


    document.getElementById(
        "gameModal"
    ).style.display =
        "flex";


    if(isWin){

        createConfetti();

    }

}


/* =========================================================
   FIREBASE REWARD
========================================================= */

async function saveReward(
    coins,
    status
){

    if(
        coins <= 0 ||
        !currentUser
    )
        return;


    try{

        const userRef =
            doc(
                db,
                "users",
                currentUser.uid
            );


        /*
         Atomic increment
        */

        await updateDoc(
            userRef,
            {
                coins:
                    increment(coins)
            }
        );


        /*
         History
        */

        await addDoc(
            collection(
                userRef,
                "coin_history"
            ),
            {
                coins_won:coins,

                status:status,

                source:"kbc_quiz",

                question_count:
                    currentQuestionIndex + 1,

                timestamp:
                    serverTimestamp()
            }
        );


        /*
         Local display
        */

        userCurrentCoins += coins;

        updateCoinDisplay();


    }catch(error){

        console.error(
            "Reward save error:",
            error
        );

    }

}

window.restartGame =
function(){

    clearInterval(

    );


    currentQuestionIndex = 0;

    selectedOptionIndex = null;

    totalCoinsEarned = 0;

    safeCoins = 0;

    rewardAlreadyProcessed = false;

    answerLocked = false;


    lifelines = {

        "5050":false,

        "phone":false,

        "audience":false,

        "flip":false

    };


    document
    .querySelectorAll(
        ".lifeline"
    )
    .forEach(
        button =>
            button.disabled = false
    );


    document.getElementById(
        "gameModal"
    ).style.display =
        "none";


    document.getElementById(
        "lifelineModal"
    ).style.display =
        "none";


    loadQuestions()
    .then(()=>{

        loadQuestion();

    });

};


/* =========================================================
   CONFETTI
========================================================= */

function createConfetti(){

    const pieces = 80;


    for(
        let i=0;
        i<pieces;
        i++
    ){

        const piece =
            document.createElement(
                "div"
            );


        piece.className =
            "confetti";


        piece.style.left =
            Math.random() * 100 + "%";


        piece.style.background =
            [
                "#ffd95a",
                "#f5c542",
                "#16c784",
                "#3b82f6",
                "#ef4444",
                "#ffffff"
            ][
                Math.floor(
                    Math.random() * 6
                )
            ];


        piece.style.animationDuration =
            (1.5 +
            Math.random() * 2) + "s";


        document.body.appendChild(
            piece
        );


        setTimeout(()=>{

            piece.remove();

        },4000);

    }

}
