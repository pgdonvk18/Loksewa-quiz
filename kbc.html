<!DOCTYPE html>
<html lang="ne">
<head>
<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width,
    initial-scale=1.0,
    maximum-scale=1.0,
    user-scalable=no"
>

<title>LoksewaQuest - Hot Seat</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

:root{
    --bg:#020617;
    --bg2:#07142f;
    --blue:#2563eb;
    --blue2:#38bdf8;
    --cyan:#22d3ee;
    --gold:#facc15;
    --gold2:#f59e0b;
    --green:#22c55e;
    --red:#ef4444;
    --white:#f8fafc;
    --muted:#94a3b8;
    --panel:rgba(7,20,47,.92);
    --border:rgba(148,163,184,.22);
}

body{
    min-height:100vh;
    background:
        radial-gradient(circle at 50% 25%,
        rgba(37,99,235,.28),
        transparent 35%),
        radial-gradient(circle at 20% 80%,
        rgba(14,165,233,.12),
        transparent 30%),
        linear-gradient(
            180deg,
            #01030a 0%,
            #03102a 45%,
            #020617 100%
        );
    color:var(--white);
    font-family:
        Inter,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    overflow-x:hidden;
}

/* =========================================
   LOADING
========================================= */

#loadingScreen{
    position:fixed;
    inset:0;
    z-index:9999;
    display:flex;
    justify-content:center;
    align-items:center;
    background:#020617;
}

.loader-box{
    width:min(90%,400px);
    text-align:center;
    padding:35px;
}

.loader-ring{
    width:70px;
    height:70px;
    border-radius:50%;
    border:5px solid rgba(255,255,255,.12);
    border-top-color:var(--gold);
    animation:spin 1s linear infinite;
    margin:0 auto 25px;
}

.loader-title{
    font-size:25px;
    font-weight:900;
    margin-bottom:8px;
}

.loading-text{
    color:var(--muted);
    font-size:14px;
}

@keyframes spin{
    to{
        transform:rotate(360deg);
    }
}

/* =========================================
   ERROR
========================================= */

#errorScreen{
    position:fixed;
    inset:0;
    z-index:9998;
    display:none;
    align-items:center;
    justify-content:center;
    padding:20px;
    background:#020617;
}

.error-card{
    width:min(100%,430px);
    padding:30px;
    border-radius:24px;
    text-align:center;
    background:
        linear-gradient(
            145deg,
            rgba(15,23,42,.98),
            rgba(2,6,23,.98)
        );
    border:1px solid rgba(239,68,68,.4);
    box-shadow:0 25px 80px rgba(0,0,0,.55);
}

.error-icon{
    font-size:48px;
    margin-bottom:15px;
}

.error-title{
    font-size:24px;
    font-weight:900;
    margin-bottom:12px;
}

.error-message{
    color:#cbd5e1;
    line-height:1.6;
    font-size:14px;
    white-space:pre-wrap;
}

.retry-btn{
    margin-top:22px;
    width:100%;
    padding:14px;
    border:0;
    border-radius:14px;
    background:linear-gradient(
        135deg,
        #2563eb,
        #1d4ed8
    );
    color:white;
    font-weight:800;
    cursor:pointer;
}

/* =========================================
   MAIN
========================================= */

#game{
    display:none;
    min-height:100vh;
}

.topbar{
    position:sticky;
    top:0;
    z-index:100;
    height:68px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 16px;
    background:rgba(2,6,23,.86);
    backdrop-filter:blur(16px);
    border-bottom:1px solid rgba(148,163,184,.12);
}

.brand{
    display:flex;
    align-items:center;
    gap:10px;
}

.brand-orb{
    width:38px;
    height:38px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(
            circle at 35% 30%,
            #fff,
            #facc15 20%,
            #f59e0b 60%,
            #92400e
        );
    color:#172554;
    font-weight:1000;
    box-shadow:
        0 0 20px rgba(250,204,21,.45);
}

.brand-name{
    font-size:16px;
    font-weight:900;
}

.brand-sub{
    color:#64748b;
    font-size:10px;
    text-transform:uppercase;
    letter-spacing:1.5px;
}

.user-area{
    display:flex;
    align-items:center;
    gap:8px;
}

.coin-box{
    display:flex;
    align-items:center;
    gap:6px;
    padding:8px 12px;
    border-radius:999px;
    background:rgba(250,204,21,.09);
    border:1px solid rgba(250,204,21,.3);
    color:var(--gold);
    font-size:13px;
    font-weight:900;
}

/* =========================================
   LAYOUT
========================================= */

.layout{
    width:min(1250px,100%);
    margin:auto;
    display:grid;
    grid-template-columns:1fr 270px;
    gap:20px;
    padding:22px;
}

.main-stage{
    min-width:0;
}

/* =========================================
   GAME HEADER
========================================= */

.game-header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:18px;
}

.question-counter{
    font-size:14px;
    color:#cbd5e1;
}

.question-counter strong{
    color:white;
    font-size:20px;
}

.topic-badge{
    max-width:55%;
    overflow:hidden;
    text-overflow:ellipsis;
    white-space:nowrap;
    padding:7px 11px;
    border-radius:999px;
    background:rgba(56,189,248,.08);
    border:1px solid rgba(56,189,248,.25);
    color:#7dd3fc;
    font-size:11px;
    font-weight:800;
}

/* =========================================
   TIMER
========================================= */

.timer-row{
    display:flex;
    justify-content:center;
    margin:10px 0 20px;
}

.timer{
    width:76px;
    height:76px;
    border-radius:50%;
    display:flex;
    justify-content:center;
    align-items:center;
    position:relative;
    background:
        radial-gradient(
            circle,
            #07152f 55%,
            transparent 56%
        );
    border:4px solid rgba(59,130,246,.25);
    box-shadow:
        0 0 30px rgba(37,99,235,.18);
}

.timer::before{
    content:"";
    position:absolute;
    inset:-5px;
    border-radius:50%;
    border:4px solid var(--blue2);
    border-right-color:transparent;
    transform:rotate(-40deg);
    transition:.3s;
}

.timer.warning{
    border-color:rgba(239,68,68,.3);
}

.timer.warning::before{
    border-color:var(--red);
    border-right-color:transparent;
    animation:pulse .7s infinite;
}

.timer-number{
    font-size:25px;
    font-weight:1000;
}

.timer-label{
    position:absolute;
    bottom:-20px;
    font-size:9px;
    color:#64748b;
    text-transform:uppercase;
    letter-spacing:1px;
}

/* =========================================
   QUESTION CARD
========================================= */

.question-card{
    position:relative;
    padding:32px 24px;
    border-radius:26px;
    background:
        radial-gradient(
            circle at 50% 0%,
            rgba(37,99,235,.2),
            transparent 50%
        ),
        linear-gradient(
            145deg,
            rgba(15,23,42,.96),
            rgba(3,12,32,.98)
        );
    border:1px solid rgba(96,165,250,.28);
    box-shadow:
        0 20px 80px rgba(0,0,0,.45),
        inset 0 0 50px rgba(37,99,235,.05);
    overflow:hidden;
}

.question-card::before{
    content:"";
    position:absolute;
    top:-150px;
    left:50%;
    transform:translateX(-50%);
    width:300px;
    height:300px;
    background:
        radial-gradient(
            circle,
            rgba(56,189,248,.16),
            transparent 70%
        );
    pointer-events:none;
}

.question-label{
    text-align:center;
    color:#60a5fa;
    font-size:11px;
    letter-spacing:2px;
    text-transform:uppercase;
    font-weight:900;
    margin-bottom:18px;
}

.question-text{
    position:relative;
    text-align:center;
    font-size:clamp(19px,3vw,29px);
    line-height:1.5;
    font-weight:800;
    max-width:850px;
    margin:auto;
}

/* =========================================
   OPTIONS
========================================= */

.options{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    margin-top:24px;
}

.option{
    position:relative;
    min-height:72px;
    display:flex;
    align-items:center;
    gap:13px;
    padding:13px 15px;
    border-radius:17px;
    border:1px solid rgba(96,165,250,.25);
    background:
        linear-gradient(
            145deg,
            rgba(15,23,42,.95),
            rgba(7,20,47,.85)
        );
    color:#f8fafc;
    cursor:pointer;
    transition:.18s ease;
    text-align:left;
}

.option:hover{
    transform:translateY(-2px);
    border-color:#38bdf8;
    box-shadow:0 8px 25px rgba(14,165,233,.12);
}

.option-letter{
    flex:0 0 37px;
    width:37px;
    height:37px;
    border-radius:50%;
    display:flex;
    align-items:center;
    justify-content:center;
    border:1px solid rgba(250,204,21,.45);
    color:var(--gold);
    font-weight:1000;
    background:rgba(250,204,21,.06);
}

.option-text{
    font-size:14px;
    line-height:1.45;
    font-weight:650;
}

.option.selected{
    border-color:#facc15;
    background:
        linear-gradient(
            135deg,
            rgba(30,58,138,.9),
            rgba(8,47,73,.9)
        );
    box-shadow:
        0 0 0 1px rgba(250,204,21,.2),
        0 0 30px rgba(250,204,21,.08);
}

.option.hidden-option{
    visibility:hidden;
    pointer-events:none;
}

.option.correct{
    border-color:#22c55e;
    background:rgba(22,101,52,.5);
    animation:correctFlash .5s ease;
}

.option.wrong{
    border-color:#ef4444;
    background:rgba(127,29,29,.5);
    animation:wrongShake .4s ease;
}

@keyframes correctFlash{
    0%,100%{transform:scale(1);}
    50%{transform:scale(1.025);}
}

@keyframes wrongShake{
    0%,100%{transform:translateX(0);}
    25%{transform:translateX(-5px);}
    75%{transform:translateX(5px);}
}

/* =========================================
   LOCK / ACTIONS
========================================= */

.actions{
    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
    margin-top:20px;
}

.lock-btn{
    min-width:190px;
    padding:14px 22px;
    border:0;
    border-radius:999px;
    background:
        linear-gradient(
            135deg,
            #facc15,
            #f59e0b
        );
    color:#172554;
    font-weight:1000;
    font-size:14px;
    cursor:pointer;
    box-shadow:
        0 10px 35px rgba(245,158,11,.18);
}

.lock-btn:disabled{
    opacity:.35;
    cursor:not-allowed;
}

.quit-btn{
    padding:13px 18px;
    border-radius:999px;
    background:transparent;
    border:1px solid rgba(148,163,184,.25);
    color:#cbd5e1;
    font-weight:750;
    cursor:pointer;
}

/* =========================================
   LIFELINES
========================================= */

.lifelines{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:9px;
    margin-top:18px;
}

.life{
    padding:12px 5px;
    border-radius:14px;
    border:1px solid rgba(148,163,184,.2);
    background:rgba(15,23,42,.7);
    color:#e2e8f0;
    text-align:center;
    cursor:pointer;
    font-size:11px;
    font-weight:800;
}

.life-icon{
    display:block;
    font-size:19px;
    margin-bottom:4px;
}

.life.used{
    opacity:.28;
    filter:grayscale(1);
    pointer-events:none;
}

/* =========================================
   PROGRESS
========================================= */

.progress-box{
    margin-top:18px;
}

.progress-top{
    display:flex;
    justify-content:space-between;
    color:#64748b;
    font-size:10px;
    margin-bottom:7px;
}

.progress{
    height:5px;
    background:#0f172a;
    border-radius:999px;
    overflow:hidden;
}

.progress-bar{
    height:100%;
    width:0%;
    background:
        linear-gradient(
            90deg,
            #2563eb,
            #38bdf8
        );
    transition:.35s;
}

/* =========================================
   LADDER
========================================= */

.ladder{
    position:sticky;
    top:88px;
    padding:16px;
    border-radius:22px;
    background:
        linear-gradient(
            145deg,
            rgba(15,23,42,.94),
            rgba(2,6,23,.94)
        );
    border:1px solid rgba(148,163,184,.16);
}

.ladder-title{
    text-align:center;
    color:var(--gold);
    font-weight:1000;
    letter-spacing:1px;
    margin-bottom:12px;
}

.level{
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:8px 10px;
    border-radius:10px;
    margin-bottom:4px;
    color:#64748b;
    font-size:12px;
}

.level.safe{
    color:#facc15;
}

.level.current{
    color:#fff;
    background:
        linear-gradient(
            90deg,
            rgba(37,99,235,.45),
            rgba(30,64,175,.15)
        );
    border:1px solid rgba(96,165,250,.3);
}

.level-number{
    font-weight:900;
}

.level-prize{
    font-weight:900;
}

/* =========================================
   MODAL
========================================= */

.modal{
    position:fixed;
    inset:0;
    z-index:1000;
    display:none;
    align-items:center;
    justify-content:center;
    padding:18px;
    background:rgba(0,0,0,.75);
    backdrop-filter:blur(10px);
}

.modal.show{
    display:flex;
}

.modal-card{
    width:min(100%,460px);
    max-height:90vh;
    overflow:auto;
    padding:28px;
    border-radius:26px;
    background:
        linear-gradient(
            145deg,
            #0f172a,
            #020617
        );
    border:1px solid rgba(250,204,21,.28);
    box-shadow:0 30px 100px rgba(0,0,0,.65);
    text-align:center;
}

.modal-icon{
    font-size:52px;
    margin-bottom:12px;
}

.modal-title{
    font-size:25px;
    font-weight:1000;
    margin-bottom:10px;
}

.modal-message{
    color:#94a3b8;
    line-height:1.6;
    font-size:14px;
}

.modal-prize{
    margin:20px 0;
    font-size:36px;
    font-weight:1000;
    color:var(--gold);
}

.modal-buttons{
    display:grid;
    gap:9px;
    margin-top:20px;
}

.modal-btn{
    padding:14px;
    border-radius:13px;
    border:0;
    font-weight:900;
    cursor:pointer;
}

.modal-primary{
    background:linear-gradient(
        135deg,
        #2563eb,
        #1d4ed8
    );
    color:white;
}

.modal-secondary{
    background:#0f172a;
    border:1px solid rgba(148,163,184,.2);
    color:#cbd5e1;
}

/* =========================================
   POLL
========================================= */

.poll-row{
    margin:13px 0;
    text-align:left;
}

.poll-label{
    display:flex;
    justify-content:space-between;
    font-size:12px;
    margin-bottom:5px;
}

.poll-track{
    height:10px;
    border-radius:999px;
    background:#111827;
    overflow:hidden;
}

.poll-fill{
    height:100%;
    width:0;
    background:linear-gradient(
        90deg,
        #2563eb,
        #38bdf8
    );
    transition:1s;
}

/* =========================================
   TOAST
========================================= */

#toast{
    position:fixed;
    left:50%;
    bottom:22px;
    transform:translateX(-50%);
    z-index:5000;
    max-width:90%;
    padding:12px 17px;
    border-radius:999px;
    background:#0f172a;
    border:1px solid rgba(148,163,184,.25);
    color:white;
    font-size:12px;
    box-shadow:0 15px 40px rgba(0,0,0,.4);
    display:none;
}

#toast.show{
    display:block;
    animation:toastIn .25s ease;
}

@keyframes toastIn{
    from{
        opacity:0;
        transform:translate(-50%,10px);
    }
    to{
        opacity:1;
        transform:translate(-50%,0);
    }
}

@keyframes pulse{
    50%{transform:scale(1.06);}
}

/* =========================================
   MOBILE
========================================= */

@media(max-width:850px){

    .layout{
        grid-template-columns:1fr;
        padding:14px;
    }

    .ladder{
        position:static;
        order:2;
    }

    .main-stage{
        order:1;
    }

    .ladder{
        display:grid;
        grid-template-columns:1fr 1fr;
        gap:4px;
    }

    .ladder-title{
        grid-column:1/-1;
    }

    .level{
        margin:0;
    }
}

@media(max-width:600px){

    .topbar{
        height:62px;
        padding:0 11px;
    }

    .brand-name{
        font-size:14px;
    }

    .brand-sub{
        display:none;
    }

    .coin-box{
        padding:7px 9px;
        font-size:11px;
    }

    .layout{
        padding:10px;
    }

    .question-card{
        padding:25px 13px 18px;
        border-radius:21px;
    }

    .question-text{
        font-size:19px;
    }

    .options{
        grid-template-columns:1fr;
        gap:9px;
    }

    .option{
        min-height:62px;
    }

    .option-text{
        font-size:13px;
    }

    .lifelines{
        grid-template-columns:repeat(4,1fr);
    }

    .life{
        padding:9px 2px;
        font-size:9px;
    }

    .life-icon{
        font-size:17px;
    }

    .game-header{
        margin-bottom:10px;
    }

    .topic-badge{
        max-width:48%;
    }
}

.hidden{
    display:none !important;
}

</style>
</head>

<body>

<!-- =========================================
     LOADING
========================================= -->

<div id="loadingScreen">

    <div class="loader-box">

        <div class="loader-ring"></div>

        <div class="loader-title">
            LoksewaQuest
        </div>

        <div class="loading-text">
            Quiz loading हुँदैछ...
        </div>

    </div>

</div>


<!-- =========================================
     ERROR
========================================= -->

<div id="errorScreen">

    <div class="error-card">

        <div class="error-icon">
            ⚠️
        </div>

        <div class="error-title">
            Quiz Load Error
        </div>

        <div class="error-message">
            Quiz load हुन सकेन।
        </div>

        <button
            class="retry-btn"
            id="retryBtn"
        >
            फेरि प्रयास गर्नुहोस्
        </button>

    </div>

</div>


<!-- =========================================
     MAIN GAME
========================================= -->

<div id="game">

    <!-- TOP BAR -->

    <header class="topbar">

        <div class="brand">

            <div class="brand-orb">
                LQ
            </div>

            <div>

                <div class="brand-name">
                    LoksewaQuest
                </div>

                <div class="brand-sub">
                    Hot Seat Challenge
                </div>

            </div>

        </div>

        <div class="user-area">

            <div class="coin-box">
                🪙
                <span id="coinBalance">
                    0
                </span>
            </div>

        </div>

    </header>


    <div class="layout">

        <main class="main-stage">

            <!-- HEADER -->

            <div class="game-header">

                <div class="question-counter">

                    प्रश्न
                    <strong id="questionNumber">
                        1
                    </strong>

                    / 10

                </div>

                <div
                    class="topic-badge"
                    id="topicBadge"
                >
                    Loading...
                </div>

            </div>


            <!-- TIMER -->

            <div class="timer-row">

                <div
                    class="timer"
                    id="timer"
                >

                    <div
                        class="timer-number"
                        id="timerNumber"
                    >
                        30
                    </div>

                    <div class="timer-label">
                        seconds
                    </div>

                </div>

            </div>


            <!-- QUESTION -->

            <section class="question-card">

                <div class="question-label">
                    तपाईंको अन्तिम उत्तर के हो?
                </div>

                <div
                    class="question-text"
                    id="questionText"
                >
                    Question loading...
                </div>


                <div
                    class="options"
                    id="options"
                >
                </div>


                <!-- ACTIONS -->

                <div class="actions">

                    <button
                        class="lock-btn"
                        id="lockBtn"
                        disabled
                    >
                        🔒 उत्तर Lock गर्नुहोस्
                    </button>

                    <button
                        class="quit-btn"
                        id="quitBtn"
                    >
                        Quit
                    </button>

                </div>


                <!-- LIFELINES -->

                <div class="lifelines">

                    <button
                        class="life"
                        id="fiftyBtn"
                    >

                        <span class="life-icon">
                            50:50
                        </span>

                        50:50

                    </button>


                    <button
                        class="life"
                        id="phoneBtn"
                    >

                        <span class="life-icon">
                            📞
                        </span>

                        Phone

                    </button>


                    <button
                        class="life"
                        id="audienceBtn"
                    >

                        <span class="life-icon">
                            👥
                        </span>

                        Audience

                    </button>


                    <button
                        class="life"
                        id="flipBtn"
                    >

                        <span class="life-icon">
                            🔄
                        </span>

                        Flip

                    </button>

/* =========================================================
   SHUFFLE
========================================================= */

function shuffleArray(array){

    for(
        let i=array.length-1;
        i>0;
        i--
    ){

        const j =
            Math.floor(
                Math.random() * (i+1)
            );

        [
            array[i],
            array[j]
        ] =
        [
            array[j],
            array[i]
        ];

    }

    return array;
}


/* =========================================================
   NORMALIZE TEXT
========================================================= */

function normalizeText(value){

    return String(value ?? "")
        .normalize("NFKC")
        .trim()
        .replace(/\s+/g," ")
        .toLocaleLowerCase();

}


/* =========================================================
   PARSE OPTIONS
========================================================= */

function parseOptions(raw){

    if(Array.isArray(raw)){

        return raw.map(
            item => {

                if(
                    typeof item ===
                    "object" &&
                    item !== null
                ){

                    return String(
                        item.label ??
                        item.text ??
                        item.value ??
                        ""
                    );

                }

                return String(item);

            }
        );

    }


    if(typeof raw === "string"){

        try{

            const parsed =
                JSON.parse(raw);

            if(Array.isArray(parsed)){

                return parsed.map(
                    x => String(
                        typeof x === "object"
                            ? (
                                x.label ??
                                x.text ??
                                x.value ??
                                ""
                            )
                            : x
                    )
                );

            }

        }catch(error){

            console.warn(
                "Options JSON parse failed:",
                raw
            );

        }

    }


    return [];

}


/* =========================================================
   FIND CORRECT ANSWER
========================================================= */

function getCorrectIndex(
    question,
    options
){

    const raw =
        String(
            question.answer ?? ""
        ).trim();

    if(!raw){
        return -1;
    }


    const normalizedAnswer =
        normalizeText(raw);


    /* Exact option text */

    const exactIndex =
        options.findIndex(
            option =>
                normalizeText(option) ===
                normalizedAnswer
        );

    if(exactIndex >= 0){

        return exactIndex;

    }


    /* A / B / C / D */

    if(
        /^[ABCD]$/i.test(raw)
    ){

        return (
            raw.toUpperCase()
                .charCodeAt(0) - 65
        );

    }


    /* 0 / 1 / 2 / 3 */

    if(
        /^\d+$/.test(raw)
    ){

        const number =
            Number(raw);

        if(
            number >= 0 &&
            number <= 3
        ){

            return number;

        }

        if(
            number >= 1 &&
            number <= 4
        ){

            return number - 1;

        }

    }


    return -1;

}

        );

    }


    console.log(
        "✅ Supabase questions:",
        data.length
    );


    const validQuestions =
        data.filter(question => {

            const options =
                parseOptions(
                    question.options
                );

            const answerIndex =
                getCorrectIndex(
                    question,
                    options
                );

            return (
                question.id != null &&
                question.question &&
                options.length >= 4 &&
                answerIndex >= 0
            );

        });


    console.log(
        "✅ Valid questions:",
        validQuestions.length
    );


    if(validQuestions.length === 0){

        throw new Error(
            "Supabase questions भेटिए तर options/answer format गलत छ।"
        );

    }


    return validQuestions;

}

/* =========================================================
   GET SAFE PRIZE
========================================================= */

function getSafePrize(
    questionIndex
){

    let safe =
        0;


    for(
        let i=0;
        i<questionIndex;
        i++
    ){

        if(
            PRIZES[i] &&
            PRIZES[i].safe
        ){

            safe =
                PRIZES[i].coins;

        }

    }


    return safe;

}

    }


    const completedIndex =
        currentQuestionIndex - 1;


    return (
        PRIZES[
            completedIndex
        ]?.coins || 0
    );

}

    if(gameOver){

    gameOver = true;

    clearTimer();

        finalPrize,
        "completed"
    );


    showResultModal(
        "🏆",
        "Congratulations!",
        "तपाईंले सबै 10 प्रश्न सही गर्नुभयो।",
        finalPrize,
        true

}

async function quitGame(){

        confirm(
            "Game छोडेर " +

/* =========================================================
   SAVE COIN HISTORY
========================================================= */

async function saveCoinHistory(
    amount,
    status
){

    if(payoutDone){

        console.log(
            "⚠️ Payout already completed."
        );

        return;

    }


    if(!currentUser){

        console.error(
            "❌ No Firebase user."
        );

        return;

    }


    try{

        const historyRef =
            doc(
                db,
                "users",
                currentUser.uid,
                "coin_history",
                currentGameId
            );


        const userRef =
            doc(
                db,
                "users",
                currentUser.uid
            );


        const result =
            await runTransaction(
                db,
                async transaction => {

                    const historySnapshot =
                        await transaction.get(
                            historyRef
                        );


                    /*
                     Duplicate protection
                    */

                    if(
                        historySnapshot.exists()
                    ){

                        return false;

                    }


                    const userSnapshot =
                        await transaction.get(
                            userRef
                        );


                    let oldCoins =
                        0;


                    if(
                        userSnapshot.exists()
                    ){

                        oldCoins =
                            Number(
                                userSnapshot.data()
                                    ?.coins || 0
                            );

                    }


                    const newCoins =
                        oldCoins +
                        Number(amount || 0);


                    if(
                        userSnapshot.exists()
                    ){

                        transaction.update(
                            userRef,
                            {

                                coins:
                                    newCoins,

                                updatedAt:
                                    serverTimestamp()

                            }
                        );

                    }else{

                        transaction.set(
                            userRef,
                            {

                                coins:
                                    newCoins,

                                createdAt:
                                    serverTimestamp(),

                                updatedAt:
                                    serverTimestamp()

                            }
                        );

                    }


                    transaction.set(
                        historyRef,
                        {

                            gameId:
                                currentGameId,

                            coins_won:
                                Number(amount || 0),

                            status:
                                status,

                            level:
                                currentQuestionIndex,

                            question_count:
                                gameQuestions.length,

                            timestamp:
                                serverTimestamp()

                        }
                    );


                    return true;

                }
            );


        if(result){

            payoutDone =
                true;


            console.log(
                "✅ Coin history saved:",
                amount
            );


            await refreshCoinBalance();

        }else{

            payoutDone =
                true;


            console.log(
                "ℹ️ Duplicate payout prevented."
            );

        }


    }catch(error){

        console.error(
            "❌ COIN SAVE ERROR:",
            error
        );


        showToast(
            "⚠️ Coin save हुन सकेन।"
        );

    }

}

/* =========================================================
   50:50
========================================================= */

function useFifty(){

    if(lifelines.fifty){
        return;
    }


    const question =
        gameQuestions[
            currentQuestionIndex
        ];


    const options =
        parseOptions(
            question.options
        );


    const correct =
        getCorrectIndex(
            question,
            options
        );


    if(correct < 0){
        return;
    }


    const wrongIndexes =
        options
            .map(
                (_,i) => i
            )
            .filter(
                i => i !== correct
            );


    shuffleArray(
        wrongIndexes
    );


    wrongIndexes
        .slice(0,2)
        .forEach(index => {

            const button =
                document.querySelector(
                    `.option[data-index="${index}"]`
                );

            if(button){

                button.classList.add(
                    "hidden-option"
                );

            }

        });


    lifelines.fifty =
        true;


    document
        .getElementById("fiftyBtn")
        .classList.add(
            "used"
        );


    playTone(
        500,
        .1
    );


    showToast(
        "50:50 प्रयोग गरियो"
    );

}


/* =========================================================
   AUDIENCE POLL
========================================================= */

function useAudience(){

    if(lifelines.audience){
        return;
    }


    const question =
        gameQuestions[
            currentQuestionIndex
        ];


    const options =
        parseOptions(
            question.options
        );


    const correct =
        getCorrectIndex(
            question,
            options
        );


    if(correct < 0){
        return;
    }


    let values =
        [0,0,0,0];


    let remaining =
        100;


    /*
     Give correct answer a
     realistic but not guaranteed
     audience advantage.
    */

    const correctPercent =
        Math.floor(
            42 +
            Math.random() * 27
        );


    values[correct] =
        correctPercent;


    remaining -=
        correctPercent;


    const wrong =
        [0,1,2,3]
            .filter(
                i => i !== correct
            );


    wrong.forEach(
        (index,pos) => {

            if(
                pos === wrong.length - 1
            ){

                values[index] =
                    remaining;

            }else{

                const value =
                    Math.floor(
                        Math.random() *
                        (remaining + 1)
                    );

                values[index] =
                    value;

                remaining -=
                    value;

            }

        }
    );


    /*
     Normalize to exactly 100
    */

    const total =
        values.reduce(
            (a,b) => a+b,
            0
        );


    if(total !== 100){

        values[correct] +=
            100 - total;

    }


    lifelines.audience =
        true;


    document
        .getElementById(
            "audienceBtn"
        )
        .classList.add(
            "used"
        );


    showPollModal(
        values,
        options
    );

}

/* =========================================================
   FLIP QUESTION
========================================================= */

async function useFlip(){

    if(lifelines.flip){
        return;
    }


    const current =
        gameQuestions[
            currentQuestionIndex
        ];


    /*
     Find another question that has
     not already been used in this
     current game.
    */

    const usedIds =
        new Set(
            gameQuestions
                .slice(
                    0,
                    currentQuestionIndex + 1
                )
                .map(
                    q => String(q.id)
                )
        );


    try{

        const all =
            await loadQuizBank();


        const candidates =
            all.filter(
                q =>
                    !usedIds.has(
                        String(q.id)
                    )
            );


        if(
            candidates.length === 0
        ){

            showToast(
                "Flip गर्न नयाँ question छैन।"
            );

            return;

        }


        const replacement =
            candidates[
                Math.floor(
                    Math.random() *
                    candidates.length
                )
            ];


        lifelines.flip =
            true;


        document
            .getElementById("flipBtn")
            .classList.add(
                "used"
            );


        gameQuestions[
            currentQuestionIndex
        ] =
            replacement;


        closeModal();


        showToast(
            "🔄 Question flip भयो!"
        );


        await showQuestion();


    }catch(error){

        console.error(
            "Flip error:",
            error
        );

        showToast(
            "Flip question load हुन सकेन।"
        );

    }

}

        "";

        .reverse()
        .forEach(

/* =========================================================
   AUDIO
========================================================= */

let audioContext = null;


function playTone(
    frequency,
    duration
){

    try{

        if(!audioContext){

            audioContext =
                new (
                    window.AudioContext ||
                    window.webkitAudioContext
                )();

        }


        const oscillator =
            audioContext.createOscillator();


        const gain =
            audioContext.createGain();


        oscillator.frequency.value =
            frequency;

        oscillator.type =
            "sine";


        gain.gain.setValueAtTime(
            .0001,
            audioContext.currentTime
        );


        gain.gain.exponentialRampToValueAtTime(
            .06,
            audioContext.currentTime + .01
        );


        gain.gain.exponentialRampToValueAtTime(
            .0001,
            audioContext.currentTime +
            duration
        );


        oscillator.connect(
            gain
        );

        gain.connect(
            audioContext.destination
        );


        oscillator.start();

        oscillator.stop(
            audioContext.currentTime +
            duration
        );

    }catch(error){

        console.log(
            "Audio unavailable"
        );

    }

}
