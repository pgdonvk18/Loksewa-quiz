<!DOCTYPE html>
<html lang="ne">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
>

<title>LoksewaQuest Quiz Arena</title>

<style>

/* =========================================================
   RESET
========================================================= */

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    -webkit-tap-highlight-color:transparent;
}

:root{

    --bg:#020711;
    --bg2:#06142a;
    --panel:#0b2140;
    --panel2:#102e55;

    --gold:#f5c542;
    --gold2:#ffd966;

    --blue:#18539a;
    --blue2:#0d3470;

    --green:#19c77a;
    --red:#e83d46;

    --white:#fff;
    --muted:#a9bad0;

}

body{

    min-height:100vh;

    color:white;

    font-family:
        "Segoe UI",
        system-ui,
        sans-serif;

    background:

        radial-gradient(
            circle at 50% 35%,
            rgba(22,77,145,.40),
            transparent 32%
        ),

        radial-gradient(
            circle at 50% 100%,
            rgba(245,197,66,.10),
            transparent 35%
        ),

        linear-gradient(
            180deg,
            #020711,
            #00040a
        );

    overflow-x:hidden;
}


/* =========================================================
   HEADER
========================================================= */

.header{

    height:64px;

    padding:8px 14px;

    display:flex;
    align-items:center;
    justify-content:space-between;

    border-bottom:
        1px solid rgba(245,197,66,.35);

    background:
        rgba(1,7,17,.92);

    position:sticky;
    top:0;

    z-index:100;
}

.logo{

    color:var(--gold2);

    font-size:17px;

    font-weight:900;

}

.logo span{
    color:white;
}

.header-coins{

    padding:7px 13px;

    border:
        1px solid rgba(245,197,66,.5);

    border-radius:20px;

    color:var(--gold2);

    font-weight:800;

    background:
        rgba(245,197,66,.07);

}


/* =========================================================
   GAME AREA
========================================================= */

.game{

    width:100%;

    max-width:900px;

    margin:auto;

    padding:
        15px
        15px
        35px;

}


/* =========================================================
   TOP GAME INFO
========================================================= */

.game-info{

    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-bottom:14px;

}

.question-counter{

    color:var(--gold2);

    font-size:14px;

    font-weight:900;

}

.ladder-button{

    border:
        1px solid rgba(245,197,66,.5);

    background:
        rgba(245,197,66,.08);

    color:var(--gold2);

    padding:7px 12px;

    border-radius:20px;

    font-weight:700;

    cursor:pointer;

}


/* =========================================================
   PROGRESS
========================================================= */

.progress{

    height:5px;

    width:100%;

    background:#142238;

    border-radius:20px;

    overflow:hidden;

    margin-bottom:15px;

}

.progress-bar{

    height:100%;

    width:10%;

    background:
        linear-gradient(
            90deg,
            #c48a13,
            #ffd966
        );

    transition:.5s;

}


/* =========================================================
   TIMER
========================================================= */

.timer-area{

    display:flex;

    justify-content:center;

    margin:
        5px
        0
        12px;

}

.timer{

    width:65px;

    height:65px;

    border-radius:50%;

    display:flex;

    align-items:center;

    justify-content:center;

    position:relative;

    background:
        conic-gradient(
            var(--gold2) var(--progress,100%),
            #17263c 0
        );

    box-shadow:
        0 0 25px
        rgba(245,197,66,.18);

}

.timer::before{

    content:"";

    position:absolute;

    width:52px;

    height:52px;

    background:#040b16;

    border-radius:50%;

}

.timer span{

    position:relative;

    z-index:2;

    font-size:20px;

    font-weight:900;

}

.timer-danger{

    color:#ff5b61;

}


/* =========================================================
   TOPIC
========================================================= */

.topic{

    text-align:center;

    color:var(--gold2);

    font-size:12px;

    font-weight:800;

    letter-spacing:.8px;

    margin-bottom:8px;

}


/* =========================================================
   QUESTION
========================================================= */

.question-box{

    width:100%;

    padding:27px 20px;

    border-radius:20px;

    border:
        2px solid
        rgba(245,197,66,.75);

    background:

        linear-gradient(
            145deg,
            #123660,
            #061426
        );

    box-shadow:

        0 0 0 1px
        rgba(255,255,255,.02),

        0 12px 40px
        rgba(0,0,0,.55),

        0 0 25px
        rgba(245,197,66,.08);

    text-align:center;

    margin-bottom:18px;

}

.question{

    font-size:
        clamp(18px,4vw,26px);

    line-height:1.55;

    font-weight:700;

}


/* =========================================================
   OPTIONS
========================================================= */

.options{

    display:grid;

    grid-template-columns:
        1fr 1fr;

    gap:12px;

}

.option{

    min-height:65px;

    border:
        1px solid
        rgba(91,134,184,.55);

    border-radius:15px;

    background:

        linear-gradient(
            145deg,
            #102d51,
            #061426
        );

    color:white;

    display:flex;

    align-items:center;

    gap:12px;

    padding:
        11px
        14px;

    cursor:pointer;

    font-size:15px;

    text-align:left;

    transition:.2s;

}

.option:hover:not(:disabled){

    border-color:var(--gold);

    transform:translateY(-2px);

}

.option-label{

    width:34px;

    height:34px;

    min-width:34px;

    display:flex;

    align-items:center;

    justify-content:center;

    border-radius:50%;

    border:
        1px solid
        var(--gold);

    color:var(--gold2);

    font-weight:900;

}

.option.selected{

    background:

        linear-gradient(
            135deg,
            #9b6909,
            #f5c542
        );

    color:#000;

    border-color:white;

}

.option.selected
.option-label{

    color:#000;

    border-color:#000;

}

.option.correct{

    background:
        linear-gradient(
            135deg,
            #08784b,
            #19c77a
        ) !important;

    border-color:
        #72ffc2 !important;

}

.option.wrong{

    background:
        linear-gradient(
            135deg,
            #821c21,
            #e83d46
        ) !important;

    border-color:
        #ff9da2 !important;

}

.option.hidden{

    visibility:hidden;

    pointer-events:none;

}


/* =========================================================
   LOCK AREA
========================================================= */

.lock-area{

    display:flex;

    flex-direction:column;

    align-items:center;

    margin-top:18px;

}

.lock{

    min-width:220px;

    border:none;

    border-radius:30px;

    padding:14px 28px;

    font-size:16px;

    font-weight:900;

    background:

        linear-gradient(
            135deg,
            #d18b0b,
            #ffd966
        );

    color:#050505;

    cursor:pointer;

    box-shadow:
        0 8px 25px
        rgba(245,197,66,.18);

}

.lock:disabled{

    opacity:.35;

    cursor:not-allowed;

}

.status{

    margin-top:8px;

    color:var(--muted);

    font-size:12px;

}


/* =========================================================
   LIFELINES
========================================================= */

.lifelines{

    display:grid;

    grid-template-columns:
        repeat(4,1fr);

    gap:9px;

    margin-top:20px;

}

.life{

    min-height:53px;

    border:
        1px solid
        rgba(245,197,66,.45);

    border-radius:13px;

    background:
        rgba(10,35,66,.9);

    color:white;

    font-weight:800;

    cursor:pointer;

}

.life:hover:not(:disabled){

    border-color:var(--gold2);

    color:var(--gold2);

}

.life:disabled{

    opacity:.3;

    cursor:not-allowed;

}


/* =========================================================
   EXPLANATION
========================================================= */

.explanation{

    display:none;

    margin-top:15px;

    padding:12px 15px;

    border:
        1px dashed
        rgba(25,199,122,.7);

    border-radius:12px;

    color:#8effcf;

    background:
        rgba(25,199,122,.07);

    line-height:1.6;

    text-align:center;

}


/* =========================================================
   LADDER DRAWER
========================================================= */

.overlay{

    position:fixed;

    inset:0;

    background:
        rgba(0,0,0,.7);

    display:none;

    z-index:500;

}

.overlay.show{
    display:block;
}

.ladder{

    position:fixed;

    top:0;

    right:-330px;

    width:320px;

    height:100vh;

    z-index:600;

    background:
        linear-gradient(
            180deg,
            #071a35,
            #020711
        );

    border-left:
        1px solid
        rgba(245,197,66,.5);

    padding:17px;

    transition:.35s;

}

.ladder.open{
    right:0;
}

.ladder-header{

    display:flex;

    align-items:center;

    justify-content:space-between;

    margin-bottom:14px;

    padding-bottom:12px;

    border-bottom:
        1px solid
        rgba(245,197,66,.2);

}

.ladder-title{

    color:var(--gold2);

    font-size:18px;

    font-weight:900;

}

.close{

    border:none;

    background:none;

    color:white;

    font-size:28px;

}

.money{

    list-style:none;

    display:flex;

    flex-direction:column;

    gap:5px;

    max-height:
        calc(100vh - 80px);

    overflow:auto;

}

.money li{

    display:flex;

    justify-content:space-between;

    padding:8px 12px;

    border-radius:8px;

    color:#8397b1;

    font-weight:700;

}

.money li.current{

    background:
        linear-gradient(
            90deg,
            #c58b13,
            #ffd966
        );

    color:#000;

}

.money li.safe{

    border-left:
        3px solid
        var(--gold);

}


/* =========================================================
   CONFIRM MODAL
========================================================= */

.modal{

    position:fixed;

    inset:0;

    display:none;

    align-items:center;

    justify-content:center;

    z-index:1000;

    padding:20px;

    background:
        rgba(0,0,0,.88);

}

.modal-card{

    width:100%;

    max-width:400px;

    padding:25px 20px;

    border:
        2px solid
        var(--gold);

    border-radius:22px;

    text-align:center;

    background:
        linear-gradient(
            145deg,
            #123660,
            #030b17
        );

}

.modal-title{

    color:var(--gold2);

    font-size:22px;

    font-weight:900;

    margin-bottom:10px;

}

.modal-question{

    color:#d7e2f0;

    line-height:1.5;

    margin-bottom:15px;

}

.selected-answer{

    padding:13px;

    border-radius:12px;

    background:
        rgba(245,197,66,.12);

    border:
        1px solid
        rgba(245,197,66,.4);

    color:var(--gold2);

    font-weight:800;

    margin-bottom:18px;

}

.modal-buttons{

    display:grid;

    grid-template-columns:1fr 1fr;

    gap:10px;

}

.modal-buttons button{

    padding:12px;

    border-radius:25px;

    border:none;

    font-weight:900;

    cursor:pointer;

}

.confirm{

    background:
        linear-gradient(
            135deg,
            #c88b12,
            #ffd966
        );

    color:#000;

}

.cancel{

    background:#26364d;

    color:white;

}


/* =========================================================
   RESULT MODAL
========================================================= */

.result-icon{

    font-size:55px;

    margin-bottom:10px;

}

.result-coins{

    color:var(--gold2);

    font-size:32px;

    font-weight:900;

    margin:12px 0 20px;

}

.restart{

    width:100%;

    padding:13px;

    border:none;

    border-radius:25px;

    background:
        linear-gradient(
            135deg,
            #d18b0b,
            #ffd966
        );

    font-weight:900;

}


/* =========================================================
   LOADING
========================================================= */

.loading{

    position:fixed;

    inset:0;

    z-index:2000;

    background:
        radial-gradient(
            circle,
            #10325c,
            #020711
        );

    display:flex;

    flex-direction:column;

    align-items:center;

    justify-content:center;

}

.loading-logo{

    color:var(--gold2);

    font-size:30px;

    font-weight:900;

    margin-bottom:18px;

}

.loader{

    width:42px;

    height:42px;

    border:
        4px solid
        rgba(255,255,255,.15);

    border-top-color:
        var(--gold2);

    border-radius:50%;

    animation:
        spin 1s linear infinite;

}

.loading-text{

    margin-top:15px;

    color:#c5d2e3;

}

@keyframes spin{

    to{
        transform:rotate(360deg);
    }

}


/* =========================================================
   MOBILE
========================================================= */

@media(max-width:650px){

    .logo{
        font-size:14px;
    }

    .options{
        grid-template-columns:1fr;
    }

    .lifelines{
        grid-template-columns:1fr 1fr;
    }

    .question-box{
        padding:22px 15px;
    }

    .question{
        font-size:18px;
    }

    .ladder{
        width:290px;
    }

}

</style>

</head>

            </span>

    </section>


    <!-- EXPLANATION -->

    <!-- LOCK -->

        <button

        <div
            class="status"

    <!-- LIFELINES -->

    <section class="lifelines">

        <button

        <button
            class="life"

        </button>

        <button
            class="life"
            id="lifeFlip"
            onclick="useFlip()">

            🔄 Flip

        </button>

    </section>

</main>


<!-- =====================================================
     LOCK CONFIRM MODAL
===================================================== -->

<div
    class="modal"
    id="confirmModal">

    <div class="modal-card">

        <div class="modal-title">

            🔒 Final Answer?

        </div>

        <div class="modal-question">

            तपाईंको चयन:

        <div

            <button

                class="confirm"

    </div>

</div>


<!-- =====================================================

<div
    class="modal"

    <div class="modal-card">

        <div
            class="result-icon"

        </div>

        <div
            class="modal-title"

        <button
            class="restart"

            🔄 फेरि खेल्नुहोस्

        </button>

    </div>

</div>

========================================================= */

async function loadCoins(){

    if(!currentUser)
        return;


    try{

        const ref =
        doc(
            db,
            "users",
            currentUser.uid
        );


        const snap =
        await getDoc(ref);


        if(snap.exists()){

            userCoins =
            Number(
                snap.data().coins || 0
            );

        }


        updateCoinUI();


    }catch(error){

        console.error(
            "Coin loading error:",
            error
        );

    }

}


/* =========================================================
   COIN UI
========================================================= */

function updateCoinUI(){

    document.getElementById(
        "headerCoins"
    ).innerText =
        `🪙 ${userCoins.toLocaleString()}`;

}


/* =========================================================
   FETCH QUESTIONS FROM SUPABASE
========================================================= */

async function fetchQuestions(){

    setLoading(
        "Supabase बाट प्रश्नहरू ल्याउँदै..."
    );


    const {
        data,
        error
    } =
    await supabase

        .from("quizzes")

        .select(`
            id,
            topic,
            question,
            options,
            answer,
            explanation
        `);


    if(error){

        throw new Error(
            "Supabase error: " +
            error.message
        );

    }


    if(!data || data.length < TOTAL){

        throw new Error(
            `quizzes table मा कम्तीमा ${TOTAL} questions आवश्यक छ। हाल ${data?.length || 0} मात्र छन्।`
        );

    }


    /*
     IMPORTANT:
     Questions are coming ONLY from Supabase.
     */

    const shuffled =
    [...data]
        .sort(
            () =>
                Math.random() - 0.5
        );


    /*
     First 10 questions
     */

    questions =
        shuffled.slice(
            0,
            TOTAL
        );


    console.log(
        "Loaded Supabase questions:",
        questions
    );

}


/* =========================================================
   NORMALIZE OPTIONS
========================================================= */

function getOptions(question){

    let options =
        question.options;


    /*
     JSONB normally arrives as
     JS array automatically.

     But this also handles
     stringified JSON.
     */

    if(typeof options === "string"){

        try{

            options =
            JSON.parse(options);

        }catch{

            return [];

        }

    }


    return Array.isArray(options)
        ? options
        : [];

}


/* =========================================================
   FIND ANSWER INDEX
========================================================= */

function getCorrectIndex(question){

    const options =
    getOptions(question);


    const answer =
    String(
        question.answer ?? ""
    )
    .trim();


    /*
     Case 1:
     answer = A/B/C/D
     */

    if(
        ["A","B","C","D"]
        .includes(
            answer.toUpperCase()
        )
    ){

        return "ABCD"
            .indexOf(
                answer.toUpperCase()
            );

    }


    /*
     Case 2:
     answer = 0/1/2/3
     */

    if(
        ["0","1","2","3"]
        .includes(answer)
    ){

        return Number(answer);

    }


    /*
     Case 3:
     answer = actual option text
     */

    const normalized =
    answer
        .toLowerCase()
        .trim();


    return options.findIndex(
        option =>
        String(option)
            .toLowerCase()
            .trim()
        === normalized
    );

}


/* =========================================================
   DRAW LADDER
========================================================= */

function renderLadder(){

    const list =
    document.getElementById(
        "moneyList"
    );


    list.innerHTML = "";


    for(
        let i = TOTAL - 1;
        i >= 0;
        i--
    ){

        const level =
        i + 1;


        const li =
        document.createElement(
            "li"
        );


        if(
            level ===
            currentIndex + 1
        ){

            li.classList.add(
                "current"
            );

        }


        if(
            SAFE_LEVELS.includes(level)
        ){

            li.classList.add(
                "safe"
            );

        }


        li.innerHTML = `

            <span>
                Q${level}
                ${
                    SAFE_LEVELS.includes(level)
                    ? " 🔒"
                    : ""
                }
            </span>

            <strong>
                🪙 ${PRIZES[i]}
            </strong>

        `;


        list.appendChild(li);

    }

}


/* =========================================================
   LOAD CURRENT QUESTION
========================================================= */

function loadQuestion(){

    if(
        currentIndex >=
        questions.length
    ){

        finishGame(
            true,
            "तपाईंले सबै प्रश्न सही गर्नुभयो!"
        );

        return;

    }


    answerLocked = false;

    selectedIndex = null;


    const q =
    questions[
        currentIndex
    ];


    const options =
    getOptions(q);


    /*
     UI
     */

    document.getElementById(
        "counter"
    ).innerText =
        `QUESTION ${currentIndex + 1} / ${TOTAL}`;


    document.getElementById(
        "progressBar"
    ).style.width =
        `${
            ((currentIndex + 1) / TOTAL) * 100
        }%`;


    document.getElementById(
        "topic"
    ).innerText =
        q.topic ||
        "LOKSEWA QUIZ";


    document.getElementById(
        "question"
    ).innerText =
        q.question;


    /*
     Options
     */

    for(
        let i=0;
        i<4;
        i++
    ){

        const button =
        document.getElementById(
            `option${i}`
        );


        const text =
        button.querySelector(
            ".option-text"
        );


        button.classList.remove(
            "selected",
            "correct",
            "wrong",
            "hidden"
        );


        button.disabled =
        false;


        if(
            options[i] !== undefined
        ){

            text.innerText =
            options[i];

            button.style.display =
            "flex";

        }else{

            button.style.display =
            "none";

        }

    }


    document.getElementById(
        "lockButton"
    ).disabled =
    true;


    document.getElementById(
        "status"
    ).innerText =
    "उत्तर चयन गर्नुहोस्";


    document.getElementById(
        "explanation"
    ).style.display =
    "none";


    renderLadder();


    startTimer();

}


/* =========================================================
   OPTION SELECT
========================================================= */

window.selectOption =
function(index){

    if(answerLocked)
        return;


    const button =
    document.getElementById(
        `option${index}`
    );


    if(
        button.disabled ||
        button.classList.contains("hidden")
    )
        return;


    for(
        let i=0;
        i<4;
        i++
    ){

        document.getElementById(
            `option${i}`
        )
        .classList.remove(
            "selected"
        );

    }


    button.classList.add(
        "selected"
    );


    selectedIndex =
    index;


    document.getElementById(
        "lockButton"
    ).disabled =
    false;


    document.getElementById(
        "status"
    ).innerText =
    "उत्तर चयन भयो";

};

/* =========================================================
   CONFIRM LOCK
========================================================= */

window.confirmLock =
function(){

    document.getElementById(
        "confirmModal"
    ).style.display =
    "none";


    lockAnswer();

};


/* =========================================================
   LOCK ANSWER
========================================================= */

function lockAnswer(){

    if(
        selectedIndex === null ||
        answerLocked
    )
        return;


    answerLocked =
    true;


    clearInterval(
        timerInterval
    );


    /*
     Disable everything during reveal
     */

    document.getElementById(
        "lockButton"
    ).disabled =
    true;


    for(
        let i=0;
        i<4;
        i++
    ){

        document.getElementById(
            `option${i}`
        ).disabled =
        true;

    }


    document.getElementById(
        "status"
    ).innerText =
    "🔒 LOCKED — उत्तर जाँच हुँदैछ...";


    /*
     Dramatic pause
     */

    setTimeout(
        revealAnswer,
        1500
    );

}


/* =========================================================
   REVEAL ANSWER
========================================================= */

function revealAnswer(){

    const q =
    questions[
        currentIndex
    ];


    const correctIndex =
    getCorrectIndex(q);


    const selectedButton =
    document.getElementById(
        `option${selectedIndex}`
    );


    /*
     CORRECT
     */

    if(
        selectedIndex ===
        correctIndex
    ){

        selectedButton.classList.remove(
            "selected"
        );


        selectedButton.classList.add(
            "correct"
        );


        winnings =
        PRIZES[
            currentIndex
        ];


        /*
         Safe level
         */

        if(
            SAFE_LEVELS.includes(
                currentIndex + 1
            )
        ){

            safeWinnings =
            winnings;

        }


        document.getElementById(
            "status"
        ).innerText =
        `🎉 सही उत्तर! ${winnings} Coins`;


        showExplanation();


        /*
         Final question
         */

        if(
            currentIndex ===
            TOTAL - 1
        ){

            setTimeout(
                () =>
                finishGame(
                    true,
                    "अविश्वसनीय! तपाईंले अन्तिम प्रश्न पनि सही गर्नुभयो।"
                ),
                2500
            );

            return;

        }


        setTimeout(()=>{

            currentIndex++;

            loadQuestion();

        },2300);


    }

    /*
     WRONG
     */

    else{

        selectedButton.classList.add(
            "wrong"
        );


        if(
            correctIndex >= 0
        ){

            document.getElementById(
                `option${correctIndex}`
            )
            .classList.add(
                "correct"
            );

        }


        showExplanation();


        /*
         Player gets SAFE amount,
         not current question prize.
         */

        winnings =
        safeWinnings;


        setTimeout(()=>{

            finishGame(
                false,
                `उत्तर गलत भयो। तपाईंले ${safeWinnings.toLocaleString()} Coins सुरक्षित गर्नुभयो।`
            );

        },2800);

    }

}


/* =========================================================
   TIMEOUT
========================================================= */

function startTimer(){

    clearInterval(
        timerInterval
    );


    timeLeft =
    30;


    updateTimer();


    timerInterval =
    setInterval(()=>{

        timeLeft--;

        updateTimer();


        if(
            timeLeft <= 0
        ){

            clearInterval(
                timerInterval
            );


            timeoutAnswer();

        }

    },1000);

}


/* =========================================================
   UPDATE TIMER
========================================================= */

function updateTimer(){

    const timer =
    document.getElementById(
        "timer"
    );


    const ring =
    document.getElementById(
        "timerRing"
    );


    timer.innerText =
    timeLeft;


    ring.style.setProperty(
        "--progress",
        `${
            (timeLeft / 30) * 100
        }%`
    );


    timer.classList.toggle(
        "timer-danger",
        timeLeft <= 7
    );

}


/* =========================================================
   TIMEOUT
========================================================= */

function timeoutAnswer(){

    if(answerLocked)
        return;


    answerLocked =
    true;


    for(
        let i=0;
        i<4;
        i++
    ){

        document.getElementById(
            `option${i}`
        ).disabled =
        true;

    }


    const q =
    questions[
        currentIndex
    ];


    const correctIndex =
    getCorrectIndex(q);


    if(
        correctIndex >= 0
    ){

        document.getElementById(
            `option${correctIndex}`
        )
        .classList.add(
            "correct"
        );

    }


    showExplanation();


    winnings =
    safeWinnings;


    document.getElementById(
        "status"
    ).innerText =
    `⏰ समय सकियो — सुरक्षित ${safeWinnings} Coins`;


    setTimeout(()=>{

        finishGame(
            false,
            `समय सकियो। तपाईंले ${safeWinnings.toLocaleString()} Coins सुरक्षित गर्नुभयो।`
        );

    },2500);

}


/* =========================================================
   EXPLANATION
========================================================= */

function showExplanation(){

    const q =
    questions[
        currentIndex
    ];


    if(!q.explanation)
        return;


    const box =
    document.getElementById(
        "explanation"
    );


    box.innerText =
    `💡 ${q.explanation}`;


    box.style.display =
    "block";

}


/* =========================================================
   50:50
========================================================= */

window.use5050 =
function(){

    if(
        lifelines.fifty ||
        answerLocked
    )
        return;


    lifelines.fifty =
    true;


    document.getElementById(
        "life5050"
    ).disabled =
    true;


    const q =
    questions[
        currentIndex
    ];


    const correct =
    getCorrectIndex(q);


    const wrong =
    [0,1,2,3]
    .filter(
        i => i !== correct
    )
    .sort(
        () =>
            Math.random() - .5
    )
    .slice(0,2);


    wrong.forEach(i=>{

        document.getElementById(
            `option${i}`
        )
        .classList.add(
            "hidden"
        );


        document.getElementById(
            `option${i}`
        ).disabled =
        true;

    });


    document.getElementById(
        "status"
    ).innerText =
    "50:50 प्रयोग गरियो";

};


/* =========================================================
   PHONE
========================================================= */

window.usePhone =
function(){

    if(
        lifelines.phone ||
        answerLocked
    )
        return;


    lifelines.phone =
    true;


    document.getElementById(
        "lifePhone"
    ).disabled =
    true;


    const q =
    questions[
        currentIndex
    ];


    const correct =
    getCorrectIndex(q);


    const letters =
    ["A","B","C","D"];


    /*
     Friend usually knows,
     but not always.
     */

    let suggestion =
    correct;


    if(
        Math.random() < .12
    ){

        const wrong =
        [0,1,2,3]
        .filter(
            i => i !== correct
        );


        suggestion =
        wrong[
            Math.floor(
                Math.random() *
                wrong.length
            )
        ];

    }


    alert(
        `📞 Phone a Friend\n\n` +
        `साथी भन्छ:\n\n` +
        `"मलाई ${letters[suggestion]} उत्तर सही जस्तो लाग्छ।"`
    );

};


/* =========================================================
   AUDIENCE
========================================================= */

window.useAudience =
function(){

    if(
        lifelines.audience ||
        answerLocked
    )
        return;


    lifelines.audience =
    true;


    document.getElementById(
        "lifeAudience"
    ).disabled =
    true;


    const q =
    questions[
        currentIndex
    ];


    const correct =
    getCorrectIndex(q);


    /*
     Generate realistic distribution
     */

    let values =
    [10,10,10,10];


    values[correct] =
    50 +
    Math.floor(
        Math.random() * 25
    );


    let remaining =
    100 -
    values[correct];


    const wrong =
    [0,1,2,3]
    .filter(
        i => i !== correct
    );


    wrong.forEach(
        (index,pos)=>{

            if(
                pos ===
                wrong.length - 1
            ){

                values[index] =
                remaining;

            }else{

                const value =
                Math.floor(
                    Math.random() *
                    (remaining + 1)
                );


                values[index] =
                value;

                remaining -=
                value;

            }

        }
    );


    alert(

        `👥 Audience Poll\n\n` +

        `A: ${values[0]}%\n` +

        `B: ${values[1]}%\n` +

        `C: ${values[2]}%\n` +

        `D: ${values[3]}%`

    );

};


/* =========================================================
   FLIP
========================================================= */

window.useFlip =
function(){

    if(
        lifelines.flip ||
        answerLocked
    )
        return;


    lifelines.flip =
    true;


    document.getElementById(
        "lifeFlip"
    ).disabled =
    true;


    /*
     Fetch a NEW question directly
     from Supabase.

     This is better than using
     another already-loaded question.
     */

    fetchReplacementQuestion();

};


/* =========================================================
   FETCH REPLACEMENT FROM SUPABASE
========================================================= */

async function fetchReplacementQuestion(){

    try{

        document.getElementById(
            "status"
        ).innerText =
        "🔄 नयाँ प्रश्न Supabase बाट ल्याउँदै...";


        const currentIds =
        questions.map(
            q => q.id
        );


        const {
            data,
            error
        } =
        await supabase

            .from("quizzes")

            .select(`
                id,
                topic,
                question,
                options,
                answer,
                explanation
            `);


        if(error)
            throw error;


        const available =
        data.filter(
            q =>
            !currentIds.includes(
                q.id
            )
        );


        if(
            available.length === 0
        ){

            document.getElementById(
                "status"
            ).innerText =
            "नयाँ प्रश्न उपलब्ध भएन।";

            return;

        }


        const replacement =
        available[
            Math.floor(
                Math.random() *
                available.length
            )
        ];


        questions[
            currentIndex
        ] =
        replacement;


        loadQuestion();


    }catch(error){

        console.error(
            error
        );


        document.getElementById(
            "status"
        ).innerText =
        "प्रश्न load गर्न सकिएन।";

    }

}


/* =========================================================
   FINISH GAME
========================================================= */

async function finishGame(
    won,
    message
){

    clearInterval(
        timerInterval
    );


    if(rewardSaved)
        return;


    rewardSaved =
    true;


    /*
     Reward ONLY once.
     */

    if(
        winnings > 0 &&
        currentUser
    ){

        try{

            const userRef =
            doc(
                db,
                "users",
                currentUser.uid
            );


            await updateDoc(
                userRef,
                {
                    coins:
                    increment(
                        winnings
                    )
                }
            );


            await addDoc(
                collection(
                    userRef,
                    "coin_history"
                ),
                {

                    coins_won:
                    winnings,

                    status:
                    won
                    ? "KBC Quiz Jackpot"
                    : "KBC Quiz Safe Amount",

                    source:
                    "loksewaquest_kbc_quiz",

                    timestamp:
                    serverTimestamp()

                }
            );


            userCoins +=
            winnings;


            updateCoinUI();


        }catch(error){

            console.error(
                "Reward error:",
                error
            );

        }

    }


    document.getElementById(
        "resultIcon"
    ).innerText =
    won
    ? "🏆"
    : winnings > 0
    ? "🪙"
    : "😔";


    document.getElementById(
        "resultTitle"
    ).innerText =
    won
    ? "अभिनन्दन!"
    : "Khel Samapta";


    document.getElementById(
        "resultMessage"
    ).innerText =
    message;


    document.getElementById(
        "resultCoins"
    ).innerText =
    `🪙 ${winnings.toLocaleString()} Coins`;


    document.getElementById(
        "resultModal"
    ).style.display =
    "flex";

}


/* =========================================================
   RESTART
========================================================= */

window.restartGame =
async function(){

    clearInterval(
        timerInterval
    );


    document.getElementById(
        "resultModal"
    ).style.display =
    "none";


    currentIndex =
    0;


    selectedIndex =
    null;


    winnings =
    0;


    safeWinnings =
    0;


    rewardSaved =
    false;


    answerLocked =
    false;


    lifelines = {

        fifty:false,
        phone:false,
        audience:false,
        flip:false

    };


    document
    .querySelectorAll(".life")
    .forEach(
        btn =>
        btn.disabled = false
    );


    try{

        await fetchQuestions();

        loadQuestion();

    }catch(error){

        showLoadingError(
            error.message
        );

    }

};

/* =========================================================
   LOADING
========================================================= */

    document.getElementById(
        "loadingText"
    ).innerText =
    text;

}


function hideLoading(){

    document.getElementById(
        "loading"
    ).style.display =
    "none";

}


function showLoadingError(message){

    document.getElementById(
        "loadingText"
    ).innerText =
    "❌ " + message;

}


/* =========================================================
   INITIALIZE
========================================================= */

async function init(){

    try{

        setLoading(
            "User authentication जाँच हुँदैछ..."
        );


        await waitForUser();


        setLoading(
            "तपाईंको coins load हुँदैछ..."
        );


        await loadCoins();


        setLoading(
            "Supabase quizzes table बाट प्रश्नहरू load हुँदैछन्..."
        );


        await fetchQuestions();


        renderLadder();


        hideLoading();


        loadQuestion();


    }catch(error){

        console.error(
            "GAME INIT ERROR:",
            error
        );


        showLoadingError(
            error.message
        );

    }

}


/* =========================================================
   START
========================================================= */

init();
