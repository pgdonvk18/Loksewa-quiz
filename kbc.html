<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoksewaQuest - Supabase Quiz & Firebase User Coins</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: radial-gradient(circle, #0b192c 0%, #020813 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-x: hidden;
            position: relative;
        }

        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: rgba(0, 0, 0, 0.6);
            border-bottom: 2px solid #d4af37;
            flex-wrap: wrap;
            gap: 10px;
        }

        .ladder-toggle-btn {
            background: #102a45;
            color: #d4af37;
            border: 2px solid #d4af37;
            padding: 6px 14px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: 0.3s;
        }

        .ladder-toggle-btn:hover {
            background: #d4af37;
            color: #000;
        }

        .lifelines {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .lifeline-btn {
            background: linear-gradient(135deg, #2c3e50, #000);
            color: #d4af37;
            border: 2px solid #d4af37;
            padding: 6px 12px;
            font-size: 0.85rem;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.3s;
        }

        .lifeline-btn:hover:not(:disabled) {
            background: #d4af37;
            color: #000;
        }

        .lifeline-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            border-color: #555;
            color: #777;
        }

        .score-display {
            font-size: 1rem;
            color: #ffd700;
            font-weight: bold;
            background: rgba(255, 215, 0, 0.1);
            padding: 6px 15px;
            border-radius: 20px;
            border: 1px solid #ffd700;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .game-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            flex-grow: 1;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }

        .topic-badge {
            background: #102a45;
            color: #d4af37;
            border: 1px solid #d4af37;
            padding: 4px 12px;
            border-radius: 10px;
            font-size: 0.85rem;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .question-box {
            background: linear-gradient(135deg, #102a45, #061424);
            border: 3px solid #d4af37;
            border-radius: 15px;
            width: 100%;
            padding: 25px 20px;
            text-align: center;
            font-size: 1.25rem;
            margin-bottom: 25px;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
            position: relative;
        }

        .timer-badge {
            position: absolute;
            top: -20px;
            right: 20px;
            background: #d4af37;
            color: #000;
            font-weight: bold;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            border: 2px solid #fff;
        }

        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            width: 100%;
        }

        @media (min-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .option-btn {
            background: linear-gradient(135deg, #14283f, #091522);
            border: 2px solid #2a4763;
            color: #ffffff;
            padding: 14px 20px;
            border-radius: 30px;
            font-size: 1rem;
            cursor: pointer;
            text-align: left;
            transition: 0.2s;
            position: relative;
            padding-left: 45px;
        }

        .option-btn::before {
            content: attr(data-label);
            position: absolute;
            left: 15px;
            color: #d4af37;
            font-weight: bold;
        }

        .option-btn:hover:not(:disabled) {
            border-color: #d4af37;
            background: #1b3654;
        }

        .option-btn.selected {
            background: #d4af37;
            color: #000;
            border-color: #fff;
            font-weight: bold;
        }

        .option-btn.selected::before {
            color: #000;
        }

        .option-btn.correct {
            background: #27ae60 !important;
            color: #fff !important;
            border-color: #2ecc71 !important;
        }

        .option-btn.wrong {
            background: #c0392b !important;
            color: #fff !important;
            border-color: #e74c3c !important;
        }

        .option-btn.hidden-option {
            visibility: hidden;
            opacity: 0;
            pointer-events: none;
        }

        .explanation-box {
            margin-top: 15px;
            background: rgba(46, 204, 113, 0.1);
            border: 1px dashed #2ecc71;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 0.95rem;
            color: #2ecc71;
            display: none;
            width: 100%;
            text-align: center;
        }

        .sidebar-menu {
            position: fixed;
            top: 0;
            left: -300px;
            width: 280px;
            height: 100%;
            background: rgba(5, 13, 23, 0.95);
            border-right: 2px solid #d4af37;
            z-index: 1001;
            transition: 0.3s ease-in-out;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .sidebar-menu.open {
            left: 0;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #2a4763;
            padding-bottom: 10px;
        }

        .sidebar-header h3 {
            color: #d4af37;
            font-size: 1.2rem;
        }

        .close-sidebar {
            background: none;
            border: none;
            color: #fff;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .money-list {
            list-style: none;
            overflow-y: auto;
            flex-grow: 1;
        }

        .money-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 12px;
            margin-bottom: 5px;
            border-radius: 5px;
            font-size: 0.95rem;
            color: #8899a6;
        }

        .money-item span:last-child {
            color: #ffd700;
            font-weight: bold;
        }

        .money-item.active {
            background: #ffd700;
            color: #000;
            font-weight: bold;
        }

        .money-item.active span:last-child {
            color: #000;
        }

        .overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
        }

        .overlay.active {
            display: block;
        }

        .action-area {
            display: flex;
            justify-content: center;
            padding: 15px;
        }

        .lock-btn {
            background: linear-gradient(135deg, #f39c12, #d35400);
            color: #fff;
            border: none;
            padding: 12px 35px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(243, 156, 18, 0.4);
            transition: 0.3s;
        }

        .lock-btn:hover {
            transform: scale(1.05);
        }

        .lock-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            z-index: 1100;
        }

        .modal-content {
            background: #102a45;
            border: 3px solid #d4af37;
            padding: 30px 20px;
            border-radius: 20px;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .modal-content h2 {
            color: #ffd700;
            margin-bottom: 12px;
            font-size: 1.7rem;
        }

        .modal-content p {
            font-size: 1.05rem;
            margin-bottom: 20px;
            color: #ddd;
        }

        .restart-btn {
            background: #ffd700;
            color: #000;
            border: none;
            padding: 10px 22px;
            font-weight: bold;
            font-size: 1rem;
            border-radius: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <div class="overlay" id="sidebarOverlay" onclick="toggleLadder()"></div>
    <div class="sidebar-menu" id="moneyLadderSidebar">
        <div class="sidebar-header">
            <h3>🪙 Coin Ladder</h3>
            <button class="close-sidebar" onclick="toggleLadder()">&times;</button>
        </div>
        <ul class="money-list" id="moneyList"></ul>
    </div>

    <div class="header-section">
        <button class="ladder-toggle-btn" onclick="toggleLadder()">📊 Coin Ladder</button>
        <div class="lifelines">
            <button class="lifeline-btn" id="ll-5050" onclick="use5050()">50:50</button>
            <button class="lifeline-btn" id="ll-phone" onclick="usePhoneAFriend()">📞 Phone</button>
            <button class="lifeline-btn" id="ll-audience" onclick="useAudiencePoll()">👥 Poll</button>
            <button class="lifeline-btn" id="ll-flip" onclick="useFlipQuestion()">🔄 Flip</button>
        </div>
        <div class="score-display" id="currentPrizeText">🪙 0 Coins</div>
    </div>

    <div class="game-container">
        <div class="topic-badge" id="topicBadge">Loksewa Quiz</div>
        <div class="question-box">
            <div class="timer-badge" id="timer">30</div>
            <span id="questionText">Supabase `public.quizzes` bata prasna haru load hudai xa...</span>
        </div>

        <div class="options-grid">
            <button class="option-btn" id="opt0" data-label="A" onclick="selectOption(0)"></button>
            <button class="option-btn" id="opt1" data-label="B" onclick="selectOption(1)"></button>
            <button class="option-btn" id="opt2" data-label="C" onclick="selectOption(2)"></button>
            <button class="option-btn" id="opt3" data-label="D" onclick="selectOption(3)"></button>
        </div>

        <div class="explanation-box" id="explanationBox"></div>
    </div>

    <div class="action-area">
        <button class="lock-btn" id="lockBtn" onclick="lockAnswer()" disabled>LOCK kiya jaye?</button>
    </div>

    <div class="modal" id="gameModal">
        <div class="modal-content">
            <h2 id="modalTitle">Khel Samapta!</h2>
            <p id="modalDesc">Tapai le coin jitnu bhayo.</p>
            <button class="restart-btn" onclick="restartGame()">Pheri Khelnu Huncha?</button>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';
        import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js';
        import { getFirestore, doc, getDoc, updateDoc, collection, addDoc, serverTimestamp, increment } from 'https://cdn.jsdelivr.net/npm/firebasejs/10.8.0/firebase-firestore.js';

        // 1. Supabase Credentials
        const SUPABASE_URL = 'https://edyirdedkiarguvurpxq.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVkeWlyZGVka2lhcmd1dnVycHhxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwMTg2NjIsImV4cCI6MjEwNDU5NDY2Mn0.yhNn3YKmFSkxRdefk2F22qxTFhuKS90NH5fa3zzKSaY';
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        // 2. Firebase Credentials
        const firebaseConfig = {
            apiKey: "AIzaSyCkKCU1re5b9MtdsAF1F4xI6rGxmxhGZak",
            authDomain: "loksewaquest-227b6.firebaseapp.com",
            projectId: "loksewaquest-227b6",
            storageBucket: "loksewaquest-227b6.firebasestorage.app",
            messagingSenderId: "779234903809",
            appId: "1:779234903809:web:dd0dd0ffb742e1c218bd00"
        };

        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        const userId = "3MTXSPMd21afwhpJ9CsRGLNj62"; 

        const coinLadder = [
            { level: 10, coins: 1000 },
            { level: 9, coins: 800 },
            { level: 8, coins: 600 },
            { level: 7, coins: 400 },
            { level: 6, coins: 250 },
            { level: 5, coins: 150 },
            { level: 4, coins: 80 },
            { level: 3, coins: 40 },
            { level: 2, coins: 20 },
            { level: 1, coins: 10 }
        ];

        let questions = [];
        let currentQuestionIndex = 0;
        let selectedOptionIndex = null;
        let timerInterval;
        let timeLeft = 30;
        let totalCoinsEarned = 0;
        let userCurrentCoins = 0;

        let lifelineUsed = {
            '5050': false,
            'phone': false,
            'audience': false,
            'flip': false
        };

        window.toggleLadder = function() {
            document.getElementById('moneyLadderSidebar').classList.toggle('open');
            document.getElementById('sidebarOverlay').classList.toggle('active');
        }

        async function fetchUserCoinsFromFirebase() {
            try {
                const userRef = doc(db, "users", userId);
                const userSnap = await getDoc(userRef);
                if (userSnap.exists()) {
                    const userData = userSnap.data();
                    userCurrentCoins = userData.coins || 0;
                    document.getElementById('currentPrizeText').innerText = `🪙 Won: 0 (Total: ${userCurrentCoins})`;
                }
            } catch (error) {
                console.error("Error fetching user coins:", error);
            }
        }

        async function fetchQuestionsFromSupabase() {
            await fetchUserCoinsFromFirebase();
            try {
                const { data, error } = await supabase.from('quizzes').select('*');
                if (error) {
                    document.getElementById('questionText').innerText = 'Supabase bata prasna load garna samasya bhayo!';
                    return;
                }
                if (data && data.length > 0) {
                    questions = data.sort(() => Math.random() - 0.5).slice(0, 10);
                    loadQuestion();
                } else {
                    document.getElementById('questionText').innerText = 'Quizzes table ma kunai prasna bhetiyena!';
                }
            } catch (err) {
                console.error('Connection error:', err);
            }
        }

        function initMoneyTree() {
            const listEl = document.getElementById('moneyList');
            listEl.innerHTML = '';
            coinLadder.forEach((item, idx) => {
                const li = document.createElement('li');
                li.className = `money-item ${idx === (coinLadder.length - 1 - currentQuestionIndex) ? 'active' : ''}`;
                li.innerHTML = `<span>Level ${item.level}</span> <span>🪙 ${item.coins} Coins</span>`;
                listEl.appendChild(li);
            });
        }

        function loadQuestion() {
            if (currentQuestionIndex >= questions.length) {
                totalCoinsEarned = 1000;
                updateFirebaseData(totalCoinsEarned, "Completed all levels");
                endGame(true, `Badhai cha! Tapai le sabai level milayera 1000 Coins jitnu bhayo! 🎉`);
                return;
            }

            initMoneyTree();
            resetOptionsUI();

            const currentQ = questions[currentQuestionIndex];
            document.getElementById('topicBadge').innerText = currentQ.topic || 'Loksewa General Quiz';
            document.getElementById('questionText').innerText = `Q${currentQuestionIndex + 1}. ${currentQ.question}`;
            
            let optionsArray = currentQ.options;
            if (typeof optionsArray === 'string') {
                try { optionsArray = JSON.parse(optionsArray); } catch(e) {}
            }

            for (let i = 0; i < 4; i++) {
                const btn = document.getElementById('opt' + i);
                if (optionsArray && optionsArray[i]) {
                    btn.innerText = optionsArray[i];
                    btn.style.display = 'block';
                }
            }

            selectedOptionIndex = null;
            document.getElementById('lockBtn').disabled = true;
            document.getElementById('explanationBox').style.display = 'none';
            startTimer();
        }

        function resetOptionsUI() {
            for (let i = 0; i < 4; i++) {
                const btn = document.getElementById('opt' + i);
                btn.classList.remove('selected', 'correct', 'wrong', 'hidden-option');
                btn.disabled = false;
            }
        }

        function startTimer() {
            clearInterval(timerInterval);
            timeLeft = 30;
            document.getElementById('timer').innerText = timeLeft;

            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    updateFirebaseData(totalCoinsEarned, "Time Out");
                    endGame(false, "Samay samapta bhayo! (Time Out)");
                }
            }, 1000);
        }

        window.selectOption = function(index) {
            for (let i = 0; i < 4; i++) {
                document.getElementById('opt' + i).classList.remove('selected');
            }
            document.getElementById('opt' + index).classList.add('selected');
            selectedOptionIndex = index;
            document.getElementById('lockBtn').disabled = false;
        }

        window.lockAnswer = function() {
            clearInterval(timerInterval);
            document.getElementById('lockBtn').disabled = true;

            const currentQ = questions[currentQuestionIndex];
            const selectedBtn = document.getElementById('opt' + selectedOptionIndex);
            
            let optionsArray = currentQ.options;
            if (typeof optionsArray === 'string') {
                try { optionsArray = JSON.parse(optionsArray); } catch(e) {}
            }

            const correctAnswerText = String(currentQ.answer).trim();
            const selectedAnswerText = String(optionsArray[selectedOptionIndex]).trim();
            
            let isCorrect = (selectedAnswerText.toLowerCase() === correctAnswerText.toLowerCase()) || 
                            (selectedOptionIndex.toString() === correctAnswerText) ||
                            (String.fromCharCode(65 + selectedOptionIndex) === correctAnswerText.toUpperCase());

            setTimeout(() => {
                if (isCorrect) {
                    selectedBtn.classList.add('correct');
                    totalCoinsEarned = coinLadder[coinLadder.length - 1 - currentQuestionIndex].coins;
                    document.getElementById('currentPrizeText').innerText = `🪙 Won: ${totalCoinsEarned}`;

                    if (currentQ.explanation) {
                        const expBox = document.getElementById('explanationBox');
                        expBox.innerText = `💡 Spastikaran: ${currentQ.explanation}`;
                        expBox.style.display = 'block';
                    }

                    setTimeout(() => {
                        currentQuestionIndex++;
                        loadQuestion();
                    }, 2500);
                } else {
                    selectedBtn.classList.add('wrong');
                    for (let i = 0; i < 4; i++) {
                        if (String(optionsArray[i]).trim().toLowerCase() === correctAnswerText.toLowerCase() ||
                            i.toString() === correctAnswerText ||
                            String.fromCharCode(65 + i) === correctAnswerText.toUpperCase()) {
                            document.getElementById('opt' + i).classList.add('correct');
                        }
                    }

                    if (currentQ.explanation) {
                        const expBox = document.getElementById('explanationBox');
                        expBox.innerText = `💡 Spastikaran: ${currentQ.explanation}`;
                        expBox.style.display = 'block';
                    }

                    setTimeout(() => {
                        updateFirebaseData(totalCoinsEarned, "Wrong Answer");
                        endGame(false, `Uttar galat bhayo! Tapai le jamma ${totalCoinsEarned} Coins surakshit garnu bhayo.`);
                    }, 3000);
                }
            }, 1000);
        }

        async function updateFirebaseData(earnedCoins, status) {
            if (earnedCoins <= 0) return;
            try {
                const userRef = doc(db, "users", userId);
                await updateDoc(userRef, {
                    coins: increment(earnedCoins)
                });

                await addDoc(collection(userRef, "coin_history"), {
                    coins_won: earnedCoins,
                    status: status,
                    timestamp: serverTimestamp()
                });

                console.log("Firebase successfully updated!");
            } catch (e) {
                console.error("Error updating Firebase: ", e);
            }
        }

        window.use5050 = function() {
            if (lifelineUsed['5050']) return;
            lifelineUsed['5050'] = true;
            document.getElementById('ll-5050').disabled = true;

            const currentQ = questions[currentQuestionIndex];
            let optionsArray = currentQ.options;
            if (typeof optionsArray === 'string') {
                try { optionsArray = JSON.parse(optionsArray); } catch(e) {}
            }

            const correctAnswerText = String(currentQ.answer).trim();
            let correctIndex = -1;
            for (let i = 0; i < 4; i++) {
                if (String(optionsArray[i]).trim().toLowerCase() === correctAnswerText.toLowerCase() ||
                    i.toString() === correctAnswerText ||
                    String.fromCharCode(65 + i) === correctAnswerText.toUpperCase()) {
                    correctIndex = i;
                }
            }

            let wrongIndices = [0, 1, 2, 3].filter(i => i !== correctIndex);
            wrongIndices.sort(() => Math.random() - 0.5);
            
            document.getElementById('opt' + wrongIndices[0]).classList.add('hidden-option');
            document.getElementById('opt' + wrongIndices[0]).disabled = true;
            document.getElementById('opt' + wrongIndices[1]).classList.add('hidden-option');
            document.getElementById('opt' + wrongIndices[1]).disabled = true;
        }

        window.usePhoneAFriend = function() {
            if (lifelineUsed['phone']) return;
            lifelineUsed['phone'] = true;
            document.getElementById('ll-phone').disabled = true;
            alert(`📞 Sathi ko sallah: "Malai yo prasna ko sahi uttar ma purna biswas xa!"`);
        }

        window.useAudiencePoll = function() {
            if (lifelineUsed['audience']) return;
            lifelineUsed['audience'] = true;
            document.getElementById('ll-audience').disabled = true;
            alert(`👥 Audience Poll ko natija:\n[A]: 50% | [B]: 20% | [C]: 20% | [D]: 10%`);
        }

        window.useFlipQuestion = function() {
            if (lifelineUsed['flip']) return;
            lifelineUsed['flip'] = true;
            document.getElementById('ll-flip').disabled = true;
            alert("🔄 Prasna pariwartan garieko xa!");
            loadQuestion();
        }

        function endGame(isWin, message) {
            clearInterval(timerInterval);
            document.getElementById('modalTitle').innerText = isWin ? "Adbhuta! Vijeta bannu bhayo! 🏆" : "Khel Samapta!";
            document.getElementById('modalDesc').innerText = message;
            document.getElementById('gameModal').style.display = 'flex';
        }

        window.restartGame = function() {
            currentQuestionIndex = 0;
            totalCoinsEarned = 0;
            document.getElementById('currentPrizeText').innerText = `🪙 Won: 0`;
            lifelineUsed = { '5050': false, 'phone': false, 'audience': false, 'flip': false };
            document.querySelectorAll('.lifeline-btn').forEach(btn => btn.disabled = false);
            document.getElementById('gameModal').style.display = 'none';
            fetchQuestionsFromSupabase();
        }

        fetchQuestionsFromSupabase();
    </script>
</body>
</html>
