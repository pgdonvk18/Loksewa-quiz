<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LoksewaQuest - KBC Solo Mode</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: radial-gradient(circle, #0b192c 0%, #020813 100%);
            color: #ffffff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            overflow-x: hidden;
            position: relative;
        }

        /* Top Bar & Header */
        .header-section {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 20px;
            background: rgba(0, 0, 0, 0.6);
            border-bottom: 2px solid #d4af37;
            flex-wrap: wrap;
            gap: 10px;
        }

        .ladder-toggle-btn {
            background: #102a45;
            color: #d4af37;
            border: 2px solid #d4af37;
            padding: 6px 14px;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.9rem;
            transition: 0.3s;
        }

        .ladder-toggle-btn:hover {
            background: #d4af37;
            color: #000;
        }

        .lifelines {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }

        .lifeline-btn {
            background: linear-gradient(135deg, #2c3e50, #000);
            color: #d4af37;
            border: 2px solid #d4af37;
            padding: 6px 12px;
            font-size: 0.85rem;
            font-weight: bold;
            border-radius: 20px;
            cursor: pointer;
            transition: 0.3s;
        }

        .lifeline-btn:hover:not(:disabled) {
            background: #d4af37;
            color: #000;
        }

        .lifeline-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
            border-color: #555;
            color: #777;
        }

        .score-display {
            font-size: 1rem;
            color: #d4af37;
            font-weight: bold;
            background: rgba(212, 175, 55, 0.1);
            padding: 6px 15px;
            border-radius: 20px;
            border: 1px solid #d4af37;
        }

        /* Main Game Area */
        .game-container {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            flex-grow: 1;
            width: 100%;
            max-width: 800px;
            margin: 0 auto;
        }

        /* Question Box */
        .question-box {
            background: linear-gradient(135deg, #102a45, #061424);
            border: 3px solid #d4af37;
            border-radius: 15px;
            width: 100%;
            padding: 25px 20px;
            text-align: center;
            font-size: 1.25rem;
            margin-bottom: 25px;
            box-shadow: 0 0 20px rgba(212, 175, 55, 0.3);
            position: relative;
        }

        .timer-badge {
            position: absolute;
            top: -20px;
            right: 20px;
            background: #d4af37;
            color: #000;
            font-weight: bold;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1rem;
            border: 2px solid #fff;
        }

        /* Options Grid */
        .options-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 15px;
            width: 100%;
        }

        @media (min-width: 600px) {
            .options-grid {
                grid-template-columns: 1fr 1fr;
            }
        }

        .option-btn {
            background: linear-gradient(135deg, #14283f, #091522);
            border: 2px solid #2a4763;
            color: #ffffff;
            padding: 14px 20px;
            border-radius: 30px;
            font-size: 1rem;
            cursor: pointer;
            text-align: left;
            transition: 0.2s;
            position: relative;
            padding-left: 45px;
        }

        .option-btn::before {
            content: attr(data-label);
            position: absolute;
            left: 15px;
            color: #d4af37;
            font-weight: bold;
        }

        .option-btn:hover:not(:disabled) {
            border-color: #d4af37;
            background: #1b3654;
        }

        .option-btn.selected {
            background: #d4af37;
            color: #000;
            border-color: #fff;
            font-weight: bold;
        }

        .option-btn.selected::before {
            color: #000;
        }

        .option-btn.correct {
            background: #27ae60 !important;
            color: #fff !important;
            border-color: #2ecc71 !important;
        }

        .option-btn.wrong {
            background: #c0392b !important;
            color: #fff !important;
            border-color: #e74c3c !important;
        }

        .option-btn.hidden-option {
            visibility: hidden;
            opacity: 0;
        }

        /* Slide-out Sidebar Menu for Money Ladder */
        .sidebar-menu {
            position: fixed;
            top: 0;
            left: -300px;
            width: 280px;
            height: 100%;
            background: rgba(5, 13, 23, 0.95);
            border-right: 2px solid #d4af37;
            z-index: 1001;
            transition: 0.3s ease-in-out;
            padding: 20px;
            display: flex;
            flex-direction: column;
        }

        .sidebar-menu.open {
            left: 0;
        }

        .sidebar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border-bottom: 1px solid #2a4763;
            padding-bottom: 10px;
        }

        .sidebar-header h3 {
            color: #d4af37;
            font-size: 1.2rem;
        }

        .close-sidebar {
            background: none;
            border: none;
            color: #fff;
            font-size: 1.5rem;
            cursor: pointer;
        }

        .money-list {
            list-style: none;
            overflow-y: auto;
            flex-grow: 1;
        }

        .money-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 12px;
            margin-bottom: 5px;
            border-radius: 5px;
            font-size: 0.95rem;
            color: #8899a6;
        }

        .money-item span:last-child {
            color: #d4af37;
            font-weight: bold;
        }

        .money-item.active {
            background: #d4af37;
            color: #000;
            font-weight: bold;
        }

        .money-item.active span:last-child {
            color: #000;
        }

        .money-item.safe-zone {
            border-left: 4px solid #3498db;
        }

        /* Overlay for Sidebar */
        .overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            z-index: 1000;
        }

        .overlay.active {
            display: block;
        }

        /* Lock Button Container */
        .action-area {
            display: flex;
            justify-content: center;
            padding: 15px;
        }

        .lock-btn {
            background: linear-gradient(135deg, #f39c12, #d35400);
            color: #fff;
            border: none;
            padding: 12px 35px;
            font-size: 1.1rem;
            font-weight: bold;
            border-radius: 30px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(243, 156, 18, 0.4);
            transition: 0.3s;
        }

        .lock-btn:hover {
            transform: scale(1.05);
        }

        .lock-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        /* Modal Overlays for Results */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.85);
            justify-content: center;
            align-items: center;
            z-index: 1100;
        }

        .modal-content {
            background: #102a45;
            border: 3px solid #d4af37;
            padding: 30px 20px;
            border-radius: 20px;
            text-align: center;
            max-width: 400px;
            width: 90%;
        }

        .modal-content h2 {
            color: #d4af37;
            margin-bottom: 12px;
            font-size: 1.7rem;
        }

        .modal-content p {
            font-size: 1.05rem;
            margin-bottom: 20px;
            color: #ddd;
        }

        .restart-btn {
            background: #d4af37;
            color: #000;
            border: none;
            padding: 10px 22px;
            font-weight: bold;
            font-size: 1rem;
            border-radius: 20px;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- Sidebar Menu for Money Ladder -->
    <div class="overlay" id="sidebarOverlay" onclick="toggleLadder()"></div>
    <div class="sidebar-menu" id="moneyLadderSidebar">
        <div class="sidebar-header">
            <h3>💰 Prize Ladder</h3>
            <button class="close-sidebar" onclick="toggleLadder()">&times;</button>
        </div>
        <ul class="money-list" id="moneyList">
            <!-- Dynamically filled by JS -->
        </ul>
    </div>

    <!-- Top Bar -->
    <div class="header-section">
        <button class="ladder-toggle-btn" onclick="toggleLadder()">📊 Prize Ladder</button>
        <div class="lifelines">
            <button class="lifeline-btn" id="ll-5050" onclick="use5050()">50:50</button>
            <button class="lifeline-btn" id="ll-phone" onclick="usePhoneAFriend()">📞 Phone</button>
            <button class="lifeline-btn" id="ll-audience" onclick="useAudiencePoll()">👥 Poll</button>
            <button class="lifeline-btn" id="ll-flip" onclick="useFlipQuestion()">🔄 Flip</button>
        </div>
        <div class="score-display" id="currentPrizeText">रू 0</div>
    </div>

    <!-- Game Core Layout -->
    <div class="game-container">
        <div class="question-box">
            <div class="timer-badge" id="timer">30</div>
            <span id="questionText">Supabase बाट प्रश्नहरू लोड हुँदैछ...</span>
        </div>

        <div class="options-grid">
            <button class="option-btn" id="optA" data-label="A" onclick="selectOption('A')"></button>
            <button class="option-btn" id="optB" data-label="B" onclick="selectOption('B')"></button>
            <button class="option-btn" id="optC" data-label="C" onclick="selectOption('C')"></button>
            <button class="option-btn" id="optD" data-label="D" onclick="selectOption('D')"></button>
        </div>
    </div>

    <!-- Lock Action Button -->
    <div class="action-area">
        <button class="lock-btn" id="lockBtn" onclick="lockAnswer()" disabled>LOCK किया जाए?</button>
    </div>

    <!-- Modal Popup for Win/Loss -->
    <div class="modal" id="gameModal">
        <div class="modal-content">
            <h2 id="modalTitle">खेल समाप्त!</h2>
            <p id="modalDesc">तपाईंले पुरस्कार जित्नुभयो।</p>
            <button class="restart-btn" onclick="restartGame()">फेरि खेल्नुहोस्</button>
        </div>
    </div>

    <!-- Supabase JS Client & Logic -->
    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js/+esm';

        // तपाईंको वास्तविक Supabase URL र Anon Key
        const SUPABASE_URL = 'https://edyirdedkiarguvurpxq.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImVkeWlyZGVka2lhcmd1dnVycHhxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODkwMTg2NjIsImV4cCI6MjEwNDU5NDY2Mn0.yhNn3YKmFSkxRdefk2F22qxTFhuKS90NH5fa3zzKSaY';
        
        const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        const prizeLadder = [
            { level: 10, prize: "रू 1,00,000", amount: 100000 },
            { level: 9, prize: "रू 50,000", amount: 50000 },
            { level: 8, prize: "रू 25,000", amount: 25000 },
            { level: 7, prize: "रू 12,500", amount: 12500, safe: true },
            { level: 6, prize: "रू 10,000", amount: 10000 },
            { level: 5, prize: "रू 7,500", amount: 7500 },
            { level: 4, prize: "रू 5,000", amount: 5000 },
            { level: 3, prize: "रू 3,000", amount: 3000, safe: true },
            { level: 2, prize: "रू 2,000", amount: 2000 },
            { level: 1, prize: "रू 1,000", amount: 1000 }
        ];

        let questions = [];
        let currentQuestionIndex = 0;
        let selectedOptionKey = null;
        let timerInterval;
        let timeLeft = 30;

        let lifelineUsed = {
            '5050': false,
            'phone': false,
            'audience': false,
            'flip': false
        };

        window.toggleLadder = function() {
            document.getElementById('moneyLadderSidebar').classList.toggle('open');
            document.getElementById('sidebarOverlay').classList.toggle('active');
        }

        async function fetchQuestionsFromSupabase() {
            try {
                const { data, error } = await supabase
                    .from('questions')
                    .select('*');

                if (error) {
                    console.error('Error fetching questions:', error);
                    document.getElementById('questionText').innerText = 'डेटाबेसबाट प्रश्न लोड गर्न समस्या भयो!';
                    return;
                }

                if (data && data.length > 0) {
                    // रेन्डम गरेर १० वटा मात्र प्रश्न छान्ने
                    questions = data.sort(() => Math.random() - 0.5).slice(0, 10);
                    loadQuestion();
                } else {
                    document.getElementById('questionText').innerText = 'कुनै पनि प्रश्न भेटिएन!';
                }
            } catch (err) {
                console.error('Connection error:', err);
                document.getElementById('questionText').innerText = 'इन्टरनेट वा कनेक्सन समस्या!';
            }
        }

        function initMoneyTree() {
            const listEl = document.getElementById('moneyList');
            listEl.innerHTML = '';
            prizeLadder.forEach((item, idx) => {
                const li = document.createElement('li');
                li.className = `money-item ${item.safe ? 'safe-zone' : ''} ${idx === (prizeLadder.length - 1 - currentQuestionIndex) ? 'active' : ''}`;
                li.innerHTML = `<span>Lvl ${item.level}</span> <span>${item.prize}</span>`;
                listEl.appendChild(li);
            });
        }

        function loadQuestion() {
            if (currentQuestionIndex >= questions.length) {
                endGame(true, "बधाई छ! तपाईंले KBC गेम सफलतापूर्वक जितेर सबै पुरस्कार जित्नुभयो! 🎉");
                return;
            }

            initMoneyTree();
            resetOptionsUI();

            const currentQ = questions[currentQuestionIndex];
            
            // Supabase को स्तम्भ (Column) नाम अनुसार म्याच गरिएको
            document.getElementById('questionText').innerText = `Q${currentQuestionIndex + 1}. ${currentQ.question_text || currentQ.q}`;
            document.getElementById('optA').innerText = currentQ.option_a;
            document.getElementById('optB').innerText = currentQ.option_b;
            document.getElementById('optC').innerText = currentQ.option_c;
            document.getElementById('optD').innerText = currentQ.option_d;

            selectedOptionKey = null;
            document.getElementById('lockBtn').disabled = true;
            startTimer();
        }

        function resetOptionsUI() {
            ['A', 'B', 'C', 'D'].forEach(key => {
                const btn = document.getElementById('opt' + key);
                btn.classList.remove('selected', 'correct', 'wrong', 'hidden-option');
                btn.disabled = false;
            });
        }

        function startTimer() {
            clearInterval(timerInterval);
            timeLeft = 30;
            document.getElementById('timer').innerText = timeLeft;

            timerInterval = setInterval(() => {
                timeLeft--;
                document.getElementById('timer').innerText = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    endGame(false, "समय समाप्त भयो! (Time Out)");
                }
            }, 1000);
        }

        window.selectOption = function(key) {
            ['A', 'B', 'C', 'D'].forEach(k => {
                document.getElementById('opt' + k).classList.remove('selected');
            });
            document.getElementById('opt' + key).classList.add('selected');
            selectedOptionKey = key;
            document.getElementById('lockBtn').disabled = false;
        }

        window.lockAnswer = function() {
            clearInterval(timerInterval);
            document.getElementById('lockBtn').disabled = true;

            const currentQ = questions[currentQuestionIndex];
            const selectedBtn = document.getElementById('opt' + selectedOptionKey);
            const correctKey = currentQ.correct_answer; // Supabase को सहि उत्तर स्तम्भ

            setTimeout(() => {
                if (selectedOptionKey === correctKey) {
                    selectedBtn.classList.add('correct');
                    document.getElementById('currentPrizeText').innerText = prizeLadder[prizeLadder.length - 1 - currentQuestionIndex].prize;
                    setTimeout(() => {
                        currentQuestionIndex++;
                        loadQuestion();
                    }, 1500);
                } else {
                    selectedBtn.classList.add('wrong');
                    document.getElementById('opt' + correctKey).classList.add('correct');
                    setTimeout(() => {
                        checkSafeZoneAndEnd();
                    }, 2000);
                }
            }, 1000);
        }

        // Lifelines
        window.use5050 = function() {
            if (lifelineUsed['5050']) return;
            lifelineUsed['5050'] = true;
            document.getElementById('ll-5050').disabled = true;

            const currentQ = questions[currentQuestionIndex];
            let wrongOptions = ['A', 'B', 'C', 'D'].filter(k => k !== currentQ.correct_answer);
            wrongOptions.sort(() => Math.random() - 0.5);
            
            document.getElementById('opt' + wrongOptions[0]).classList.add('hidden-option');
            document.getElementById('opt' + wrongOptions[0]).disabled = true;
            document.getElementById('opt' + wrongOptions[1]).classList.add('hidden-option');
            document.getElementById('opt' + wrongOptions[1]).disabled = true;
        }

        window.usePhoneAFriend = function() {
            if (lifelineUsed['phone']) return;
            lifelineUsed['phone'] = true;
            document.getElementById('ll-phone').disabled = true;

            const currentQ = questions[currentQuestionIndex];
            alert(`📞 साथीको सल्लाह: "मलाई लाग्छ यसको सही उत्तर विकल्प (${currentQ.correct_answer}) हुनुपर्छ!"`);
        }

        window.useAudiencePoll = function() {
            if (lifelineUsed['audience']) return;
            lifelineUsed['audience'] = true;
            document.getElementById('ll-audience').disabled = true;

            const currentQ = questions[currentQuestionIndex];
            let a = 15, b = 15, c = 15, d = 15;
            if (currentQ.correct_answer === 'A') a = 65;
            else if (currentQ.correct_answer === 'B') b = 65;
            else if (currentQ.correct_answer === 'C') c = 65;
            else d = 65;

            alert(`👥 अडियन्स पोलको नतिजा:\n[A]: ${a}% | [B]: ${b}% | [C]: ${c}% | [D]: ${d}%`);
        }

        window.useFlipQuestion = function() {
            if (lifelineUsed['flip']) return;
            lifelineUsed['flip'] = true;
            document.getElementById('ll-flip').disabled = true;

            alert("🔄 प्रश्न परिवर्तन गरिएको छ!");
            loadQuestion();
        }

        function checkSafeZoneAndEnd() {
            let wonAmount = "रू 0";
            if (currentQuestionIndex >= 7) wonAmount = "रू 12,500 (Safe Zone)";
            else if (currentQuestionIndex >= 3) wonAmount = "रू 3,000 (Safe Zone)";

            endGame(false, `उत्तर गलत भयो! तपाईं खेलबाट बाहिरिनुभयो। सुरक्षित रकम: ${wonAmount}`);
        }

        function endGame(isWin, message) {
            clearInterval(timerInterval);
            document.getElementById('modalTitle').innerText = isWin ? "अद्भूत! विजेता बन्नुभयो! 🏆" : "खेल समाप्त!";
            document.getElementById('modalDesc').innerText = message;
            document.getElementById('gameModal').style.display = 'flex';
        }

        window.restartGame = function() {
            currentQuestionIndex = 0;
            lifelineUsed = { '5050': false, 'phone': false, 'audience': false, 'flip': false };
            document.querySelectorAll('.lifeline-btn').forEach(btn => btn.disabled = false);
            document.getElementById('gameModal').style.display = 'none';
            fetchQuestionsFromSupabase();
        }

        // Page load मा Supabase बाट प्रश्न ल्याउने
        fetchQuestionsFromSupabase();
    </script>
</body>
</html>
